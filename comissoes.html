<script>
var VERSAO="Comissões 2.5";
var SB_URL="https://ghxjqmjtmbqzvogwzylo.supabase.co";
var SB_KEY="sb_publishable_-M5rRFdjNXtFr1td-NVWPQ_GGkd_liB";
var SESSAO=null;
try{ SESSAO=JSON.parse(localStorage.getItem("aw_sessao")||"null"); }catch(e){}
if(!SESSAO||!SESSAO.access_token){ location.replace("index.html"); }
function guardarSessao(d){
  var ant=SESSAO||{};
  SESSAO={dia:ant.dia, login_dia:ant.login_dia, access_token:d.access_token, refresh_token:d.refresh_token||(SESSAO&&SESSAO.refresh_token), email:SESSAO&&SESSAO.email, id:SESSAO&&SESSAO.id};
  try{ localStorage.setItem("aw_sessao",JSON.stringify(SESSAO)); }catch(e){}
}
/* 10/11/2026: outra aba (o CRM, o Hub, outro módulo) pode já ter renovado o token.
   Antes de renovar, olha o aw_sessao: se lá tem um token mais novo e ainda válido da
   mesma pessoa, usa ele; se não, renova com o refresh_token mais novo de lá, nunca com
   o velho da memória (o Supabase recusa o velho e pode derrubar a sessão inteira). */
function sessaoDeOutraAba(){
  var ls=null; try{ ls=JSON.parse(localStorage.getItem("aw_sessao")||"null"); }catch(e){}
  if(!ls||!ls.access_token||!SESSAO) return false;
  if(SESSAO.id&&ls.id&&ls.id!==SESSAO.id) return false;
  if(ls.refresh_token) SESSAO.refresh_token=ls.refresh_token;
  if(ls.access_token===SESSAO.access_token) return Date.now()-RENOVADA_EM<20000;
  var exp=0;
  try{ var b=ls.access_token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"); exp=JSON.parse(atob(b+"===".slice((b.length+3)%4))).exp||0; }catch(e){}
  if(exp*1000<Date.now()+30000) return false;
  SESSAO.access_token=ls.access_token;
  RENOVADA_EM=Date.now();
  return true;
}
/* Várias consultas que dão 401 juntas esperam uma renovação só. A que chega logo
   depois de uma renovação (até 20 s) só repete com o token novo. */
var RENOVACAO=null, RENOVADA_EM=0;
function renovar(){
  if(sessaoDeOutraAba()) return Promise.resolve(SESSAO);
  if(RENOVACAO) return RENOVACAO;
  RENOVACAO=renovarAgora().then(function(x){ RENOVADA_EM=Date.now(); RENOVACAO=null; return x; },
                                function(e){ RENOVACAO=null; throw e; });
  return RENOVACAO;
}
function renovarAgora(){
  if(!SESSAO||!SESSAO.refresh_token) return Promise.reject(new Error("sem sessão"));
  return fetch(SB_URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({refresh_token:SESSAO.refresh_token})}).then(function(res){
      if(!res.ok) throw new Error("sessão expirada"); return res.json().then(guardarSessao); });
}
function erroTexto(t){ try{ var j=JSON.parse(t); return j.message||j.erro||t; }catch(e){ return t; } }
function api(path,opts,jaTentou){
  opts=opts||{};
  var h={"apikey":SB_KEY,"Authorization":"Bearer "+((SESSAO&&SESSAO.access_token)||SB_KEY),"Content-Type":"application/json"};
  return fetch(SB_URL+"/rest/v1/"+path,{method:opts.method||"GET",headers:h,body:opts.body?JSON.stringify(opts.body):undefined})
    .then(function(res){
      if(res.status===401&&SESSAO&&!jaTentou) return renovar().then(function(){ return api(path,opts,true); })
        .catch(function(){ alert("Sua sessão expirou. Entre de novo no Hub."); location.replace("index.html"); throw new Error("sessão expirada"); });
      return res.text().then(function(t){ if(!res.ok) throw new Error(erroTexto(t)||("Erro "+res.status)); return t?JSON.parse(t):null; });
    });
}
function rpc(nome,args){ return api("rpc/"+nome,{method:"POST",body:args||{}}); }

/* ---------- utilidades ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function n(v){ var x=Number(v); return isFinite(x)?x:0; }
function brl(v){ return (n(v)<0?"-":"")+"R$ "+Math.abs(n(v)).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function pc(v){ return n(v).toLocaleString("pt-BR",{maximumFractionDigits:2})+"%"; }
function lerValor(s){ s=String(s==null?"":s).trim().replace(/[R$\s]/g,""); if(!s) return 0;
  if(/,\d{1,2}$/.test(s)) s=s.replace(/\./g,"").replace(",","."); else if(/^\-?[\d.]+$/.test(s)&&/\.\d{3}(\.|$)/.test(s)) s=s.replace(/\./g,"");
  var x=parseFloat(s); return isFinite(x)?x:0; }
var MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function nomeMes(iso){ var p=String(iso).slice(0,7).split("-"); var m=MESES[Number(p[1])-1]; return m.charAt(0).toUpperCase()+m.slice(1)+"/"+p[0]; }
function mesSeguinte(iso){ var d=new Date(iso.slice(0,7)+"-01T12:00:00"); d.setMonth(d.getMonth()+1); return d.toISOString().slice(0,7)+"-01"; }
function mesAnterior(){ var d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-01"; }
function normal(s){ return String(s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/\s+/g," ").trim(); }
function chaveCol(x){ return String(x==null?"":x).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]/g,""); }
function dataBR(iso){ return iso?String(iso).slice(0,10).split("-").reverse().join("/"):"—"; }
function quando(ts){ return ts?new Date(ts).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}):"—"; }
var TIPOS={receita:"Comissão",ajuste:"Ajuste",fixo:"Ajuste fixo",minimo:"Mínimo garantido",saldo_anterior:"Saldo anterior"};

function pessoa(id){ for(var i=0;i<(P?P.pessoas:[]).length;i++) if(P.pessoas[i].user_id===id) return P.pessoas[i]; return null; }
function nomeP(id){ if(id==="escritorio") return "Escritório"; var p=pessoa(id); return p?p.nome:"(pessoa removida)"; }
function empresa(id){ for(var i=0;i<(P?P.empresas:[]).length;i++) if(P.empresas[i].id===id) return P.empresas[i]; return null; }
function origem(id){ for(var i=0;i<(P?P.origens:[]).length;i++) if(P.origens[i].id===id) return P.origens[i]; return null; }
function lista(id){ for(var i=0;i<(P?P.listas:[]).length;i++) if(P.listas[i].id===id) return P.listas[i]; return null; }
function planilha(id){ for(var i=0;i<(P?P.planilhas:[]).length;i++) if(P.planilhas[i].id===id) return P.planilhas[i]; return null; }
function total(uid){ for(var i=0;i<(P.totais||[]).length;i++) if(P.totais[i].user_id===uid) return P.totais[i]; return null; }
function pagamento(id){ for(var i=0;i<(P.pagamentos||[]).length;i++) if(P.pagamentos[i].user_id===id) return P.pagamentos[i]; return null; }
function aberto(){ return !P||!P.mes||P.mes.status!=="fechado"; }
function opera(){ return !!(P&&P.pode_operar); }
function pessoasAtivas(){ return (P.pessoas||[]).filter(function(p){ return !p.revogado; }); }
function opcoesPessoas(sel,comEscritorio,vazio){
  return (vazio!==undefined?'<option value="">'+esc(vazio)+'</option>':'')+(comEscritorio?'<option value="escritorio"'+(sel==="escritorio"?" selected":"")+'>Escritório</option>':'')+
    pessoasAtivas().map(function(p){ return '<option value="'+p.user_id+'"'+(p.user_id===sel?" selected":"")+'>'+esc(p.nome)+(p.codigo?" ("+esc(p.codigo)+")":"")+'</option>'; }).join("");
}
function opcoesEmpresas(sel,vazio){ return '<option value="">'+esc(vazio)+'</option>'+(P.empresas||[]).filter(function(e){ return e.ativo||e.id===sel; }).map(function(e){ return '<option value="'+e.id+'"'+(e.id===sel?" selected":"")+'>'+esc(e.nome)+'</option>'; }).join(""); }
function nomeEmp(id){ var e=id?empresa(id):null; return e?e.nome:"sem empresa"; }
/* 2.2: cada pessoa pode receber por mais de uma empresa (a da regra). Totais e pagamentos trazem por_empresa. */
function porEmpresa(x){ return (x&&x.por_empresa)||[]; }
function empresasDe(x){ return uniq(porEmpresa(x).map(function(p){ return p.empresa_id?nomeEmp(p.empresa_id):"sem empresa"; })); }
function naEmpresa(x,eid,campo){ return porEmpresa(x).reduce(function(a,p){ return a+((p.empresa_id||null)===(eid||null)?n(p[campo||"liquido"]):0); },0); }
function mostrar(texto,tipo){ MSG={texto:texto,tipo:tipo||"ok"}; pintar(); if(tipo!=="erro") setTimeout(function(){ if(MSG&&MSG.texto===texto){ MSG=null; pintar(); } },7000); }
function falhou(e){ OCUPADO=false; mostrar(String(e&&e.message||e),"erro"); }
function v(id){ var e=document.getElementById(id); return e?e.value:""; }
function marcado(id){ var e=document.getElementById(id); return !!(e&&e.checked); }

function carregar(){
  return rpc("comissoes_painel",{p_competencia:COMP}).then(function(d){ P=d; OCUPADO=false; pintar(); })

}
function trocarMes(m){ COMP=m; WIZ=null; PLAN=null; ED=null; try{ localStorage.setItem("aw_com_comp",m); }catch(e){} return carregar(); }
function aba(a){ ABA=a; ED=null; WIZ=null; PLAN=null; TESTE=null; RAPIDA=null; MSG=null; pintar(); window.scrollTo(0,0); }
function listaMeses(){
  var out=[], d=new Date(); d.setDate(1); d.setMonth(d.getMonth()+1);
  var fim=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-01";
  (P.meses||[]).forEach(function(m){ if(m.competencia>fim) fim=m.competencia; });
  for(var m="2026-10-01"; m<=fim; m=mesSeguinte(m)) out.unshift(m);
  return out;
}

/* ---------- contas da tela (o que vale é o banco; aqui só soma o que ele mandou) ---------- */
function parte(l,uid){
  if(uid==="escritorio") return n(l.valor_escritorio);
  var s=0; (l.rateio||[]).forEach(function(r){ if(r.user_id===uid) s+=n(r.valor); }); return s;
}
function ehDele(l,uid){ return uid==="escritorio"?n(l.valor_escritorio)!==0:(l.rateio||[]).some(function(r){ return r.user_id===uid; }); }
function geradoPor(l,uid){ return l.tipo==="receita"&&(uid==="escritorio"?l.prof_escritorio:l.profissional_id===uid); }
function filtraLinha(l){
  if(F.categoria&&l.categoria!==F.categoria) return false;
  if(F.origem&&(l.origem_id||"")!==F.origem) return false;
  if(F.cliente){ var q=normal(F.cliente); if(normal(l.cliente+" "+l.conta+" "+l.descricao).indexOf(q)<0) return false; }
  return true;
}
function filtrando(){ return !!(F.categoria||F.origem||F.cliente); }

/* ===================== Comissões por pessoa ===================== */
function categorias(){ var s={}; (P.lancamentos||[]).forEach(function(l){ if(l.categoria) s[l.categoria]=1; }); return Object.keys(s).sort(); }
function filtrosHtml(){
  var pessoasMes={}; (P.totais||[]).forEach(function(t){ pessoasMes[t.user_id]=1; });
  (P.lancamentos||[]).forEach(function(l){ if(l.profissional_id) pessoasMes[l.profissional_id]=1; });
  var ids=Object.keys(pessoasMes).sort(function(a,b){ return nomeP(a).localeCompare(nomeP(b)); });
  return '<div class="filtros">'+
    '<label class="c">Profissional<select onchange="F.pessoa=this.value;F.abertos={};pintar()"><option value="">Todos</option><option value="escritorio"'+(F.pessoa==="escritorio"?" selected":"")+'>Escritório</option>'+
      ids.map(function(id){ return '<option value="'+id+'"'+(F.pessoa===id?" selected":"")+'>'+esc(nomeP(id))+'</option>'; }).join("")+'</select></label>'+
    '<label class="c">Categoria<select onchange="F.categoria=this.value;pintar()"><option value="">Todas</option>'+categorias().map(function(c){ return '<option'+(F.categoria===c?" selected":"")+'>'+esc(c)+'</option>'; }).join("")+'</select></label>'+
    '<label class="c">Origem<select onchange="F.origem=this.value;pintar()"><option value="">Todas</option>'+(P.origens||[]).map(function(o){ return '<option value="'+o.id+'"'+(F.origem===o.id?" selected":"")+'>'+esc(o.nome)+'</option>'; }).join("")+'</select></label>'+
    '<label class="c">Cliente<input id="fCli" value="'+esc(F.cliente)+'" placeholder="nome ou conta" onchange="F.cliente=this.value;pintar()"></label>'+
    (filtrando()?'<button class="link" style="align-self:flex-end;margin-bottom:10px" onclick="F.categoria=\'\';F.origem=\'\';F.cliente=\'\';pintar()">Limpar filtros</button>':'')+'</div>';
}
function telaResumo(){
  var lanc=P.lancamentos||[];
  var h='<div class="cartao">'+filtrosHtml();
  if(!lanc.length){
    return h+'<p class="vazio">Nenhuma linha em '+esc(nomeMes(COMP))+' ainda. Comece em <button class="link" onclick="aba(\'planilhas\')">Planilhas</button>, subindo o arquivo de cada origem.</p></div>';
  }
  if(!F.pessoa) return h+resumoTodos()+'</div>';
  return h+resumoPessoa(F.pessoa)+'</div>';
}
function resumoTodos(){
  var lanc=(P.lancamentos||[]).filter(filtraLinha), linhas={};
  function lin(id){ if(!linhas[id]) linhas[id]={gerada:0,bruto:0}; return linhas[id]; }
  lanc.forEach(function(l){
    if(l.tipo==="receita"){ if(l.prof_escritorio) lin("escritorio").gerada+=n(l.valor); else if(l.profissional_id) lin(l.profissional_id).gerada+=n(l.valor); }
    (l.rateio||[]).forEach(function(r){ lin(r.user_id).bruto+=n(r.valor); });
    lin("escritorio").bruto+=n(l.valor_escritorio);
  });
  var ids=Object.keys(linhas).filter(function(k){ return k!=="escritorio"; }).sort(function(a,b){ return nomeP(a).localeCompare(nomeP(b)); });
  var h='<p class="sub">'+(filtrando()?'Valores só das linhas do filtro.':'Clique numa pessoa para ver o detalhe por categoria ou por cliente.')+'</p>'+
    '<div class="tab-rol"><table><thead><tr><th>Profissional</th><th>Empresa pagadora</th><th class="n">Comissão gerada</th><th class="n">Bruta</th><th class="n">Imposto</th><th class="n">Líquida</th></tr></thead><tbody>';
  var s={g:0,b:0,i:0,l:0};
  ids.forEach(function(id){
    var x=linhas[id], t=total(id), pct=t?n(t.pct_imposto):0, bruto=filtrando()||!t?x.bruto:n(t.bruto);
    var imp=filtrando()||!t?(bruto>0?bruto*pct/100:0):n(t.imposto), liq=bruto-imp;
    var emps=t?empresasDe(t):[];
    s.g+=x.gerada; s.b+=bruto; s.i+=imp; s.l+=liq;
    h+='<tr class="clica" onclick="F.pessoa=\''+id+'\';F.abertos={};pintar()"><td><b>'+esc(nomeP(id))+'</b></td><td>'+(emps.length?emps.map(function(nm){ return nm==="sem empresa"?'<span class="falta">sem empresa</span>':esc(nm); }).join("<br>"):'—')+'</td>'+
      '<td class="n">'+brl(x.gerada)+'</td><td class="n'+(bruto<0?" neg":"")+'">'+brl(bruto)+'</td><td class="n">'+(imp?brl(-imp)+' <span class="sub">'+pc(pct)+'</span>':'—')+'</td><td class="n"><b>'+brl(liq)+'</b></td></tr>';
  });
  var e=linhas.escritorio||{gerada:0,bruto:0};
  h+='<tr class="clica" onclick="F.pessoa=\'escritorio\';F.abertos={};pintar()"><td><b>Escritório</b></td><td></td><td class="n">'+brl(e.gerada)+'</td><td class="n">'+brl(e.bruto)+'</td><td class="n">—</td><td class="n"><b>'+brl(e.bruto)+'</b></td></tr>';
  h+='<tr class="total"><td>Total</td><td></td><td class="n">'+brl(s.g+e.gerada)+'</td><td class="n">'+brl(s.b+e.bruto)+'</td><td class="n">'+brl(-s.i)+'</td><td class="n">'+brl(s.l+e.bruto)+'</td></tr></tbody></table></div>';
  return h;
}
function resumoPessoa(uid){
  var todas=(P.lancamentos||[]).filter(function(l){ return ehDele(l,uid)||geradoPor(l,uid); });
  var lanc=todas.filter(filtraLinha);
  var gerada=0, rec=0, aj=0;
  lanc.forEach(function(l){ if(geradoPor(l,uid)) gerada+=n(l.valor); if(l.tipo==="receita") rec+=parte(l,uid); else aj+=parte(l,uid); });
  var bruto=rec+aj, t=uid==="escritorio"?null:total(uid), pct=t?n(t.pct_imposto):0;
  if(!t&&uid!=="escritorio"){ var pp=pessoa(uid), em=pp&&pp.pagto?empresa(pp.pagto.empresa_id):null; pct=em?n(em.pct_imposto):0; }
  var imp=bruto>0?bruto*pct/100:0;
  var h='<div class="resumo"><div><span>Comissão gerada'+(uid==="escritorio"?' (linhas do escritório)':' nos clientes da pessoa')+'</span><b>'+brl(gerada)+'</b></div>'+
    '<div><span>Repasses das comissões</span><b>'+brl(rec)+'</b></div><div><span>Ajustes</span><b>'+brl(aj)+'</b></div>'+
    '<div><span>Comissão bruta</span><b>'+brl(bruto)+'</b></div><div><span>Imposto'+(pct?' ('+pc(pct)+')':'')+'</span><b>'+brl(-imp)+'</b></div>'+
    '<div class="destaque"><span>Comissão líquida</span><b>'+brl(bruto-imp)+'</b></div></div>';
  h+='<div class="linha-topo"><div class="radios"><label><input type="radio" name="visao" '+(F.visao==="categoria"?"checked":"")+' onchange="F.visao=\'categoria\';F.abertos={};pintar()"> Por categoria</label>'+
    '<label><input type="radio" name="visao" '+(F.visao==="cliente"?"checked":"")+' onchange="F.visao=\'cliente\';F.abertos={};pintar()"> Por cliente</label></div>'+
    '<div><button class="bt" onclick="F.pessoa=\'\';pintar()">&#8592; Todos</button>'+(uid!=="escritorio"?' <button class="bt" onclick="baixarPessoa(\''+uid+'\')">Baixar Excel</button>':'')+'</div></div>';
  var grupos={}, ordem=[];
  lanc.forEach(function(l){
    var k=F.visao==="cliente"?(l.cliente||(l.tipo==="receita"?"(sem cliente)":TIPOS[l.tipo])):(l.categoria||"(sem categoria)");
    if(!grupos[k]){ grupos[k]={g:0,p:0,ls:[]}; ordem.push(k); }
    grupos[k].ls.push(l); grupos[k].p+=parte(l,uid); if(geradoPor(l,uid)) grupos[k].g+=n(l.valor);
  });
  ordem.sort(function(a,b){ return Math.abs(grupos[b].p)-Math.abs(grupos[a].p); });
  if(!ordem.length) return h+'<p class="vazio">Nada para esta pessoa'+(filtrando()?' com esses filtros':'')+'.</p>';

    if(p>pontos&&p>=2){ pontos=p; cab=i; }

function recebedorNome(r){ return r==="profissional"?"o profissional da linha":(r==="escritorio"?"o escritório":nomeP(r)); }
function nomesOrigens(ids){ return (P.origens||[]).filter(function(o){ return (ids||[]).indexOf(o.id)>=0; }).map(function(o){ return o.nome; }); }
function juntar(l){ return l.length<2?l.join(""):l.slice(0,-1).join(", ")+" e "+l[l.length-1]; }
function fraseRegra(g){
  var c=[];
  if((g.cond_origens||[]).length) c.push("planilha "+juntar(nomesOrigens(g.cond_origens)));
  if(g.cond_categoria) c.push("categoria "+g.cond_categoria);
  if(g.cond_produto) c.push("produto "+g.cond_produto);
  if(g.cond_profissional) c.push("assessor "+nomeP(g.cond_profissional));
  if(g.cond_cliente) c.push("cliente "+g.cond_cliente);
  if(g.cond_lista_id) c.push("cliente da lista \""+((lista(g.cond_lista_id)||{}).nome||"?")+"\"");
  var d=(g.divisao||[]).map(function(x){ return (x.pct===null||x.pct===undefined?"o restante":(x.pct_planilha?"o % da planilha (ou "+pc(x.pct)+")":pc(x.pct)))+" para "+recebedorNome(x.recebedor)+(x.so_primeira?" (só na 1ª parcela)":"")+(x.negativos===false?" (não entra em valor negativo)":""); });
  var tem=(g.divisao||[]).some(function(x){ return x.pct===null||x.pct===undefined; });
  var emp=g.empresa_id?empresa(g.empresa_id):null;
  return (c.length?"Quando for "+c.join(", "):"Para qualquer linha")+": "+d.join(", ")+(tem?"":", e o que sobrar fica com o escritório")+"."+
    (emp?" Paga: "+emp.nome+".":" Paga: a empresa padrão de cada pessoa.");

/* A divisão cabe no formulário simples? (no máximo um "assessor da linha" com %, pessoas com %, e o
   escritório só como "o restante"; nada de "não vale para negativo"). */
function simplesDe(div){
  var s={ass:false,assPct:"",assPri:false,outros:[]}, ok=true, restos=0;
  (div||[]).forEach(function(x){
    var resto=x.pct===null||x.pct===undefined;
    if(x.negativos===false) ok=false;
    if(x.recebedor==="escritorio"){ if(!resto||x.so_primeira) ok=false; else restos++; }
    else if(resto) ok=false;
    else if(x.recebedor==="profissional"){ if(s.ass) ok=false; s.ass=true; s.assPct=x.pct; s.assPri=!!x.so_primeira; s.assPl=!!x.pct_planilha; }
    else s.outros.push({rec:x.recebedor,pct:x.pct,pri:!!x.so_primeira});
  });
  return ok&&restos<=1?s:null;
}
function divDeSimples(s){
  var d=[]; if(s.ass) d.push({recebedor:"profissional",pct:lerValor(s.assPct),negativos:true,so_primeira:!!s.assPri,pct_planilha:!!s.assPl});
  s.outros.forEach(function(o){ d.push({recebedor:o.rec,pct:lerValor(o.pct),negativos:true,so_primeira:!!o.pri}); });
  d.push({recebedor:"escritorio",pct:null,negativos:true,so_primeira:false});
  return d;
}
function abrirRegra(d){
  d.cond_origens=d.cond_origens||[]; var s=simplesDe(d.divisao);
  ED={tipo:"regra",d:d,modo:s?"simples":"avancado",s:s||{ass:true,assPct:50,assPri:false,outros:[]}};

}

/* Restante, exemplo com R$ 1.000 e a frase, a cada tecla. */
function atualizarRegra(){
  if(!ED||ED.tipo!=="regra") return;
  var d=lerTudoRegra(), div=d.divisao||[];
  var soma=div.reduce(function(a,x){ return a+(x.pct===null||x.pct===undefined?0:n(x.pct)); },0);
  var r=document.getElementById("rResto"); if(r){ r.textContent=pc(Math.max(0,100-soma)); r.className=soma>100.0001?"ruim":""; }
  var e=document.getElementById("rSoma"); if(e){ var tem=div.some(function(x){ return x.pct===null; }); e.textContent="Soma dos percentuais: "+pc(soma)+(tem?" + o restante":(soma<100?" (o que sobra vai para o escritório)":"")); e.className="soma "+(soma>100.0001?"ruim":"bom"); }
  var ex=document.getElementById("rExemplo");
  if(ex){
    if(soma>100.0001){ ex.innerHTML='<span class="ruim">Os percentuais passam de 100% ('+esc(pc(soma))+').</span>'; }
    else {
      var partes=[], resto=1000;
      div.forEach(function(x){ if(x.pct===null||x.pct===undefined) return; var vv=1000*n(x.pct)/100; resto-=vv;
        partes.push((x.recebedor==="profissional"?"Profissional da linha"+(x.pct_planilha?" (ou o % da planilha)":""):(x.recebedor==="escritorio"?"Escritório":(x.recebedor?nomeP(x.recebedor):"(escolha a pessoa)")))+" "+brl(vv)+(x.so_primeira?" (só na 1ª parcela)":"")); });
      var dono=div.filter(function(x){ return x.pct===null||x.pct===undefined; })[0];
      partes.push((dono&&dono.recebedor!=="escritorio"?recebedorNome(dono.recebedor):"Escritório")+" "+brl(resto));
      ex.innerHTML='<b>Exemplo</b>, numa comissão de R$ 1.000,00: '+esc(partes.join(" · "));
    }
  }
  var f=document.getElementById("rFrase"); if(f) f.textContent=fraseRegra(d);
}

/* ===================== Fechamento e envio ===================== */
function totaisOrdenados(){ return (P.totais||[]).slice().sort(function(a,b){ return nomeP(a.user_id).localeCompare(nomeP(b.user_id)); }); }
function telaFechamento(){
  var tot=totaisOrdenados(), fechado=!aberto(), mes=P.mes||{};
  var h='<div class="cartao"><h2>'+(fechado?"Mês fechado":"Conferência antes de fechar")+'</h2>';
  if(fechado) h+='<p class="sub">Fechado em '+esc(quando(mes.fechado_em))+' por '+esc(mes.fechado_por||"")+'. Os valores estão travados.</p>';
  else h+='<p class="sub">Ao fechar: entram o mínimo garantido e o imposto de cada um, o mês trava, os saldos negativos passam para '+esc(nomeMes(mesSeguinte(COMP)))+' e os e-mails ficam liberados.</p>';
  var alertas=[];
  var comErro=(P.planilhas||[]).filter(function(p){ return p.linhas_erro>0; });
  if(comErro.length) alertas.push(comErro.length+' planilha(s) com linhas de fora: '+comErro.map(function(p){ return (origem(p.origem_id)||{}).nome+" ("+p.linhas_erro+")"; }).join(", ")+'.');
  var faltam=(P.origens||[]).filter(function(o){ return o.ativo&&!(P.planilhas||[]).some(function(p){ return p.origem_id===o.id; }); });
  if(faltam.length) alertas.push('Ainda não subiram: '+faltam.map(function(o){ return o.nome; }).join(", ")+'.');
  var semEmp=tot.filter(function(t){ return porEmpresa(t).some(function(p){ return !p.empresa_id&&n(p.bruto)>0; }); });
  if(semEmp.length) alertas.push(semEmp.length+' pessoa(s) com valor sem empresa pagadora (fica sem imposto; diga a empresa na regra ou a empresa padrão em Pessoas e acordos): '+semEmp.map(function(t){ return nomeP(t.user_id); }).join(", ")+'.');
  var semDados=tot.filter(function(t){ var p=pessoa(t.user_id); return n(t.bruto)>0&&!pagtoCompleto(p&&p.pagto); });
  if(semDados.length) alertas.push(semDados.length+' pessoa(s) a receber sem dados bancários completos: '+semDados.map(function(t){ return nomeP(t.user_id); }).join(", ")+'.');
  if(!fechado&&alertas.length) h+='<div class="aviso info"><b>Antes de fechar, confira:</b><ul>'+alertas.map(function(a){ return '<li>'+esc(a)+'</li>'; }).join("")+'</ul></div>';
  if(!tot.length) h+='<p class="vazio">Nenhum valor no mês.</p>';
  else {
    h+='<div class="tab-rol"><table><thead><tr><th>Pessoa</th><th class="n">Bruta</th><th class="n">Imposto</th><th class="n">Líquida</th>'+(fechado?'<th>E-mail</th>':'')+'<th></th></tr></thead><tbody>';
    var s={b:0,i:0,l:0};
    tot.forEach(function(t){
      s.b+=n(t.bruto); s.i+=n(t.imposto); s.l+=n(t.liquido); var pg=pagamento(t.user_id), st='';
      if(fechado) st=pg&&pg.enviado_em?'<span class="status-env ok">enviado '+esc(quando(pg.enviado_em))+'</span>':(pg&&pg.envio_erro?'<span class="status-env erro">'+esc(pg.envio_erro)+'</span>':(pg?'<span class="sub">não enviado</span>':'<span class="sub">—</span>'));
      h+='<tr><td>'+esc(nomeP(t.user_id))+(n(t.bruto)<0?' <span class="chip estorno">passa para o mês seguinte</span>':'')+'</td><td class="n'+(n(t.bruto)<0?" neg":"")+'">'+brl(t.bruto)+'</td>'+
        '<td class="n">'+(n(t.imposto)?brl(-t.imposto)+' <span class="sub">'+pc(t.pct_imposto)+'</span>':'—')+'</td><td class="n"><b>'+brl(t.liquido)+'</b></td>'+(fechado?'<td>'+st+'</td>':'')+
        '<td style="white-space:nowrap" class="n"><button class="link" onclick="baixarPessoa(\''+t.user_id+'\')">Baixar Excel</button>'+(fechado&&opera()&&pg?' &nbsp; <button class="link" onclick="enviar([\''+t.user_id+'\'])">'+(pg.enviado_em?"Reenviar":"Enviar")+'</button>':'')+'</td></tr>';
    });
    h+='<tr class="total"><td>Total</td><td class="n">'+brl(s.b)+'</td><td class="n">'+brl(-s.i)+'</td><td class="n">'+brl(s.l)+'</td>'+(fechado?'<td></td>':'')+'<td></td></tr></tbody></table></div>';
  }
  h+='<div class="linha-acoes"><button class="bt" onclick="baixarGeral()"'+(tot.length?'':' disabled')+'>Baixar planilha geral</button>';
  if(opera()){
    if(!fechado) h+='<button class="bt pri" onclick="fecharMes()"'+(tot.length?'':' disabled')+'>Fechar '+esc(nomeMes(COMP))+'</button>';
    else h+='<button class="bt perigo" onclick="reabrirMes()">Reabrir</button><button class="bt pri" id="btEnviar" onclick="enviar(null)">Enviar e-mails a todos</button>';
  }
  h+='</div></div>';
  if(fechado){
    h+='<div class="cartao"><div class="linha-topo"><div><h2>Fechamento disponível para os profissionais</h2><p class="sub">Ligado, cada pessoa vê o próprio fechamento de '+esc(nomeMes(COMP))+' no Hub, em "Minha comissão" (e aparece "visualizado" na folha).</p></div>'+
      (opera()?'<label class="chave"><input type="checkbox"'+(mes.liberado?" checked":"")+' onchange="liberar(this.checked)"><span></span>'+(mes.liberado?"Liberado":"Não liberado")+'</label>':'<b>'+(mes.liberado?"Liberado":"Não liberado")+'</b>')+'</div></div>';
  }
  return h;
}

  rpc("comissao_fechar",{p_competencia:COMP}).then(function(r){ MSG={texto:"Mês fechado. "+r.a_pagar+" pessoa(s) a receber"+(r.minimos?", "+r.minimos+" com mínimo garantido":"")+(r.negativos?", "+r.negativos+" saldo(s) negativo(s) levado(s) para o mês seguinte":"")+".",tipo:"ok"}; return carregar(); }).catch(falhou);

/* Planilha de uma pessoa: as linhas dela com a parte dela; no fim, bruta, imposto e líquida. */
function planilhaPessoa(uid){
  var p=pessoa(uid), t=total(uid)||{bruto:0,imposto:0,liquido:0,pct_imposto:0};
  var rows=[["Adami Captal · Comissão de "+nomeMes(COMP)],[(p?p.nome:"")+" · pagamento em "+nomeMes(mesSeguinte(COMP))],[],
    ["Tipo","Origem","Cliente","Conta","Categoria","Produto","Descrição","Empresa que paga","Comissão gerada (R$)","Sua parte (R$)"]];
  var padrao=p&&p.pagto?p.pagto.empresa_id:null;
  (P.lancamentos||[]).filter(function(l){ return ehDele(l,uid); }).sort(function(a,b){ return (a.categoria+a.cliente).localeCompare(b.categoria+b.cliente); }).forEach(function(l){
    rows.push([TIPOS[l.tipo]||l.tipo,l.origem_nome||"",l.cliente,l.conta,l.categoria,l.produto,l.descricao||l.regra_nome||"",nomeEmp(l.empresa_id||padrao),l.tipo==="receita"?Math.round(n(l.valor)*100)/100:"",Math.round(parte(l,uid)*100)/100]); });
  rows.push([]);
  if(porEmpresa(t).length>1) porEmpresa(t).forEach(function(x){ rows.push(["","","","","","","","Líquida por "+nomeEmp(x.empresa_id)+(n(x.imposto)?" (imposto "+pc(x.pct_imposto)+")":""),"",n(x.liquido)]); });
  rows.push(["","","","","","","","Comissão bruta","",n(t.bruto)]);
  rows.push(["","","","","","","","Imposto","",-n(t.imposto)]);
  rows.push(["","","","","","","","Comissão líquida","",n(t.liquido)]);
  var ws=XLSX.utils.aoa_to_sheet(rows); ws["!cols"]=[{wch:14},{wch:16},{wch:30},{wch:12},{wch:20},{wch:18},{wch:28},{wch:34},{wch:20},{wch:15}];
  for(var i=4;i<=rows.length;i++){ ["I","J"].forEach(function(c){ var x=ws[c+i]; if(x&&typeof x.v==="number") x.z="#,##0.00"; }); }
  var wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Comissão");
  return {wb:wb,nome:"Comissão "+nomeMes(COMP).replace("/","-")+" - "+(p?p.nome:"")+".xlsx",total:n(t.liquido)};
}
/* Baixa pelo próprio navegador, com o nome certo (o writeFile do SheetJS perde o nome com acento em alguns navegadores). */
function baixarWb(wb,nome){
  var dados=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([dados],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
  a.download=nome; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1000);
}
function baixarPessoa(uid){ var x=planilhaPessoa(uid); baixarWb(x.wb,x.nome); }
/* Uma linha da folha. Com eid, só a parte paga por essa empresa (eid "" = parte sem empresa). */
function linhaFolha(t,eid){
  var p=pessoa(t.user_id)||{}, d=p.pagto||{}, pg=pagamento(t.user_id)||{}, base=t.por_empresa?t:pg;
  var bruto=n(t.bruto!=null?t.bruto:pg.bruto), imp=n(t.imposto!=null?t.imposto:pg.imposto), liq=n(t.liquido!=null?t.liquido:pg.valor), emp=empresasDe(base).join(", ");
  if(eid!==undefined){ bruto=naEmpresa(base,eid||null,"bruto"); imp=naEmpresa(base,eid||null,"imposto"); liq=naEmpresa(base,eid||null,"liquido"); emp=nomeEmp(eid||null); }
  return [p.nome,p.codigo||"",d.cpf_cnpj||"",emp,bruto,-imp,liq,
    (d.pix_tipo?d.pix_tipo+": ":"")+(d.pix_chave||""),d.banco||"",d.agencia||"",d.conta||"",d.titular||"",pg.pago_em?dataBR(pg.pago_em):"",pg.visualizado_em?"sim":""];
}
function baixarGeral(){
  var cab=["Pessoa","Código","CPF/CNPJ","Empresa pagadora","Bruta","Imposto","Líquida","PIX","Banco","Agência","Conta","Titular","Pago em","Visualizou"];
  var rows=[cab]; totaisOrdenados().forEach(function(t){ rows.push(linhaFolha(t)); });
  var det=[["Tipo","Origem","Linha","Cliente","Conta","Profissional","Categoria","Produto","Regra ou descrição","Comissão","Pessoa","Parte"]];
  (P.lancamentos||[]).forEach(function(l){
    var prof=l.prof_escritorio?"Escritório":(l.profissional_id?nomeP(l.profissional_id):l.profissional_txt);
    (l.rateio||[]).forEach(function(r){ det.push([TIPOS[l.tipo],l.origem_nome,l.linha||"",l.cliente,l.conta,prof,l.categoria,l.produto,l.regra_nome||l.descricao,l.tipo==="receita"?n(l.valor):"",nomeP(r.user_id),n(r.valor)]); });
    if(n(l.valor_escritorio)) det.push([TIPOS[l.tipo],l.origem_nome,l.linha||"",l.cliente,l.conta,prof,l.categoria,l.produto,l.regra_nome||l.descricao,l.tipo==="receita"?n(l.valor):"","Escritório",n(l.valor_escritorio)]);
  });
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),"Por pessoa");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(det),"Linhas");
  baixarWb(wb,"Comissões "+nomeMes(COMP).replace("/","-")+" - geral.xlsx");
}

/* E-mail: a função comissoes-enviar confere no banco quem pode enviar, o e-mail e o valor de cada
   pessoa; a tela só manda a planilha. */
function enviar(ids){
  var alvo=ids||(P.pagamentos||[]).map(function(t){ return t.user_id; });
  if(!ids&&!confirm("Enviar o e-mail com o valor e a planilha para "+alvo.length+" pessoa(s)?")) return;
  var b=document.getElementById("btEnviar"); if(b){ b.disabled=true; }
  var ok=0, erros=[], i=0;
  function proximo(){
    if(i>=alvo.length){ MSG={texto:ok+" e-mail(s) enviado(s)."+(erros.length?" Falharam: "+erros.join("; "):""),tipo:erros.length?"erro":"ok"}; return carregar(); }
    var uid=alvo[i++], x=planilhaPessoa(uid);
    if(b) b.textContent="Enviando "+i+" de "+alvo.length+"…";
    var arquivo=XLSX.write(x.wb,{bookType:"xlsx",type:"base64"});
    return enviarUm(uid,x.nome,arquivo,false).then(function(r){ if(r&&r.ok) ok++; else erros.push(nomeP(uid)+": "+(r&&r.erro||"erro")); })
      .catch(function(e){ erros.push(nomeP(uid)+": "+(e.message||e)); }).then(proximo);
  }
  proximo();
}
function enviarUm(uid,nome,arquivo,jaTentou){
  return fetch(SB_URL+"/functions/v1/comissoes-enviar",{method:"POST",
    headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SESSAO.access_token,"Content-Type":"application/json"},
    body:JSON.stringify({competencia:COMP,user_id:uid,nome_arquivo:nome,arquivo_base64:arquivo})})
    .then(function(res){
      if(res.status===401&&!jaTentou) return renovar().then(function(){ return enviarUm(uid,nome,arquivo,true); });
      if(res.status===404) return {erro:"a função de envio (comissoes-enviar) ainda não foi instalada no Supabase"};
      return res.text().then(function(t){ var j={}; try{ j=JSON.parse(t); }catch(e){ j={erro:t}; } return j; });
    });
}

/* ===================== Folha de pagamento ===================== */
function telaFolha(){
  if(aberto()) return '<div class="cartao"><h2>Folha de pagamento</h2><p class="vazio">A folha aparece depois que o mês for fechado (em Fechamento e envio).</p></div>';
  var es=P.empresas||[];
  var pags=(P.pagamentos||[]).slice().sort(function(a,b){ return nomeP(a.user_id).localeCompare(nomeP(b.user_id)); }).filter(function(pg){
    if(FOLHA.empresa&&!porEmpresa(pg).some(function(x){ return x.empresa_id===FOLHA.empresa; })) return false;
    if(FOLHA.status==="pago"&&!pg.pago_em) return false; if(FOLHA.status==="pendente"&&pg.pago_em) return false;
    return true; });
  var h='<div class="cartao"><div class="linha-topo"><div><h2>Folha de '+esc(nomeMes(COMP))+'</h2><p class="sub">Faça as transferências em '+esc(nomeMes(mesSeguinte(COMP)))+' e marque cada pagamento.</p></div>'+
    '<div class="acoes" style="margin:0"><button class="bt" onclick="baixarFolha()">Baixar folha (Excel)</button></div></div>'+
    '<div class="filtros"><label class="c">Empresa<select onchange="FOLHA.empresa=this.value;pintar()"><option value="">Todas</option>'+es.map(function(e){ return '<option value="'+e.id+'"'+(FOLHA.empresa===e.id?" selected":"")+'>'+esc(e.nome)+'</option>'; }).join("")+'</select></label>'+
    '<label class="c">Situação<select onchange="FOLHA.status=this.value;pintar()"><option value="">Todas</option><option value="pendente"'+(FOLHA.status==="pendente"?" selected":"")+'>A pagar</option><option value="pago"'+(FOLHA.status==="pago"?" selected":"")+'>Pagas</option></select></label></div>';
  if(!pags.length) return h+'<p class="vazio">Ninguém nesta seleção.</p></div>';
  var usadas=es.filter(function(e){ return (P.pagamentos||[]).some(function(pg){ return porEmpresa(pg).some(function(x){ return x.empresa_id===e.id; }); }); });
  var semEmp=(P.pagamentos||[]).some(function(pg){ return porEmpresa(pg).some(function(x){ return !x.empresa_id; }); });
  h+='<div class="tab-rol"><table><thead><tr>'+(opera()?'<th><input type="checkbox" aria-label="Marcar todos" onchange="selTodos(this.checked)"></th>':'')+'<th>Situação</th><th>Profissional</th><th>CPF/CNPJ</th><th class="n">Bruta</th><th class="n">Imposto</th><th class="n">Líquida</th>'+
    usadas.map(function(e){ return '<th class="n">'+esc(e.nome)+'</th>'; }).join("")+(semEmp?'<th class="n">Sem empresa</th>':'')+'<th>PIX / conta</th><th>Pago em</th></tr></thead><tbody>';
  var s={b:0,i:0,l:0,e:{},x:0};
  pags.forEach(function(pg){
    var p=pessoa(pg.user_id)||{}, d=p.pagto||{};
    s.b+=n(pg.bruto); s.i+=n(pg.imposto); s.l+=n(pg.valor);
    usadas.forEach(function(e){ s.e[e.id]=(s.e[e.id]||0)+naEmpresa(pg,e.id); }); s.x+=naEmpresa(pg,null);
    h+='<tr>'+(opera()?'<td><input type="checkbox" class="selF" value="'+pg.user_id+'"'+(SEL[pg.user_id]?" checked":"")+' onchange="SEL[this.value]=this.checked" aria-label="Selecionar '+esc(p.nome||"")+'"></td>':'')+
      '<td>'+(pg.pago_em?'<span class="chip ok">Pago</span>':'<span class="chip">A pagar</span>')+'<div class="sub" style="font-size:11px">'+(pg.visualizado_em?"visualizado":"não visualizado")+'</div></td>'+
      '<td><b>'+esc(p.nome||"")+'</b>'+(pagtoCompleto(d)?'':'<div class="falta">faltam dados</div>')+'</td><td>'+esc(d.cpf_cnpj||"—")+'</td>'+
      '<td class="n">'+brl(pg.bruto)+'</td><td class="n">'+(n(pg.imposto)?brl(-pg.imposto):"—")+'</td><td class="n"><b>'+brl(pg.valor)+'</b></td>'+
      usadas.map(function(e){ var vv=naEmpresa(pg,e.id); return '<td class="n">'+(porEmpresa(pg).some(function(x){ return x.empresa_id===e.id; })?brl(vv):"—")+'</td>'; }).join("")+
      (semEmp?'<td class="n">'+(porEmpresa(pg).some(function(x){ return !x.empresa_id; })?brl(naEmpresa(pg,null)):"—")+'</td>':'')+
      '<td class="sub">'+esc(d.pix_chave?(d.pix_tipo?d.pix_tipo+": ":"")+d.pix_chave:[d.banco,d.agencia,d.conta].filter(Boolean).join(" · ")||"—")+'</td>'+
      '<td>'+(opera()?'<input type="date" value="'+esc(pg.pago_em||"")+'" onchange="marcarPago(\''+pg.user_id+'\',this.value)" aria-label="Data do pagamento">':esc(dataBR(pg.pago_em)))+'</td></tr>';
  });
  h+='<tr class="total">'+(opera()?'<td></td>':'')+'<td></td><td>Total</td><td></td><td class="n">'+brl(s.b)+'</td><td class="n">'+brl(-s.i)+'</td><td class="n">'+brl(s.l)+'</td>'+
    usadas.map(function(e){ return '<td class="n">'+brl(s.e[e.id]||0)+'</td>'; }).join("")+(semEmp?'<td class="n">'+brl(s.x)+'</td>':'')+'<td></td><td></td></tr></tbody></table></div>';
  if(opera()) h+='<div class="linha-acoes"><button class="bt pri" onclick="pagarSelecionados()">Marcar selecionados como pagos hoje</button></div>';
  return h+'</div>';
}
function selTodos(sim){ document.querySelectorAll(".selF").forEach(function(c){ c.checked=sim; SEL[c.value]=sim; }); }
function marcarPago(uid,data){
  rpc("comissao_marcar_pago",{p_competencia:COMP,p_user:uid,p_data:data||null}).then(function(){ MSG={texto:data?"Pagamento marcado.":"Pagamento desmarcado.",tipo:"ok"}; return carregar(); }).catch(falhou);
}
function pagarSelecionados(){
  var ids=Object.keys(SEL).filter(function(k){ return SEL[k]; }); if(!ids.length){ mostrar("Selecione pelo menos uma pessoa.","erro"); return; }
  var hoje=new Date().toLocaleDateString("en-CA",{timeZone:"America/Sao_Paulo"}), i=0;
  (function prox(){ if(i>=ids.length){ SEL={}; MSG={texto:ids.length+" pagamento(s) marcado(s).",tipo:"ok"}; return carregar(); }
    rpc("comissao_marcar_pago",{p_competencia:COMP,p_user:ids[i++],p_data:hoje}).then(prox).catch(falhou); })();
}
function baixarFolha(){
  var cab=["Pessoa","Código","CPF/CNPJ","Empresa pagadora","Bruta","Imposto","Líquida","PIX","Banco","Agência","Conta","Titular","Pago em","Visualizou"];
  var wb=XLSX.utils.book_new(), pags=(P.pagamentos||[]).slice().sort(function(a,b){ return nomeP(a.user_id).localeCompare(nomeP(b.user_id)); });
  var todas=[cab]; pags.forEach(function(pg){ todas.push(linhaFolha(pg)); });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(todas),"Folha");
  (P.empresas||[]).concat([{id:"",nome:"Sem empresa"}]).forEach(function(e){
    var ls=pags.filter(function(pg){ return porEmpresa(pg).some(function(x){ return (x.empresa_id||"")===e.id; }); }); if(!ls.length) return;
    var r=[cab]; ls.forEach(function(pg){ r.push(linhaFolha(pg,e.id)); });
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),e.nome.replace(/[\\\/\?\*\[\]:]/g,"").slice(0,31));
  });
  baixarWb(wb,"Folha de comissões "+nomeMes(COMP).replace("/","-")+".xlsx");
}

carregar();
</script>

</html>
