#awVoltar{display:none !important}

.mesbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}

td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}

.chip.estorno{background:var(--verm-c);color:var(--verm)}.chip.ajuste{background:#F1ECF8;color:#5B3E8C}.chip.saldo{background:#F4F4F4;color:#555}
.rateio div{white-space:nowrap}
.vazio{color:var(--muted);font-size:13px;padding:14px 4px}
.form{border:1px solid #CBD7E8;background:#F7FAFE;border-radius:16px;padding:16px;margin:0 0 16px}
.form h3{font:700 14px Inter,sans-serif;color:var(--navy);margin:0 0 12px}
.grade{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.grade .larga{grid-column:span 2}.grade .toda{grid-column:1/-1}
label.c{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
label.c input,label.c select,label.c textarea{text-transform:none;letter-spacing:0;font-weight:500;font-size:13.5px}
.previa{margin-top:12px;font-size:13px;color:var(--ink2);background:#fff;border:1px dashed #CBD7E8;border-radius:12px;padding:10px 12px}
.soma{font-weight:700}.soma.ruim{color:var(--verm)}.soma.bom{color:var(--verde)}
.linha-acoes{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.status-env{font-size:12px}.status-env.ok{color:var(--verde)}.status-env.erro{color:var(--verm)}
.falta{color:var(--amar);font-size:12px;font-weight:600}
.imp-mapa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0 12px}

  .menu-marca{padding:0;flex:1 1 auto}.menu-voltar{margin:0}.menu-secao,.menu-pe{display:none}

<body>
<div id="app"><p class="vazio">Carregando…</p></div>
<script>
var VERSAO="Comissões 1.1";
var SB_URL="https://ghxjqmjtmbqzvogwzylo.supabase.co";
var SB_KEY="sb_publishable_-M5rRFdjNXtFr1td-NVWPQ_GGkd_liB";
var SESSAO=null;
try{ SESSAO=JSON.parse(localStorage.getItem("aw_sessao")||"null"); }catch(e){}
if(!SESSAO||!SESSAO.access_token){ location.replace("index.html"); }
function guardarSessao(d){
  var ant=SESSAO||{};
  SESSAO={dia:ant.dia, login_dia:ant.login_dia, access_token:d.access_token, refresh_token:d.refresh_token||(SESSAO&&SESSAO.refresh_token), email:SESSAO&&SESSAO.email, id:SESSAO&&SESSAO.id};
  try{ localStorage.setItem("aw_sessao",JSON.stringify(SESSAO)); }catch(e){}
}
function renovar(){
  if(!SESSAO||!SESSAO.refresh_token) return Promise.reject(new Error("sem sessão"));
  return fetch(SB_URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({refresh_token:SESSAO.refresh_token})}).then(function(res){
      if(!res.ok) throw new Error("sessão expirada"); return res.json().then(guardarSessao); });
}
function erroTexto(t){ try{ var j=JSON.parse(t); return j.message||j.erro||t; }catch(e){ return t; } }
function api(path,opts,jaTentou){
  opts=opts||{};
  var h={"apikey":SB_KEY,"Authorization":"Bearer "+((SESSAO&&SESSAO.access_token)||SB_KEY),"Content-Type":"application/json"};
  return fetch(SB_URL+"/rest/v1/"+path,{method:opts.method||"GET",headers:h,body:opts.body?JSON.stringify(opts.body):undefined})
    .then(function(res){
      if(res.status===401&&SESSAO&&!jaTentou) return renovar().then(function(){ return api(path,opts,true); })
        .catch(function(){ alert("Sua sessão expirou. Entre de novo no Hub."); location.replace("index.html"); throw new Error("sessão expirada"); });
      return res.text().then(function(t){ if(!res.ok) throw new Error(erroTexto(t)||("Erro "+res.status)); return t?JSON.parse(t):null; });
    });
}
function rpc(nome,args){ return api("rpc/"+nome,{method:"POST",body:args||{}}); }

/* ---------- utilidades ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function n(v){ var x=Number(v); return isFinite(x)?x:0; }
function brl(v){ return (n(v)<0?"-":"")+"R$ "+Math.abs(n(v)).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function pc(v){ return n(v).toLocaleString("pt-BR",{maximumFractionDigits:2})+"%"; }
function lerValor(s){ s=String(s==null?"":s).trim().replace(/[R$\s]/g,""); if(!s) return 0;
  if(/,\d{1,2}$/.test(s)) s=s.replace(/\./g,"").replace(",","."); else if(/^\-?[\d.]+$/.test(s)&&/\.\d{3}(\.|$)/.test(s)) s=s.replace(/\./g,"");
  var x=parseFloat(s); return isFinite(x)?x:0; }
var MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function nomeMes(iso){ var p=String(iso).slice(0,7).split("-"); var m=MESES[Number(p[1])-1]; return m.charAt(0).toUpperCase()+m.slice(1)+"/"+p[0]; }
function mesSeguinte(iso){ var d=new Date(iso.slice(0,7)+"-01T12:00:00"); d.setMonth(d.getMonth()+1); return d.toISOString().slice(0,7)+"-01"; }
function mesAnterior(){ var d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-01"; }
var ORIGENS={btg:"BTG",seguro:"Seguro",consorcio:"Consórcio",outro:"Outro",ajuste:"Ajuste",saldo:"Saldo"};
var TIPOS={receita:"Receita",estorno:"Estorno",ajuste:"Ajuste",saldo_anterior:"Saldo anterior"};

/* ---------- estado ---------- */
var P=null, COMP=(function(){ try{ return localStorage.getItem("aw_com_comp")||mesAnterior(); }catch(e){ return mesAnterior(); } })();
if(COMP<"2026-10-01") COMP="2026-10-01";
var ABA="lanc", FORM=null, MSG=null, BUSCA="";
function pessoa(id){ for(var i=0;i<(P?P.pessoas:[]).length;i++) if(P.pessoas[i].user_id===id) return P.pessoas[i]; return null; }
function nomeP(id){ var p=pessoa(id); return p?p.nome:"(pessoa removida)"; }
function aberto(){ return !P||!P.mes||P.mes.status!=="fechado"; }
function opera(){ return !!(P&&P.pode_operar); }
function mostrar(texto,tipo){ MSG={texto:texto,tipo:tipo||"ok"}; pintar(); if(tipo!=="erro") setTimeout(function(){ if(MSG&&MSG.texto===texto){ MSG=null; pintar(); } },6000); }
function falhou(e){ mostrar(String(e&&e.message||e),"erro"); }

function carregar(){
  return rpc("comissoes_painel",{p_competencia:COMP}).then(function(d){ P=d; pintar(); })
    .catch(function(e){ document.getElementById("app").innerHTML='<div class="aviso erro">'+esc(e.message||e)+'</div><p class="vazio">Se o erro falar de "comissoes_painel", falta instalar o comissoes.sql no Supabase.</p>'; });
}
function trocarMes(v){ COMP=v; FORM=null; try{ localStorage.setItem("aw_com_comp",v); }catch(e){} carregar(); }
function aba(a){ ABA=a; FORM=null; pintar(); }

/* ---------- cálculo da prévia (o valor que vale é o do banco) ---------- */
function regraPorId(id){ for(var i=0;i<P.regras.length;i++) if(P.regras[i].id===id) return P.regras[i]; return null; }
function regrasVigentes(origens){
  return P.regras.filter(function(r){ return r.ativo && origens.indexOf(r.origem)>=0 && r.vigencia_inicio<=mesSeguinte(COMP) && (!r.vigencia_fim||r.vigencia_fim>=COMP); });
}
function previaRegra(r,receita){
  if(!r||!receita) return "";
  var imp=receita*n(r.pct_imposto)/100, liq=receita-imp;
  var partes=[];
  if(n(r.pct_imposto)) partes.push("imposto "+brl(imp));
  if(n(r.pct_btg)) partes.push("BTG "+brl(liq*n(r.pct_btg)/100));
  if(n(r.pct_escritorio)) partes.push("escritório "+brl(liq*n(r.pct_escritorio)/100));
  if(n(r.pct_assessor)) partes.push("assessor "+brl(liq*n(r.pct_assessor)/100));
  if(n(r.pct_especialista)) partes.push("especialista "+brl(liq*n(r.pct_especialista)/100));
  return partes.join(" · ");
}

/* ---------- tela ---------- */
function pintar(){
  if(!P) return;
  var mesesOpc=[], vistos={};
  var lista=(P.meses||[]).map(function(m){ return m.competencia; });
  lista.push(COMP); lista.push(mesAnterior());
  var d=new Date(); lista.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-01");
  lista.sort().reverse().forEach(function(c){ if(!vistos[c]&&c>="2026-10-01"){ vistos[c]=1; mesesOpc.push(c); } });
  var st=P.mes&&P.mes.status==="fechado"?"fechado":"aberto";
  var lanc=P.lancamentos||[], tot=P.totais||[];
  var receita=lanc.reduce(function(a,l){ return a+(l.tipo==="receita"||l.tipo==="estorno"?n(l.receita):0); },0);
  var aPagar=tot.reduce(function(a,t){ return a+Math.max(0,n(t.total)); },0);
  var escrit=lanc.reduce(function(a,l){ return a+n(l.valor_escritorio); },0);
  var h='<div class="topo"><div><div class="eyebrow">Financeiro</div><h1>'+esc(({lanc:"Lançamentos",regras:"Regras de repasse",pessoas:"Pessoas e dados bancários",fech:"Fechamento e envio",pag:"Pagamentos"})[ABA]||"Comissões")+'</h1>'+
    '<div class="sub">Competência '+esc(nomeMes(COMP))+' &middot; pagamento em '+esc(nomeMes(mesSeguinte(COMP)))+'</div></div>'+
    '<div class="mesbox"><select aria-label="Mês" onchange="trocarMes(this.value)">'+mesesOpc.map(function(c){ return '<option value="'+c+'"'+(c===COMP?" selected":"")+'>'+esc(nomeMes(c))+'</option>'; }).join("")+'</select>'+
    '<span class="selo '+st+'">'+(st==="fechado"?"Fechado":"Aberto")+'</span></div></div>';
  if(!opera()) h+='<div class="aviso info">Você vê as comissões só para leitura. Quem lança, fecha e paga é o Financeiro.</div>';
  if(MSG) h+='<div class="aviso '+(MSG.tipo==="erro"?"erro":"ok")+'" role="status">'+esc(MSG.texto)+'</div>';
  h+='<div class="nums"><div class="num"><span>Receita total do mês</span><b>'+brl(receita)+'</b></div>'+
    '<div class="num"><span>A pagar à equipe</span><b>'+brl(aPagar)+'</b></div>'+
    '<div class="num"><span>Faturamento do escritório</span><b>'+brl(escrit)+'</b></div></div>';
  h+= ABA==="regras"?telaRegras(): ABA==="pessoas"?telaPessoas(): ABA==="fech"?telaFechamento(): ABA==="pag"?telaPagamentos(): telaLancamentos();
  var IC={lanc:'<path d="M4 6h16M4 12h16M4 18h10"/>',regras:'<path d="M12 3v18M5 8h14M7 8l-3 7h6zM17 8l-3 7h6z"/>',pessoas:'<circle cx="9" cy="8" r="3.2"/><path d="M3.5 20v-1.4A4.6 4.6 0 0 1 8.1 14h1.8a4.6 4.6 0 0 1 4.6 4.6V20"/><path d="M16.5 7.2a3 3 0 0 1 0 5.6M18 20v-1.6a4.3 4.3 0 0 0-2.3-3.8"/>',
    fech:'<rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',pag:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/>'};
  var itens=[["lanc","Lançamentos"],["regras","Regras de repasse"],["pessoas","Pessoas e dados bancários"],["fech","Fechamento e envio"],["pag","Pagamentos"]];
  var menu='<aside class="menu" aria-label="Menu de Comissões"><div class="menu-marca"><i><svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 3 21 12 12 21 3 12z" fill="#C0A265"/></svg></i><div><b>Comissões</b><span>Financeiro · Adami Captal</span></div></div>'+
    '<a class="menu-voltar" href="index.html">&#8592; Hub Adami</a><div class="menu-secao">Comissões</div>'+
    itens.map(function(it){ return '<button type="button" class="menu-item'+(ABA===it[0]?" on":"")+'" onclick="aba(\''+it[0]+'\')"'+(ABA===it[0]?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+IC[it[0]]+'</svg>'+it[1]+'</button>'; }).join("")+
    '<div class="menu-pe">'+esc(VERSAO)+(SESSAO&&SESSAO.email?'<br>'+esc(SESSAO.email):'')+'</div></aside>';
  document.getElementById("app").innerHTML='<div class="casca">'+menu+'<main class="principal">'+h+'</main></div>';
}

/* ===== Lançamentos ===== */
function opcoesPessoas(sel,filtro){
  return '<option value="">Escolha…</option>'+P.pessoas.filter(function(p){ return !p.revogado&&(!filtro||filtro(p)); }).map(function(p){
    return '<option value="'+p.user_id+'"'+(p.user_id===sel?" selected":"")+'>'+esc(p.nome)+(p.codigo?" ("+esc(p.codigo)+")":"")+'</option>'; }).join("");
}
function telaLancamentos(){
  var h='';

function chaveCol(x){ return String(x==null?"":x).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]/g,""); }

function lerPlanilha(inp){
  var f=inp.files&&inp.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var wb=XLSX.read(new Uint8Array(rd.result),{type:"array"});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""});
      var todas=[].concat.apply([],CAMPOS_IMP.map(function(c){ return c[2]; }));
      var hi=-1;
      for(var i=0;i<Math.min(rows.length,15);i++){ var acertos=rows[i].filter(function(x){ return todas.indexOf(chaveCol(x))>=0; }).length; if(acertos>=2){ hi=i; break; } }
      if(hi<0) throw new Error("Não achei o cabeçalho (a linha com os nomes das colunas). Use um dos modelos.");
      var colunas=rows[hi].map(function(x){ return String(x).trim(); });
      var mapa={}, usadas={};
      CAMPOS_IMP.forEach(function(c){ mapa[c[0]]=null;
        for(var k=0;k<c[2].length&&mapa[c[0]]===null;k++) for(var j=0;j<colunas.length;j++) if(!usadas[j]&&chaveCol(colunas[j])===c[2][k]){ mapa[c[0]]=j; usadas[j]=1; break; } });
      var linhas=rows.slice(hi+1).filter(function(r){ return r.some(function(x){ return String(x).trim()!==""; }); });
      IMP={arquivo:f.name,colunas:colunas,linhas:linhas,linhaIni:hi+2,mapa:mapa};
      montarImp(); pintar();
    }catch(e){ IMP={erro:String(e.message||e)}; pintar(); }
  };
  rd.readAsArrayBuffer(f);
}
function acharPessoa(txt){
  var t=String(txt==null?"":txt).trim(); if(!t) return null;
  var k=chaveCol(t), ps=P.pessoas.filter(function(p){ return !p.revogado; });
  for(var i=0;i<ps.length;i++) if(ps[i].codigo&&chaveCol(ps[i].codigo)===k) return ps[i];
  for(i=0;i<ps.length;i++) if(String(ps[i].email||"").toLowerCase()===t.toLowerCase()) return ps[i];
  for(i=0;i<ps.length;i++) if(chaveCol(ps[i].nome)===k) return ps[i];
  var porPrimeiro=ps.filter(function(p){ return chaveCol(String(p.nome).split(/\s+/)[0])===k; });
  return porPrimeiro.length===1?porPrimeiro[0]:null;
}

  var m=IMP.mapa, cel=function(r,c){ return m[c]===null||m[c]===undefined?"":r[m[c]]; };

  IMP.itens=IMP.linhas.map(function(r,i){
    var x={linha:IMP.linhaIni+i,item:{},vRec:0,vAss:0,vEsp:0,vEsc:0};
    var rec=numCel(cel(r,"receita")), txtA=String(cel(r,"assessor")).trim(), pa=acharPessoa(txtA);
    x.txtAss=txtA; x.nomeAss=pa?pa.nome:"";
    x.item={tipo:rec<0?"estorno":"receita",cliente:String(cel(r,"cliente")).trim(),conta:String(cel(r,"conta")).trim(),
      empresa:String(cel(r,"empresa")).trim(),produto:String(cel(r,"produto")).trim(),receita:Math.abs(rec),assessor_id:pa?pa.user_id:null};
    var sinal=rec<0?-1:1;
    if(IMP.modo==="btg"){
      var rep=numCel(cel(r,"repasse")), vb=numCel(cel(r,"btg")), ve=numCel(cel(r,"escritorio"));
      x.item.origem="btg"; x.item.valor_assessor=Math.abs(rep); x.item.valor_btg=Math.abs(vb); x.item.valor_escritorio=Math.abs(ve);
      if(rep<0&&rec>=0){ x.item.tipo="estorno"; sinal=-1; }
      x.vRec=sinal*Math.abs(rec); x.vAss=sinal*Math.abs(rep); x.vEsc=sinal*Math.abs(ve);
      if(!txtA) x.erro="sem assessor"; else if(!pa) x.erro="assessor \""+txtA+"\" não está na Equipe"; else if(!rep) x.erro="sem repasse";
    } else {
      var nr=chaveCol(cel(r,"regra")), regra=null;
      if(nr) regra=regras.filter(function(g){ return chaveCol(g.nome)===nr; })[0]||null;
      if(!regra&&(x.item.empresa||x.item.produto)) regra=regras.filter(function(g){ return chaveCol(g.empresa)===chaveCol(x.item.empresa)&&(!x.item.produto||chaveCol(g.produto)===chaveCol(x.item.produto)); })[0]||null;
      var txtE=String(cel(r,"especialista")).trim(), pe=acharPessoa(txtE);
      x.nomeEsp=pe?pe.nome:(txtE?"":""); x.nomeRegra=regra?regra.nome:"";
      if(regra){ x.item.regra_id=regra.id; x.item.origem=regra.origem; if(!x.item.empresa) x.item.empresa=regra.empresa; if(!x.item.produto) x.item.produto=regra.produto; }
      x.item.especialista_id=pe?pe.user_id:null;
      if(!rec) x.erro="sem valor de receita";
      else if(!regra) x.erro=nr?"regra \""+cel(r,"regra")+"\" não existe":"não achei regra para "+([x.item.empresa,x.item.produto].filter(Boolean).join(" · ")||"esta linha");
      else if(n(regra.pct_assessor)>0&&!pa) x.erro=txtA?"assessor \""+txtA+"\" não está na Equipe":"sem assessor";
      else if(n(regra.pct_especialista)>0&&!pe) x.erro=txtE?"especialista \""+txtE+"\" não está na Equipe":"sem especialista";
      if(regra){ var liq=Math.abs(rec)*(1-n(regra.pct_imposto)/100);
        x.vRec=sinal*Math.abs(rec); x.vAss=sinal*liq*n(regra.pct_assessor)/100; x.vEsp=sinal*liq*n(regra.pct_especialista)/100; x.vEsc=sinal*(liq-liq*n(regra.pct_btg)/100)-x.vAss-x.vEsp; }
    }
    return x;
  });
}

function baixarPessoa(uid){ var x=planilhaPessoa(uid); baixarWb(x.wb,x.nome); }
function baixarGeral(){
  var rows=[["Pessoa","E-mail","Total (R$)","CPF/CNPJ","PIX","Banco","Agência","Conta","Enviado em","Pago em"]];
  totaisOrdenados().forEach(function(t){ var p=pessoa(t.user_id)||{}, d=p.pagto||{}, pg=pagamento(t.user_id)||{};
    rows.push([p.nome,p.email,Math.round(n(t.total)*100)/100,d.cpf_cnpj||"",(d.pix_tipo?d.pix_tipo+": ":"")+(d.pix_chave||""),d.banco||"",d.agencia||"",d.conta||"",pg.enviado_em?new Date(pg.enviado_em).toLocaleString("pt-BR"):"",pg.pago_em?pg.pago_em.split("-").reverse().join("/"):""]); });
  var det=[["Tipo","Origem","Regra","Cliente","Conta","Empresa","Produto","Descrição","Receita","Imposto","BTG","Escritório","Pessoa","Papel","Valor da pessoa"]];
  (P.lancamentos||[]).forEach(function(l){ (l.rateio&&l.rateio.length?l.rateio:[{}]).forEach(function(r){
    det.push([TIPOS[l.tipo],ORIGENS[l.origem],l.regra_nome,l.cliente,l.conta,l.empresa,l.produto,l.descricao,n(l.receita),n(l.imposto),n(l.valor_btg),n(l.valor_escritorio),r.user_id?nomeP(r.user_id):"",r.papel||"",n(r.valor)]); }); });
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),"Por pessoa");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(det),"Lançamentos");
  baixarWb(wb,"Comissões "+nomeMes(COMP).replace("/","-")+" - geral.xlsx");
}

/* E-mail: a função comissoes-enviar confere no banco quem pode enviar, o e-mail e o total de cada
   pessoa; a tela só manda a planilha. */
function enviar(ids){
  var alvo=ids||totaisOrdenados().map(function(t){ return t.user_id; });
  if(!ids&&!confirm("Enviar o e-mail com o valor e a planilha para "+alvo.length+" pessoa(s)?")) return;
  var b=document.getElementById("btEnviar"); if(b){ b.disabled=true; }
  var ok=0, erros=[], i=0;
  function proximo(){
    if(i>=alvo.length){ MSG={texto:ok+" e-mail(s) enviado(s)."+(erros.length?" Falharam: "+erros.join("; "):""),tipo:erros.length?"erro":"ok"}; return carregar(); }
    var uid=alvo[i++], x=planilhaPessoa(uid);
    if(b) b.textContent="Enviando "+i+" de "+alvo.length+"…";
    var arquivo=XLSX.write(x.wb,{bookType:"xlsx",type:"base64"});
    return enviarUm(uid,x.nome,arquivo,false).then(function(r){ if(r&&r.ok) ok++; else erros.push(nomeP(uid)+": "+(r&&r.erro||"erro")); })
      .catch(function(e){ erros.push(nomeP(uid)+": "+(e.message||e)); }).then(proximo);
  }
  proximo();
}
function enviarUm(uid,nome,arquivo,jaTentou){
  return fetch(SB_URL+"/functions/v1/comissoes-enviar",{method:"POST",
    headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SESSAO.access_token,"Content-Type":"application/json"},
    body:JSON.stringify({competencia:COMP,user_id:uid,nome_arquivo:nome,arquivo_base64:arquivo})})
    .then(function(res){
      if(res.status===401&&!jaTentou) return renovar().then(function(){ return enviarUm(uid,nome,arquivo,true); });
      if(res.status===404) return {erro:"a função de envio (comissoes-enviar) ainda não foi instalada no Supabase"};
      return res.text().then(function(t){ var j={}; try{ j=JSON.parse(t); }catch(e){ j={erro:t}; } return j; });
    });
}

/* ===== Pagamentos ===== */
function telaPagamentos(){
  if(aberto()) return '<div class="cartao"><h2>Pagamentos</h2><p class="vazio">Os pagamentos aparecem depois que o mês for fechado (aba Fechamento e envio).</p></div>';
  var pags=(P.pagamentos||[]).slice().sort(function(a,b){ return nomeP(a.user_id).localeCompare(nomeP(b.user_id)); });
  var h='<div class="cartao"><h2>Pagamentos de '+esc(nomeMes(COMP))+'</h2><p class="sub">Faça as transferências em '+esc(nomeMes(mesSeguinte(COMP)))+' e marque a data de cada uma.</p>';
  if(!pags.length) return h+'<p class="vazio">Ninguém a receber neste mês.</p></div>';
  var soma=0, pago=0;
  h+='<div class="tab-rol"><table><thead><tr><th>Pessoa</th><th class="n">Valor</th><th>PIX</th><th>Banco · agência · conta</th><th>CPF/CNPJ</th><th>Pago em</th></tr></thead><tbody>';
  pags.forEach(function(pg){
    var p=pessoa(pg.user_id)||{}, d=p.pagto||{}; soma+=n(pg.valor); if(pg.pago_em) pago+=n(pg.valor);
    h+='<tr><td><b>'+esc(nomeP(pg.user_id))+'</b>'+(d.titular?'<div class="sub" style="font-size:11.5px">titular: '+esc(d.titular)+'</div>':'')+(pagtoCompleto(d)?'':'<div class="falta">faltam dados</div>')+'</td>'+
      '<td class="n"><b>'+brl(pg.valor)+'</b></td><td>'+esc(d.pix_chave?(d.pix_tipo?d.pix_tipo+": ":"")+d.pix_chave:"—")+'</td>'+
      '<td>'+esc([d.banco,d.agencia,d.conta,d.tipo_conta].filter(Boolean).join(" · ")||"—")+'</td><td>'+esc(d.cpf_cnpj||"—")+'</td>'+
      '<td>'+(opera()?'<input type="date" value="'+esc(pg.pago_em||"")+'" onchange="marcarPago(\''+pg.user_id+'\',this.value)" aria-label="Data do pagamento">':esc(pg.pago_em?pg.pago_em.split("-").reverse().join("/"):"—"))+'</td></tr>';
  });
  h+='<tr class="total"><td>Total</td><td class="n">'+brl(soma)+'</td><td colspan="4">pago: '+brl(pago)+' &middot; falta: '+brl(soma-pago)+'</td></tr></tbody></table></div>';
  return h+'<div class="linha-acoes"><button class="bt" onclick="baixarGeral()">Baixar planilha (contabilidade)</button></div></div>';
}
function marcarPago(uid,data){
  rpc("comissao_marcar_pago",{p_competencia:COMP,p_user:uid,p_data:data||null}).then(function(){ MSG={texto:data?"Pagamento marcado.":"Pagamento desmarcado.",tipo:"ok"}; return carregar(); }).catch(falhou);
}

carregar();
