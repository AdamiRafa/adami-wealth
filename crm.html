  const [currentUser, setCurrentUser] = useState(null);
  const [query, setQuery] = useState('');
  const [vendorFilter, setVendorFilter] = useState('all');
  const [openLead, setOpenLead] = useState(null);
  const [creating, setCreating] = useState(false);
  const [quickAddStage, setQuickAddStage] = useState(null);
  const [managingTeam, setManagingTeam] = useState(false);
  const [saveStatus, setSaveStatus] = useState('idle');
  const [view, setView] = useState('kanban'); // kanban | perdidos
  /* Pousa em "Hoje" assim que a sessão carrega, uma vez só: depois disso a
     navegação do usuário manda. Especialista não tem jornada de cliente,
     então continua caindo no próprio quadro de negócios. */
  const viewInicializada = useRef(false);
  useEffect(() => {
    if(!currentUser || viewInicializada.current) return;
    viewInicializada.current = true;
    /* O botão do e-mail da manhã chega com #agenda e abre direto na Agenda. */
    if(location.hash === '#agenda') setView('agenda');
    else if(currentUser.role !== 'especialista') setView('hoje');
  }, [currentUser]);
  const [losingLead, setLosingLead] = useState(null);
  const [winningLead, setWinningLead] = useState(null);
  const [movingLead, setMovingLead] = useState(null);
  const [overviewOpen, setOverviewOpen] = useState(true);
  const [encaminhando, setEncaminhando] = useState(null);
  const [verNotificacoes, setVerNotificacoes] = useState(false);
  const [filtros, setFiltros] = useState({ ...FILTROS_VAZIOS });
  /* Cotação do dólar: uma para o app inteiro, vinda do banco. Fica aqui e não
     em cada tela porque o consolidado tem de ser o mesmo em todas elas. */
  const [cotacao, setCotacao] = useState(null);
  /* Abre no mês corrente: captação líquida é número do mês, e é esse o
     primeiro que se quer ver. A carteira não depende do período. */
  const [kpiFiltros, setKpiFiltros] = useState({
    periodo:'mes', de:'', ate:'', assessor:'all', produtos:[], especialista:'all',
    temperatura:[],
  });
  /* Simular um assessor leva os KPIs junto: o recorte por assessor dos
     indicadores passa a ser o da simulação (e volta à casa ao sair dela). */
  useEffect(() => {
    setKpiFiltros(f => f.assessor === vendorFilter ? f : { ...f, assessor: vendorFilter });
  }, [vendorFilter]);
  const grupos = useMemo(() => gruposExistentes(leads), [leads]);
  const [filtrosAbertos, setFiltrosAbertos] = useState(false);
  const [modoBoard, setModoBoard] = useState('quadro');   // quadro | lista
  const notificacoesMostradas = useRef(false);
  const [funil, setFunil] = useState('assessor');
  const [produtoFiltro, setProdutoFiltro] = useState(PRODUTOS[0]);
  const [toasts, setToasts] = useState([]);
  /* Agenda: tarefas da tabela `tarefas`. O erro fica guardado para a aba
     avisar que falta rodar agenda.sql, em vez de quebrar o CRM inteiro. */
  const [tarefas, setTarefas] = useState([]);
  const [tarefasErro, setTarefasErro] = useState('');
  const [souMaster, setSouMaster] = useState(false);
  /* Visual 2026: menu recolhido e modo noite ficam guardados no navegador.
     "aw_cor" é a mesma chave do Hub, para os dois andarem juntos. */
  const [menuCurto, setMenuCurto] = useState(() => { try{ return localStorage.getItem('aw_menu_curto') === '1'; }catch(e){ return false; } });
  const [noite, setNoite] = useState(() => { try{ return localStorage.getItem('aw_cor') === 'noite'; }catch(e){ return false; } });
  useEffect(() => { try{ localStorage.setItem('aw_menu_curto', menuCurto ? '1' : '0'); }catch(e){} }, [menuCurto]);
  useEffect(() => {
    if(noite) document.documentElement.dataset.cor = 'noite'; else delete document.documentElement.dataset.cor;
    try{ localStorage.setItem('aw_cor', noite ? 'noite' : 'dia'); }catch(e){}
  }, [noite]);

  /* Fila de avisos: toda mutação agora confirma o que aconteceu.
     Antes só o bloqueio de trajeto falava com o usuário. */
  const toastSeq = useRef(0);
  const pushToast = (mensagem, tipo = 'info') => {
    const id = ++toastSeq.current;
    setToasts(prev => [...prev.slice(-2), { id, mensagem, tipo }]);
    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), tipo === 'error' ? 5000 : 3200);
  };

  const loadedOnce = useRef(false);

  /* ---------- Carga inicial e sessão ---------- */
  const carregarDados = async () => {
    const [ls, ps] = await Promise.all([ fetchLeads(), fetchProfiles() ]);
    setLeads(ls); setUsers(ps);
    /* Convites só interessam ao admin, e a política do banco recusa a
       leitura para os demais — por isso a busca fica separada e tolerante. */
    try{ setConvites(await fetchConvites()); }catch(e){ setConvites([]); }
    /* Tolerante pelo mesmo motivo: num banco onde a migração da cotação ainda
       não rodou, a tabela não existe. Sem cotação o app funciona — só não
       consolida o offshore, e diz isso na tela. */
    try{ setCotacao(await fetchConfig(COTACAO_CHAVE)); }catch(e){ setCotacao(null); }
    try{ setTarefas(await fetchTarefas()); setTarefasErro(''); }
    catch(e){ setTarefas([]); setTarefasErro(String((e && e.message) || e || 'erro')); }
    try{ setSouMaster(await fetchSouMaster()); }catch(e){ setSouMaster(false); }
  };

  useEffect(() => {
    if(MODO_DEMO){ semearDemo(); setPhase('login'); loadedOnce.current = true; return; }
    if(!libPronta){ setPhase('semlib'); return; }
    if(!configurado){ setPhase('config'); return; }
    if(invertido || chaveSecreta || !sb){ setPhase('chaves'); return; }
    (async () => {
      /* Login único. O portal guarda a sessão em aw_sessao, com chave
         própria; o supabase-js guarda na dele. Mesmo projeto, mesmos
         tokens — só não se enxergavam, e por isso o assessor logava
         duas vezes. Aqui a sessão do portal é adotada antes de o CRM
         procurar a sua.                                             */
      await adotarSessaoDoPortal();
      const { data } = await sb.auth.getSession();
      if(data && data.session){
        const entrou = await abrirSessao(data.session.user);
        if(!entrou) setPhase('login');
      } else {
        setPhase('login');
      }
      loadedOnce.current = true;
    })();
    /* Sessão expirada ou logout em outra aba derruba esta também. */
    const { data: sub } = sb.auth.onAuthStateChange((evento, sessao) => {
      if(evento === 'SIGNED_OUT'){
        setCurrentUser(null); setPhase('login');
        try { localStorage.removeItem('aw_sessao'); } catch(e){}
      } else if(evento === 'TOKEN_REFRESHED' || evento === 'SIGNED_IN'){
        devolverSessaoAoPortal(sessao);
      }
    });
    return () => { if(sub && sub.subscription) sub.subscription.unsubscribe(); };
  }, []);

  /* ---------- Login único com o portal ---------- */
  async function adotarSessaoDoPortal(){
    let portal = null;
    try { portal = JSON.parse(localStorage.getItem('aw_sessao') || 'null'); } catch(e){}
    if(!portal || !portal.access_token || !portal.refresh_token) return false;
    const { data } = await sb.auth.getSession();
    if(data && data.session && data.session.access_token === portal.access_token) return true;
    const { error } = await sb.auth.setSession({
      access_token: portal.access_token,
      refresh_token: portal.refresh_token
    });
    if(error){
      try { localStorage.removeItem('aw_sessao'); } catch(e){}
      return false;
    }
    return true;
  }
  /* Quando o supabase-js renova o token, o portal precisa saber — senão
     fica com o token velho e cai no login na próxima visita. */
  function devolverSessaoAoPortal(sessao){
    if(!sessao || !sessao.access_token) return;
    try {
      const atual = JSON.parse(localStorage.getItem('aw_sessao') || 'null') || {};
      atual.access_token  = sessao.access_token;
      atual.refresh_token = sessao.refresh_token;
      if(sessao.expires_at) atual.expires_at = sessao.expires_at;
      if(sessao.user){ atual.id = sessao.user.id; atual.email = sessao.user.email; }
      localStorage.setItem('aw_sessao', JSON.stringify(atual));
    } catch(e){}
  }

  /* Carrega o perfil do usuário autenticado e decide se ele pode entrar. */
  const abrirSessao = async (authUser) => {
    const { data, error } = await sb.from('profiles').select('*').eq('id', authUser.id).maybeSingle();
    /* Recusar acesso ao CRM NAO e logout. Com o login unico, derrubar a
       sessao aqui expulsaria a pessoa do portal inteiro — bastaria abrir
       o card do CRM sem ter perfil ativo para perder tudo.            */
    if(error || !data){ setMotivoBloqueio('sem-perfil'); setPhase('bloqueado'); return true; }
    if(data.status !== 'ativo'){ setMotivoBloqueio(data.status); setPhase('bloqueado'); return true; }
    setCurrentUser({ id:data.id, nome:data.nome, role:data.role, status:data.status,
      produtos:data.produtos || [], especialistasPadrao:data.especialistas_padrao || {} });
    if(data.role === 'especialista'){
      setFunil('especialista');
      const meus = (data.produtos || []).filter(x => PRODUTOS.indexOf(x) !== -1);
      if(meus.length) setProdutoFiltro(meus[0]);
    }
    await carregarDados();
    setPhase('app');
    return true;
  };

  /* ---------- Tempo real ----------
     Substitui a sincronização manual: a alteração de um colega chega
     na tela sem precisar trocar de aba. */
  useEffect(() => {
    if(phase !== 'app' || !sb || MODO_DEMO) return;
    const canal = sb.channel('leads-stream')
      .on('postgres_changes', { event:'*', schema:'public', table:'leads' }, (payload) => {
        const novo = payload.new && payload.new.id ? leadFromRow(payload.new) : null;
        if(!novo) return;
        setLeads(prev => {
          const i = prev.findIndex(l => l.id === novo.id);
          /* Ignora o eco da própria gravação para não sobrescrever o que
             o usuário já está editando na tela. */
          if(i >= 0 && prev[i].atualizadoEm >= novo.atualizadoEm) return prev;
          if(i >= 0){ const copia = prev.slice(); copia[i] = novo; return copia; }
          return [...prev, novo];
        });
      })
      .subscribe();
    return () => { sb.removeChannel(canal); };
  }, [phase]);

  /* Rede cai, aba volta: recarrega para não ficar com dados velhos. */
  useEffect(() => {
    if(phase !== 'app' || MODO_DEMO) return;
    const sincronizar = () => { if(document.visibilityState === 'visible') carregarDados().catch(()=>{}); };
    window.addEventListener('focus', sincronizar);
    return () => window.removeEventListener('focus', sincronizar);
  }, [phase]);

  /* ---------- Persistência ----------
     Grava um negócio de cada vez. Em caso de falha, o estado local segue
     com a alteração e o banner oferece nova tentativa. */
  const pendentesSalvar = useRef(new Map());

  const persistir = async (lead) => {
    pendentesSalvar.current.set(lead.id, lead);
    setSaveStatus('saving');
    try{
      await upsertLead(lead);
      pendentesSalvar.current.delete(lead.id);
      setSaveStatus(pendentesSalvar.current.size ? 'error' : 'idle');
    }catch(e){
      console.error('Falha ao salvar negócio', e);
      setSaveStatus('error');
    }
  };

  const retrySave = async () => {
    const fila = Array.from(pendentesSalvar.current.values());
    setSaveStatus('saving');
    for(const lead of fila){
      try{ await upsertLead(lead); pendentesSalvar.current.delete(lead.id); }
      catch(e){ console.error(e); }
    }
    const ok = pendentesSalvar.current.size === 0;
    setSaveStatus(ok ? 'idle' : 'error');
    if(ok) pushToast('Alterações salvas.', 'success');
  };

  /* ---------- Autenticação ---------- */
  const traduzErroAuth = (msg) => {
    const m = (msg || '').toLowerCase();
    if(m.includes('invalid login')) return 'E-mail ou senha incorretos.';
    if(m.includes('already registered') || m.includes('already been registered')) return 'Já existe uma conta com esse e-mail.';
    if(m.includes('email not confirmed')) return 'Confirme seu e-mail antes de entrar.';
    if(m.includes('signups not allowed') || m.includes('signup is disabled')) return 'O cadastro está desativado no painel do Supabase (Authentication > Sign In / Providers > Email).';
    if(m.includes('database error')) return 'O banco recusou a criação do perfil. Verifique se o schema.sql foi executado por completo.';
    if(m.includes('password')) return 'Senha recusada: ' + msg;
    if(m.includes('rate limit') || m.includes('too many')) return 'Muitas tentativas. Aguarde um minuto.';
    /* Mostrar o texto original é melhor do que esconder a causa atrás
       de uma mensagem vaga que não ajuda ninguém a resolver. */
    return 'Erro do servidor: ' + (msg || 'sem detalhes');
  };

  const handleLogin = async (email, senha) => {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });
    if(error){ console.error('login falhou:', error); return traduzErroAuth(error.message); }
    const entrou = await abrirSessao(data.user);
    return entrou ? true : 'Sua conta ainda não foi liberada por um administrador.';
  };

  const handleRegister = async (nome, email, senha) => {
    const { error } = await sb.auth.signUp({ email, password: senha, options:{ data:{ nome } } });
    if(error){ console.error('signUp falhou:', error); return traduzErroAuth(error.message); }
    await sb.auth.signOut();
    return true;
  };

  const handleReset = async (email) => {
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.href });
    if(error) return traduzErroAuth(error.message);
    return true;
  };

  /* Entrada sem senha, exclusiva do modo demonstração. */
  const entrarDemo = async (userId) => {
    const perfil = demoStore.profiles.find(p => p.id === userId);
    if(!perfil) return;
    setCurrentUser({ ...perfil });
    if(perfil.role === 'especialista'){
      setFunil('especialista');
      const meus = (perfil.produtos || []).filter(x => PRODUTOS.indexOf(x) !== -1);
      if(meus.length) setProdutoFiltro(meus[0]);
    }
    await carregarDados();
    setPhase('app');
  };

  const handleLogout = async () => {
    notificacoesMostradas.current = false;
    /* Devolve a navegação ao estado inicial: o próximo login pode ser de
       alguém com outro papel, e sobra de estado da sessão anterior confunde. */
    setFunil('assessor');
    setProdutoFiltro(PRODUTOS[0]);
    setFiltros({ ...FILTROS_VAZIOS });
    setFiltrosAbertos(false);
    setView('kanban');
    if(!MODO_DEMO) await sb.auth.signOut();
    setCurrentUser(null); setLeads([]); setTarefas([]); setSouMaster(false); setPhase('login');
    setQuery(''); setVendorFilter('all'); setView('kanban');
  };

  /* ---------- Equipe ---------- */
  /* O banco fala snake_case; o estado do app, camelCase. Traduz o patch
     em vez de mandar chaves inexistentes para o Postgres. */
  const perfilParaLocal = (campos) => {
    const local = { ...campos };
    if('especialistas_padrao' in campos){
      local.especialistasPadrao = campos.especialistas_padrao;
      delete local.especialistas_padrao;
    }
    return local;
  };

  const atualizarPerfil = async (userId, campos, mensagem) => {
    if(MODO_DEMO){
      const local = perfilParaLocal(campos);
      const i = demoStore.profiles.findIndex(p => p.id === userId);
      if(i >= 0) demoStore.profiles[i] = { ...demoStore.profiles[i], ...local };
      setUsers(prev => prev.map(u => u.id===userId ? { ...u, ...local } : u));
      pushToast(mensagem, 'success');
      return;
    }
    const { error } = await sb.from('profiles').update(campos).eq('id', userId);
    if(error){ console.error(error); pushToast('Não foi possível salvar a alteração na equipe.', 'error'); return; }
    setUsers(prev => prev.map(u => u.id===userId ? { ...u, ...perfilParaLocal(campos) } : u));
    pushToast(mensagem, 'success');
  };

  const ROTULO_PAPEL = { admin:'administrador', especialista:'especialista', vendedor:'assessor' };

  /* Muda o papel preservando o resto do perfil. Sair de especialista limpa
     os produtos, porque eles só fazem sentido nesse papel — e mantê-los
     escondidos faria a pessoa voltar a receber indicações sem querer. */
  const definirRole = (userId, role) => {
    const alvo = users.find(u => u.id === userId);
    if(!alvo || alvo.role === role) return;
    const campos = { role };
    if(role !== 'especialista') campos.produtos = [];
    atualizarPerfil(userId, campos, alvo.nome + ' agora é ' + (ROTULO_PAPEL[role] || role) + '.');
  };

  const definirProdutos = (userId, produtos) => {
    const alvo = users.find(u => u.id === userId);
    if(!alvo) return;
    atualizarPerfil(userId, { produtos },
      produtos.length
        ? alvo.nome + ' atende ' + produtos.join(' e ') + '.'
        : alvo.nome + ' ficou sem produto atribuído.');
  };

  /* Guarda a dupla no perfil do assessor: é acordo de time, não do cliente. */
  const definirPadrao = (userId, produto, especialistaId) => {
    const alvo = users.find(u => u.id === userId);
    if(!alvo) return;
    const mapa = { ...(alvo.especialistasPadrao || {}) };
    if(especialistaId) mapa[produto] = especialistaId; else delete mapa[produto];
    const nomeEsp = (users.find(u => u.id === especialistaId) || {}).nome;
    atualizarPerfil(userId, { especialistas_padrao: mapa },
      especialistaId ? produto + ' de ' + alvo.nome.split(' ')[0] + ' vai para ' + nomeEsp + '.'
                     : 'Padrão de ' + produto + ' removido.');
  };

  /* Convite: o admin define quem a pessoa será; ela define a própria senha
     ao se cadastrar com esse e-mail. O casamento acontece no banco. */
  const criarConvite = async (dados) => {
    const email = dados.email.trim().toLowerCase();
    if(users.some(u => (u.email || '').toLowerCase() === email)){
      pushToast('Já existe uma conta com esse e-mail.', 'error'); return false;
    }
    if(convites.some(c => c.email.toLowerCase() === email)){
      pushToast('Esse e-mail já foi convidado.', 'error'); return false;
    }
    const novo = { email, nome: dados.nome.trim(), role: dados.role,
      produtos: dados.role === 'especialista' ? dados.produtos : [], criadoEm: Date.now() };

    if(MODO_DEMO){
      demoStore.convites.unshift(novo);
      setConvites([novo, ...convites]);
      pushToast('Convite criado para ' + novo.nome + '.', 'success');
      return true;
    }
    const { error } = await sb.from('convites').insert({
      email: novo.email, nome: novo.nome, role: novo.role,
      produtos: novo.produtos, criado_por: currentUser.id,
    });
    if(error){ console.error(error); pushToast('Não foi possível criar o convite.', 'error'); return false; }
    setConvites([novo, ...convites]);
    pushToast('Convite criado para ' + novo.nome + '.', 'success');
    return true;
  };

  const cancelarConvite = async (email) => {
    if(MODO_DEMO){
      demoStore.convites = demoStore.convites.filter(c => c.email !== email);
    } else {
      const { error } = await sb.from('convites').delete().eq('email', email);
      if(error){ console.error(error); pushToast('Não foi possível cancelar.', 'error'); return; }
    }
    setConvites(convites.filter(c => c.email !== email));
    pushToast('Convite cancelado.', 'success');
  };

  const approveUser = (userId) => {
    const alvo = users.find(u => u.id === userId);
    atualizarPerfil(userId, { status:'ativo' }, (alvo ? alvo.nome : 'Conta') + ' liberado para entrar.');
  };

  /* Redefinir senha é feito pelo próprio usuário, por e-mail: o app nunca
     manipula credenciais de outra pessoa. */
  const resetPin = async (userId) => {
    const alvo = users.find(u => u.id === userId);
    const { data, error } = await sb.from('profiles').select('id').eq('id', userId).maybeSingle();
    if(error || !data){ pushToast('Perfil não encontrado.', 'error'); return; }
    pushToast('Peça para ' + (alvo ? alvo.nome : 'a pessoa') + ' usar "Esqueci minha senha" na tela de entrada.', 'info');
  };

  /* Sem chave de serviço no navegador não dá para apagar a conta de login.
     Marcar como removido bloqueia o acesso pelas políticas do banco. */
  const removeUser = async (userId, destinoId) => {
    const alvo = users.find(u => u.id === userId);
    if(destinoId){
      const daPessoa = ativos(leads).filter(l => l.responsavelId === userId);
      for(const l of daPessoa){
        const movido = stampLead({ ...l, responsavelId: destinoId });
        setLeads(prev => prev.map(x => x.id===l.id ? movido : x));
        await persistir(movido);
      }
    }
    await atualizarPerfil(userId, { status:'removido' },
      (alvo ? alvo.nome : 'Conta') + ' removido' + (destinoId ? ' e carteira transferida.' : '.'));
  };

  const isAdmin = currentUser && currentUser.role === 'admin';
  const pendentes = users.filter(u => u.status === 'pendente');
  /* Simular a visão do assessor: o admin escolhe alguém no seletor "Toda a
     equipe" (que já existia só para filtrar dado) e a navegação passa a
     esconder o que só o admin vê — Equipe, Atualizar base, Offshore — para
     ele enxergar e preencher exatamente como aquela pessoa enxergaria.
     Só a navegação muda; o que pode gravar continua sendo o admin de
     verdade (podeEditar já libera admin em tudo), então nada aqui muda
     permissão de escrita nem autoria do que for registrado. */
  const simulando = isAdmin && vendorFilter !== 'all';
  const isAdminChrome = isAdmin && !simulando;
  const simulandoNome = simulando ? ((users.find(u => u.id === vendorFilter) || {}).nome || '') : '';

  /* Pinta a interface conforme o contexto aberto. Fica no body porque o
     cabeçalho é HTML estático, fora da árvore do React. */
  const tema = temaDe(funil, produtoFiltro);
  useEffect(() => {
    document.body.dataset.tema = phase === 'app' ? tema : 'jornada';
    /* O admin transita pelos três contextos: a faixa dourada no cabeçalho
       lembra que ele está vendo tudo, não só a própria carteira. */
    if(phase === 'app' && isAdmin) document.body.dataset.papel = 'admin';
    else delete document.body.dataset.papel;
    const alvo = document.getElementById('contexto-atual');
    if(alvo) alvo.textContent = phase === 'app' ? (TEMAS[tema] || {}).rotulo || '' : '';
  }, [tema, phase, isAdmin]);

  /* Precisa varrer todos os leads: os cards de indicação pertencem ao
     especialista e não aparecem no escopo do assessor. */
  const pendentesIndicacao = useMemo(() => {
    const vivos = ativos(leads);
    return new Set(vivos.filter(l => semIndicacao(vivos, l)).map(l => l.id));
  }, [leads]);

  /* O aviso de entrada considera tudo que é do usuário, sem depender do
     funil aberto ou da aba de produto selecionada. */
  const minhasNotificacoes = useMemo(() => {
    if(!currentUser) return [];
    const meus = ativos(leads).filter(l =>
      !saiuDoQuadro(l) && (isAdmin || l.responsavelId === currentUser.id));
    const hoje = todayISO();
    const indicar = meus.filter(l => pendentesIndicacao.has(l.id)).map(l => ({
      id: l.id + ':indicar', leadId: l.id, lead: l,
      classe: 'indicacao', rotulo: 'Indicação pendente',
      texto: 'Chegou na R4 sem negócio indicado ao especialista',
      data: null, urgencia: 'late',
    }));
    return [...indicar, ...notificacoesDe(meus, hoje)];
  }, [leads, currentUser, isAdmin, pendentesIndicacao]);

  /* Aparece uma vez por sessão, quando há algo pendente. */
  useEffect(() => {
    if(phase !== 'app' || notificacoesMostradas.current) return;
    if(!loadedOnce.current) return;
    notificacoesMostradas.current = true;
    if(minhasNotificacoes.length > 0) setVerNotificacoes(true);
  }, [phase, minhasNotificacoes]);

  /* Especialista só enxerga os produtos que atende; admin e assessor veem todos.
     Sem produto nenhum reconhecido (cadastro sem marcar Consórcio nem Seguro em
     Equipe, ou marcado só para um produto que o CRM ainda não modela, como
     Previdência), o resultado é lista vazia — nunca a lista cheia como se
     tivesse acesso a tudo. Devolver "tudo" aqui já escondeu esse esquecimento:
     o especialista aterrissava sem aba nenhuma, a tela ficava presa em
     Consórcio, e o card nascia lá sem ninguém perceber. */
  const produtosVisiveis = useMemo(() => {
    if(!currentUser) return PRODUTOS;
    if(currentUser.role === 'especialista')
      return PRODUTOS.filter(p => (currentUser.produtos || []).indexOf(p) !== -1);
    return PRODUTOS;
  }, [currentUser]);

  /* O seletor de produto mostra o que há em cada funil: escolher às cegas
     entre dois nomes é pior do que escolher vendo volume e urgência. */
  const negociosPorProduto = useMemo(() => {
    if(!currentUser) return {};
    const meus = ativos(leads).filter(l =>
      l.funil === 'especialista' && !l.ganho && !l.perdido && (
        isAdmin
        || l.responsavelId === currentUser.id
        || (l.origemLeadId && leads.some(o => o.id === l.origemLeadId && o.responsavelId === currentUser.id))
      ));
    const mapa = {};
    PRODUTOS.forEach(prod => {
      const doProduto = meus.filter(l => l.produto === prod);
      mapa[prod] = {
        total: doProduto.length,
        atrasados: doProduto.filter(l => taskUrgency(l) === 'late').length,
      };
    });
    return mapa;
  }, [leads, currentUser, isAdmin]);

  /* Mantém a aba num produto válido quando o conjunto visível muda. */
  useEffect(() => {
    if(produtosVisiveis.length && produtosVisiveis.indexOf(produtoFiltro) === -1)
      setProdutoFiltro(produtosVisiveis[0]);
  }, [produtosVisiveis]);

  /* Os funis nunca se misturam na tela, e dentro de Negócios cada produto
     é um CRM independente. */
  const scopedLeads = useMemo(() => {
    if(!currentUser) return [];
    let vivos = ativos(leads).filter(l => (l.funil || 'assessor') === funil);
    if(funil === 'especialista') vivos = vivos.filter(l => l.produto === produtoFiltro);
    if(!isAdmin) return vivos.filter(l =>
      l.responsavelId === currentUser.id
      /* O assessor acompanha o card que gerou, em modo leitura. */
      || (funil === 'especialista' && l.origemLeadId && leads.some(o => o.id === l.origemLeadId && o.responsavelId === currentUser.id))
    );
    if(vendorFilter === 'all') return vivos;
    /* Simular um assessor é ver o que ELE vê ao entrar: no funil de Negócios,
       os negócios que ele indicou (o especialista é o responsável, ele é a
       origem). Antes a simulação só olhava o responsável, e um assessor que
       fechou 8 negócios aparecia com zero (relato do Emil, 05/11/2026). */
    const porId = new Map(leads.map(o => [o.id, o]));
    return vivos.filter(l => l.responsavelId === vendorFilter
      || (funil === 'especialista' && l.origemLeadId && porId.has(l.origemLeadId) && porId.get(l.origemLeadId).responsavelId === vendorFilter));
  }, [leads, currentUser, isAdmin, vendorFilter, funil, produtoFiltro]);

  /* No funil de Negócios o assessor apenas acompanha: os cards chegam por
     encaminhamento, não por cadastro manual. Criar cabe ao especialista. */
  /* Roda antes da tela de login existir, então precisa tolerar sessão nula:
     ao sair de uma conta de especialista o funil continua em "Negócios". */
  const podeCriar = !!currentUser &&
    (funil !== 'especialista' || isAdmin
      /* Sem produto habilitado não há aba para escolher, e criar aqui só
         gravaria o card num produto ao acaso. */
      || (currentUser.role === 'especialista' && produtosVisiveis.length > 0));

  /* Edição pertence a quem é responsável. Acompanhar não é editar. */
  const podeEditar = (lead) => !!lead && !!currentUser && (isAdmin || lead.responsavelId === currentUser.id);

  /* Busca agora cobre também a oportunidade e o produto — antes um negócio só
     era encontrável pelo nome, telefone ou e-mail do cliente.

     E ignora acento dos dois lados: "joao" precisa achar "João", porque quem
     digita rápido não para para acentuar, e um nome maior que veio completo
     do cadastro não pode ficar mais difícil de achar do que um digitado sem
     capricho. */
  const semAcento = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const buscar = (lista, q) => {
    if(!q) return lista;
    const alvo = semAcento(q);
    return lista.filter(l =>
      semAcento(l.cliente).includes(alvo) ||
      semAcento(l.conta).includes(alvo) ||
      semAcento(l.contaOffshore).includes(alvo) ||
      semAcento(l.telefone).includes(alvo) ||
      semAcento(l.email).includes(alvo) ||
      semAcento(l.oportunidade).includes(alvo) ||
      semAcento(l.produtoServico).includes(alvo)
    );
  };

  const hojeISO = todayISO();
  const refinar = (lista) => aplicarFiltros(buscar(lista, query.trim().toLowerCase()), filtros, hojeISO);

  const filtered  = useMemo(() => refinar(scopedLeads.filter(l => !saiuDoQuadro(l))), [scopedLeads, query, filtros]);
  const lostLeads = useMemo(() => refinar(scopedLeads.filter(l => l.perdido)), [scopedLeads, query, filtros]);
  const wonLeads  = useMemo(() => refinar(scopedLeads.filter(l => l.ganho)), [scopedLeads, query, filtros]);

  /* Recorte temporal dos indicadores: a data que importa é a do desfecho,
     ou a de criação para quem ainda está em aberto. */
  /* Recorte dos indicadores. Não passa por scopedLeads de propósito: a
     gestão filtra pela barra da própria página, sem depender da aba de
     produto nem do funil aberto. Devolve os dois lados separados, para o
     admin ver carteira e produção na mesma tela. */
  const kpiRecorte = useMemo(() => {
    if(!currentUser) return { jornada: [], negocios: [] };
    const vivos = ativos(leads);

    const dentroDoPeriodo = (l) => {
      const ref = l.ganhoEm || l.perdidoEm || l.criadoEm || 0;
      if(kpiFiltros.periodo === 'custom'){
        if(kpiFiltros.de && ref < new Date(kpiFiltros.de + 'T00:00:00').getTime()) return false;
        if(kpiFiltros.ate && ref > new Date(kpiFiltros.ate + 'T23:59:59').getTime()) return false;
        return true;
      }
      if(kpiFiltros.periodo === 'all') return true;
      return ref >= inicioDoPeriodo(kpiFiltros.periodo);
    };

    /* No funil de produto, "assessor" é quem originou a indicação. */
    const doAssessor = (l) => {
      if(kpiFiltros.assessor === 'all') return true;
      if((l.funil || 'assessor') !== 'especialista') return l.responsavelId === kpiFiltros.assessor;
      const origem = vivos.find(o => o.id === l.origemLeadId);
      return !!origem && origem.responsavelId === kpiFiltros.assessor;
    };

    /* Mesma regra do filtro do quadro: 'sem' é escolha legítima, e é dela que
       sai a leitura "quanto da carteira ninguém classificou ainda". */
    const naTemperatura = (l) => !kpiFiltros.temperatura.length
      || (!l.ganho && kpiFiltros.temperatura.indexOf(l.temperatura || 'sem') !== -1);

    const meu = (l) => isAdmin || l.responsavelId === currentUser.id;
    /* O período recorta só o lado da produção. A carteira é estoque — quem
       está sob gestão continua sob gestão quando o mês vira — e o que nela é
       fluxo (captação, aportes, retiradas) já é recortado por data dentro do
       cálculo, em dentroDoRecorte. Recortar o CLIENTE pela data de cadastro
       tirava da carteira quem entrou antes do período: com "30 dias", a base
       inteira sumia do total, e com "Este mês" como padrão sumiria sempre. */
    const base = vivos.filter(l => meu(l) && doAssessor(l) && naTemperatura(l));

    return {
      jornada: base.filter(l => (l.funil || 'assessor') !== 'especialista'),
      negocios: base.filter(l => l.funil === 'especialista' && dentroDoPeriodo(l)
        && (kpiFiltros.produtos.length === 0 || kpiFiltros.produtos.indexOf(l.produto) !== -1)
        && (kpiFiltros.especialista === 'all' || l.responsavelId === kpiFiltros.especialista)),
    };
  }, [leads, currentUser, isAdmin, kpiFiltros]);

  /* Para quem não é admin, o painel segue o funil aberto. */
  const kpiLeads = funil === 'especialista' ? kpiRecorte.negocios : kpiRecorte.jornada;

  /* A cotacao e uma decisao do escritorio: grava, recarrega e todo numero
     convertido na tela muda junto, porque todos leem do mesmo contexto. */
  const salvarCotacao = async (valor) => {
    await upsertConfig(COTACAO_CHAVE, valor);
    setCotacao({ valor, atualizadoEm: Date.now(), atualizadoPor: currentUser ? currentUser.id : null });
    pushToast('Cotação atualizada para ' + fmtBRL(valor) + ' por dólar.', 'success');
  };

  /* Aplica a mudança na tela na hora e grava só aquele negócio no banco. */
  const mutate = (id, fn) => {
    const atual = leads.find(l => l.id === id);
    if(!atual) return null;
    const novo = stampLead(fn(atual));
    setLeads(prev => prev.map(l => l.id===id ? novo : l));
    persistir(novo);
    return novo;
  };

  /* Aplica a prévia da atualização semanal. Recebe exatamente o objeto que a
     tela mostrou — nada é recalculado aqui, senão a prévia deixaria de ser
     uma promessa do que vai acontecer.

     Grava em lote: uma chamada por cliente faria centenas de idas ao servidor
     e deixaria a carteira do escritório meio atualizada se a conexão caísse
     no meio. */
  const aplicarImportacaoBase = async (res) => {
    const agora = Date.now(), hoje = todayISO();
    /* Offshore e Pershing gravam e escrevem em dólar: é a moeda de valorOffshore. */
    const off = res.tipo === 'offshore';
    const dolar = off || res.tipo === 'pershing';
    const fmt = dolar ? fmtUSD : fmtBRL;
    const novos = res.atualizacoes.map((a) => {
      const l = leads.find(x => x.id === a.lead.id) || a.lead;
      const novo = { ...l, ...a.patch };
      const notas = [];

      if(Math.abs(a.delta) >= 0.01){
        /* O que se grava é o valor INICIAL, não o saldo do arquivo: as
           movimentações lançadas pelo assessor continuam somando por cima e
           seriam contadas duas vezes. Ver btgValorAlvo e btgCampoValor. */
        novo[a.campoValor] = fmt(a.valorAlvo);
        notas.push(a.vinculo ? 'saldo inicial ' + fmt(a.saldoBTG)
          : 'saldo ' + fmt(a.saldoAtual) + ' → ' + fmt(a.saldoBTG)
            + ' (' + (a.delta >= 0 ? '+' : '−') + fmt(Math.abs(a.delta)) + ')');
      }
      for(const c of a.campos) notas.unshift(!c.de && a.vinculo
        ? c.rotulo.toLowerCase() + ' ' + c.para + ' vinculada'
        : c.rotulo.toLowerCase() + ': ' + (c.de || '—') + ' → ' + c.para);

      /* Histórico só quando há o que contar: divergência fora da faixa ou
         mudança de cadastro. Rendimento dentro de 0,5% atualiza o saldo em
         silêncio.

         O motivo é de escala, e só aparece no volume real: quase toda conta
         rende alguma coisa toda semana, então registrar a variação de todas
         somaria ~52 entradas por cliente por ano, todas dizendo "rendeu
         0,2%". O histórico da ficha é cronológico — em um ano as transições
         que importam (R1→R2, a captação efetivada, a indicação na R4)
         ficariam soterradas sob extrato de rendimento.

         Nada se perde em auditoria: o saldo continua sendo o do arquivo, e o
         que se descarta é o registro de uma variação que ninguém iria ler. */
      if(a.alerta || a.campos.length){
        novo.historico = [...(l.historico || []), {
          id: uid('h'), de: l.etapa, para: l.etapa, data: agora,
          resumo: (off ? 'Base BTG offshore · ' : 'Base BTG · ') + notas.join(' · ') + (a.alerta ? ' · fora da faixa de rendimento' : ''),
          autor: currentUser.nome,
          /* Marca como reconciliação pra timeline poder recolher esta
             entrada: é diferença de importação, não um fato que alguém
             contou — não deve competir em destaque com o que o assessor
             de fato escreveu. */
          reconciliacao: true,
        }];
      }

      /* O alerta é o que devolve a divergência para quem consegue explicá-la.
         O admin vê o número no resumo; quem liga para o cliente é o assessor,
         e é no card dele que o aviso precisa estar. */
      if(a.alerta){
        novo.alertas = [...(l.alertas || []), {
          id: uid('al'), tipo: 'divergencia',
          texto: (off ? 'Saldo offshore do BTG variou ' : 'Saldo do BTG variou ') + (a.delta >= 0 ? '+' : '−') + fmt(Math.abs(a.delta))
            + ' sem movimentação lançada que explique. Confirmar com o cliente se houve aporte ou resgate.',
          data: hoje, autor: currentUser.nome, criadoEm: agora, resolvido: false,
        }];
      }
      return stampLead(novo);
    });

    /* Conta nova com código reconhecido: nasce card, na hora, com o
       assessor já vinculado pelo código — é a mesma autorização que já
       valia para transferir carteira existente. Sem código, a conta
       continua só listada; cadastro manual, como sempre foi.
       Só o onshore cria: offshore e Pershing nunca criam cliente — a conta
       lá fora só existe depois que a onshore existe (ou, na Pershing, depois
       que alguém liga o número na ficha manualmente). */
    const criados = res.tipo !== 'onshore' ? [] : (res.novas || []).filter(n => n.donoPorCodigo).map((n) => {
      /* Cliente da base já é carteira de verdade — veio com saldo do BTG,
         não é prospect a triar. Por isso entra direto na R2, apresentação
         da proposta, pulando o Cliente Novo: esteira 'base' já autoriza esse
         pulo (ver TRAJETOS — de Cliente Novo só se vai para R2 quando a
         esteira é 'base'). */
      const historico = [{ id: uid('h'), de: null, para: 'R2', data: agora,
        resumo: 'Cadastrado pela importação da base BTG · vínculo pelo código ' + n.codigo,
        autor: currentUser.nome }];
      return stampLead(congelarSaldoInicialOffshore(null, congelarSaldoInicial(null, {
        ...emptyLead(n.donoPorCodigo.id),
        cliente: n.nome, conta: n.conta,
        etapa: 'R2', funil: 'assessor', esteira: 'base',
        segmento: segmentoPorPatrimonio(n.saldo) || 'Advisory',
        saldoInicial: fmtBRL(n.saldo),
        tipoPessoa: n.tipoPessoa || 'PF', nascimento: n.nascimento || '',
        origem: 'Base BTG', criadoEm: agora, etapaDesde: agora,
        historico, atividades: [],
      })));
    });

    if(!novos.length && !criados.length) return;
    const porId = new Map(novos.map(l => [l.id, l]));
    setLeads(prev => [...prev.map(l => porId.has(l.id) ? porId.get(l.id) : l), ...criados]);
    setSaveStatus('saving');
    try {
      await upsertLeads([...novos, ...criados]);
      setSaveStatus(pendentesSalvar.current.size ? 'error' : 'idle');
    } catch(e){
      console.error('Falha ao gravar a atualização da base', e);
      setSaveStatus('error');
      throw e;
    }
    const qtdAlertas = res.resumo.alertas;
    const partes = [];
    if(novos.length) partes.push(novos.length + (novos.length === 1 ? ' cliente atualizado' : ' clientes atualizados'));
    if(criados.length) partes.push(criados.length + (criados.length === 1 ? ' cliente cadastrado' : ' clientes cadastrados'));
    if(qtdAlertas) partes.push(qtdAlertas + (qtdAlertas === 1 ? ' divergência sinalizada' : ' divergências sinalizadas'));
    pushToast(partes.join(' · '), qtdAlertas ? 'warn' : 'success');
  };

  const createLead = (lead) => {
    const historico = [{ id: uid('h'), de: null, para: lead.etapa, data: Date.now(), resumo: 'Lead criado', autor: currentUser.nome }];
    /* Cliente da base nasce com o saldo sob gestão separado do patrimônio. */
    const novo = stampLead({ ...congelarSaldoInicialOffshore(null, congelarSaldoInicial(null, lead)), historico, atividades: [] });
    setLeads(prev => [...prev, novo]);
    persistir(novo);
    setCreating(false);
    pushToast(termos(funil).Sing + ' cadastrado.', 'success');
  };

  const saveLead = (draft) => {
    /* Editar o patrimônio não mexe no sob gestão: o saldo anterior à edição
       fica guardado antes de o rascunho substituir o registro. */
    mutate(draft.id, (atual) => congelarSaldoInicialOffshore(atual, congelarSaldoInicial(atual, draft)));
    setOpenLead(null);
    pushToast('Alterações salvas.', 'success');
  };

  /* Exclusão lógica: um registro apagado de vez não sobrevive à mesclagem
     entre sessões e voltaria a existir no próximo save de outra pessoa. */
  const deleteLead = (id) => {
    if(!isAdmin) return;
    mutate(id, l => ({ ...l, excluido:true, excluidoEm: Date.now() }));
    setOpenLead(null);
    pushToast(termos(funil).Sing + ' excluído.', 'success');
  };

  /* Desfecho no funil do especialista pode encerrar a jornada do cliente de
     origem. A verificação roda sobre a lista já atualizada, senão o próprio
     card recém-encerrado ainda apareceria em aberto. */
  /* Sincroniza a jornada do cliente com o estado das indicações. Vale nos dois
     sentidos: conclui quando todos os especialistas encerram, e devolve para a
     R4 se algum voltar a trabalhar o negócio. Um lugar só, para as duas
     direções nunca discordarem. */
  const sincronizarJornada = (leadEspecialista) => {
    if(!leadEspecialista || leadEspecialista.funil !== 'especialista') return;
    const origemId = leadEspecialista.origemLeadId;
    if(!origemId) return;

    setLeads(prev => {
      const origem = prev.find(l => l.id === origemId);
      if(!origem) return prev;

      const concluida = jornadaConcluida(prev, origem);
      const mover = (para, resumo) => {
        const entrada = { id: uid('h'), de: origem.etapa, para, data: Date.now(),
          resumo, autor: 'Sistema', automatico: true };
        const atualizado = stampLead({ ...origem, etapa: para, etapaDesde: Date.now(),
          historico: [...(origem.historico || []), entrada] });
        persistir(atualizado);
        return prev.map(l => l.id === origemId ? atualizado : l);
      };

      if(origem.etapa === 'R4' && concluida){
        pushToast('Jornada de ' + (nomeCliente(origem) || 'cliente') + ' concluída.', 'success');
        return mover('Jornada Concluída', 'Todas as indicações foram encerradas pelos especialistas.');
      }
      if(origem.etapa === 'Jornada Concluída' && !concluida){
        return mover('R4', 'Um especialista voltou a trabalhar a indicação.');
      }
      return prev;
    });
  };

  const confirmLose = (id, motivo) => {
    /* O saldo offshore de quem foi captado sai junto com o valor captado;
       o da base é saldo de verdade e fica. */
    const atualizado = mutate(id, l => ({ ...l, perdido:true, motivoPerda:motivo, perdidoEm:Date.now(), ganho:false, valorFechado:'', ganhoEm:null,
      ...((l.esteira || 'novo') !== 'base' ? { saldoInicialOffshore:'' } : {}) }));
    setLosingLead(null); setOpenLead(null);
    pushToast('Negócio movido para perdidos.', 'success');
    sincronizarJornada(atualizado);
  };

  const confirmWin = (id, valorFechado, valorOffshore) => {
    const atualizado = mutate(id, l => ({
      ...l, ganho:true, valorFechado, ganhoEm:Date.now(), perdido:false, motivoPerda:'', perdidoEm:null,
      /* Só a Jornada tem custódia. No funil de produto o campo nem aparece, e
         um argumento ausente não pode apagar o que já estava gravado. */
      /* O offshore captado vai para o saldo, não para o patrimônio
         declarado: o cliente pode ter mais lá fora do que trouxe. O
         declarado só é preenchido se estava vazio. */
      ...(valorOffshore === undefined ? {} : {
        saldoInicialOffshore: fmtUSD(parseValor(valorOffshore) || 0),
        ...(parseValor(l.valorOffshore) === null && parseValor(valorOffshore) ? { valorOffshore } : {}),
      }),
    }));
    setWinningLead(null); setOpenLead(null);
    const off = parseValor(valorOffshore);
    pushToast(funil === 'especialista'
      ? 'Venda registrada.'
      : 'Captação efetivada.' + (off ? ' ' + fmtUSD(off) + ' entram na carteira offshore.' : ''), 'success');
    sincronizarJornada(atualizado);
  };

  /* Reabrir devolve o negócio à etapa em que ele estava, não ao início do funil. */
  const reopenLead = (id) => {
    const atualizado = mutate(id, l => ({ ...l, perdido:false, motivoPerda:'', perdidoEm:null, ganho:false, valorFechado:'', ganhoEm:null,
      ...((l.esteira || 'novo') !== 'base' ? { saldoInicialOffshore:'' } : {}) }));
    const lead = leads.find(l => l.id === id);
    pushToast('Reaberto em ' + (lead ? etapaLonga(lead.etapa, lead.funil) : 'sua etapa anterior') + '.', 'success');

    sincronizarJornada(atualizado);
  };

  const addMovimentacao = (leadId, mov) => {
    const lead = leads.find(l => l.id === leadId);
    if(!lead || !podeEditar(lead)) return null;
    /* Aporte de cliente da base em negociação abate a captação em aberto:
       é o mesmo dinheiro, e ele não pode estar nos dois lugares. */
    const atualizado = mutate(leadId, l => abaterCaptacao({ ...l, movimentacoes: [...(l.movimentacoes || []), mov] }, mov));
    const antes = parseValor(lead.valorEmCaptacao) || 0;
    const depois = atualizado ? (parseValor(atualizado.valorEmCaptacao) || 0) : antes;
    pushToast((mov.tipo === 'retirada' ? 'Retirada' : 'Aporte') + ' de '
      + (custodiaDe(mov) === 'offshore' ? fmtUSD : fmtBRL)(parseValor(mov.valor) || 0) + ' registrado.'
      + (depois < antes ? (depois > 0 ? ' Restam ' + moedaCaptacao(lead)(depois) + ' em negociação.' : ' Captação em negociação concluída.') : ''),
      'success');
    return atualizado;
  };

  /* Captação da base: informar, confirmar, encerrar. Cada passo grava só a
     linha do cliente e devolve o registro para a ficha se atualizar. */
  const passoCaptacao = (leadId, passo, dados, mensagem) => {
    const lead = leads.find(l => l.id === leadId);
    if(!lead || !podeEditar(lead)) return null;
    const atualizado = mutate(leadId, l => passo(l, { ...dados, autor: currentUser.nome }));
    pushToast(mensagem(lead), 'success');
    return atualizado;
  };
  const iniciarCaptacaoLead = (leadId, dados) => passoCaptacao(leadId, iniciarCaptacao, dados,
    (l) => (parseValor(l.valorEmCaptacao) || 0) > 0
      ? 'Captação atualizada.'
      : (dados.custodia === 'offshore' ? 'Captação offshore de ' + fmtUSD(parseValor(dados.valor) || 0)
                                       : 'Captação de ' + fmtBRL(parseValor(dados.valor) || 0)) + ' iniciada.');
  const confirmarCaptacaoLead = (leadId, dados) => passoCaptacao(leadId, confirmarCaptacao, dados,
    (l) => 'Captação confirmada: ' + moedaCaptacao(l)(parseValor(dados.valor) || 0)
      + (custodiaCaptacao(l) === 'offshore' ? ' entraram na carteira offshore.' : ' entraram na carteira.'));
  const encerrarCaptacaoLead = (leadId, dados) => passoCaptacao(leadId, encerrarCaptacao, dados,
    () => 'Captação encerrada sem entrada.');

  const removerMovimentacao = (leadId, movId) => {
    const lead = leads.find(l => l.id === leadId);
    if(!lead || !podeEditar(lead)) return null;
    return mutate(leadId, l => ({ ...l, movimentacoes: (l.movimentacoes || []).filter(m => m.id !== movId) }));
  };

  const addAlerta = (leadId, alerta) => {
    const lead = leads.find(l => l.id === leadId);
    if(!lead || !podeEditar(lead)) return null;
    const atualizado = mutate(leadId, l => ({ ...l, alertas: [...(l.alertas || []), alerta] }));
    pushToast('Alerta de ' + tipoAlertaLabel(alerta.tipo).toLowerCase() + ' criado.', 'success');
    return atualizado;
  };

  /* Resolver mantém o registro: o alerta some da lista ativa mas fica no
     histórico do cliente, com quem resolveu e quando. */
  const resolverAlerta = (leadId, alertaId) => {
    const lead = leads.find(l => l.id === leadId);
    if(!lead || !podeEditar(lead)) return null;
    return mutate(leadId, l => ({
      ...l,
      alertas: (l.alertas || []).map(a => a.id === alertaId
        ? { ...a, resolvido:true, resolvidoEm: Date.now(), resolvidoPor: currentUser.nome }
        : a),
    }));
  };

  const removerAlerta = (leadId, alertaId) => {
    const lead = leads.find(l => l.id === leadId);
    if(!lead || !podeEditar(lead)) return null;
    return mutate(leadId, l => ({ ...l, alertas: (l.alertas || []).filter(a => a.id !== alertaId) }));
  };

  /* Clicar no pipe na ficha grava na hora, sem abrir o formulário de edição —
     é campo de uso frequente, e o assessor não devia precisar entrar em modo
     de edição toda vez que muda de ideia sobre a temperatura do cliente.
     Vale para cliente da base também: o pipe geral é leitura de
     relacionamento, independente do fluxo de captação (que continua à
     parte, no extrato, para quem está com uma captação nova em jogo). */
  const setPipe = (leadId, key) => {
    const lead = leads.find(l => l.id === leadId);
    /* Captado também tem pipe (captaNova): a temperatura vale para ele. */
    if(!lead || !podeEditar(lead) || (lead.ganho && !captaNova(lead))) return null;
    return mutate(leadId, l => ({ ...l, temperatura: (l.temperatura || '') === key ? '' : key }));
  };

  /* Mesmo caminho do pipe, para o valor que anda junto com ele: quanto o
     negócio vale muda com a mesma frequência que a temperatura, e separar
     os dois em telas diferentes obrigaria a abrir "Editar" só para o valor
     depois de já ter classificado o pipe na ficha. */
  const setValorPipe = (leadId, valor) => {
    const lead = leads.find(l => l.id === leadId);
    if(!lead || !podeEditar(lead) || lead.ganho) return null;
    return mutate(leadId, l => ({ ...l, valorPotencial: valor }));
  };

  /* Observações editadas direto na ficha. */
  const setObservacoes = (leadId, texto) => {
    const lead = leads.find(l => l.id === leadId);
    if(!lead || !podeEditar(lead)) return null;
    return mutate(leadId, l => ({ ...l, observacoes: texto }));
  };

  /* A fatia em negociação, separada do total. */
  const setValorNegociacaoPipe = (leadId, valor) => {
    const lead = leads.find(l => l.id === leadId);
    if(!lead || !podeEditar(lead) || lead.ganho) return null;
    return mutate(leadId, l => ({ ...l, valorEmNegociacao: valor }));
  };

  const toggleOnboarding = (leadId, itemId) => {
    const lead = leads.find(l => l.id === leadId);
    if(!lead || !podeEditar(lead)) return null;
    const feitos = onboardingFeitos(lead);
    const marcado = feitos.indexOf(itemId) !== -1;
    const novos = marcado ? feitos.filter(x => x !== itemId) : [...feitos, itemId];
    return mutate(leadId, l => ({ ...l, pautas: { ...(l.pautas || {}), onboarding: novos } }));
  };

  const addActivity = (leadId, atividade) => {
    const lead = leads.find(l => l.id === leadId);
    if(!lead) return null;
    const atualizado = mutate(leadId, l => ({
      ...l,
      atividades: [...(l.atividades || []), atividade],
      /* A atividade é a evidência do contato: ela move a data do último contato. */
      ultimoContato: (!l.ultimoContato || atividade.data > l.ultimoContato) ? atividade.data : l.ultimoContato,
    }));
    pushToast(tipoAtividadeLabel(atividade.tipo) + ' registrada.', 'success');
    return atualizado;
  };

  /* Corrigir o que foi escrito errado, sem apagar e registrar de novo
     (o que trocaria autor e data pelo de quem corrigiu). */
  const editarAtividade = (leadId, atividadeId, nota) => {
    const lead = leads.find(l => l.id === leadId);
    if(!lead) return null;
    return mutate(leadId, l => ({
      ...l,
      atividades: (l.atividades || []).map(a => a.id === atividadeId ? { ...a, nota } : a),
    }));
  };

  const removerAtividade = (leadId, atividadeId) => {
    const lead = leads.find(l => l.id === leadId);
    if(!lead) return null;
    return mutate(leadId, l => ({ ...l, atividades: (l.atividades || []).filter(a => a.id !== atividadeId) }));
  };

  /* ---------- Agenda ----------
     Quem pode atribuir: head comercial (admin do CRM) e master. A tela só
     usa isso para mostrar os controles; quem barra é o banco. */
  const podeAtribuir = !!currentUser && (currentUser.role === 'admin' || souMaster);
  const erroTarefa = (e) => {
    const m = String((e && e.message) || e || '');
    if(/atribuída a você/.test(m)) return m;
    if(/row-level security|permission denied/i.test(m)) return 'Você não tem permissão para mexer nesta tarefa.';
    return 'Não foi possível salvar a tarefa (' + m + ').';
  };
  const salvarTarefa = async (t, nova) => {
    try{
      const salva = await gravarTarefa(t, nova);
      setTarefas(prev => nova ? [...prev, salva] : prev.map(x => x.id === salva.id ? salva : x));
      const dono = (users.find(u => u.id === salva.donoId) || {}).nome || '';
      pushToast(nova
        ? (salva.donoId === currentUser.id ? 'Tarefa criada.' : 'Tarefa criada para ' + dono + '.')
        : 'Tarefa atualizada.', 'success');
      return true;
    }catch(e){ pushToast(erroTarefa(e), 'error'); return false; }
  };
  const apagarTarefa = async (t) => {
    try{
      await apagarTarefaBanco(t.id);
      setTarefas(prev => prev.filter(x => x.id !== t.id));
      pushToast('Tarefa excluída.', 'success');
      return true;
    }catch(e){ pushToast(erroTarefa(e), 'error'); return false; }
  };
  /* Marca ou desmarca uma ocorrência. Na hora, sem esperar o banco; se o
     banco recusar, volta como estava. Concluir tarefa ligada a cliente
     registra a atividade na ficha dele (desmarcar não apaga o registro:
     ele se corrige na própria ficha). */
  const concluirTarefa = async (t, dia, feita) => {
    const concluidas = feita
      ? Array.from(new Set([...(t.concluidas || []), dia])).sort()
      : (t.concluidas || []).filter(d => d !== dia);
    const nova = { ...t, concluidas };
    setTarefas(prev => prev.map(x => x.id === t.id ? nova : x));
    try{
      const salva = await gravarTarefa(nova, false);
      setTarefas(prev => prev.map(x => x.id === salva.id ? salva : x));
    }catch(e){
      setTarefas(prev => prev.map(x => x.id === t.id ? t : x));
      pushToast(erroTarefa(e), 'error');
      return;
    }
    const lead = feita && t.leadId ? leads.find(l => l.id === t.leadId) : null;
    if(lead && podeEditar(lead)){
      const hoje = todayISO();
      addActivity(lead.id, {
        id: uid('a'), tipo: AG_TIPO_ATIVIDADE[t.tipo] || 'nota', data: dia < hoje ? dia : hoje,
        nota: t.titulo + (t.nota ? '\n' + t.nota : '') + '\n(concluída na Agenda)',
        autor: currentUser.nome, criadoEm: Date.now(),
      });
    }
  };
  /* Próximo contato e régua se resolvem registrando o contato, como na
     ficha. No próximo contato a data marcada é limpa, porque já aconteceu;
     a próxima se marca na ficha. */
  const registrarDaAgenda = (item, nota) => {
    const lead = leads.find(l => l.id === item.leadId);
    if(!lead || !podeEditar(lead)) return;
    const atividade = { id: uid('a'), tipo: item.origem === 'regua' ? item.reguaTipo : 'ligacao',
      data: todayISO(), nota, autor: currentUser.nome, criadoEm: Date.now() };
    if(item.origem === 'contato'){
      mutate(lead.id, l => ({ ...l, atividades: [...(l.atividades || []), atividade],
        ultimoContato: (!l.ultimoContato || atividade.data > l.ultimoContato) ? atividade.data : l.ultimoContato,
        proximoContato: '' }));
      pushToast('Contato registrado. Marque o próximo na ficha do cliente.', 'success');
    } else {
      addActivity(lead.id, atividade);
    }
  };
  const resolverVencimentoDaAgenda = (leadId, alertaId) => {
    if(resolverAlerta(leadId, alertaId)) pushToast('Vencimento marcado como resolvido.', 'success');
  };

  /* Válvula de escape da trava de trajeto: o admin corrige um movimento errado,
     e a correção fica registrada na linha do tempo como tal. */
  const correctStage = (leadId, para, motivo) => {
    if(!isAdmin) return;
    const lead = leads.find(l => l.id === leadId);
    if(!lead) return;
    const entry = { id: uid('h'), de: lead.etapa, para, data: Date.now(), resumo: motivo, autor: currentUser.nome, correcao: true };
    mutate(leadId, l => ({ ...l, etapa: para, historico: [...(l.historico || []), entry] }));
    setOpenLead(null);
    pushToast('Etapa corrigida para ' + para + '.', 'success');
  };

  /* Gera um card por produto no funil do especialista, mantendo o vínculo
     com a origem para o assessor acompanhar o desfecho sem poder editar. */
  const confirmarEncaminhamento = async (lead, selecao, briefings) => {
    const produtos = Object.keys(selecao).filter(p => selecao[p]);
    if(produtos.length === 0) return;
    const agora = Date.now();
    const perfil = (briefings && briefings.__perfil) || '';
    const novos = produtos.map(produto => {
      const b = (briefings && briefings[produto]) || {};
      return stampLead({
      ...emptyLead(selecao[produto]),
      /* Nome já composto, e não a conta em coluna: `conta` tem índice único
         no banco, e duas linhas não podem representar a mesma conta do BTG.
         O card do especialista é um retrato, não um segundo registro daquele
         cliente — mas o especialista precisa saber qual Maria é. */
      cliente: nomeCliente(lead), oportunidade: produto + (b.interesse ? ' — ' + b.interesse : ''),
      telefone: lead.telefone, email: lead.email,
      segmento: lead.segmento, esteira: lead.esteira,
      tipoPessoa: lead.tipoPessoa, contatoNome: lead.contatoNome, contatoCargo: lead.contatoCargo,
      grupoFamiliar: lead.grupoFamiliar,
      funil: 'especialista', etapa: 'Cliente Novo', produto,
      origemLeadId: lead.id, etapaDesde: agora,
      responsavelId: selecao[produto],
      /* O valor aqui é o do negócio indicado, não o patrimônio do cliente. */
      valorPotencial: b.valor || '',
      briefing: { interesse: b.interesse || '', urgencia: b.urgencia || '', perfil },
      observacoes: 'Indicado por ' + currentUser.nome + ' a partir da R4.',
      historico: [{ id: uid('h'), de: null, para: 'Cliente Novo', data: agora,
        resumo: 'Indicado por ' + currentUser.nome + ' · ' + produto
          + (b.interesse ? ' · ' + b.interesse : '')
          + (b.urgencia ? ' · urgência: ' + b.urgencia.toLowerCase() : ''),
        autor: currentUser.nome }],
    });
    });

    setLeads(prev => [...prev, ...novos]);
    for(const n of novos){ await persistir(n); }

    const nomeDe = (id) => (users.find(u=>u.id===id)||{}).nome || 'especialista';
    mutate(lead.id, l => ({
      ...l,
      historico: [...(l.historico||[]), { id: uid('h'), de: l.etapa, para: l.etapa, data: agora,
        resumo: 'Indicado para ' + produtos.map(p => p + ' (' + nomeDe(selecao[p]) + ')').join(', '),
        autor: currentUser.nome, encaminhamento: true }],
    }));

    setEncaminhando(null);
    setOpenLead(null);
    setProdutoFiltro(produtos[0]);
    pushToast(produtos.length > 1
      ? produtos.length + ' negócios indicados.'
      : produtos[0] + ' indicado para ' + nomeDe(selecao[produtos[0]]) + '.', 'success');
  };

  const requestMove = (leadId, targetStage) => {
    const lead = leads.find(l => l.id === leadId);
    if(!lead || lead.etapa === targetStage) return;
    if(!podeEditar(lead)){
      pushToast('Este negócio é do especialista. Você acompanha, mas não edita.', 'error');
      return;
    }
    if(!canMove(lead, targetStage)){
      const opcoes = allowedMoves(lead);
      pushToast(opcoes.length === 0
        ? 'De "' + etapaLonga(lead.etapa, lead.funil) + '" não há movimentação permitida.'
        : 'Trajeto não permitido: de "' + etapaLonga(lead.etapa, lead.funil) + '" só é possível ir para '
          + listarEtapas(opcoes.map(e => etapaLonga(e, lead.funil))) + '.', 'error');
      return;
    }
    /* O destino viaja junto: com vários caminhos possíveis, a etapa de
       chegada não dá mais para deduzir a partir da etapa atual. */
    setMovingLead({ lead, to: targetStage });
  };

  const confirmMove = (id, to, resumo) => {
    const atualizado = mutate(id, l => {
      const entry = { id: uid('h'), de: l.etapa, para: to, data: Date.now(), resumo, autor: currentUser.nome };
      return { ...l, etapa: to, etapaDesde: Date.now(), historico: [...(l.historico||[]), entry] };
    });
    setMovingLead(null);
    pushToast('Movido para ' + to + '.', 'success');
    /* A R4 é a reunião de produto: ao chegar nela, o encaminhamento é o
       próximo passo natural, então o modal abre sem exigir um clique extra. */
    const alvo = leads.find(l => l.id === id);
    if(to === 'R4' && alvo && (alvo.funil || 'assessor') === 'assessor'){
      setOpenLead(null);
      setEncaminhando({ ...alvo, etapa: 'R4' });
    } else {
      /* Mudar de etapa não é o fim da visita ao card: o assessor costuma
         registrar atividade ou mexer na régua logo em seguida, na mesma
         ficha. Só atualiza se a ficha já estava aberta para este lead —
         mover pelo arrastar no quadro, sem ficha aberta, continua sem abrir
         nada sozinho. */
      setOpenLead(prev => (prev && prev.id === id) ? atualizado : prev);
    }
    /* Mover para Contato Futuro encerra a indicação; sair de lá a reabre. */
    sincronizarJornada(atualizado);
  };

  /* Contador da Agenda no menu: o que está aberto hoje mais o atrasado. */
  const contAgenda = useMemo(() => {
    if(!currentUser) return 0;
    const hoje = todayISO();
    const donos = new Set([currentUser.id]);
    return agendaItens({ tarefas, leads, users, donos, de: hoje, ate: hoje, hoje }).filter(i => !i.feita).length
      + agendaAtrasadas({ tarefas, leads, users, donos, hoje }).length;
  }, [tarefas, leads, users, currentUser]);

  if(phase === 'loading'){
    return h('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',height:'240px',color:'var(--ink-muted)',gap:8,fontSize:13.5}}, h(IconLoader,{size:16}), 'Carregando pipeline...');
  }

  if(phase === 'chaves'){
    return h('div',{className:'login-screen'},
      h('div',{className:'login-card', style:{maxWidth:500}},
        h('div',{className:'login-logo'}, h('span',{className:'brand-mark'}),
          h('h2',null, chaveSecreta ? 'Chave secreta no lugar da pública' : invertido ? 'Chaves trocadas' : 'Chaves inválidas')),
        h('p',{className:'sub'}, chaveSecreta
          ? 'Essa é a chave secreta do projeto (service_role). Ela ignora todas as regras de acesso do banco e não pode ficar num arquivo que roda no navegador. Use a chave publicável:'
          : invertido
          ? 'A URL e a chave parecem estar em campos invertidos. A ordem correta é:'
          : 'Não foi possível conectar com esses valores. Confira se estão assim:'),
        h('div',{className:'csv-dump', style:{minHeight:0,whiteSpace:'pre-wrap',padding:'10px 12px'}},
          "const SUPABASE_URL      = 'https://SEUPROJETO.supabase.co';\nconst SUPABASE_ANON_KEY = 'sb_publishable_...';"),
        erroCliente ? h('p',{className:'sub', style:{marginTop:12,color:'var(--danger)'}}, erroCliente) : null,
        h('p',{className:'sub', style:{marginTop:12,marginBottom:0}},'A URL começa com https:// e termina em .supabase.co. A chave começa com sb_publishable_.')
      )
    );
  }

  if(phase === 'semlib'){
    return h('div',{className:'login-screen'},
      h('div',{className:'login-card', style:{maxWidth:460}},
        h('div',{className:'login-logo'}, h('span',{className:'brand-mark'}), h('h2',null,'Biblioteca não carregou')),
        h('p',{className:'sub'},'A biblioteca supabase-js não carregou. Ela é servida pelo próprio portal, em vendor/supabase-js-2.min.js — confirme que a pasta vendor subiu junto com o crm.html.'),
        h('button',{className:'btn btn-primary', style:{width:'100%',justifyContent:'center'}, onClick:()=>window.location.reload()}, 'Tentar de novo')
      )
    );
  }

  /* Erra cedo e explica: sem as chaves, nada mais faz sentido. */
  if(phase === 'config'){
    return h('div',{className:'login-screen'},
      h('div',{className:'login-card', style:{maxWidth:460}},
        h('div',{className:'login-logo'}, h('span',{className:'brand-mark'}), h('h2',null,'Falta configurar o banco')),
        h('p',{className:'sub'},'Abra este arquivo em um editor de texto e substitua as duas constantes no início do script:'),
        h('div',{className:'csv-dump', style:{minHeight:0,whiteSpace:'pre-wrap',padding:'10px 12px'}},
          "const SUPABASE_URL      = 'https://xxxxx.supabase.co';\nconst SUPABASE_ANON_KEY = 'sb_publishable_...';"),
        h('p',{className:'sub', style:{marginTop:14,marginBottom:0}},'Os dois valores estão no painel do Supabase, em Project Settings > API. Use a chave publicável — nunca a service_role, que ignora as regras de acesso do banco.')
      )
    );
  }

  if(phase === 'bloqueado'){
    const pendente = motivoBloqueio === 'pendente';
    return h('div',{className:'tela-aviso', style:{maxWidth:520,margin:'80px auto',padding:'0 24px',textAlign:'center'}},
      h('h1',{style:{fontFamily:"'Fraunces',Georgia,serif",color:'#1B2A4A',fontSize:24,marginBottom:12}},
        pendente ? 'Acesso aguardando liberação' : 'Sem acesso ao CRM'),
      h('p',{style:{lineHeight:1.6,color:'#4A5568',marginBottom:10}},
        pendente
          ? 'A sua conta existe e você continua logado no portal. Falta um master liberar o seu acesso ao CRM na tela de Equipe.'
          : 'A sua conta não tem perfil no CRM. Peça a um master para definir o seu papel na tela de Equipe do hub.'),
      h('p',{style:{fontSize:13,color:'#8A93A6',marginBottom:22}},
        'Os outros módulos do portal continuam funcionando normalmente.'),
      h('button',{className:'btn btn-primary',
        onClick:()=>{ window.location.href='index.html'; }}, 'Voltar ao portal')
    );
  }

  if(phase === 'login'){
    return h(LoginScreen,{ onLogin:handleLogin, onRegister:handleRegister, onReset:handleReset,
      demo: MODO_DEMO ? demoStore.profiles.filter(p => p.status === 'ativo') : null, onEntrarDemo:entrarDemo });
  }

  const especialistaView = funil === 'especialista';
  const viewTitle = view==='perdidos'
      ? (especialistaView ? 'Negócios perdidos' : 'Clientes desqualificados')
    : view==='ganhos'
      ? (especialistaView ? 'Negócios fechados' : 'Captações efetivadas')
    : view==='kpis' ? (isAdmin ? 'Indicadores' : rotuloIndicadores(false, funil))
    : view==='offshore' ? 'Carteira offshore'
    : view==='importacao' ? 'Atualização da base'
    : view==='hoje' ? 'Dashboard'
    : view==='agenda' ? 'Agenda'
    : especialistaView ? produtoFiltro + ' · negócios em andamento'
    : 'Jornada do cliente';

  /* A cotacao entra aqui e nao em cada tela: o consolidado tem de ser o
     mesmo numero em todas elas. */
  return h(CotacaoContext.Provider, { value: cotacao },
    h('div',{className:'casca'},

/* Sem isto, qualquer exceção durante a renderização desmonta a árvore inteira
   e o usuário vê uma página em branco, sem nenhuma pista do que aconteceu. */
class ErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state = { erro: null }; }
  static getDerivedStateFromError(erro){ return { erro }; }
  componentDidCatch(erro, info){ console.error('Falha na interface:', erro, info); }
  render(){
    if(!this.state.erro) return this.props.children;
    const e = this.state.erro;
    const msg = (e && e.message) ? e.message : String(e);
    const pilha = (e && e.stack) ? String(e.stack) : '';
    /* A primeira linha do stack costuma apontar o componente culpado; o resto
       é rastro interno do React e não ajuda a identificar a causa. */
    const origem = pilha.split('\n').slice(0,4).join('\n');
    return h('div',{className:'login-screen'},
      h('div',{className:'login-card', style:{maxWidth:560}},
        h('div',{className:'login-logo'}, h('span',{className:'brand-mark'}), h('h2',null,'Algo quebrou na tela')),
        h('p',{className:'sub'},'Seus dados estão salvos. Copie a mensagem abaixo para identificar a causa.'),
        h('div',{style:{padding:'12px 14px',background:'var(--danger-tint)',border:'1px solid #F0CFCC',
          borderRadius:'var(--radius-md)',color:'var(--danger)',fontSize:13,fontWeight:600,
          wordBreak:'break-word',marginBottom:12}}, msg),
        h('div',{className:'csv-dump', style:{minHeight:0,maxHeight:150,whiteSpace:'pre-wrap',fontSize:10.5}}, origem),
        h('button',{className:'btn btn-primary', style:{width:'100%',justifyContent:'center',marginTop:14}, onClick:()=>window.location.reload()}, 'Recarregar')
      )
    );
  }
}

const root = ReactDOM.createRoot(document.getElementById('app'));
root.render(h(ErrorBoundary, null, h(App)));
