  /* Três colunas, para a faixa de Carteira depois que o SLA saiu (eram
     quatro campos, agora três) — mesmo padrão da linha-2, um degrau maior. */
  .painel .painel-linha.linha-3{grid-template-columns:repeat(3, minmax(0,1fr));}
  @media (max-width:600px){
    .painel .painel-linha.linha-3{grid-template-columns:minmax(0,1fr);}
    .painel .linha-3 .ind:nth-child(2),
    .painel .linha-3 .ind:nth-child(3){padding-left:0;border-left:none;}
  }

  @media (prefers-reduced-motion:reduce){
    .rosca-fatia, .barra-v-fill{animation:none;}
  }

  /* =========================================================
     PAINEL DE INDICADORES — repaginação
     A faixa navy no topo inverte a página: o panorama vem em fundo
     escuro, as análises em papel branco. A separação é o que faz o
     gestor saber onde olhar primeiro.
     ========================================================= */
  .painel-topo{
    background:
      radial-gradient(130% 150% at 88% -20%, rgba(176,138,46,.20) 0%, rgba(176,138,46,0) 60%),
      linear-gradient(168deg, #0A2143 0%, var(--navy) 62%);
    border-radius:var(--radius-xl);
    padding:26px 28px 22px;
    margin-bottom:var(--space-5);
    box-shadow:var(--shadow-navy);
    position:relative;overflow:hidden;
  }
  .painel-topo::before{
    content:'';position:absolute;inset:0 0 auto 0;height:2px;background:var(--gold);
  }

  .painel-linha{
    display:grid;grid-template-columns:minmax(0,1.5fr) repeat(4, minmax(0,1fr));gap:var(--space-5);
    padding-bottom:24px;
  }

  .ind{
    display:flex;flex-direction:column;gap:5px;min-width:0;overflow:hidden;
    padding-left:16px;border-left:1px solid rgba(255,255,255,.12);
    animation:ind-entra .5s var(--ease) both;
  }
  .ind:first-child{padding-left:0;border-left:none;}
  .ind:nth-child(2){animation-delay:.06s;}
  .ind:nth-child(3){animation-delay:.12s;}
  .ind:nth-child(4){animation-delay:.18s;}
  .ind:nth-child(5){animation-delay:.24s;}
  @keyframes ind-entra{ from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:none;} }

  .ind-rotulo{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:10px;font-weight:600;
    color:#8FA6C6;text-transform:uppercase;letter-spacing:.13em;
  }
  .ind-valor{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-weight:500;color:#fff;
    /* Fluido: com seis colunas na faixa, tamanho fixo estoura em telas
       médias. O piso de 17px mantém a leitura. */
    font-size:clamp(17px, 1.55vw, 25px);
    line-height:1.05;letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;
  }
  .ind.largo .ind-valor{font-size:clamp(24px, 2.9vw, 40px);}
  .ind-rotulo{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ind-contexto{font-size:11px;color:#93A8C6;line-height:1.35;}
  .ind.ouro .ind-valor{color:#E3C77A;}
  .ind.verde .ind-valor{color:#6FCFA1;}
  .ind.alerta .ind-valor{color:#F0918A;}

  /* Composição da carteira: uma faixa contínua, não um gráfico à parte.
     Mesma gramática do espectro do funil. */
  .composicao{padding-top:20px;border-top:1px solid rgba(255,255,255,.12);}
  .composicao-faixa{
    display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px;
    background:rgba(255,255,255,.07);
  }
  .composicao-parte{
    height:100%;min-width:2px;
    animation:composicao-cresce .8s var(--ease) both .3s;transform-origin:left;
  }
  @keyframes composicao-cresce{ from{transform:scaleX(0);} to{transform:scaleX(1);} }
  .composicao-legenda{
    display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-6);margin-top:14px;
  }
  .composicao-item{display:flex;align-items:baseline;gap:7px;}
  .composicao-ponto{width:7px;height:7px;border-radius:2px;flex-shrink:0;align-self:center;}
  .composicao-nome{font-size:12px;color:#C4D2E6;}
  .composicao-valor{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:12.5px;font-weight:500;color:#fff;
  }
  .composicao-qtd{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:10.5px;color:#8FA6C6;
    background:rgba(255,255,255,.09);border-radius:10px;padding:1px 6px;
  }

  /* Seções de análise: cabeçalho com filete e mais respiro que o resto do app */
  .kpi-section-head h2{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:16px;letter-spacing:-.01em;}
  .kpi-section-head{
    padding-bottom:12px;border-bottom:1px solid var(--border);
    margin-bottom:var(--space-4);
  }

  /* Barras crescem ao abrir a página, em cascata */
  .bar-fill{animation:barra-cresce .7s var(--ease) both;transform-origin:left;}
  @keyframes barra-cresce{ from{transform:scaleX(0);} to{transform:scaleX(1);} }

  @media (max-width:1100px){
    .painel-linha{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-4);row-gap:22px;}
    .ind{padding-left:0;border-left:none;}
    .ind.largo{grid-column:span 2;}
  }
  @media (max-width:600px){
    .painel-topo{padding:20px;}
    .painel-linha{grid-template-columns:minmax(0,1fr);}
    .ind.largo{grid-column:span 1;}
  }
  @media (prefers-reduced-motion:reduce){
    .ind, .composicao-parte, .bar-fill{animation:none;}
  }

  /* Gráfico de série mensal */
  .grafico-mensal{padding-top:4px;}
  .grafico-svg{width:100%;height:auto;display:block;overflow:visible;}
  .grafico-svg .grade{stroke:var(--border);stroke-width:1;}
  .grafico-svg .grade-num{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:9.5px;fill:var(--ink-faint);
  }
  .grafico-svg .grafico-mes{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:10px;fill:var(--ink-faint);
  }
  /* Traçado da esquerda para a direita: a linha "acontece" no tempo. */
  .grafico-linha{
    stroke-dasharray:1400;stroke-dashoffset:1400;
    animation:traca 1.1s var(--ease) forwards .15s;
  }
  @keyframes traca{ to{stroke-dashoffset:0;} }
  .grafico-ponto{opacity:0;animation:ponto-entra .3s var(--ease) forwards 1s;}
  @keyframes ponto-entra{ to{opacity:1;} }
  @media (prefers-reduced-motion:reduce){
    .grafico-linha{stroke-dasharray:none;stroke-dashoffset:0;animation:none;}
    .grafico-ponto{opacity:1;animation:none;}
  }

  /* Variação do mês e colunas de entrada no gráfico de carteira */
  .carteira-variacao{
    display:inline-flex;align-items:baseline;gap:8px;margin-bottom:10px;
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:15px;font-weight:500;color:var(--success);
  }
  .carteira-variacao.baixa{color:var(--danger);}
  .carteira-variacao span{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px;font-weight:400;color:var(--ink-faint);
  }
  .carteira-col{
    fill:var(--primary);opacity:.32;
    animation:barra-sobe .6s var(--ease) both;transform-origin:bottom;transform-box:fill-box;
  }
  @media (prefers-reduced-motion:reduce){ .carteira-col{animation:none;} }

  /* Barra de composição dentro da tabela de produção */
  .producao-barra{
    display:block;width:100%;max-width:210px;height:5px;border-radius:3px;
    background:var(--bg);box-shadow:inset 0 0 0 1px rgba(5,19,42,.05);
    margin-top:7px;overflow:hidden;
  }
  .producao-barra i{
    display:block;height:100%;border-radius:3px;
    animation:barra-cresce .8s var(--ease) both .2s;transform-origin:left;
  }
  /* Conversão como anel: proporção lida como forma, não só como número. */
  .producao-anel{
    display:inline-flex;align-items:center;justify-content:center;
    width:46px;height:46px;border-radius:50%;
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:11.5px;font-weight:500;color:var(--ink);
    background:conic-gradient(var(--cor) var(--pct), var(--bg) 0);
    position:relative;
  }
  .producao-anel::before{
    content:'';position:absolute;inset:4px;border-radius:50%;background:var(--surface);
  }
  .producao-anel{isolation:isolate;}
  .producao-anel > *{position:relative;z-index:1;}

  .producao-tabela{display:flex;flex-direction:column;}
  .producao-head, .producao-linha{
    display:grid;grid-template-columns:minmax(0,1.6fr) repeat(4, minmax(0,1fr));gap:var(--space-3);align-items:baseline;
  }
  .producao-head{
    padding-bottom:9px;border-bottom:1px solid var(--border);
    font-size:10px;font-weight:600;color:var(--ink-faint);
    text-transform:uppercase;letter-spacing:.07em;
  }
  .producao-head span:not(:first-child), .producao-linha .producao-num{text-align:right;}
  .producao-linha{padding:12px 0;border-bottom:1px solid var(--border);}
  .producao-linha:last-child{border-bottom:none;}
  .producao-nome{
    display:flex;align-items:center;gap:7px;flex-wrap:wrap;
    font-size:13.5px;font-weight:600;color:var(--ink);
  }
  .producao-nome em{font-style:normal;font-size:11px;font-weight:400;color:var(--ink-faint);}
  .producao-num{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:13px;color:var(--ink-muted);
    display:flex;flex-direction:column;align-items:flex-end;gap:2px;
  }
  .producao-num.forte{color:var(--ink);font-weight:500;}
  .producao-num em{font-style:normal;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:10.5px;color:var(--ink-faint);}
  @media (max-width:720px){
    .producao-head{display:none;}
    .producao-linha{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;}
    .producao-linha .producao-num{align-items:flex-start;text-align:left;}
    .producao-nome{grid-column:span 2;}
  }

  .kpi-filtros{margin-bottom:var(--space-4);}
  .kpi-filtros .select-sm{min-width:190px;}
  .kpi-datas{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .kpi-datas .select-sm{min-width:0;flex:1;}
  .kpi-datas-sep{font-size:11.5px;color:var(--ink-faint);}
  @media (max-width:720px){
    .kpi-filtros .filtro-grupo{width:100%;}
    .kpi-filtros .select-sm{width:100%;min-width:0;}
  }

  .filtro-limpar{align-self:flex-end;margin-left:auto;padding-bottom:5px;}
  .btn.ativo{border-color:var(--primary);color:var(--primary);}
  @media (prefers-reduced-motion:reduce){
    .filtros-panel{animation:none;} .filtro-chip{transition:none;}
  }
  @media (max-width:720px){
    .filtros-panel{gap:var(--space-4);padding:var(--space-4);}
    .filtro-limpar{margin-left:0;align-self:flex-start;}
  }

  /* Ações do quadro: coladas ao kanban, não à navegação do aplicativo */
  .board-actions{
    display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);
    margin-bottom:var(--space-3);flex-wrap:wrap;
  }
  .board-actions-left{display:flex;align-items:center;gap:var(--space-3);}
  /* Alternador quadro/lista */
  .modo-switch{display:flex;gap:2px;background:var(--bg);border:1px solid var(--border);
    border-radius:var(--radius-sm);padding:2px;}
  .modo-switch button{
    display:inline-flex;align-items:center;gap:6px;border:none;background:none;
    padding:5px 11px;border-radius:var(--radius-xs);cursor:pointer;font-family:inherit;
    font-size:12px;font-weight:600;color:var(--ink-muted);
    transition:background .12s var(--ease),color .12s var(--ease);
  }
  .modo-switch button.active{background:var(--surface);color:var(--navy);box-shadow:var(--shadow-card);}
  .modo-switch button:focus-visible{outline:2px solid var(--primary);outline-offset:-2px;}

  /* ---------- Lista da base ---------- */
  .lista-wrap{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    overflow:auto;max-height:calc(100vh - 300px);
  }
  .lista{width:100%;border-collapse:collapse;font-size:13px;}
  .lista th{
    position:sticky;top:0;z-index:1;background:var(--surface);
    text-align:left;padding:12px 14px;cursor:pointer;user-select:none;
    font-size:10px;font-weight:600;color:var(--ink-faint);
    text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;
    border-bottom:1px solid var(--border);
  }
  .lista th:hover{color:var(--ink);}
  .lista th.ordenado{color:var(--primary);}
  .lista th:focus-visible{outline:2px solid var(--primary);outline-offset:-2px;}
  .lista-seta{margin-left:5px;font-size:9px;}
  .lista td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
  .lista tbody tr{cursor:pointer;transition:background .12s var(--ease);}
  .lista tbody tr:hover{background:var(--bg);}
  .lista tbody tr:focus-visible{outline:2px solid var(--primary);outline-offset:-2px;}
  .lista tbody tr.somente-leitura{opacity:.72;}
  .lista tbody tr:last-child td{border-bottom:none;}
  .lista .num{text-align:right;font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;
    font-size:12.5px;color:var(--ink-muted);white-space:nowrap;}
  .lista .num.forte{color:var(--ink);font-weight:500;}
  .lista-cliente{display:block;font-weight:600;color:var(--ink);}
  .lista-sub{display:block;font-size:11px;color:var(--ink-faint);margin-top:2px;}
  .lista-fraco{color:var(--ink-faint);}
  .lista-chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink-muted);}
  .lista-data.late{color:var(--danger);font-weight:500;}
  .lista-data.today{color:var(--gold);font-weight:500;}
  .lista tfoot td{
    position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--border-strong);
    border-bottom:none;font-size:11.5px;color:var(--ink-muted);
  }
  @media (prefers-reduced-motion:reduce){
    .modo-switch button, .lista tbody tr{transition:none;}
  }
  @media (max-width:720px){
    .lista-wrap{max-height:none;}
    .lista{font-size:12px;}
    .lista th, .lista td{padding:9px 10px;}
  }

  .board-actions-count{font-size:12px;color:var(--ink-muted);}
  @media (max-width:720px){
    .board-actions{gap:var(--space-2);}
    .board-actions .btn{flex:1;justify-content:center;}
    .board-actions-left{flex:1;}
  }

  /* ---------- Grupo familiar ---------- */
  .grupo-box{
    margin:18px 0 6px;padding:14px 16px;border-radius:var(--radius-md);
    background:var(--navy);border:1px solid var(--navy);color:#fff;
  }
  .grupo-box .pauta-head{border-bottom-color:rgba(255,255,255,.14);}
  .grupo-box .bento-eyebrow{color:#A8BBD6;}
  .grupo-total{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:15px;font-weight:500;color:#fff;
  }
  .grupo-sub{font-size:11.5px;color:#9FB2CE;margin:8px 0 4px;}
  .grupo-membros{display:flex;flex-direction:column;}
  .grupo-membro{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:7px 0;border-bottom:1px solid rgba(255,255,255,.09);
  }
  .grupo-membro:last-child{border-bottom:none;}
  .grupo-membro-nome{font-size:12.5px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .grupo-membro-valor{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:11px;color:#9FB2CE;flex-shrink:0;
  }
  .grupo-box .pj-tag{background:rgba(255,255,255,.18);}

  /* ---------- Temperatura do lead ---------- */
  /* O ponto colorido carrega a leitura rápida; o texto ao lado existe porque
     cor sozinha não é informação para quem não distingue vermelho de verde. */
  .temp-dot{
    width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block;
  }
  /* Selos curtos do card do quadro (temperatura, grupo, aniversário, urgência
     imediata) andam juntos numa faixa só que quebra linha sozinha — ver
     .card-chips. Sem isso cada selo era uma linha inteira do card, e a soma
     deixava o card do quadro com uma "escadinha" pesada de ler. */
  .card-chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;}
  .card-chip{
    display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:10px;
    font-size:10.5px;font-weight:600;white-space:nowrap;
    background:var(--bg);border:1px solid var(--border);
  }
  .card-temp{
    font-size:10.5px;font-weight:600;letter-spacing:.02em;color:var(--ink-muted);
    text-transform:uppercase;
  }
  .temp-chip{display:inline-flex;align-items:center;gap:6px;}
  /* No chip selecionado o fundo é navy: o ponto ganha um anel para não sumir. */
  .temp-chip.ativo .temp-dot{box-shadow:0 0 0 1.5px rgba(255,255,255,.55);}
  .ficha-tag .temp-dot{margin-right:5px;vertical-align:middle;}


  /* ---------- Offshore ---------- */
  /* Selo curto: cabe no card, na aba e ao lado de um numero sem empurrar
     nada. "OFF" e o vocabulario que o escritorio ja usa. */
  .off-tag{
    display:inline-flex;align-items:center;justify-content:center;
    padding:1px 5px;border-radius:4px;background:var(--offshore-tint);
    color:var(--offshore);font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;
    font-size:9px;font-weight:600;letter-spacing:.06em;flex-shrink:0;
  }
  .view-tab .off-tag{margin-right:5px;}

  .card-offshore{
    display:flex;align-items:center;gap:6px;margin-top:5px;
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:11px;color:var(--offshore);
  }
  .card-offshore-valor{font-weight:500;}
  .card-offshore-aviso{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:10px;color:var(--danger);
    text-transform:uppercase;letter-spacing:.04em;
  }
  /* Captação em negociação do cliente da base: dourado, o tom de "Em
     captação" no painel, para o card e o indicador falarem a mesma língua. */
  .card-captacao{
    display:flex;align-items:center;gap:6px;margin-top:5px;
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:11px;color:var(--gold);
  }
  .card-captacao-rotulo{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:10px;
    text-transform:uppercase;letter-spacing:.04em;
  }
  .card-captacao-valor{font-weight:500;}
  .card-captacao.vazio{opacity:.55;}
  .valor-linha.vazia .lead-card-value{color:var(--ink-faint);}
  .ficha-pipe-bloco{background:var(--gold-tint);border:1px solid #EADFC2;border-radius:12px;padding:12px 14px;margin-bottom:10px;}
  .field-row.ficha-pipe-bloco{gap:12px;}
  .ficha-pipe-linha{display:flex;gap:8px;align-items:center;}
  .ficha-pipe-linha input{flex:1;min-width:0;}
  .ficha-pipe-acoes{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;}
  .ficha-obs-cab{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .ficha-obs-texto{width:100%;min-height:90px;margin-top:8px;border:1px solid var(--border-strong);border-radius:10px;padding:10px 12px;font:inherit;font-size:13.5px;resize:vertical;}
  .ficha-obs-acoes{display:flex;gap:8px;margin-top:8px;}
  .ficha-obs-vazia{color:var(--ink-faint);font-style:italic;}
  .tag-gestao.tag-patrimonio{background:var(--bg);color:var(--ink-muted);}
  .hero-offshore{
    display:flex;align-items:center;gap:6px;margin-top:6px;
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:11.5px;color:#9FB2CE;
  }
  .hero-offshore .off-tag{background:rgba(255,255,255,.14);color:#CFE3E0;}
  .ficha-tag.off{background:var(--offshore-tint);border-color:#CFE3E0;color:var(--offshore);}
  .ficha-tag.off .off-tag{background:transparent;padding:0;margin-right:5px;}

  /* Composicao das custodias na ficha: o total consolidado sozinho esconde
     quanto esta fora, que e a pergunta seguinte de quem abre o cliente. */
  .ficha-custodias{
    border:1px solid var(--border);border-radius:var(--radius-md);
    padding:12px 14px;background:var(--bg);
  }
  .custodia-linha{
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    padding:4px 0;
  }
  .custodia-rotulo{
    display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-muted);
    text-transform:uppercase;letter-spacing:.04em;font-weight:600;
  }
  .custodia-valor{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:13.5px;color:var(--ink);font-weight:500;
  }
  .custodia-nota{
    margin-top:8px;padding-top:8px;border-top:1px solid var(--border);
    font-size:11.5px;color:var(--ink-muted);line-height:1.5;
  }
  .custodia-nota.alerta{color:var(--danger);}

  /* Alternador do extrato. Nao e filtro: e a escolha de qual conta se esta
     olhando, e as duas nunca aparecem juntas porque nao se somam. */
  .custodia-switch{display:flex;gap:4px;margin-bottom:10px;}
  .custodia-switch button{
    display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;
    border:1px solid var(--border);background:var(--surface);color:var(--ink-muted);
    font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;
  }
  .custodia-switch button.active{background:var(--navy);border-color:var(--navy);color:#fff;}
  .custodia-switch button:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
  .custodia-moeda{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:10px;opacity:.7;
  }

  /* A cotacao explica todo numero convertido na tela; por isso abre a pagina
     em vez de ficar escondida numa tela de configuracao. */
  .cotacao-box{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:12px 16px;margin-bottom:var(--space-4);
    border:1px solid var(--border);border-left:3px solid var(--offshore);
    border-radius:var(--radius-md);background:var(--surface);
  }
  .cotacao-valor{display:flex;align-items:baseline;gap:6px;min-width:max-content;}
  .cotacao-num{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:19px;font-weight:500;color:var(--ink);
  }
  .cotacao-rotulo{font-size:12px;color:var(--ink-muted);}
  .cotacao-nota{font-size:11.5px;color:var(--ink-muted);line-height:1.5;}
  .cotacao-box .link-btn{margin-left:auto;}
  .cotacao-box.vazia{
    border-left-color:var(--danger);background:var(--danger-tint);
    justify-content:space-between;
  }
  .cotacao-box.vazia strong{color:var(--ink);font-size:13px;}
  .cotacao-box.vazia span{font-size:12.5px;color:var(--ink-muted);}
  .cotacao-box.editando{align-items:flex-end;}
  .cotacao-campo{display:flex;flex-direction:column;gap:4px;}
  .cotacao-campo label{
    font-size:11px;font-weight:600;color:var(--ink-muted);
    text-transform:uppercase;letter-spacing:.04em;
  }
  .cotacao-campo input{max-width:140px;}

  /* Linha do extrato consolidado do escritorio: mesma forma da do cliente,
     mas clicavel, porque daqui se abre o cliente. */
  .extrato-item.como-botao{
    width:100%;text-align:left;border:none;background:none;font-family:inherit;
    cursor:pointer;border-radius:var(--radius-sm);
  }
  .extrato-item.como-botao:hover{background:var(--bg);}
  .extrato-item.como-botao:focus-visible{outline:2px solid var(--primary);outline-offset:-2px;}
  .lista-nota{
    margin-left:7px;padding:1px 6px;border-radius:10px;background:var(--gold-tint);
    color:#6E5719;font-size:10px;font-weight:600;white-space:nowrap;
  }

  /* Marcador no card do quadro */
  .card-grupo{font-size:10.5px;color:var(--gold);font-weight:600;letter-spacing:.02em;}

  /* ---------- Ficha do cliente ---------- */
  .ficha{display:flex;flex-direction:column;gap:var(--space-4);margin-bottom:var(--space-2);}
  .ficha-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .ficha-etapa{
    padding:3px 10px;border-radius:20px;color:#fff;
    font-size:11px;font-weight:600;letter-spacing:.02em;
  }
  .ficha-tag{
    padding:3px 10px;border-radius:20px;background:var(--bg);
    border:1px solid var(--border);color:var(--ink-muted);font-size:11px;font-weight:500;
  }
  .ficha-tag.gold{background:var(--gold-tint);border-color:#E8DCB8;color:#6E5719;}
  .ficha-oportunidade{
    margin:10px 0 0;font-size:14px;color:var(--ink);line-height:1.45;
  }

  /* Quatro números lado a lado: a leitura de 3 segundos antes de uma ligação */
  /* 2x2 e não quatro em linha: no modal de 520px, quatro colunas dão 109px de
     tile e 83px de conteúdo — menos do que "7d restantes" (101px) ou
     "3d em atraso" precisam, e o valor saía por cima do tile vizinho. Em 2x2
     cada tile fica com 226px, folgado para qualquer valor que a base produza.
     O minmax(0,…) é o de sempre: sem ele a coluna volta a crescer com o
     conteúdo em vez de dividir o espaço. */
  .ficha-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
  .ficha-tile{
    display:flex;flex-direction:column;gap:5px;padding:11px 12px;min-width:0;
    background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-md);
  }
  .ficha-tile-rotulo{
    font-size:10px;font-weight:600;color:var(--ink-faint);
    text-transform:uppercase;letter-spacing:.06em;
  }
  .ficha-tile-valor{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:14px;font-weight:500;color:var(--ink);
    line-height:1.2;word-break:break-word;
  }
  .ficha-tile.ok{background:var(--success-tint);border-color:#CFE3D8;}
  .ficha-tile.ok .ficha-tile-valor{color:var(--success);}
  .ficha-tile.alerta{background:var(--danger-tint);border-color:#F0CFCC;}
  .ficha-tile.alerta .ficha-tile-valor{color:var(--danger);}
  .ficha-tile.atencao{background:var(--gold-tint);border-color:#E8DCB8;}
  .ficha-tile.atencao .ficha-tile-valor{color:#6E5719;}

  .ficha-dados{display:flex;flex-direction:column;}
  .ficha-linha{
    display:flex;align-items:baseline;gap:var(--space-4);padding:9px 2px;
    border-bottom:1px solid var(--border);
  }
  .ficha-linha:last-child{border-bottom:none;}
  .ficha-rotulo{
    flex:0 0 130px;font-size:11px;font-weight:600;color:var(--ink-faint);
    text-transform:uppercase;letter-spacing:.05em;
  }
  .ficha-valor{font-size:13.5px;color:var(--ink);min-width:0;word-break:break-word;}
  .ficha-valor.link{color:var(--primary);text-decoration:none;}
  .ficha-valor.link:hover{text-decoration:underline;}
  .ficha-obs{
    padding:12px 14px;background:var(--bg);border:1px solid var(--border);
    border-radius:var(--radius-md);
  }
  .ficha-obs p{margin:6px 0 0;font-size:13.5px;color:var(--ink);line-height:1.55;white-space:pre-wrap;}

  @media (max-width:720px){
    .ficha-tiles{grid-template-columns:repeat(2, minmax(0,1fr));}
    .ficha-linha{flex-direction:column;gap:2px;}
    .ficha-rotulo{flex:none;}
  }

  /* ---------- Briefing da indicação ---------- */
  .brief-bloco{
    padding:14px;margin-bottom:12px;background:var(--bg);
    border:1px solid var(--border);border-radius:var(--radius-md);
  }
  .brief-bloco:last-of-type{margin-bottom:0;}
  .brief-titulo{
    display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:12px;
  }
  .brief-titulo span{font-size:11.5px;font-weight:400;color:var(--ink-muted);}
  .brief-bloco .filtro-chip{font-size:11.5px;padding:5px 10px;}

  .brief-ficha{
    padding:11px 14px;background:var(--gold-tint);
    border:1px solid #E8DCB8;border-radius:var(--radius-md);
  }
  .brief-ficha .brief-titulo{color:#6E5719;margin-bottom:8px;}
  .brief-ficha .brief-titulo span{color:#8A7233;}
  .brief-linhas{display:flex;flex-wrap:wrap;gap:6px;}
  .brief-chip{
    display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;
    background:rgba(255,255,255,.7);border:1px solid #E8DCB8;
    font-size:11.5px;font-weight:500;color:#6E5719;
  }
  .brief-perfil{
    margin:9px 0 0;padding-top:9px;border-top:1px solid #E8DCB8;
    font-size:12.5px;line-height:1.5;color:var(--ink);white-space:pre-wrap;
  }
  .card-urgente{background:var(--danger-tint);color:var(--danger);}

  /* Ações e histórico na tela de encerrados */
  .lost-row-acoes{display:flex;gap:8px;flex-shrink:0;align-items:center;}
  .lost-row-badge{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:10.5px;color:var(--ink-faint);
    background:var(--bg);border-radius:10px;padding:1px 6px;margin-left:2px;
  }
  .hist-resumo{
    display:flex;flex-wrap:wrap;gap:6px;align-items:center;
    padding-bottom:16px;border-bottom:1px solid var(--border);
  }
  .hist-motivo{padding-top:14px;}
  .hist-motivo p{margin:5px 0 0;font-size:13.5px;color:var(--ink);line-height:1.55;white-space:pre-wrap;}
  @media (max-width:720px){
    .lost-row-acoes{width:100%;}
    .lost-row-acoes .btn{flex:1;justify-content:center;}
  }

  /* Aniversário: presente só no dia */
  .card-aniversario{background:var(--gold-tint);color:#6E5719;}
  .ficha-linha.festa .ficha-valor{color:#6E5719;font-weight:600;}
  .ficha-idade{color:var(--ink-faint);font-weight:400;}
  .ficha-hoje{
    margin-left:8px;padding:2px 7px;border-radius:10px;
    background:var(--gold);color:#fff;font-size:10px;font-weight:600;
    text-transform:uppercase;letter-spacing:.06em;
  }

  .pending-dot{
    display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;
    margin-left:2px;border-radius:10px;background:var(--gold);color:#fff;
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:10px;font-weight:500;
  }

  @media (max-width:720px){
    .team-row{flex-wrap:wrap;}
    .team-row-actions{width:100%;justify-content:flex-start;}
    .activity-form-row{flex-direction:column;}
  }

  /* ---------- KPI dashboard ---------- */
  .kpi-grid{display:grid;grid-template-columns:repeat(6, minmax(0,1fr));gap:var(--space-3);margin-bottom:var(--space-1);}
  .kpi-tile{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:var(--space-4) var(--space-5);display:flex;flex-direction:column;min-width:0;
    position:relative;overflow:hidden;
    animation:bento-in .4s var(--ease) both;
  }
  /* Filete de estado no topo: a cor do tile é lida antes do número. */
  .kpi-tile::before{
    content:'';position:absolute;inset:0 0 auto 0;height:2px;background:var(--border-strong);
  }
  .kpi-tile.offshore::before{background:var(--offshore);}
  .kpi-tile.success::before{background:var(--success);}
  .kpi-tile.danger::before{background:var(--danger);}
  .kpi-tile.gold::before{background:var(--gold);}
  .kpi-tile:nth-child(2){animation-delay:.05s;}
  .kpi-tile:nth-child(3){animation-delay:.1s;}
  .kpi-tile:nth-child(4){animation-delay:.15s;}
  .kpi-tile:nth-child(5){animation-delay:.2s;}
  @media (prefers-reduced-motion:reduce){ .kpi-tile{animation:none;} }
  .kpi-tile.span2{grid-column:span 2;}
  .kpi-tile .kpi-label{font-size:10.5px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-bottom:var(--space-2);}
  .kpi-tile .kpi-num{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:29px;font-weight:500;color:var(--ink);
    line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  }
  .kpi-tile .kpi-sub{font-size:11.5px;color:var(--ink-faint);margin-top:var(--space-2);}
  .kpi-tile.navy{
    grid-column:span 2;grid-row:span 2;justify-content:space-between;
    background:
      radial-gradient(120% 140% at 100% 0%, rgba(176,138,46,.16) 0%, rgba(176,138,46,0) 58%),
      var(--navy);
    border-color:var(--navy);box-shadow:var(--shadow-navy);position:relative;overflow:hidden;
  }
  /* Segundo número do herói: o mês corrente, separado por um filete. */
  .heroi-mes{
    margin-top:14px;padding-top:13px;border-top:1px solid rgba(255,255,255,.14);
  }
  .heroi-mes .kpi-label{margin-bottom:5px;}
  .heroi-mes-valor{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:21px;font-weight:500;color:#6FCFA1;
    line-height:1;letter-spacing:-.02em;white-space:nowrap;
  }
  .heroi-mes-var{
    margin-left:8px;font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:11px;color:#6FCFA1;
  }
  .heroi-mes-var.baixa{color:#F0918A;}

  .kpi-tile.navy::before{content:'';position:absolute;inset:0 0 auto 0;height:2px;background:var(--gold);opacity:.85;}
  .kpi-tile.navy .kpi-label{color:#A8BBD6;}
  .kpi-tile.navy .kpi-num{color:#fff;font-size:clamp(26px,3vw,36px);}
  .kpi-tile.navy .kpi-sub{color:#9FB2CE;}
  .kpi-tile.success .kpi-num{color:var(--success);}
  .kpi-tile.danger .kpi-num{color:var(--danger);}
  .kpi-tile.gold .kpi-num{color:var(--gold);}

  /* Medidor de conversão: a barra carrega o dado, o número só confirma */
  .kpi-meter{height:6px;border-radius:4px;background:var(--bg);overflow:hidden;margin-top:var(--space-3);}
  .kpi-meter-fill{height:100%;border-radius:4px;background:var(--primary);transition:width .4s var(--ease);}
  @media (prefers-reduced-motion:reduce){ .kpi-meter-fill{transition:none;} }

  .kpi-section{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:var(--space-5) var(--space-6);margin-top:var(--space-3);min-width:0;
  }
  .kpi-section-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-4);}
  .kpi-section-head h2{font-size:15px;font-weight:600;margin:0;color:var(--ink);letter-spacing:-.01em;}
  .kpi-section-head span{
    font-size:10.5px;color:var(--ink-faint);text-align:right;
    text-transform:uppercase;letter-spacing:.07em;font-weight:600;
  }
  /* Bento das seções: 4/2 em vez de 1/1 — o funil e a série mensal precisam de largura */
  /* Mesmo motivo do .painel-duplo: sem o minmax(0,…) a proporção 4:2 é só uma
     sugestão — a coluna cresce até caber o nome mais longo e estoura o pai. */
  /* Cabecalho de bloco fora de uma .kpi-section: separa a carteira offshore
     do resto de "Minha carteira" sem precisar de mais uma caixa. */
  .offshore-head{margin-top:var(--space-5);padding-top:var(--space-4);border-top:1px solid var(--border);}
  .offshore-head h2{display:flex;align-items:center;gap:8px;}

  .kpi-two-col{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,2fr);gap:var(--space-3);margin-top:var(--space-3);}
  .kpi-two-col .kpi-section{margin-top:0;}

  .bar-row{margin-bottom:16px;}
  .bar-row:last-child{margin-bottom:0;}
  .bar-row-topo{
    display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-4);
    margin-bottom:7px;
  }
  .bar-row-label{
    display:flex;align-items:baseline;gap:8px;min-width:0;
    font-size:13px;color:var(--ink);font-weight:500;
  }
  .bar-row-nome{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  /* Posição só onde a ordem carrega informação: rankings. */
  .bar-row-pos{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:10.5px;font-weight:500;
    color:var(--ink-faint);background:var(--bg);border-radius:4px;
    padding:2px 5px;flex-shrink:0;align-self:center;
  }
  .bar-row-label .stage-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;align-self:center;}
  .bar-row-value{display:flex;align-items:baseline;gap:8px;flex-shrink:0;}
  .bar-row-num{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:14px;font-weight:500;
    color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  }
  .bar-row-sec{font-size:11px;color:var(--ink-faint);}

  .bar-track{
    position:relative;height:8px;background:var(--bg);border-radius:5px;
    box-shadow:inset 0 0 0 1px rgba(5,19,42,.04);
  }
  .bar-fill{height:100%;border-radius:5px;}
  /* Trilha tracejada em vez de barra zerada: ausência de dado tem forma própria. */
  .bar-track.tracejada{
    background:repeating-linear-gradient(90deg,
      var(--border) 0 6px, transparent 6px 12px);
    box-shadow:none;opacity:.7;
  }
  /* Ausência de dado é informação, não ruído: precisa ser lida sem esforço.
     O tom fraco padrão passa no contraste, mas some em texto pequeno. */
  .bar-row.vazio .bar-row-label{color:var(--ink-muted);}
  .bar-row.vazio .bar-row-num{
    color:var(--ink-muted);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:11.5px;font-weight:500;letter-spacing:0;
  }
  .bar-row.vazio .bar-track.tracejada{opacity:1;}

  /* Marca da meta sobre a trilha: o realizado lido contra o prazo. */
  .bar-meta{
    position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:2px;
    background:var(--ink-faint);opacity:.55;
  }
  .bar-meta.passou{background:var(--danger);opacity:.9;}
  .bar-row-meta-label{
    font-size:10.5px;color:var(--ink-faint);margin-top:5px;
  }

  .month-chart{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;height:150px;padding-top:10px;}
  .month-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;}
  .month-bars{display:flex;align-items:flex-end;gap:3px;height:100%;width:100%;justify-content:center;}
  .month-bar{width:9px;border-radius:3px 3px 0 0;min-height:2px;}
  .month-label{font-size:10.5px;color:var(--ink-faint);font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;}
  /* Quebra em vez de transbordar: são três rótulos lado a lado que já não
     cabiam abaixo de ~830px de janela. */
  .month-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:11.5px;color:var(--ink-muted);margin-top:14px;}
  .month-legend-item{display:flex;align-items:center;gap:6px;}
  .month-legend-dot{width:8px;height:8px;border-radius:2px;}

  .empty-kpi{
    font-size:12.5px;color:var(--ink-faint);text-align:center;padding:28px 16px;
    background:var(--bg);border:1px dashed var(--border-strong);border-radius:var(--radius-md);
  }

  @media (max-width:1180px){
    .kpi-grid{grid-template-columns:repeat(4, minmax(0,1fr));}
    .kpi-two-col{grid-template-columns:minmax(0,1fr);}
  }
  @media (max-width:720px){
    .kpi-grid{grid-template-columns:repeat(2, minmax(0,1fr));gap:var(--space-2);}
    .kpi-tile.navy{grid-column:span 2;grid-row:span 1;}
    .kpi-tile.span2{grid-column:span 1;}
    .kpi-tile{padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);}
    .kpi-section{padding:var(--space-4);border-radius:var(--radius-md);}
  }

  /* ---------- Cockpit (Hoje) ---------- */
  .cockpit{max-width:1180px;}
  /* Abertura do dia: um título só, sem imagem nem animação — a mesma
     serifa que já assina "Carteira"/"Negócios" no painel do admin, só que
     em tamanho de manchete de uma linha, porque aqui é a única coisa na
     tela até o assessor olhar para baixo. */
  .cockpit-hero{margin-bottom:var(--space-6);}
  .cockpit-hero h1{
    font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:26px;font-weight:600;
    color:var(--ink);margin:0 0 4px;letter-spacing:-.01em;
  }
  .cockpit-hero > span{font-size:12.5px;color:var(--ink-faint);}
  .cockpit-grupo{margin-bottom:var(--space-6);}
  .cockpit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:var(--space-3);}
  .cockpit-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:var(--space-4) var(--space-5);text-align:left;cursor:pointer;
    display:flex;flex-direction:column;gap:var(--space-2);min-width:0;
    font:inherit;color:inherit;transition:border-color .15s var(--ease);
  }
  .cockpit-card:hover{border-color:var(--border-strong);}
  .cockpit-card.aberto{border-color:var(--primary);}
  .cockpit-card.disabled{cursor:default;opacity:.55;}
  .cockpit-card.estatico{cursor:default;}
  .cockpit-card .cockpit-label{
    font-size:10.5px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600;
    display:flex;align-items:center;justify-content:space-between;gap:6px;
  }
  .cockpit-card .cockpit-num{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:26px;font-weight:500;color:var(--ink);
    line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  }
  /* Só o que pede ação hoje ganha peso de fundo — o resto do quadriculado
     fica quieto de propósito, para o olho ir direto no que importa em vez
     de tudo competir com a mesma cor de caixa. */
  .cockpit-card.danger{background:var(--danger-tint);border-color:transparent;}
  .cockpit-card.danger .cockpit-label{color:#8A4A42;}
  .cockpit-card.danger .cockpit-num{color:var(--danger);}
  .cockpit-card.success .cockpit-num{color:var(--success);}
  .cockpit-card.gold .cockpit-num{color:var(--gold);}
  .cockpit-card .cockpit-sub{font-size:11.5px;color:var(--ink-faint);}
  .cockpit-card.danger .cockpit-sub{color:#9C5B52;}
  .cockpit-card .cockpit-chevron{transition:transform .15s var(--ease);color:var(--ink-faint);flex-shrink:0;}
  .cockpit-card.aberto .cockpit-chevron{transform:rotate(180deg);}
  .cockpit-lista{
    background:var(--bg);border:1px solid var(--border);border-top:none;
    border-radius:0 0 var(--radius-md) var(--radius-md);margin-top:-9px;padding:var(--space-2);
  }
  .cockpit-linha{
    display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);
    padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);
  }
  .cockpit-linha:hover{background:var(--surface);}
  .cockpit-linha-nome{font-size:12.5px;color:var(--ink);cursor:pointer;flex:1;min-width:0;background:none;border:none;text-align:left;padding:0;font-family:inherit;}
  .cockpit-linha-nome:hover{text-decoration:underline;}
  .cockpit-linha-meta{font-size:11px;color:var(--ink-faint);font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;white-space:nowrap;}
  .cockpit-linha-atraso{color:var(--danger);font-weight:600;}
  .cockpit-linha-acao{font-size:11px;color:var(--primary);background:none;border:none;cursor:pointer;font-weight:600;white-space:nowrap;padding:0;}
  .cockpit-linha-acao:hover{text-decoration:underline;}
  .cockpit-vazio{font-size:12px;color:var(--ink-faint);padding:var(--space-3);text-align:center;}
  .cockpit-nota{display:flex;gap:6px;padding:6px var(--space-3) var(--space-2);}
  .cockpit-nota input{flex:1;font-size:12px;padding:5px 8px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);}
  .cockpit-escolha{
    background:var(--bg);border:1px dashed var(--border-strong);border-radius:var(--radius-lg);
    padding:var(--space-6);text-align:center;color:var(--ink-muted);font-size:13px;
  }
  @media (max-width:720px){ .cockpit-grid{grid-template-columns:repeat(2,minmax(0,1fr));} }

  /* ---------- Print report ---------- */
  .print-header{display:none;}
  .print-header .print-brand{display:flex;align-items:center;gap:9px;}
  .print-header .print-brand .brand-mark{background:var(--gold);}
  .print-header .print-brand span{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:600;font-size:18px;color:var(--navy);}
  .print-header h1{font-size:20px;margin:10px 0 2px;}
  .print-header .print-meta{font-size:11.5px;color:var(--ink-muted);font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;}
  .print-header hr{border:none;border-top:2px solid var(--gold);margin:14px 0 18px;}

  @media print{
    @page{ margin:14mm; }
    body{ background:#fff; }
    *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important; }
    .no-print, .masthead, .topbar, .save-banner, .toast-stack, .overlay, .overview-toggle{ display:none !important; }
    .print-header{ display:block; }
    #app{ max-width:none; padding:0; }
    .kpi-grid{ grid-template-columns:repeat(3, minmax(0,1fr)); }
    .kpi-grid > *{ grid-column:span 1 !important; grid-row:auto !important; }
    .kpi-tile.navy .kpi-num{ font-size:22px; }
    .kpi-two-col{ grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
    .kpi-section, .kpi-tile{ break-inside:avoid; box-shadow:none; animation:none !important; }
    .kpi-section{ margin-top:14px; padding:14px 16px; }

    /* O painel é escuro na tela; no papel ele volta ao claro. Sem isto o
       PDF sai com texto claro sobre fundo branco — ilegível. */
    .painel{
      --bg:#F4F6F9; --surface:#FFFFFF;
      --ink:#0F1B2D; --ink-muted:#54627A; --ink-faint:#8A97AB;
      --border:#E2E6ED; --border-strong:#CCD3DD;
      --primary:#195AB4; --primary-tint:#E8F0FB;
      --success:#2F7A57; --success-tint:#E7F3EC;
      --danger:#B4453E;  --danger-tint:#FAEBEA;
      --gold:#B08A2E;    --gold-tint:#F7F0DC;
      display:block;background:#fff;padding:0;box-shadow:none;border-radius:0;
    }
    /* Os filtros descrevem o recorte no cabeçalho impresso; a coluna de
       controles não tem função no papel. */
    .painel-lado{ display:none !important; }
    .painel .painel-linha{
      grid-template-columns:repeat(3, minmax(0,1fr));row-gap:14px;
      background:#fff;border:1px solid var(--border);
    }
    .painel .ind{ animation:none !important; border-left-color:var(--border); }
    .painel .ind-rotulo{ color:#54627A; }
    .painel .ind-valor{ color:#0F1B2D; }
    .painel .ind-contexto{ color:#8A97AB; }
    .painel .ind.ouro .ind-valor{ color:#8A6A18; }
    .painel .ind.verde .ind-valor{ color:#2F7A57; }
    .painel .ind.alerta .ind-valor{ color:#B4453E; }
    .painel-duplo{ grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
    .painel-caixa, .painel .kpi-section{ break-inside:avoid; border:1px solid var(--border); }
    .painel-area{ gap:14px; }
    .rosca-total{ fill:#0F1B2D; }
    .rosca-legenda-total, .grafico-svg .grade-num, .grafico-svg .grafico-mes{ fill:#8A97AB; }
    .rosca-fatia, .barra-v-fill, .bar-fill, .grafico-linha, .grafico-ponto,
    .composicao-parte, .producao-barra i{ animation:none !important; }
    .grafico-linha{ stroke-dasharray:none !important; stroke-dashoffset:0 !important; }
    .grafico-ponto{ opacity:1 !important; }
    .barras-v{ height:150px; overflow:visible; }
  }

  .required{color:var(--danger);}
  .meta-line{font-size:11px;color:var(--ink-faint);margin-top:16px;font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;}

  /* ---------- Lost deals ---------- */
  /* Resumo do desfecho no topo da lista */
  .desfecho-resumo{
    display:flex;gap:var(--space-6);flex-wrap:wrap;
    padding:16px 20px;margin-bottom:var(--space-4);
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    border-left:3px solid var(--border-strong);
  }
  .desfecho-resumo.ganho{border-left-color:var(--success);}
  .desfecho-resumo.perda{border-left-color:var(--danger);}
  .desfecho-bloco{display:flex;flex-direction:column;gap:3px;}
  .desfecho-rotulo{
    font-size:10px;font-weight:600;color:var(--ink-faint);
    text-transform:uppercase;letter-spacing:.08em;
  }
  .desfecho-valor{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:19px;font-weight:500;
    color:var(--ink);letter-spacing:-.02em;white-space:nowrap;
  }
  .desfecho-resumo.ganho .desfecho-bloco:first-child .desfecho-valor{color:var(--success);}
  .desfecho-resumo.perda .desfecho-bloco:first-child .desfecho-valor{color:var(--danger);}

  .lost-list{display:flex;flex-direction:column;gap:8px;}
  .lost-row{
    display:flex;align-items:stretch;gap:0;background:var(--surface);border:1px solid var(--border);
    border-radius:8px;overflow:hidden;padding-right:12px;
  }
  .lost-row-bar{width:4px;background:var(--danger);flex-shrink:0;}
  .lost-row-main{flex:1;min-width:0;padding:11px 13px;}
  .lost-row-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .lost-row-name{font-size:13.5px;font-weight:600;color:var(--ink);}
  .lost-row-value{font-size:12.5px;font-weight:600;color:var(--ink-muted);}
  .lost-row-deal{font-size:12px;color:var(--ink-muted);margin-top:2px;}
  .lost-row-motivo{font-size:12px;color:var(--ink-faint);font-style:italic;margin-top:5px;}
  .lost-row-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-faint);margin-top:8px;}
  .lost-row button{align-self:center;flex-shrink:0;}
  .lost-row.won .lost-row-bar{background:var(--success);}
  .lost-row.won .lost-row-value{color:var(--success);}

  /* ---------- Login ---------- */
  .login-screen{
    min-height:70vh;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .login-card{
    width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);
    border-radius:14px;padding:28px 26px;box-shadow:var(--shadow-card);
  }
  .login-logo{display:flex;align-items:center;gap:9px;margin-bottom:6px;}
  .login-card h2{font-size:18px;margin:0 0 4px;font-weight:700;}
  .login-card .sub{font-size:12.5px;color:var(--ink-muted);margin-bottom:20px;}
  .user-list{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;max-height:220px;overflow-y:auto;}
  .user-pick{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--border);
    border-radius:9px;background:var(--surface);cursor:pointer;text-align:left;font-family:inherit;
  }
  .user-pick:hover{border-color:var(--primary);background:var(--primary-tint);}
  .user-pick.selected{border-color:var(--primary);background:var(--primary-tint);}
  .user-pick .name{font-size:13.5px;font-weight:600;flex:1;}
  .login-divider{display:flex;align-items:center;gap:10px;color:var(--ink-faint);font-size:11.5px;margin:18px 0;}
  .login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--border);}
  .link-btn{background:none;border:none;color:var(--primary);font-size:12.5px;font-weight:600;cursor:pointer;padding:0;font-family:inherit;}
  .link-btn:hover{text-decoration:underline;}

  @media (max-width:900px){
    .topbar{align-items:flex-start;}
    .topbar-actions{width:100%;justify-content:stretch;}
    .search-wrap{max-width:none;}
    .brand h1{font-size:20px;}
  }
  @media (max-width:720px){
    #app{padding:var(--space-4) var(--space-4) 56px;}
    .masthead{padding:12px var(--space-4);}
    /* Celular (05/11/2026): o cabeçalho estourava a tela para o lado. Aqui
       ele vira uma coluna só, as ferramentas quebram linha e as abas rolam
       para o lado dentro da própria faixa, sem empurrar a página. */
    .topbar{grid-template-columns:minmax(0,1fr);}
    .topbar-actions{grid-column:1;flex-wrap:wrap;justify-content:flex-start;}
    .topbar-actions select{max-width:100%;flex:1 1 160px;}
    .busca-slot{width:100%;min-width:0;flex:1 1 100%;}
    .busca-slot.oculta{display:none;}
    .search-wrap{min-width:0;}
    .user-chip .name{display:none;}
    .topbar-nav{min-width:0;}
    .topbar-nav > *{max-width:100%;}
    .view-tabs{width:100%;overflow-x:auto;min-width:0;}
    .view-tab{flex:0 0 auto;justify-content:center;}
    /* Alvos de toque confortáveis nas ações do card */
    .lose-btn, .win-btn{width:26px;height:26px;}
  }

  #awVoltar{position:fixed;bottom:18px;left:18px;z-index:99999;background:#1B3A5F;color:#fff;border:0;
  border-radius:999px;padding:10px 18px;font:500 13px "Segoe UI",system-ui,Arial,sans-serif;cursor:pointer;
  box-shadow:0 4px 16px rgba(0,0,0,.22);opacity:.92}
  #awVoltar:hover{background:#132B47;opacity:1}
  @media print{#awVoltar{display:none!important}}

  /* ================= Painel (aba Dashboard) =================
     Inspirado na tela de carteira que o Emil montou para outra operação:
     herói azul-marinho com o número grande em serifa, pílulas, abas
     segmentadas, rosca com lista que se abre. Tudo com prefixo pn- para não
     encostar no cockpit e nos indicadores, que continuam iguais. */
  .pn{max-width:1180px;margin:0 auto;}
  .pn-heroi{
    background:linear-gradient(180deg,#0B1E3F 0%,var(--navy) 100%);color:#fff;
    border-radius:18px;padding:22px 32px 74px;position:relative;
  }
  .pn-heroi-topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .pn-visao{display:flex;align-items:center;gap:8px;}
  .pn-visao-seta{
    width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:transparent;
    color:#fff;font-size:20px;line-height:1;cursor:pointer;
  }
  .pn-visao-seta:hover{background:rgba(255,255,255,.08);}
  .pn-visao-caixa,.pn-visao-fixa{
    display:flex;flex-direction:column;gap:2px;background:rgba(255,255,255,.07);border-radius:10px;
    padding:7px 14px;min-width:240px;
  }
  .pn-visao-caixa span,.pn-visao-fixa span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);}
  .pn-visao-caixa select{
    background:transparent;border:0;color:#fff;font:600 15px/1.3 'Inter',-apple-system,sans-serif;padding:0;outline:none;cursor:pointer;
    max-width:260px;text-overflow:ellipsis;
  }
  .pn-visao-caixa select option{color:var(--ink);}
  .pn-visao-fixa strong{font-size:15px;}
  .pn-ola{font-family:'Fraunces',Georgia,serif;font-size:24px;font-weight:500;margin-bottom:16px;}
  .pn-heroi-numeros{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 48px;}
  .pn-rotulo{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:6px;}
  .pn-grande{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:clamp(34px,4.6vw,50px);line-height:1.05;letter-spacing:-.01em;}
  .pn-grande small,.pn-medio small{font-size:.42em;color:rgba(255,255,255,.7);margin-right:8px;font-weight:500;}
  .pn-heroi-off{padding-left:28px;border-left:1px solid rgba(255,255,255,.16);}
  .pn-medio{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:clamp(22px,2.6vw,30px);line-height:1.1;}
  .pn-heroi-nota{font-size:11.5px;color:rgba(255,255,255,.5);margin-top:4px;}
  .pn-pilulas{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 12px;}
  .pn-pilula{
    font-size:13px;font-weight:600;padding:6px 13px;border-radius:999px;
    background:rgba(255,255,255,.09);color:rgba(255,255,255,.92);
  }
  .pn-pilula.boa{background:#E3F3EA;color:#1F6B47;}
  .pn-pilula.ruim{background:#FBE7E5;color:#9B342E;}
  .pn-pilula.alerta{background:rgba(176,138,46,.22);color:#F4DDA2;}
  .pn-meta{font-size:13px;color:rgba(255,255,255,.62);}

  .pn-abas{
    display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);
    border-radius:14px;padding:6px;margin:-36px 18px 26px;position:relative;
    box-shadow:0 6px 24px rgba(5,19,42,.10);
  }
  .pn-abas button{
    border:0;background:transparent;border-radius:10px;height:44px;font:500 14.5px 'Inter',-apple-system,sans-serif;
    color:var(--ink-muted);cursor:pointer;
  }
  .pn-abas button:hover{color:var(--ink);background:var(--bg);}
  .pn-abas button.ativa{background:var(--navy);color:#fff;font-weight:600;}

  .pn-conteudo{padding:0 18px;}
  .pn-grupo{margin-bottom:26px;}
  .pn-grupo-titulo{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;}
  .pn-grupo-titulo span{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-muted);font-weight:600;}
  .pn-grupo-titulo em{font-style:normal;font-size:12px;color:var(--ink-faint);}
  .pn-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
  .pn-card{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px 15px;
    position:relative;transition:border-color .15s, box-shadow .15s;
  }
  .pn-card.clicavel{cursor:pointer;}
  .pn-card.clicavel:hover{border-color:var(--border-strong);box-shadow:0 4px 16px rgba(5,19,42,.06);}
  .pn-card.aberto{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy);}
  .pn-card-label{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-muted);font-weight:500;}
  .pn-card-seta{color:var(--ink-faint);transform:rotate(0deg);transition:transform .15s;display:inline-flex;}
  .pn-card.aberto .pn-card-seta{transform:rotate(180deg);}
  .pn-card-num{font-family:'Fraunces',Georgia,serif;font-size:28px;font-weight:600;color:var(--navy);margin:6px 0 4px;letter-spacing:-.01em;}
  .pn-card-sub{font-size:12.5px;color:var(--ink-faint);line-height:1.4;}
  .pn-card.boa{border-left:3px solid var(--success);}
  .pn-card.boa .pn-card-num{color:var(--success);}
  .pn-card.ruim{border-left:3px solid var(--danger);}
  .pn-card.atencao{border-left:3px solid var(--gold);}
  .pn-card.ouro .pn-card-num{color:var(--gold);}
  .pn-card.desligado{background:transparent;border-style:dashed;}
  .pn-card.desligado .pn-card-num{color:var(--ink-faint);}

  .pn-lista{
    margin-top:12px;background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;
  }
  .pn-lista-vazio{padding:16px 18px;color:var(--ink-faint);font-size:13.5px;}
  .pn-linha{display:flex;align-items:center;gap:12px;padding:11px 18px;border-top:1px solid var(--border);font-size:13.5px;}
  .pn-linha:first-child{border-top:0;}
  .pn-linha-nome{
    flex:1;min-width:0;text-align:left;border:0;background:none;padding:0;cursor:pointer;
    font:600 13.5px 'Inter',-apple-system,sans-serif;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .pn-linha-nome:hover{color:var(--primary);}
  .pn-linha-quem{font-weight:400;color:var(--ink-faint);}
  .pn-linha-meta{font-family:'IBM Plex Mono',Consolas,monospace;font-size:12.5px;color:var(--ink-muted);white-space:nowrap;}
  .pn-linha-meta.atrasado{color:var(--danger);}
  .pn-linha-acao{
    border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:12px;
    cursor:pointer;color:var(--ink-muted);
  }
  .pn-linha-acao:hover{border-color:var(--success);color:var(--success);}

  .pn-carteira-topo{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .pn-rotulo-escuro{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-muted);font-weight:600;}
  .pn-alternar{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px;}
  .pn-alternar button{border:0;background:transparent;border-radius:999px;padding:7px 16px;font:500 13.5px 'Inter',sans-serif;color:var(--ink-muted);cursor:pointer;}
  .pn-alternar button.ativo{background:var(--navy);color:#fff;font-weight:600;}
  .pn-carteira{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start;}
  .pn-carteira-rosca{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;}
  .pn-rosca{position:relative;width:200px;height:200px;margin:0 auto 18px;}
  .pn-rosca svg{width:100%;height:100%;display:block;}
  .pn-fatia{transition:stroke-width .12s;}
  .pn-fatia.ativa{stroke-width:27;}
  .pn-rosca-centro{pointer-events:none;text-align:center;}
  .pn-rosca-centro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .pn-rosca-centro span{font-size:11.5px;color:var(--ink-faint);}
  .pn-rosca-centro strong{font-size:19px;color:var(--navy);}
  .pn-legenda-item{display:flex;align-items:center;gap:9px;font-size:13px;padding:5px 0;color:var(--ink);}
  .pn-legenda-item i,.pn-bloco-cab i{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .pn-legenda-item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pn-legenda-item b{font-family:'IBM Plex Mono',Consolas,monospace;font-size:12px;font-weight:500;}
  .pn-carteira-lista{display:flex;flex-direction:column;gap:10px;}
  .pn-bloco{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
  .pn-bloco-cab{
    width:100%;display:flex;align-items:center;gap:14px;border:0;background:none;padding:16px 18px;cursor:pointer;text-align:left;
    font-family:'Inter',-apple-system,sans-serif;color:var(--ink);
  }
  .pn-bloco-cab:hover{background:#FAFBFC;}
  .pn-bloco-nome,.pn-cliente-nome{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .pn-bloco-nome strong{font-size:15px;}
  .pn-bloco-nome small,.pn-bloco-valor small,.pn-cliente-nome small,.pn-cliente-valor small{font-size:12px;color:var(--ink-faint);}
  .pn-bloco-valor,.pn-cliente-valor{display:flex;flex-direction:column;align-items:flex-end;gap:3px;white-space:nowrap;}
  .pn-bloco-valor strong{font-size:15px;}
  .pn-bloco-seta{color:var(--ink-faint);display:inline-flex;transition:transform .15s;}
  .pn-bloco.aberto .pn-bloco-seta{transform:rotate(180deg);}
  .pn-bloco-corpo{border-top:1px solid var(--border);background:#F8F9FB;}
  .pn-bloco-ir{
    display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--border);background:var(--primary-tint);
    color:var(--primary);font:600 13px 'Inter',sans-serif;padding:10px 18px 10px 41px;cursor:pointer;
  }
  .pn-cliente{
    width:100%;display:flex;align-items:center;gap:14px;border:0;border-top:1px solid var(--border);background:none;
    padding:12px 18px 12px 41px;cursor:pointer;text-align:left;font-family:'Inter',-apple-system,sans-serif;color:var(--ink);
  }
  .pn-cliente:first-child{border-top:0;}
  .pn-cliente:hover{background:#EFF3F8;}
  .pn-cliente-nome strong,.pn-cliente-valor strong{font-size:13.5px;font-weight:600;}
  .pn-cliente-nome strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pn-cliente-seta{color:var(--ink-faint);font-size:18px;}
  .pn-vazio{background:var(--surface);border:1px dashed var(--border-strong);border-radius:14px;padding:28px;text-align:center;color:var(--ink-faint);}
  .pn-receita{margin-top:12px;}
  .pn-receita-partes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
  .pn-receita-parte{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 18px;display:flex;flex-direction:column;gap:4px;}
  .pn-receita-parte span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);font-weight:600;}
  .pn-receita-parte strong{font-family:'Fraunces',Georgia,serif;font-size:24px;color:var(--gold);}
  .pn-receita-parte small{font-size:12.5px;color:var(--ink-faint);}
  .pn-receita-parte.desligada{background:transparent;border-style:dashed;}
  .pn-receita-parte.desligada strong{color:var(--ink-faint);}
  .pn-heroi-curto{padding-bottom:26px;margin-bottom:22px;}
  .pn-conteudo-solto{padding:0;}
  .pn-bloco-corpo.lost-list{display:flex;flex-direction:column;gap:8px;padding:12px;}
  .pn-bloco-corpo.lost-list .lost-row{margin:0;}
  .pn-rodape-nota{font-size:12.5px;color:var(--ink-faint);margin-top:14px;}

  .pn-tabela-wrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow-x:auto;}
  .pn-tabela{width:100%;border-collapse:collapse;font-size:13.5px;}
  .pn-tabela th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted);font-weight:600;text-align:left;padding:13px 16px;border-bottom:1px solid var(--border);white-space:nowrap;}
  .pn-tabela td{padding:13px 16px;border-top:1px solid var(--border);}
  .pn-tabela tbody tr{cursor:pointer;}
  .pn-tabela tbody tr:hover{background:#F6F8FB;}
  .pn-tabela .n{text-align:right;font-family:'IBM Plex Mono',Consolas,monospace;font-size:12.5px;white-space:nowrap;}
  .pn-tabela .boa{color:var(--success);}
  .pn-tabela .ruim{color:var(--danger);}
  .pn-tabela .seta{color:var(--ink-faint);text-align:right;width:20px;}
  .pn-versao{text-align:center;font-size:11px;color:var(--ink-faint);margin-top:30px;letter-spacing:.04em;}

  @media (max-width:900px){
    .pn-carteira{grid-template-columns:1fr;}
  }
  @media (max-width:640px){
    .pn-heroi{padding:18px 18px 66px;border-radius:14px;}
    .pn-visao-caixa{min-width:0;flex:1;}
    .pn-visao{width:100%;}
    .pn-heroi-off{padding-left:0;border-left:0;}
    .pn-abas{margin:-34px 8px 20px;}
    .pn-abas button{font-size:13px;height:40px;}
    .pn-conteudo{padding:0;}
    .pn-grade{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
    .pn-card{padding:13px 13px 12px;}
    .pn-card-num{font-size:22px;}
    .pn-bloco-cab{padding:14px;gap:10px;}
    .pn-cliente{padding:11px 14px 11px 33px;}
    .pn-linha{padding:10px 14px;flex-wrap:wrap;}
  }

  /* ================= Quadro de Relacionamento no estilo do painel =================
     Só visual (05/11/2026): mesmo azul com degradê do Dashboard, números
     grandes em serifa e cantos iguais. Colunas, arrastar e cliques ficam
     como estavam. */
  .bento-block{border-radius:14px;}
  .bento-block.navy{
    background:linear-gradient(180deg,#0B1E3F 0%,var(--navy) 100%);border-radius:18px;
    box-shadow:0 6px 24px rgba(5,19,42,.14);
  }
  .bento-block.navy::before{display:none;}
  .hero-figure{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:500;letter-spacing:-.01em;}
  .tile-figure{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:600;color:var(--navy);letter-spacing:-.01em;}
  .bento-tile.alert .tile-figure{color:var(--danger);}
  .bento-tile.clear .tile-figure{color:var(--success);}
  .lead-card{border-radius:12px;}

  /* ================= Indicadores navegáveis ================= */
  .kn{display:flex;flex-direction:column;gap:14px;max-width:1180px;margin:0 auto;width:100%;}
  .kn-heroi{padding-bottom:26px;margin-bottom:18px;max-width:1180px;margin-left:auto;margin-right:auto;}
  .kn-visao{margin:6px 0 16px;}
  .kn-periodos{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
  .kn-periodos button{
    border:1px solid rgba(255,255,255,.18);background:transparent;color:rgba(255,255,255,.85);
    border-radius:999px;padding:7px 14px;font:500 13px 'Inter',-apple-system,sans-serif;cursor:pointer;
  }
  .kn-periodos button:hover{background:rgba(255,255,255,.08);}
  .kn-periodos button.ativo{background:#fff;color:var(--navy);border-color:#fff;font-weight:600;}
  .kn-periodos .kn-mais{margin-left:auto;border-style:dashed;}
  .kn-periodos .kn-mais.ligado{border-style:solid;background:rgba(176,138,46,.25);border-color:rgba(244,221,162,.5);color:#F4DDA2;}
  .kn-datas{display:flex;align-items:center;gap:8px;margin-top:12px;color:rgba(255,255,255,.7);font-size:13px;}
  .kn-datas input{height:34px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;padding:0 10px;font-family:inherit;color-scheme:dark;}
  .kn-heroi .pn-meta{margin-top:12px;}
  .kn-filtros{max-width:1180px;margin:-6px auto 18px;}
  .kn-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
  .kn-card-titulo{font-family:'Fraunces',Georgia,serif;font-size:19px;font-weight:600;color:var(--navy);margin:8px 0 4px;line-height:1.25;}
  .kn-corpo{display:none;flex-direction:column;gap:var(--space-4);}
  .kn-corpo.aberto{display:flex;animation:knAbre .18s ease-out;}
  @keyframes knAbre{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
  /* O painel do admin era escuro e com coluna de filtros; agora segue o
     Dashboard: fundo claro, uma coluna, cartões brancos. */
  .painel.kn-admin{
    --bg:#F4F6F9; --surface:#FFFFFF; --ink:#0C1626; --ink-muted:#5C6B7F; --ink-faint:#95A1B0;
    --border:#E2E6ED; --border-strong:#CCD3DD; --primary:#195AB4; --primary-tint:#E7EFFB;
    --success:#2F7A56; --success-tint:#E6F1EC; --danger:#B3403A; --danger-tint:#FBEBEA;
    --gold:#B08A2E; --gold-tint:#F7F0DC;
    display:block;background:transparent;color:var(--ink);padding:0;box-shadow:none;border-radius:0;
    max-width:1180px;margin:0 auto;
  }
  /* As cores claras são as mesmas que a impressão do painel já usava. */
  .painel.kn-admin .ind{border-left-color:var(--border);}
  .painel.kn-admin .ind-rotulo{color:#54627A;}
  .painel.kn-admin .ind-valor{color:#0F1B2D;}
  .painel.kn-admin .ind-contexto{color:#8A97AB;}
  .painel.kn-admin .ind.ouro .ind-valor{color:#8A6A18;}
  .painel.kn-admin .ind.verde .ind-valor{color:#2F7A57;}
  .painel.kn-admin .ind.alerta .ind-valor{color:#B4453E;}
  .painel.kn-admin .rosca-total{fill:#0F1B2D;}
  .painel.kn-admin .rosca-legenda-total, .painel.kn-admin .grafico-svg .grade-num,
  .painel.kn-admin .grafico-svg .grafico-mes{fill:#8A97AB;}
  .painel.kn-admin .bar-track{box-shadow:none;}
  @media print{
    .kn-grade, .kn-heroi, .kn-filtros{display:none !important;}
    .kn-corpo{display:flex !important;}
  }
  @media (max-width:640px){
    .kn-grade{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
    .kn-periodos .kn-mais{margin-left:0;}
    .kn-card-titulo{font-size:16px;}
  }

  /* ================= Panorama dos KPIs e listas em níveis ================= */
  .kp{display:flex;flex-direction:column;gap:14px;margin-top:6px;}
  .kp-duplo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start;}
  .kp-caixa{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 18px 10px;min-width:0;}
  .kp-caixa .pn-rosca{width:170px;height:170px;margin:0 auto 14px;}
  .arv-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px;}
  .arv-titulo{font-family:'Fraunces',Georgia,serif;font-size:18px;font-weight:600;color:var(--navy);}
  .arv-desc{font-size:12px;color:var(--ink-faint);margin-top:2px;}
  .arv-excel{
    display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);
    border-radius:8px;padding:6px 10px;font:500 12.5px 'Inter',sans-serif;color:var(--success);cursor:pointer;white-space:nowrap;
  }
  .arv-excel:hover{border-color:var(--success);background:var(--success-tint);}
  .arv-excel:disabled{opacity:.5;cursor:default;}
  .arv-cab,.arv-linha{display:flex;align-items:center;gap:10px;}
  .arv-cab{padding:6px 16px;border-bottom:1px solid var(--border);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;}
  .arv-linha{
    width:100%;border:0;border-bottom:1px solid var(--border);background:none;padding:10px 16px;cursor:pointer;text-align:left;
    font-family:'Inter',-apple-system,sans-serif;color:var(--ink);
  }
  .arv-linha:hover{background:#F6F8FB;}
  .arv-grupo.nivel-0{background:var(--surface);}
  .arv-grupo.nivel-1{background:#FAFBFC;}
  .arv-folha{background:#F4F7FA;}
  .arv-nome{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .arv-nome strong{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .arv-folha .arv-nome strong{font-weight:500;}
  .arv-nome small{font-size:11.5px;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .arv-num{width:92px;flex-shrink:0;text-align:right;font-family:'IBM Plex Mono',Consolas,monospace;font-size:12.5px;color:var(--ink-muted);white-space:nowrap;}
  .arv-cab .arv-num{font-family:'Inter',sans-serif;font-size:10.5px;}
  .arv-num.forte{color:var(--ink);font-weight:500;}
  .arv-seta-grupo{color:var(--ink-faint);display:inline-flex;transform:rotate(-90deg);transition:transform .15s;flex-shrink:0;}
  .arv-grupo.aberto .arv-seta-grupo{transform:none;}
  .arv-seta{color:var(--ink-faint);width:14px;flex-shrink:0;}
  .arv-cor{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .arv-barra{width:70px;height:6px;border-radius:3px;background:var(--bg);overflow:hidden;flex-shrink:0;}
  .arv-barra b{display:block;height:100%;border-radius:3px;}
  .arv-vazio{padding:14px 16px;color:var(--ink-faint);font-size:13px;}
  .arv .arv-linha:last-child{border-bottom:0;}
  .kp-duplo .arv-barra{display:none;}
  .kp-duplo .arv-num{width:80px;}
  /* O panorama é para navegar na tela; o PDF segue com as seções completas, como antes. */
  @media print{ .arv-excel, .kp{display:none !important;} }
  @media (max-width:900px){ .kp-duplo{grid-template-columns:1fr;} }
  @media (max-width:640px){
    .arv-num{width:66px;font-size:11.5px;}
    .arv-barra{display:none;}
    .arv-num.m2, .arv-num.m3, .arv-num.m4{display:none;}
  }

  /* ================= Detalhe lateral dos gráficos ================= */
  .drill-fundo{position:fixed;inset:0;background:rgba(5,19,42,.32);z-index:60;display:flex;justify-content:flex-end;animation:knAbre .15s ease-out;}
  .drill-painel{width:min(620px,100%);height:100%;background:var(--bg);box-shadow:-12px 0 40px rgba(5,19,42,.18);display:flex;flex-direction:column;}
  .drill-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 22px;background:var(--surface);border-bottom:1px solid var(--border);}
  .drill-cab h2{margin:4px 0 0;font-size:21px;color:var(--navy);}
  .drill-corpo{flex:1;overflow:auto;padding:16px;}
  .drill-painel .arv-barra{display:none;}
  .drill-corpo .arv{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 16px 6px;}
  /* Tudo que abre detalhe mostra que é clicável. */
  .clica-drill{cursor:pointer;}
  .bar-row.clica-drill:hover .bar-row-nome, .rosca-item.clica-drill:hover .rosca-nome{color:var(--primary);text-decoration:underline;}
  .bar-row.clica-drill:hover .bar-track{box-shadow:0 0 0 1px var(--primary);}
  .ind.clica-drill:hover .ind-rotulo{color:var(--primary) !important;}
  .ind.clica-drill:hover{background:rgba(25,90,180,.04);border-radius:8px;}
  .barra-v-col.clica-drill:hover .barra-v-fill{filter:brightness(1.12);}
  .rosca-fatia.clica-drill{transition:stroke-width .12s;}
  .rosca-fatia.ativa{stroke-width:26;}
  .grafico-alvo{fill:transparent;cursor:pointer;}
  .grafico-alvo:hover{fill:rgba(25,90,180,.06);}
  .grafico-dica{font-family:'IBM Plex Mono',Consolas,monospace;font-size:10px;fill:var(--ink);}
  @media print{ .drill-fundo{display:none !important;} }

  /* ================= Agenda (aba própria, ao lado do Dashboard) =================
     Herói, abas e caixa "Agenda de" reaproveitam o desenho do Dashboard (pn-).
     O resto tem prefixo ag- para não encostar em nada que já existe. A cor da
     borda esquerda de cada item diz de onde ele veio (AG_ORIGENS). */
  .ag{max-width:1180px;margin:0 auto;}
  .ag-heroi-topo{flex-wrap:wrap;gap:12px;}
  .ag-novo{
    height:42px;padding:0 18px;border-radius:10px;border:0;background:#fff;color:var(--navy);
    font:600 14px 'Inter',-apple-system,sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  }
  .ag-novo:hover{background:#E9EEF5;}
  .ag-novo:disabled{opacity:.55;cursor:not-allowed;}
  .ag-dia-titulo{font-family:'Fraunces',Georgia,serif;font-size:clamp(22px,3vw,28px);font-weight:500;margin:0 0 4px;}
  .ag-aviso{
    background:var(--gold-tint);border:1px solid #E6D3A0;color:#5E4810;border-radius:12px;
    padding:12px 16px;font-size:13.5px;line-height:1.5;margin:0 18px 18px;
  }
  .ag-hoje{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start;padding:0 18px;}
  .ag-col{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:22px;}
  .ag-lado{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:16px;}
  .ag-secao-titulo{
    display:flex;align-items:baseline;gap:8px;margin:0 0 10px;font-size:11.5px;letter-spacing:.16em;
    text-transform:uppercase;font-weight:600;color:var(--ink-muted);
  }
  .ag-secao-titulo em{font-style:normal;letter-spacing:0;text-transform:none;font-weight:500;color:var(--ink-faint);font-size:12px;}
  .ag-secao-titulo.atrasada{color:var(--danger);}
  .ag-lista{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
  .ag-lista.atrasadas{border-color:#F0CFCC;}
  .ag-vazio{padding:16px 18px;color:var(--ink-faint);font-size:13.5px;}
  .ag-item{
    display:flex;gap:12px;align-items:flex-start;padding:12px 14px 12px 12px;
    border-top:1px solid var(--border);border-left:4px solid var(--ag-cor,#195AB4);
  }
  .ag-item:first-child{border-top:0;}
  .ag-check{
    width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border-strong);background:var(--surface);
    cursor:pointer;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;color:transparent;padding:0;
  }
  .ag-check:hover{border-color:var(--success);color:var(--success);}
  .ag-check:disabled{cursor:default;opacity:.5;}
  .ag-check:disabled:hover{border-color:var(--border-strong);color:transparent;}
  .ag-item.feita .ag-check{background:var(--success);border-color:var(--success);color:#fff;}
  .ag-item.feita .ag-item-titulo{text-decoration:line-through;color:var(--ink-faint);}
  .ag-hora{
    font-family:'IBM Plex Mono',Consolas,monospace;font-size:13px;font-weight:500;color:var(--navy);
    width:44px;flex-shrink:0;padding-top:5px;
  }
  .ag-item-corpo{flex:1;min-width:0;}
  .ag-item-titulo{font-weight:600;font-size:14px;color:var(--ink);overflow-wrap:anywhere;padding-top:4px;}
  .ag-item-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:4px;font-size:12.5px;color:var(--ink-muted);}
  .ag-selo{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;}
  .ag-cliente{border:0;background:none;padding:0;color:var(--primary);font:inherit;font-weight:500;cursor:pointer;text-align:left;}
  .ag-cliente:hover{text-decoration:underline;}
  .ag-atraso{color:var(--danger);font-weight:600;}
  .ag-acoes{display:flex;gap:2px;flex-shrink:0;}
  .ag-icone{
    width:34px;height:34px;border-radius:8px;border:1px solid transparent;background:none;color:var(--ink-faint);
    cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;
  }
  .ag-icone:hover{border-color:var(--border);color:var(--ink);background:var(--bg);}
  .ag-registro{margin-top:10px;display:flex;flex-direction:column;gap:8px;}
  .ag-registro textarea{
    width:100%;min-height:64px;border:1px solid var(--border);border-radius:8px;padding:8px 10px;
    font:13.5px/1.45 'Inter',-apple-system,sans-serif;color:var(--ink);background:var(--surface);resize:vertical;box-sizing:border-box;
  }
  .ag-registro textarea:focus{outline:none;border-color:var(--primary);}
  .ag-registro-botoes{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
  .ag-mais{
    display:block;width:100%;border:0;border-top:1px solid var(--border);background:var(--bg);padding:10px;
    font:500 13px 'Inter',-apple-system,sans-serif;color:var(--primary);cursor:pointer;
  }
  .ag-mais:hover{text-decoration:underline;}
  .ag-cartao{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;}
  .ag-cartao h3{margin:0 0 10px;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-muted);font-weight:600;}
  .ag-prox{display:flex;flex-direction:column;gap:12px;}
  .ag-prox-dia strong{display:block;font-size:12.5px;color:var(--navy);margin-bottom:4px;}
  .ag-prox-linha{
    display:flex;gap:8px;align-items:baseline;font-size:12.5px;color:var(--ink);padding:3px 0 3px 8px;
    border-left:3px solid var(--ag-cor);width:100%;text-align:left;background:none;border-top:0;border-right:0;border-bottom:0;
    font-family:inherit;cursor:pointer;
  }
  .ag-prox-linha:hover{color:var(--primary);}
  .ag-prox-linha span{font-family:'IBM Plex Mono',Consolas,monospace;font-size:11px;color:var(--ink-muted);flex-shrink:0;}
  .ag-legenda-item{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--ink-muted);margin-bottom:7px;line-height:1.4;}
  .ag-legenda-item strong{color:var(--ink);font-weight:600;}
  .ag-legenda-cor{width:10px;height:10px;border-radius:3px;margin-top:3px;flex-shrink:0;}
  .ag-nota{font-size:12px;color:var(--ink-faint);line-height:1.5;margin:8px 0 0;}

  .ag-nav{display:flex;align-items:center;gap:8px;margin:0 18px 12px;flex-wrap:wrap;}
  .ag-nav strong{font-size:15px;color:var(--navy);margin:0 6px;}
  .ag-nav-btn{
    height:38px;min-width:38px;padding:0 12px;border:1px solid var(--border);background:var(--surface);border-radius:8px;
    cursor:pointer;font:500 13.5px 'Inter',-apple-system,sans-serif;color:var(--ink);
  }
  .ag-nav-btn:hover{border-color:var(--border-strong);background:var(--bg);}
  .ag-semana-rolagem{overflow-x:auto;margin:0 18px;padding-bottom:4px;}
  .ag-semana{display:grid;grid-template-columns:repeat(7,minmax(128px,1fr));gap:8px;min-width:930px;}
  .ag-coluna{background:var(--surface);border:1px solid var(--border);border-radius:12px;min-height:280px;display:flex;flex-direction:column;}
  .ag-coluna.hoje{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy);}
  .ag-coluna.fds{background:#FAFBFC;}
  .ag-coluna-cab{padding:9px 10px;border-bottom:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--ink-muted);border-radius:11px 11px 0 0;}
  .ag-coluna.hoje .ag-coluna-cab{background:var(--navy);color:#fff;}
  .ag-coluna-corpo{padding:6px;display:flex;flex-direction:column;gap:5px;}
  .ag-chip{
    display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--ag-cor);background:var(--bg);
