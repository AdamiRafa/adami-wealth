/* ================= Visão geral do funil (Bento) =================
   Substitui a antiga fileira de cards iguais. Três tamanhos de bloco:
   herói (valor em pipeline), tiles de contagem e um bloco acionável
   com os contatos vencidos — as únicas linhas da tela que pedem ação hoje. */
function PipelineOverview({ leads, onOpen, funil }){
  const cotacao = useCotacao();
  const hoje = todayISO();
  const jornada = funil !== 'especialista';
  const t = termos(funil);

  const valores = leads.map(l => parseValor(l.valorPotencial)).filter(v => v !== null);
  /* Na jornada o herói mostra o que já está sob gestão; o potencial ainda
     em disputa aparece embaixo, para os dois números não se confundirem. */
  const totalCarteira = leads.reduce((acc,l) => acc + valorEmCarteiraTotal(l, cotacao), 0);
  const totalOffshoreUsd = leads.reduce((acc,l) => acc + valorEmCarteiraOffshore(l), 0);
  const totalCaptacao = leads.reduce((acc,l) => acc + valorEmCaptacao(l, cotacao), 0);
  const totalValor = jornada ? totalCarteira : valores.reduce((a,b) => a+b, 0);

  const porEtapa = stagesDo(funil).map(s => ({
    key: s.key, color: s.color,
    count: leads.filter(l => l.etapa === s.key).length,
  }));
  const countOf = (k) => (porEtapa.find(s => s.key === k) || {}).count || 0;
  const emReuniao = countOf('R1') + countOf('R2') + countOf('R2.1');
  const emNegociacao = countOf('Negociando') + countOf('Contato Futuro');
  const avancados = countOf('R3') + countOf('R4');
  const semProximo = leads.filter(l => !proximoContatoEfetivo(l, hoje)).length;

  const notificacoes = notificacoesDe(leads, hoje);

  return h('div',{className:'bento'},

    /* --- Herói: o número que resume o funil inteiro --- */
    h('div',{className:'bento-block bento-hero navy'},
      h('div',null,
        h('div',{className:'bento-eyebrow'}, jornada ? 'Total da carteira' : 'Valor em pipeline'),
        h('div',{className:'hero-figure'}, fmtBRL(totalValor)),
        h('div',{className:'hero-sub'},
          h('strong',null, leads.length), ' ',
          leads.length === 1 ? t.sing : t.plur,
          jornada ? ' na jornada' : ' ativos',
          jornada && totalCaptacao > 0
            ? h(Fragment, null, ' · ', h('strong',null, fmtBRLCompact(totalCaptacao)), ' em captação')
            : (valores.length < leads.length
                ? ' · ' + (leads.length - valores.length) + ' sem valor informado'
                : null)
        ),
        /* O total consolidado não deixa ver quanto está lá fora, e essa é a
           primeira pergunta de quem abriu a visão offshore. */
        (jornada && totalOffshoreUsd > 0) ? h('div',{className:'hero-offshore'},
          h('span',{className:'off-tag'},'OFF'),
          fmtUSDCompact(totalOffshoreUsd), ' offshore',
          cotacaoValida(cotacao) ? ' · já no total' : ' · fora do total, sem cotação'
        ) : null
      ),
      leads.length === 0
        ? h('div',{className:'spectrum-empty'},'Cadastre ' + t.art + ' primeiro ' + t.sing + ' para ver a distribuição.')
        : h('div',null,
            h('div',{className:'spectrum', role:'img',
              'aria-label':'Distribuição por etapa: ' + porEtapa.map(s=>etapaCurta(s.key)+', '+s.count).join('; ')},
              porEtapa.filter(s => s.count > 0).map(s =>
                h('div',{key:s.key, className:'spectrum-seg',
                  style:{flexGrow:s.count, background:s.color}})
              )
            ),
            h('div',{className:'spectrum-legend','aria-hidden':'true'},
              porEtapa.map(s => h('div',{key:s.key, className:'spectrum-key'},
                h('span',{className:'spectrum-dot', style:{background:s.color}}),
                etapaCurta(s.key), ' ', h('b',null, s.count)
              ))
            )
          )
    ),

    /* --- Tiles de contagem --- */
    h('div',{className:'bento-block bento-tile'},
      h('div',{className:'tile-figure'}, countOf('Cliente Novo')),
      h('div',{className:'tile-label'}, h('span',{className:'stat-dot', style:{background:'var(--stage-novo)'}}),
        jornada ? 'Sem primeira reunião' : 'Sem contato ainda')
    ),
    h('div',{className:'bento-block bento-tile'},
      h('div',{className:'tile-figure'}, jornada ? emReuniao : countOf('R1') + countOf('R2')),
      h('div',{className:'tile-label'}, h('span',{className:'stat-dot', style:{background:'var(--stage-r2)'}}), 'Em reunião')
    ),

    /* --- Notificações: alertas e contatos que pedem ação hoje --- */
    h('div',{className:'bento-block bento-wide'},
      h('div',{className:'attention-head'},
        h('div',{className:'bento-eyebrow'},'Notificações'),
        h('span',{className:'attention-count' + (notificacoes.length === 0 ? ' zero' : '')}, notificacoes.length)
      ),
      notificacoes.length === 0
        ? h('div',{className:'attention-empty'},
            h('div',null,'Nada pendente para hoje.'),
            h('span',null,'Alertas e contatos agendados aparecem aqui quando vencem.')
          )
        : h('div',{className:'attention-list'},
              notificacoes.map(i => h('button',{
                key:i.id, className:'attention-row', type:'button',
                onClick:()=>onOpen(i.lead),
                title:'Abrir ' + (nomeCliente(i.lead) || 'cliente'),
              },
                h('span',{className:'task-dot ' + i.urgencia, 'aria-hidden':'true'}),
                h('span',{className:'attention-row-main'},
                  h('span',{className:'attention-row-name'}, nomeCliente(i.lead)),
                  h('span',{className:'attention-row-stage'}, i.rotulo, ' · ', i.texto)
                ),
                h('span',{className:'attention-row-when ' + i.urgencia},
                  i.urgencia === 'today' ? 'hoje' : (i.data ? fmtDate(i.data) : ''))
              ))
          )
    ),

    h('div',{className:'bento-block bento-tile'},
      h('div',{className:'tile-figure'}, jornada ? countOf('Jornada Concluída') : emNegociacao),
      h('div',{className:'tile-label'}, h('span',{className:'stat-dot', style:{background: jornada ? 'var(--success)' : 'var(--stage-negociando)'}}),
        jornada ? 'Jornadas concluídas' : 'Em negociação')
    ),
    h('div',{className:'bento-block bento-tile' + (semProximo > 0 ? ' alert' : ' clear')},
      h('div',{className:'tile-figure'}, semProximo),
      h('div',{className:'tile-label'},
        h('span',{className:'stat-dot', style:{background: semProximo > 0 ? 'var(--danger)' : 'var(--success)'}}),
        'Sem próximo contato'
      )
    )
  );
}

/* ================= Board ================= */
/* Visão em lista: a carteira inteira de uma vez, ordenável. O quadro mostra
   o processo; a lista mostra a base. São perguntas diferentes — "onde cada
   cliente está" contra "o que eu tenho". */
function ListaClientes({ leads, onOpen, users, showOwner, funil, podeEditar }){
  const cotacao = useCotacao();
  const [ordem, setOrdem] = useState({ campo:'valor', desc:true });
  const jornada = funil !== 'especialista';
  const hoje = todayISO();
  const nomeDe = (id) => (users.find(u => u.id === id) || {}).nome || '—';

  const valorDe = (l) => jornada
    ? valorEmCarteiraTotal(l, cotacao)
    : (parseValor(l.valorFechado) || parseValor(l.valorPotencial) || 0);

  const campos = {
    cliente:  (l) => (l.cliente || '').toLowerCase(),
    grupo:    (l) => (l.grupoFamiliar || '').toLowerCase(),
    segmento: (l) => l.segmento || '',
    etapa:    (l) => stagesDo(funil).findIndex(x => x.key === l.etapa),
    valor:    valorDe,
    /* Sem data vai para o fim: quem não tem contato agendado não é o mais
       urgente da lista, mas também não pode encabeçá-la. */
    proximo:  (l) => proximoContatoEfetivo(l, hoje) || '9999-99-99',
    responsavel: (l) => nomeDe(l.responsavelId).toLowerCase(),
  };

  const ordenados = useMemo(() => {
    const fn = campos[ordem.campo] || campos.cliente;
    return leads.slice().sort((a,b) => {
      const va = fn(a), vb = fn(b);
      const cmp = typeof va === 'string' ? va.localeCompare(vb,'pt-BR') : (va - vb);
      return ordem.desc ? -cmp : cmp;
    });
  }, [leads, ordem, funil]);

  const alternar = (campo) => setOrdem(o =>
    o.campo === campo ? { campo, desc: !o.desc } : { campo, desc: campo === 'valor' });

  const total = ordenados.reduce((a,l) => a + valorDe(l), 0);

  const cabecalho = (campo, rotulo, classe) => h('th',{
    className: (classe || '') + (ordem.campo === campo ? ' ordenado' : ''),
    onClick:()=>alternar(campo), role:'button', tabIndex:0,
    'aria-sort': ordem.campo === campo ? (ordem.desc ? 'descending' : 'ascending') : 'none',
    onKeyDown:(e)=>{ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); alternar(campo); } },
  }, rotulo, ordem.campo === campo ? h('span',{className:'lista-seta'}, ordem.desc ? '▾' : '▴') : null);

  if(leads.length === 0){
    return h('div',{className:'board-empty'},
      h('span',{className:'board-empty-mark'}),
      h('h2',null,'Nada para listar'),
      h('p',null,'Nenhum registro corresponde à busca ou aos filtros aplicados.')
    );
  }

  return h('div',{className:'lista-wrap'},
    h('table',{className:'lista'},
      h('thead',null, h('tr',null,
        cabecalho('cliente','Cliente'),
        jornada ? cabecalho('grupo','Grupo familiar') : null,
        jornada ? cabecalho('segmento','Segmento') : null,
        cabecalho('etapa','Etapa'),
        cabecalho('valor', jornada ? 'Sob gestão' : 'Valor', 'num'),
        cabecalho('proximo','Próximo contato','num'),
        showOwner ? cabecalho('responsavel','Responsável') : null
      )),
      h('tbody',null,
        ordenados.map(l => h('tr',{
          key:l.id, onClick:()=>onOpen(l), tabIndex:0,
          onKeyDown:(e)=>{ if(e.key === 'Enter'){ e.preventDefault(); onOpen(l); } },
          className: (podeEditar && !podeEditar(l)) ? 'somente-leitura' : '',
        },
          h('td',null,
            h('span',{className:'lista-cliente'},
              l.tipoPessoa === 'PJ' ? h('span',{className:'pj-tag'},'PJ') : null,
              nomeCliente(l)),
            l.oportunidade ? h('span',{className:'lista-sub'}, l.oportunidade) : null
          ),
          jornada ? h('td',{className:'lista-fraco'}, l.grupoFamiliar || '—') : null,
          jornada ? h('td',null, h('span',{className:'lista-chip'},
            h('span',{className:'stat-dot', style:{background:CORES_SEGMENTO[l.segmento]}}),
            l.segmento)) : null,
          h('td',null, h('span',{className:'lista-chip'},
            h('span',{className:'stat-dot', style:{background:stageInfo(l.etapa, l.funil).color}}),
            etapaCurta(l.etapa, l.funil))),
          h('td',{className:'num forte'}, fmtBRL(valorDe(l))),
          h('td',{className:'num'},
            proximoContatoEfetivo(l, hoje)
              ? h('span',{className:'lista-data ' + taskUrgency(l)}, fmtDate(proximoContatoEfetivo(l, hoje)))
              : h('span',{className:'lista-fraco'},'—')),
          showOwner ? h('td',{className:'lista-fraco'}, nomeDe(l.responsavelId)) : null
        ))
      ),
      h('tfoot',null, h('tr',null,
        h('td',{colSpan: 2 + (jornada ? 2 : 0)},
          ordenados.length + (ordenados.length === 1 ? ' registro' : ' registros')),
        h('td',{className:'num forte'}, fmtBRL(total)),
        h('td',{colSpan: showOwner ? 2 : 1})
      ))
    )
  );
}

function Board({ leads, onOpen, users, showOwner, onQuickAdd, onLose, onWin, onRequestMove, emptyAll, funil, podeEditar, podeCriar, pendentesIndicacao }){
  const [draggingId, setDraggingId] = useState(null);
  const [overCol, setOverCol] = useState(null);
  const nameFor = (id) => (users.find(u=>u.id===id)||{}).nome;
  /* Colunas recolhidas: em telas menores o funil tem 6 etapas e nem todas
     interessam ao mesmo tempo. Recolher preserva a contagem à vista. */
  const [colapsadas, setColapsadas] = useState([]);
  const recolher = (chave) => setColapsadas(prev =>
    prev.indexOf(chave) === -1 ? [...prev, chave] : prev.filter(k => k !== chave));

  /* Funil sem nenhum negócio: um convite, não cinco colunas vazias repetindo a mesma frase. */
  if(emptyAll){
    const deProduto = funil === 'especialista';
    return h('div',{className:'board-empty'},
      h('span',{className:'board-empty-mark'}),
      h('h2',null, deProduto ? 'Nenhum negócio aqui ainda' : 'Sua carteira começa aqui'),
      h('p',null, deProduto
        ? 'Os negócios deste produto chegam quando um assessor encaminha um cliente na R4.'
        : 'Cadastre o primeiro cliente para acompanhar a jornada reunião a reunião, com histórico do que foi tratado em cada etapa.'),
      (deProduto || !podeCriar) ? null
        : h('button',{className:'btn btn-primary', onClick:()=>onQuickAdd('Cliente Novo')}, h(IconPlus,{size:14}), 'Cadastrar o primeiro cliente')
    );
  }

  const draggingLead = draggingId ? leads.find(l => l.id === draggingId) : null;
  return h('div',{className:'board'},
    stagesDo(funil).map(stage => {
      const colLeads = leads.filter(l => l.etapa === stage.key);
      const valores = colLeads.map(l => parseValor(l.valorPotencial)).filter(v => v !== null);
      const total = valores.reduce((a,b) => a+b, 0);
      const isOver = overCol === stage.key;
      const isValidTarget = draggingLead && podeEditar(draggingLead) && canMove(draggingLead, stage.key);
      if(colapsadas.indexOf(stage.key) !== -1){
        return h('button',{
          key: stage.key, className:'column colapsada', type:'button',
          title:'Expandir ' + etapaLonga(stage.key, funil),
          onClick:()=>recolher(stage.key),
          /* Soltar um card sobre a coluna recolhida a expande, para o
             arrasto não ficar sem destino. */
          onDragOver:(e)=>{ e.preventDefault(); },
          onDrop:()=>recolher(stage.key),
        },
          h('span',{className:'colapsada-rule', style:{background:stage.color}}),
          h('span',{className:'colapsada-count'}, colLeads.length),
          h('span',{className:'colapsada-nome'}, etapaCurta(stage.key, funil))
        );
      }

      return h('div',{ key: stage.key, className:'column' },
        h('div',{className:'column-rule', style:{background:stage.color}}),
        h('div',{className:'column-head'},
          h('div',{className:'column-title'},
            h('div',{className:'column-title-left'}, h('span',{className:'stage-dot', style:{background:stage.color}}), h('span',null, etapaLonga(stage.key, funil))),
            h('span',{style:{display:'flex',alignItems:'center',gap:6}},
              h('span',{className:'column-count'}, colLeads.length),
              h('button',{className:'column-toggle', type:'button', title:'Recolher ' + etapaLonga(stage.key, funil),
                'aria-label':'Recolher coluna ' + etapaLonga(stage.key, funil),
                onClick:(e)=>{ e.stopPropagation(); recolher(stage.key); }},
                h(Icon,{path:'M15 18l-6-6 6-6', size:13}))
            )
          ),
          valores.length > 0 ? h('div',{className:'column-total'}, fmtBRL(total)) : null
        ),
        h('div',{
          className:'column-body' + (isOver && isValidTarget ? ' drag-over' : isOver && draggingLead && stage.key !== draggingLead.etapa ? ' drag-over-invalid' : ''),
          onDragOver:(e)=>{ e.preventDefault(); setOverCol(stage.key); },
          onDragLeave:()=>setOverCol(prev => prev===stage.key ? null : prev),
          onDrop:(e)=>{
            e.preventDefault();
            const id = e.dataTransfer.getData('text/plain');
            if(id) onRequestMove(id, stage.key);
            setOverCol(null); setDraggingId(null);
          },
        },
          colLeads.length === 0
            ? h('div',{className:'empty-col'}, 'Nenhum lead aqui ainda.')
            : colLeads.map(lead => h(LeadCard,{
                key: lead.id, lead, onOpen, dragging: draggingId===lead.id, showOwner, onLose, onWin,
                ownerName: nameFor(lead.responsavelId),
                onAdvance: onRequestMove,
                editavel: podeEditar(lead),
                pendenteIndicacao: pendentesIndicacao && pendentesIndicacao.has(lead.id),
                onDragStart:(id)=>setDraggingId(id),
                onDragEnd:()=>{ setDraggingId(null); setOverCol(null); },
              }))
        ),
        null
      );
    })
  );
}

/* ================= Cockpit (Hoje) =================
   Tela de abertura do assessor: o que precisa de ação hoje, não a lista
   inteira da carteira. Cada bloco lê dados que já existem em outro lugar do
   sistema (alertas, movimentações, régua, negócios), filtrados para UM
   assessor — o mesmo que o admin escolhe no seletor "Toda a equipe / <nome>"
   no topo, ou o próprio usuário logado quando não é admin. Receita e
   dinheiro parado em conta (PJ1, resgate provisionado/pago) ainda não têm
   fonte de dado: entram como card desativado até a integração com o banco. */
function computeCockpitStats(leads, users, assessorId, cotacao){
  const vivos = ativos(leads);
  const hoje = todayISO();
  const jornada = vivos.filter(l => (l.funil || 'assessor') !== 'especialista' && l.responsavelId === assessorId);
  const inicioMes = inicioDoPeriodo('mes');

  const vencimentos = [];
  jornada.forEach(l => {
    alertasAbertos(l).filter(a => a.tipo === 'vencimento').forEach(a => {
      const diasAtraso = a.data ? Math.round((new Date(hoje + 'T00:00:00') - new Date(a.data + 'T00:00:00')) / DIA_MS) : null;
      vencimentos.push({ leadId:l.id, cliente:nomeCliente(l), alertaId:a.id, texto:a.texto, data:a.data, diasAtraso });
    });
  });
  vencimentos.sort((x,y) => (y.diasAtraso===null?-999:y.diasAtraso) - (x.diasAtraso===null?-999:x.diasAtraso));

  const aportes = [], resgates = [];
  jornada.forEach(l => {
    (l.movimentacoes || []).forEach(m => {
      if(!m.data) return;
      if(new Date(m.data + 'T12:00:00').getTime() < inicioMes) return;
      const item = { leadId:l.id, cliente:nomeCliente(l), valor: parseValor(m.valor) || 0, data:m.data, custodia: m.custodia || 'onshore' };
      if(m.tipo === 'aporte') aportes.push(item);
      else if(m.tipo === 'retirada') resgates.push(item);
    });
  });
  aportes.sort((a,b) => b.data.localeCompare(a.data));
  resgates.sort((a,b) => b.data.localeCompare(a.data));

  const regua = [];
  jornada.forEach(l => {
    reguaPendencias(l, hoje).forEach(r => {
      regua.push({ leadId:l.id, cliente:nomeCliente(l), tipo:r.tipo, label:r.label, diasAtraso:r.diasAtraso });
    });
  });
  regua.sort((a,b) => b.diasAtraso - a.diasAtraso);

  /* Contato atrasado: a mesma leitura da situação "atrasado" do quadro
     (proximoContatoEfetivo), só que na tela de abertura do dia em vez de
     enterrada 3 cliques dentro de Filtros. Desqualificado não entra —
     ninguém precisa ligar de novo pra quem já foi perdido. */
  const contatosAtrasados = [];
  jornada.forEach(l => {
    if(l.perdido) return;
    const prox = proximoContatoEfetivo(l, hoje);
    if(prox && prox < hoje){
      const diasAtraso = Math.round((new Date(hoje + 'T00:00:00') - new Date(prox + 'T00:00:00')) / DIA_MS);
      contatosAtrasados.push({ leadId:l.id, cliente:nomeCliente(l), diasAtraso });
    }
  });
  contatosAtrasados.sort((a,b) => b.diasAtraso - a.diasAtraso);

  const abertas = jornada.filter(l => naCarteira(l));
  const semAtivar = abertas.filter(l => !(valorEmCarteira(l) > 0 || valorEmCarteiraOffshore(l) > 0))
    .map(l => ({ leadId:l.id, cliente:nomeCliente(l), diasNaCarteira: l.criadoEm ? Math.round((Date.now() - l.criadoEm) / DIA_MS) : null }));
  const ativadas = abertas.length - semAtivar.length;

  const filtrosMes = { periodo:'mes', de:'', ate:'', segmento:[], esteira:[], tipoPessoa:[], situacao:[], grupo:[], temperatura:[] };
  const nnmStats = computeAssessoriaStats(jornada, users, filtrosMes, cotacao);

  /* PJ2: receita do assessor sobre negócios de Consórcio e Seguro fechados
     este mês — o mesmo vínculo de origem usado no ranking "Quem indicou". */
  const porId = new Map(vivos.map(l => [l.id, l]));
  const negociosPJ2 = vivos.filter(l => l.funil === 'especialista' && l.ganho && l.ganhoEm
      && l.ganhoEm >= inicioMes
      && l.origemLeadId && porId.has(l.origemLeadId) && porId.get(l.origemLeadId).responsavelId === assessorId)
    .map(l => ({ leadId:l.id, cliente:nomeCliente(l), produto:l.produto,
      valor: parseValor(l.valorFechado) || parseValor(l.valorPotencial) || 0 }));
  const receitaPJ2 = negociosPJ2.reduce((s,l) => s + l.valor, 0);

  return {
    vencimentos, aportes, resgates, regua, contatosAtrasados,
    contas: { abertas: abertas.length, ativadas, semAtivar },
    nnm: nnmStats.fluxo,
    receitaPJ2: { valor: receitaPJ2, negocios: negociosPJ2 },
  };
}

function CockpitCard({ tom, label, valor, sub, aberto, onClick, disabled }){
  const clicavel = !!onClick;
  return h('div',{
    className:'cockpit-card' + (tom?' '+tom:'') + (aberto?' aberto':'') + (disabled?' disabled':'') + (!clicavel && !disabled ? ' estatico':''),
    onClick: clicavel ? onClick : undefined,
    role: clicavel ? 'button' : undefined, tabIndex: clicavel ? 0 : undefined,
    onKeyDown: clicavel ? (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); onClick(); } } : undefined,
  },
    h('div',{className:'cockpit-label'}, label, clicavel ? h('span',{className:'cockpit-chevron'}, h(IconChevron,{size:13})) : null),
    h('div',{className:'cockpit-num'}, valor),
    sub ? h('div',{className:'cockpit-sub'}, sub) : null
  );
}

function CockpitLista({ itens, vazio, renderLinha }){
  if(!itens.length) return h('div',{className:'cockpit-lista'}, h('div',{className:'cockpit-vazio'}, vazio));
  return h('div',{className:'cockpit-lista'}, itens.map(renderLinha));
}

function Cockpit({ leads, users, currentUser, isAdmin, vendorFilter, onOpen, onResolverAlerta, onAddActivity }){
  const cotacao = useCotacao();
  const [abertoKey, setAbertoKey] = useState(null);
  const [marcando, setMarcando] = useState(null);
  const [notaTxt, setNotaTxt] = useState('');

  const assessorId = isAdmin ? (vendorFilter === 'all' ? null : vendorFilter) : (currentUser && currentUser.id);
  const assessorNome = assessorId ? ((users.find(u => u.id === assessorId) || {}).nome || '') : '';

  const stats = useMemo(() => assessorId ? computeCockpitStats(leads, users, assessorId, cotacao) : null,
    [leads, users, assessorId, cotacao]);

  if(!assessorId){
    return h('div',{className:'cockpit'},
      h('div',{className:'cockpit-escolha'},
        'Escolha um assessor em "Toda a equipe", no topo da tela, para ver a rotina do dia dele.')
    );
  }

  const toggle = (key) => setAbertoKey(prev => prev === key ? null : key);
  const abrir = (leadId) => { const l = leads.find(x => x.id === leadId); if(l) onOpen(l); };

  const confirmarRegua = () => {
    if(!notaTxt.trim() || !marcando) return;
    onAddActivity(marcando.leadId, {
      id: uid('a'), tipo: marcando.tipo, data: todayISO(),
      nota: notaTxt.trim(), autor: currentUser.nome, criadoEm: Date.now(),
    });
    setMarcando(null); setNotaTxt('');
  };

  const linhaVencimento = (v) => h('div',{className:'cockpit-linha', key:v.alertaId},
    h('button',{className:'cockpit-linha-nome', onClick:()=>abrir(v.leadId)}, v.cliente,
      v.texto ? h('span',{style:{color:'var(--ink-faint)'}}, ' · ' + v.texto) : null),
    h('span',{className:'cockpit-linha-meta' + (v.diasAtraso>0?' cockpit-linha-atraso':'')},
      v.diasAtraso === null ? '—' : v.diasAtraso > 0 ? v.diasAtraso + 'd atrasado' : v.diasAtraso === 0 ? 'hoje' : 'em ' + (-v.diasAtraso) + 'd'),
    h('button',{className:'cockpit-linha-acao', onClick:()=>onResolverAlerta(v.leadId, v.alertaId)}, 'Concluído')
  );

  const linhaMovimentacao = (m, key) => h('div',{className:'cockpit-linha', key},
    h('button',{className:'cockpit-linha-nome', onClick:()=>abrir(m.leadId)}, m.cliente),
    h('span',{className:'cockpit-linha-meta'},
      (m.custodia==='offshore'?fmtUSD:fmtBRL)(m.valor) + ' · ' + new Date(m.data+'T12:00:00').toLocaleDateString('pt-BR'))
  );

  const linhaRegua = (r) => h(Fragment,{key:r.leadId+':'+r.tipo},
    h('div',{className:'cockpit-linha'},
      h('button',{className:'cockpit-linha-nome', onClick:()=>abrir(r.leadId)}, r.cliente,
        h('span',{style:{color:'var(--ink-faint)'}}, ' · ' + r.label)),
      h('span',{className:'cockpit-linha-meta cockpit-linha-atraso'}, r.diasAtraso + 'd atrasado'),
      h('button',{className:'cockpit-linha-acao', onClick:()=>{ setMarcando({leadId:r.leadId, tipo:r.tipo}); setNotaTxt(''); }}, 'Marcar feito')
    ),
    marcando && marcando.leadId===r.leadId && marcando.tipo===r.tipo
      ? h('div',{className:'cockpit-nota'},
          h('input',{ placeholder:'O que foi conversado?', value:notaTxt, autoFocus:true,
            onChange:e=>setNotaTxt(e.target.value),
            onKeyDown:e=>{ if(e.key==='Enter') confirmarRegua(); } }),
          h('button',{className:'btn btn-primary', onClick:confirmarRegua}, 'OK'),
          h('button',{className:'btn btn-ghost', onClick:()=>setMarcando(null)}, h(IconX,{size:12}))
        )
      : null
  );

  const linhaSemAtivar = (c) => h('div',{className:'cockpit-linha', key:c.leadId},
    h('button',{className:'cockpit-linha-nome', onClick:()=>abrir(c.leadId)}, c.cliente),
    h('span',{className:'cockpit-linha-meta'}, c.diasNaCarteira===null?'—':'há ' + c.diasNaCarteira + 'd na carteira')
  );

  const linhaPJ2 = (n) => h('div',{className:'cockpit-linha', key:n.leadId},
    h('button',{className:'cockpit-linha-nome', onClick:()=>abrir(n.leadId)}, n.cliente,
      h('span',{style:{color:'var(--ink-faint)'}}, ' · ' + n.produto)),
    h('span',{className:'cockpit-linha-meta'}, fmtBRLCompact(n.valor))
  );

  const linhaContatoAtrasado = (c) => h('div',{className:'cockpit-linha', key:c.leadId},
    h('button',{className:'cockpit-linha-nome', onClick:()=>abrir(c.leadId)}, c.cliente),
    h('span',{className:'cockpit-linha-meta cockpit-linha-atraso'}, c.diasAtraso + 'd atrasado')
  );

  const agora = new Date();
  const saudacao = agora.getHours() < 12 ? 'Bom dia' : agora.getHours() < 18 ? 'Boa tarde' : 'Boa noite';
  const dataLonga = agora.toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long' });
  const heroTitulo = isAdmin ? 'Rotina de ' + (assessorNome.split(' ')[0] || assessorNome)
    : saudacao + ', ' + ((currentUser.nome || '').split(' ')[0] || '');

  return h('div',{className:'cockpit'},
    h('div',{className:'cockpit-hero'},
      h('h1',null, heroTitulo),
      h('span',null, dataLonga.charAt(0).toUpperCase() + dataLonga.slice(1))
    ),

    h('div',{className:'cockpit-grupo'},
      h('div',{className:'painel-secao'}, h('span',{className:'painel-secao-nome'},'Eventos'), h('span',{className:'painel-secao-desc'},'o que precisa de ação hoje')),
      h('div',{className:'cockpit-grid'},
        h(CockpitCard,{ tom: stats.contatosAtrasados.length ? 'danger':'', label:'Contato atrasado',
          valor:stats.contatosAtrasados.length, sub:'próximo contato já passou', aberto:abertoKey==='contatos',
          onClick:()=>toggle('contatos') }),
        h(CockpitCard,{ tom: stats.vencimentos.length ? 'danger':'', label:'Vencimentos',
          valor:stats.vencimentos.length, sub:'dia e mês', aberto:abertoKey==='vencimentos',
          onClick:()=>toggle('vencimentos') }),
        h(CockpitCard,{ tom:'success', label:'Aportes no mês', valor:stats.aportes.length,
          sub: fmtBRLCompact(stats.aportes.reduce((s,a)=>s+a.valor,0)),
          aberto:abertoKey==='aportes', onClick:()=>toggle('aportes') }),
        h(CockpitCard,{ label:'Resgates no mês', valor:stats.resgates.length,
          sub: fmtBRLCompact(stats.resgates.reduce((s,a)=>s+a.valor,0)),
          aberto:abertoKey==='resgates', onClick:()=>toggle('resgates') }),
        h(CockpitCard,{ label:'Dinheiro parado em conta', valor:'—',
          sub:'chega com a integração do banco', disabled:true })
      ),
      abertoKey==='contatos' ? h(CockpitLista,{ itens:stats.contatosAtrasados, vazio:'Nenhum contato atrasado.', renderLinha:linhaContatoAtrasado }) : null,
      abertoKey==='vencimentos' ? h(CockpitLista,{ itens:stats.vencimentos, vazio:'Nenhum vencimento em aberto.', renderLinha:linhaVencimento }) : null,
      abertoKey==='aportes' ? h(CockpitLista,{ itens:stats.aportes, vazio:'Nenhum aporte lançado este mês.',
        renderLinha:(m,i)=>linhaMovimentacao(m,'ap'+i) }) : null,
      abertoKey==='resgates' ? h(CockpitLista,{ itens:stats.resgates, vazio:'Nenhum resgate lançado este mês.',
        renderLinha:(m,i)=>linhaMovimentacao(m,'rs'+i) }) : null,
      stats.resgates.length ? h('div',{className:'field-hint'}, 'Separar "provisionado" de "pago" chega com a integração da API do banco.') : null
    ),

    h('div',{className:'cockpit-grupo'},
      h('div',{className:'painel-secao'}, h('span',{className:'painel-secao-nome'},'Receita'), h('span',{className:'painel-secao-desc'},'prévia do mês · zera todo dia 1')),
      h('div',{className:'cockpit-grid'},
        h(CockpitCard,{ tom:'gold', label:'PJ2 · Consórcio e Seguro', valor:fmtBRLCompact(stats.receitaPJ2.valor),

/* ================= Agenda (aba própria, ao lado do Dashboard) =================
   Decidido com o Emil em 05/11/2026, protótipo aprovado no mesmo dia:
   - as tarefas criadas na mão moram na tabela `tarefas` (agenda.sql);
   - próximo contato, vencimento e régua NÃO viram tarefa gravada: são lidos
     da ficha do cliente a cada abertura, para os dois nunca discordarem
     (mesma razão de a régua não ser alerta gravado);
   - head comercial (admin do CRM) e master atribuem tarefa a qualquer
     pessoa e enxergam a agenda de todos; o assessor enxerga a própria. Quem
     garante isso é o banco (políticas de `tarefas`), não esta tela;
   - tarefa recorrente: não repete, todo dia útil, toda semana em dias
     escolhidos ou todo mês;
   - concluir tarefa ligada a cliente registra a atividade na ficha dele;
   - Outlook só leitura, quando o administrador do Microsoft 365 autorizar
     (ainda não ligado). */
const AG_TIPOS = [
  { key:'ligacao', label:'Ligação' },
  { key:'reuniao', label:'Reunião' },
  { key:'email',   label:'E-mail' },
  { key:'tarefa',  label:'Tarefa interna' },
];
const agTipoLabel = (k) => (AG_TIPOS.find(t => t.key === k) || AG_TIPOS[3]).label;
/* Tipo da tarefa -> tipo da atividade que ela registra na ficha ao ser concluída. */
const AG_TIPO_ATIVIDADE = { ligacao:'ligacao', reuniao:'reuniao', email:'email', tarefa:'nota' };
const AG_ORIGENS = {
  manual:     { nome:'Minha',           cor:'#195AB4', desc:'criada pela própria pessoa' },
  atribuida:  { nome:'Atribuída',       cor:'#7C5CC4', desc:'passada pelo head comercial ou por um master' },
  contato:    { nome:'Próximo contato', cor:'#2F7A56', desc:'data marcada na ficha do cliente' },
  vencimento: { nome:'Vencimento',      cor:'#B3403A', desc:'alerta de vencimento na ficha do cliente' },
  regua:      { nome:'Régua',           cor:'#8A6A18', desc:'contato previsto pela régua de relacionamento' },
};
const AG_DIAS = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const AG_REPETE = [
  { key:'nao',      label:'Não repete' },
  { key:'dia_util', label:'Todo dia útil' },
  { key:'semana',   label:'Toda semana' },
  { key:'mes',      label:'Todo mês' },
];
/* Recorrente atrasada só olha o último mês: uma tarefa diária esquecida não
   vira trinta linhas vermelhas, vira uma ("atrasada desde"). */
const AG_JANELA_ATRASO = 31;
const AG_ATRASADAS_VISIVEIS = 8;

const agData = (iso) => new Date(iso + 'T12:00:00');
const agSoma = (iso, n) => { const d = agData(iso); d.setDate(d.getDate() + n); return toISODate(d); };
const agDiaSemana = (iso) => { const g = agData(iso).getDay(); return g === 0 ? 7 : g; };
const agSegunda = (iso) => agSoma(iso, 1 - agDiaSemana(iso));
const agDiasEntre = (de, ate) => Math.round((agData(ate) - agData(de)) / DIA_MS);
const agPrimeiraMaiuscula = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const agDataLonga = (iso) => agPrimeiraMaiuscula(agData(iso).toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long' }));
const agDataCurta = (iso) => AG_DIAS[agDiaSemana(iso) - 1] + ', ' + iso.slice(8,10) + '/' + iso.slice(5,7);
const agMesAno = (iso) => agPrimeiraMaiuscula(agData(iso).toLocaleDateString('pt-BR', { month:'long', year:'numeric' }));
function agRotuloDia(iso, hoje){
  const d = agDiasEntre(hoje, iso);
  if(d === 0) return 'Hoje';
  if(d === 1) return 'Amanhã';
  if(d === -1) return 'Ontem';
  return agDataCurta(iso);
}
function agNovoId(){
  try{ if(window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID(); }catch(e){}
  /* Navegador antigo: UUID v4 montado à mão (a coluna é uuid). */
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

/* A tarefa acontece neste dia? A repetição começa no dia de "data". */
function tarefaCaiEm(t, dia){
  if(!t || !t.data || dia < t.data) return false;
  switch(t.repeticao){
    case 'dia_util': return agDiaSemana(dia) <= 5;
    case 'semana':   return (t.diasSemana || []).indexOf(agDiaSemana(dia)) !== -1;
    case 'mes': {
      /* Dia 31 num mês de 30 dias cai no último dia do mês, não some. */
      const alvo = Number(t.data.slice(8,10));
      const d = agData(dia);
      const ultimo = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      return Number(dia.slice(8,10)) === Math.min(alvo, ultimo);
    }
    default: return dia === t.data;
  }
}
function agRepeteTexto(t){
  if(!t) return '';
  if(t.repeticao === 'dia_util') return 'todo dia útil';
  if(t.repeticao === 'semana'){
    const dias = (t.diasSemana || []).slice().sort((a,b) => a - b).map(n => AG_DIAS[n - 1].toLowerCase());
    return dias.length ? 'toda ' + dias.join(', ') : 'toda semana';
  }
  if(t.repeticao === 'mes') return 'todo dia ' + Number(t.data.slice(8,10));
  return '';
}

/* ---------- Itens da agenda ----------
   Tudo vira o mesmo formato de item, venha da tabela ou da ficha:
   { chave, origem, dia, hora, titulo, tipo, leadId, cliente, donoId, dono,
     por, repete, feita, atrasada, tarefa?, alertaId?, reguaTipo? }
   donos: Set de ids de quem a agenda mostra, ou null para toda a equipe. */
function agBaseTarefa(t, porLead, nomeDe){
  const origem = t.criadoPor && t.criadoPor !== t.donoId ? 'atribuida' : 'manual';
  const lead = t.leadId ? porLead.get(t.leadId) : null;
  return {
    origem, tarefa: t, titulo: t.titulo, tipo: t.tipo, hora: t.hora || '',
    leadId: lead ? lead.id : '', cliente: lead ? nomeCliente(lead) : '',
    donoId: t.donoId, dono: nomeDe(t.donoId),
    por: origem === 'atribuida' ? nomeDe(t.criadoPor) : '',
    repete: agRepeteTexto(t),
  };
}
function agLeadsDaAgenda(leads, donos){
  return ativos(leads).filter(l => !saiuDoQuadro(l) && (!donos || donos.has(l.responsavelId)));
}
/* Os três tipos que vêm da ficha do cliente, já com o dia em que caem. */
function agItensDaFicha(leads, users, donos, hoje){
  const nomeDe = (id) => (users.find(u => u.id === id) || {}).nome || '';
  const itens = [];
  agLeadsDaAgenda(leads, donos).forEach(l => {
    const base = { leadId: l.id, cliente: nomeCliente(l), donoId: l.responsavelId, dono: nomeDe(l.responsavelId),
      hora: '', por: '', repete: '', feita: false };
    if(l.proximoContato){
      itens.push({ ...base, chave: 'c:' + l.id, origem: 'contato', dia: l.proximoContato, tipo: 'ligacao',
        titulo: 'Contato agendado · ' + etapaCurta(l.etapa, l.funil) + (l.oportunidade ? ' · ' + l.oportunidade : '') });
    }
    alertasAbertos(l).filter(a => a.tipo === 'vencimento' && a.data).forEach(a => {
      itens.push({ ...base, chave: 'v:' + l.id + ':' + a.id, origem: 'vencimento', dia: a.data, tipo: 'tarefa',
        alertaId: a.id, titulo: a.texto ? 'Vencimento · ' + a.texto : 'Vencimento' });
    });
    reguaStatus(l, hoje).forEach(r => {
      itens.push({ ...base, chave: 'r:' + l.id + ':' + r.tipo, origem: 'regua', dia: r.prevista, tipo: 'reuniao',
        reguaTipo: r.tipo, titulo: r.label + ' (régua ' + l.segmento + ')' });
    });
  });
  return itens.map(it => ({ ...it, atrasada: it.dia < hoje }));
}
const agOrdenar = (a, b) => a.dia.localeCompare(b.dia)
  || (a.hora || '99').localeCompare(b.hora || '99')
  || a.titulo.localeCompare(b.titulo);

/* Tudo o que cai entre "de" e "ate" (inclusive). */
function agendaItens({ tarefas, leads, users, donos, de, ate, hoje }){
  const nomeDe = (id) => (users.find(u => u.id === id) || {}).nome || '';
  const porLead = new Map(leads.map(l => [l.id, l]));
  const itens = [];
  (tarefas || []).forEach(t => {
    if(donos && !donos.has(t.donoId)) return;
    const base = agBaseTarefa(t, porLead, nomeDe);
    const concluidas = t.concluidas || [];
    for(let d = t.data > de ? t.data : de; d <= ate; d = agSoma(d, 1)){
      if(!tarefaCaiEm(t, d)) continue;
      const feita = concluidas.indexOf(d) !== -1;
      itens.push({ ...base, chave: t.id + '@' + d, dia: d, feita, atrasada: !feita && d < hoje });
    }
  });
  agItensDaFicha(leads, users, donos, hoje).forEach(it => {
    if(it.dia >= de && it.dia <= ate) itens.push(it);
  });
  return itens.sort(agOrdenar);
}

/* O que ficou para trás. Tarefa recorrente conta uma vez só (a última
   ocorrência antes de hoje, se não foi feita) e só até chegar a próxima: a
   reunião de quinta esquecida deixa de ser atrasada quando a quinta seguinte
   chega, porque aí ela já aparece em "Hoje". */
function agendaAtrasadas({ tarefas, leads, users, donos, hoje }){
  const nomeDe = (id) => (users.find(u => u.id === id) || {}).nome || '';
  const porLead = new Map(leads.map(l => [l.id, l]));
  const itens = [];
  (tarefas || []).forEach(t => {
    if((donos && !donos.has(t.donoId)) || !t.data || t.data >= hoje) return;
    const concluidas = t.concluidas || [];
    let dia = null;
    if(t.repeticao === 'nao') dia = t.data;
    else if(tarefaCaiEm(t, hoje)) return;
    else {
      const limite = agSoma(hoje, -AG_JANELA_ATRASO);
      for(let d = agSoma(hoje, -1); d >= t.data && d >= limite; d = agSoma(d, -1)){
        if(tarefaCaiEm(t, d)){ dia = d; break; }
      }
    }
    if(!dia || concluidas.indexOf(dia) !== -1) return;
    itens.push({ ...agBaseTarefa(t, porLead, nomeDe), chave: t.id + '@' + dia, dia, feita: false, atrasada: true });
  });
  agItensDaFicha(leads, users, donos, hoje).forEach(it => { if(it.dia < hoje) itens.push(it); });
  return itens.sort(agOrdenar);
}

/* Resumo de um dia para a faixa do Dashboard e o herói da Agenda. */
function agResumo(itensHoje, atrasadas){
  const abertas = itensHoje.filter(i => !i.feita);
  const agora = new Date();
  const hhmm = String(agora.getHours()).padStart(2,'0') + ':' + String(agora.getMinutes()).padStart(2,'0');
  const proxima = abertas.filter(i => i.hora && i.hora >= hhmm).sort((a,b) => a.hora.localeCompare(b.hora))[0] || null;
  return { total: itensHoje.length, abertas: abertas.length, feitas: itensHoje.length - abertas.length,
    atrasadas: atrasadas.length, proxima };
}
const agPlural = (n, um, varios) => n + ' ' + (n === 1 ? um : varios);

/* Faixa no topo do Dashboard: o dia em uma linha, com atalho para a Agenda. */
function AgendaFaixa({ tarefas, leads, users, donoId, onAbrir }){
  const hoje = todayISO();
  const donos = useMemo(() => new Set([donoId]), [donoId]);
  const r = useMemo(() => agResumo(
    agendaItens({ tarefas, leads, users, donos, de: hoje, ate: hoje, hoje }),
    agendaAtrasadas({ tarefas, leads, users, donos, hoje })), [tarefas, leads, users, donos, hoje]);
  return h('div', { className: 'ag-faixa' },
    h('span', { className: 'ag-faixa-rotulo' }, 'Agenda de hoje'),
    h('span', { className: 'ag-faixa-txt' },
      r.abertas ? agPlural(r.abertas, 'tarefa', 'tarefas') + (r.abertas === 1 ? ' aberta' : ' abertas') : 'Nada pendente para hoje',
      r.proxima ? ' · próxima às ' + r.proxima.hora : '',
      r.atrasadas ? h('span', { className: 'ag-atraso' }, ' · ' + agPlural(r.atrasadas, 'atrasada', 'atrasadas')) : null),
    h('button', { className: 'btn btn-ghost', onClick: onAbrir }, 'Abrir a Agenda'));
}

function Agenda({ tarefas, tarefasErro, leads, users, currentUser, podeAtribuir, podeEditarLead,
  onSalvarTarefa, onApagarTarefa, onConcluir, onOpen, onResolverAlerta, onRegistrar }){
  const hoje = todayISO();
  const [visao, setVisao] = useState('hoje');
  const [quem, setQuem] = useState(currentUser.id);
  const [refSemana, setRefSemana] = useState(agSegunda(hoje));
  const [refMes, setRefMes] = useState(hoje.slice(0,8) + '01');
  const [diaMes, setDiaMes] = useState(hoje);
  const [form, setForm] = useState(null);
  const [registrando, setRegistrando] = useState(null);
  const [textoRegistro, setTextoRegistro] = useState('');
  const [todasAtrasadas, setTodasAtrasadas] = useState(false);

  /* Quem pode ser visto: head comercial e master veem todos, o assessor só a si. */
  const pessoas = useMemo(() => {
    const ativas = users.filter(u => u.status === 'ativo' && u.id !== currentUser.id)
      .sort((a,b) => (a.nome || '').localeCompare(b.nome || ''));
    return [currentUser].concat(ativas);
  }, [users, currentUser]);
  const visoes = podeAtribuir ? pessoas.map(p => p.id).concat(['todos']) : [currentUser.id];
  const donos = useMemo(() => quem === 'todos' ? null : new Set([quem]), [quem]);
  const nomeDe = (id) => (users.find(u => u.id === id) || {}).nome || '';
  const irPara = (delta) => {
    const i = visoes.indexOf(quem);
    setQuem(visoes[(i + delta + visoes.length) % visoes.length]);
  };

  const base = { tarefas, leads, users, donos, hoje };
  const atrasadas = useMemo(() => agendaAtrasadas(base), [tarefas, leads, users, donos, hoje]);
  const itensHoje = useMemo(() => agendaItens({ ...base, de: hoje, ate: hoje }), [tarefas, leads, users, donos, hoje]);
  const proximos = useMemo(() => agendaItens({ ...base, de: agSoma(hoje, 1), ate: agSoma(hoje, 7) }), [tarefas, leads, users, donos, hoje]);
  const resumo = agResumo(itensHoje, atrasadas);
  const semanaFim = agSoma(refSemana, 6);
  const itensSemana = useMemo(() => visao === 'semana' ? agendaItens({ ...base, de: refSemana, ate: semanaFim }) : [],
    [visao, tarefas, leads, users, donos, refSemana, hoje]);
  const mesInicio = agSegunda(refMes);
  const mesUltimo = (() => { const d = agData(refMes); return toISODate(new Date(d.getFullYear(), d.getMonth() + 1, 0)); })();
  const mesFim = agSoma(agSegunda(mesUltimo), 6);
  const itensMes = useMemo(() => visao === 'mes' ? agendaItens({ ...base, de: mesInicio, ate: mesFim }) : [],
    [visao, tarefas, leads, users, donos, refMes, hoje]);

  const mostrarDono = quem === 'todos';
  const leadDe = (id) => leads.find(l => l.id === id) || null;
  const abrirLead = (id) => { const l = leadDe(id); if(l) onOpen(l); };
  const meu = (t) => t.criadoPor === currentUser.id || (!t.criadoPor && t.donoId === currentUser.id);
  const podeEditarTarefa = (t) => podeAtribuir || meu(t);
  const podeConcluirTarefa = (t) => t.donoId === currentUser.id || podeEditarTarefa(t);
  const semTabela = !!tarefasErro;

  const novaTarefa = (dia) => setForm({ nova: true, tarefa: {
    id: agNovoId(), titulo: '', tipo: 'ligacao', leadId: '', donoId: quem === 'todos' ? currentUser.id : quem,
    criadoPor: currentUser.id, data: dia || hoje, hora: '', repeticao: 'nao', diasSemana: [agDiaSemana(dia || hoje)],
    concluidas: [], emailManha: true, nota: '' } });

  /* Clicar num item: tarefa editável abre o formulário; o resto abre a ficha. */
  const abrirItem = (it) => {
    if(it.tarefa && podeEditarTarefa(it.tarefa)) setForm({ nova: false, tarefa: it.tarefa });
    else if(it.leadId) abrirLead(it.leadId);
  };

  const fecharRegistro = () => { setRegistrando(null); setTextoRegistro(''); };
  const clicarCheck = (it) => {
    if(it.tarefa){ onConcluir(it.tarefa, it.dia, !it.feita); return; }
    if(it.origem === 'vencimento'){ onResolverAlerta(it.leadId, it.alertaId); return; }
    setRegistrando(registrando === it.chave ? null : it.chave); setTextoRegistro('');
  };
  const salvarRegistro = (it) => {
    if(!textoRegistro.trim()) return;
    onRegistrar(it, textoRegistro.trim());
    fecharRegistro();
  };
  const podeMexer = (it) => it.tarefa ? podeConcluirTarefa(it.tarefa) : (!!leadDe(it.leadId) && podeEditarLead(leadDe(it.leadId)));
  const rotuloCheck = (it) => it.tarefa ? (it.feita ? 'Desmarcar como feita' : 'Marcar como feita')
    : it.origem === 'vencimento' ? 'Marcar o vencimento como resolvido'
    : it.origem === 'contato' ? 'Registrar o contato' : 'Registrar o contato da régua';

  const selo = (origem) => { const o = AG_ORIGENS[origem];
    return h('span', { className: 'ag-selo', style: { background: o.cor + '1A', color: o.cor } }, o.nome); };

  const linha = (it, opcoes) => {
    const o = AG_ORIGENS[it.origem];
    const mexe = podeMexer(it);
    const mostrarDia = opcoes && opcoes.mostrarDia;
    return h('div', { key: it.chave, className: 'ag-item' + (it.feita ? ' feita' : ''), style: { '--ag-cor': o.cor } },
      h('button', { className: 'ag-check', disabled: !mexe, onClick: () => clicarCheck(it),
        'aria-label': rotuloCheck(it), title: mexe ? rotuloCheck(it) : 'Só o responsável pelo cliente pode registrar' },
        h(Icon, { size: 15, path: 'M20 6 9 17l-5-5' })),
      it.hora ? h('span', { className: 'ag-hora' }, it.hora) : null,
      h('div', { className: 'ag-item-corpo' },
        h('div', { className: 'ag-item-titulo' }, it.titulo),
        h('div', { className: 'ag-item-meta' },
          mostrarDia ? h('span', { className: it.atrasada ? 'ag-atraso' : '' },
            it.atrasada ? 'atrasada desde ' + agDataCurta(it.dia) : agRotuloDia(it.dia, hoje)) : null,
          it.tarefa ? h('span', null, agTipoLabel(it.tipo)) : null,
          it.cliente ? h('button', { className: 'ag-cliente', onClick: () => abrirLead(it.leadId) }, it.cliente) : null,
          selo(it.origem),
          it.por ? h('span', null, 'de ' + it.por) : null,
          mostrarDono && it.dono ? h('span', null, 'para ' + it.dono) : null,
          it.repete ? h('span', null, '↻ ' + it.repete) : null),
        registrando === it.chave ? h('div', { className: 'ag-registro' },
          h('textarea', { value: textoRegistro, autoFocus: true, onChange: e => setTextoRegistro(e.target.value),
            placeholder: 'O que foi conversado? Fica registrado na ficha do cliente.' }),
          h('div', { className: 'ag-registro-botoes' },
            h('button', { className: 'btn btn-ghost', onClick: fecharRegistro }, 'Cancelar'),
            h('button', { className: 'btn btn-primary', disabled: !textoRegistro.trim(), onClick: () => salvarRegistro(it) }, 'Registrar contato'))) : null),
      h('div', { className: 'ag-acoes' },
        it.tarefa && podeEditarTarefa(it.tarefa)
          ? h('button', { className: 'ag-icone', onClick: () => setForm({ nova: false, tarefa: it.tarefa }), 'aria-label': 'Editar tarefa', title: 'Editar' }, h(IconEditar, { size: 15 }))
          : null,
        !it.tarefa && it.leadId
          ? h('button', { className: 'ag-icone', onClick: () => abrirLead(it.leadId), 'aria-label': 'Abrir a ficha do cliente', title: 'Abrir a ficha' }, h(Icon, { size: 15, path: 'M9 18l6-6-6-6' }))
          : null));
  };

  const lista = (itens, vazio, opcoes) => h('div', { className: 'ag-lista' + (opcoes && opcoes.classe ? ' ' + opcoes.classe : '') },
    itens.length ? itens.map(it => linha(it, opcoes)) : h('div', { className: 'ag-vazio' }, vazio),
    opcoes && opcoes.mais ? opcoes.mais : null);

  /* ---------- herói ---------- */
  const nomeQuem = quem === 'todos' ? 'Toda a equipe' : quem === currentUser.id ? 'Minha agenda' : nomeDe(quem);
  const heroi = h('section', { className: 'pn-heroi' },
    h('div', { className: 'pn-heroi-topo ag-heroi-topo' },
      podeAtribuir ? h('div', { className: 'pn-visao' },
        h('button', { className: 'pn-visao-seta', onClick: () => irPara(-1), 'aria-label': 'Agenda anterior' }, '‹'),
        h('label', { className: 'pn-visao-caixa' },
          h('span', null, 'Agenda de'),
          h('select', { value: quem, onChange: e => setQuem(e.target.value) },
            pessoas.map(p => h('option', { key: p.id, value: p.id }, p.id === currentUser.id ? 'Minha agenda (' + p.nome + ')' : p.nome)),
            h('option', { value: 'todos' }, 'Toda a equipe'))),
        h('button', { className: 'pn-visao-seta', onClick: () => irPara(1), 'aria-label': 'Próxima agenda' }, '›')
      ) : h('div', { className: 'pn-visao-fixa' }, h('span', null, 'Agenda de'), h('strong', null, currentUser.nome)),
      h('button', { className: 'ag-novo', onClick: () => novaTarefa(hoje), disabled: semTabela,
        title: semTabela ? 'Falta criar a tabela de tarefas no banco' : '' }, h(IconPlus, { size: 15 }), 'Nova tarefa')),
    h('h2', { className: 'ag-dia-titulo' }, agDataLonga(hoje)),
    h('div', { className: 'pn-pilulas' },
      h('span', { className: 'pn-pilula' }, resumo.abertas
        ? agPlural(resumo.abertas, 'tarefa aberta hoje', 'tarefas abertas hoje')
        : (resumo.total ? 'Tudo feito hoje' : 'Nada marcado para hoje')),
      resumo.feitas ? h('span', { className: 'pn-pilula boa' }, agPlural(resumo.feitas, 'feita', 'feitas')) : null,
      resumo.atrasadas ? h('span', { className: 'pn-pilula ruim' }, agPlural(resumo.atrasadas, 'atrasada', 'atrasadas')) : null,
      resumo.proxima ? h('span', { className: 'pn-pilula alerta' }, 'Próxima às ' + resumo.proxima.hora) : null),
    h('div', { className: 'pn-meta' }, nomeQuem + ' · tarefas criadas na Agenda, próximos contatos, vencimentos e régua de relacionamento'));

  const abas = h('div', { className: 'pn-abas', role: 'tablist', 'aria-label': 'Visão da agenda' },
    [['hoje','Hoje'], ['semana','Semana'], ['mes','Mês']].map(([k, rot]) =>
      h('button', { key: k, role: 'tab', 'aria-selected': visao === k ? 'true' : 'false',
        className: visao === k ? 'ativa' : '', onClick: () => setVisao(k) }, rot)));

  const aviso = semTabela ? h('div', { className: 'ag-aviso', role: 'status' },
    h('strong', null, 'A Agenda ainda não está ligada ao banco. '),
    'Falta rodar o arquivo agenda.sql no SQL Editor do Supabase. Enquanto isso, ela mostra só o que vem das fichas dos clientes: próximo contato, vencimento e régua.') : null;

  /* ---------- Hoje ---------- */
  const legenda = h('div', { className: 'ag-cartao' },
    h('h3', null, 'De onde vem cada item'),
    Object.keys(AG_ORIGENS).map(k => h('div', { key: k, className: 'ag-legenda-item' },
      h('span', { className: 'ag-legenda-cor', style: { background: AG_ORIGENS[k].cor } }),
      h('span', null, h('strong', null, AG_ORIGENS[k].nome), ': ' + AG_ORIGENS[k].desc))),
    h('p', { className: 'ag-nota' }, 'Concluir uma tarefa ligada a um cliente registra a atividade na ficha dele. As reuniões do Outlook entram aqui quando o administrador do Microsoft 365 autorizar o acesso.'));
  const porDia = proximos.reduce((acc, it) => { (acc[it.dia] = acc[it.dia] || []).push(it); return acc; }, {});
  const proximosDias = h('div', { className: 'ag-cartao' },
    h('h3', null, 'Próximos 7 dias'),
    Object.keys(porDia).length ? h('div', { className: 'ag-prox' },
      Object.keys(porDia).sort().map(d => h('div', { key: d, className: 'ag-prox-dia' },
        h('strong', null, agRotuloDia(d, hoje) + (agDiasEntre(hoje, d) > 1 ? '' : ' · ' + agDataCurta(d).split(', ')[1])),
        porDia[d].slice(0, 6).map(it => h('button', { key: it.chave, className: 'ag-prox-linha', style: { '--ag-cor': AG_ORIGENS[it.origem].cor },
          onClick: () => abrirItem(it) },
          it.hora ? h('span', null, it.hora) : null, it.titulo + (it.cliente ? ' · ' + it.cliente : ''))),
        porDia[d].length > 6 ? h('div', { className: 'ag-nota', style: { margin: 0 } }, '+ ' + (porDia[d].length - 6) + ' no dia') : null)))
      : h('p', { className: 'ag-nota', style: { margin: 0 } }, 'Nada marcado para a próxima semana.'));

  const atrasadasVisiveis = todasAtrasadas ? atrasadas : atrasadas.slice(0, AG_ATRASADAS_VISIVEIS);
  const telaHoje = h('div', { className: 'ag-hoje' },
    h('div', { className: 'ag-col' },
      atrasadas.length ? h('div', null,
        h('h3', { className: 'ag-secao-titulo atrasada' }, 'Atrasadas', h('em', null, String(atrasadas.length))),
        lista(atrasadasVisiveis, '', { classe: 'atrasadas', mostrarDia: true,
          mais: atrasadas.length > AG_ATRASADAS_VISIVEIS ? h('button', { className: 'ag-mais', onClick: () => setTodasAtrasadas(v => !v) },
            todasAtrasadas ? 'Mostrar menos' : 'Mostrar as outras ' + (atrasadas.length - AG_ATRASADAS_VISIVEIS)) : null })) : null,
      h('div', null,
        h('h3', { className: 'ag-secao-titulo' }, 'Hoje', h('em', null, itensHoje.length ? String(itensHoje.length) : '')),
        lista(itensHoje, semTabela ? 'Nada vindo das fichas para hoje.' : 'Nada marcado para hoje. Use "Nova tarefa" para planejar o dia.'))),
    h('aside', { className: 'ag-lado' }, proximosDias, legenda));

  /* ---------- Semana ---------- */
  const diasSemana = Array.from({ length: 7 }, (_, i) => agSoma(refSemana, i));
  const tituloSemana = refSemana.slice(8,10) + '/' + refSemana.slice(5,7) + ' a ' + semanaFim.slice(8,10) + '/' + semanaFim.slice(5,7);
  const chip = (it) => h('button', { key: it.chave, className: 'ag-chip' + (it.feita ? ' feita' : '') + (it.atrasada ? ' atrasada' : ''),
    style: { '--ag-cor': AG_ORIGENS[it.origem].cor }, onClick: () => abrirItem(it),
    title: AG_ORIGENS[it.origem].nome + (it.cliente ? ' · ' + it.cliente : '') },
    it.hora ? h('span', { className: 'ag-chip-hora' }, it.hora) : null, it.titulo,
    it.cliente || (mostrarDono && it.dono) ? h('span', { className: 'ag-chip-quem' },

    h('div', { className: 'ag-nav' },
      h('button', { className: 'ag-nav-btn', onClick: () => setRefSemana(agSoma(refSemana, -7)), 'aria-label': 'Semana anterior' }, '‹'),

      h('button', { className: 'ag-nav-btn', onClick: () => setRefSemana(agSoma(refSemana, 7)), 'aria-label': 'Próxima semana' }, '›'),
      refSemana !== agSegunda(hoje) ? h('button', { className: 'ag-nav-btn', onClick: () => setRefSemana(agSegunda(hoje)) }, 'Esta semana') : null),
    h('div', { className: 'ag-semana-rolagem' },
      h('div', { className: 'ag-semana' }, diasSemana.map((d, i) => {
        const doDia = itensSemana.filter(it => it.dia === d);
        return h('div', { key: d, className: 'ag-coluna' + (d === hoje ? ' hoje' : '') + (i >= 5 ? ' fds' : '') },
          h('div', { className: 'ag-coluna-cab' }, AG_DIAS[i] + ' ' + Number(d.slice(8,10))),
          h('div', { className: 'ag-coluna-corpo' },
            doDia.map(chip),
            !semTabela ? h('button', { className: 'ag-chip', style: { '--ag-cor': 'transparent', background: 'none', color: 'var(--ink-faint)' },
              onClick: () => novaTarefa(d < hoje ? hoje : d), 'aria-label': 'Nova tarefa em ' + agDataCurta(d) }, '+ tarefa') : null));
      }))));

  /* ---------- Mês ---------- */
  const diasMes = [];
  for(let d = mesInicio; d <= mesFim; d = agSoma(d, 1)) diasMes.push(d);
  const mesmoMes = (d) => d.slice(0,7) === refMes.slice(0,7);
  const mudarMes = (delta) => {
    const d = agData(refMes);
    const novo = toISODate(new Date(d.getFullYear(), d.getMonth() + delta, 1));
    setRefMes(novo);
    setDiaMes(novo.slice(0,7) === hoje.slice(0,7) ? hoje : novo);
  };
  const itensDiaMes = itensMes.filter(it => it.dia === diaMes);
  const telaMes = h('div', null,
    h('div', { className: 'ag-nav' },
      h('button', { className: 'ag-nav-btn', onClick: () => mudarMes(-1), 'aria-label': 'Mês anterior' }, '‹'),
      h('strong', null, agMesAno(refMes)),
      h('button', { className: 'ag-nav-btn', onClick: () => mudarMes(1), 'aria-label': 'Próximo mês' }, '›'),
      refMes.slice(0,7) !== hoje.slice(0,7) ? h('button', { className: 'ag-nav-btn', onClick: () => { setRefMes(hoje.slice(0,8) + '01'); setDiaMes(hoje); } }, 'Este mês') : null),
    h('div', { className: 'ag-mes' },
      AG_DIAS.map(d => h('div', { key: d, className: 'ag-mes-cab' }, d)),
      diasMes.map(d => {
        const doDia = itensMes.filter(it => it.dia === d);
        return h('button', { key: d, onClick: () => setDiaMes(d),
          className: 'ag-mes-dia' + (mesmoMes(d) ? '' : ' fora') + (d === hoje ? ' hoje' : '') + (d === diaMes ? ' escolhido' : ''),
          'aria-label': agDataCurta(d) + ': ' + agPlural(doDia.length, 'item', 'itens') },
          h('span', { className: 'ag-mes-num' }, Number(d.slice(8,10))),
          doDia.slice(0, 3).map(it => h('span', { key: it.chave, className: 'ag-mes-chip' + (it.feita ? ' feita' : ''),
            style: { '--ag-cor': AG_ORIGENS[it.origem].cor } }, (it.hora ? it.hora + ' ' : '') + it.titulo)),
          doDia.length > 3 ? h('span', { className: 'ag-mes-mais' }, '+ ' + (doDia.length - 3)) : null,
          doDia.length ? h('span', { className: 'ag-mes-conta' }, doDia.length) : null);
      })),
    h('div', { className: 'ag-dia-escolhido' },
      h('h3', { className: 'ag-secao-titulo' }, agDataLonga(diaMes), h('em', null, itensDiaMes.length ? String(itensDiaMes.length) : '')),
      lista(itensDiaMes, 'Nada marcado neste dia.')));

  return h('div', { className: 'pn ag' },
    heroi, abas, aviso,
    visao === 'hoje' ? telaHoje : visao === 'semana' ? telaSemana : telaMes,
    form ? h(AgendaForm, { inicial: form.tarefa, nova: form.nova, users, leads, currentUser, podeAtribuir,
      podeApagar: !form.nova && (podeAtribuir || meu(form.tarefa)),
      onClose: () => setForm(null),
      onSalvar: async (t) => { const ok = await onSalvarTarefa(t, form.nova); if(ok) setForm(null); },
      onApagar: async (t) => { const ok = await onApagarTarefa(t); if(ok) setForm(null); } }) : null);
}

function AgendaForm({ inicial, nova, users, leads, currentUser, podeAtribuir, podeApagar, onClose, onSalvar, onApagar }){
  useEsc(onClose);
  const [t, setT] = useState(() => ({ ...inicial, diasSemana: (inicial.diasSemana && inicial.diasSemana.length)
    ? inicial.diasSemana.slice() : [agDiaSemana(inicial.data || todayISO())] }));
  const [erro, setErro] = useState('');
  const [salvando, setSalvando] = useState(false);
  const [confirmaApagar, setConfirmaApagar] = useState(false);
  const muda = (campo, valor) => { setT(prev => ({ ...prev, [campo]: valor })); setErro(''); };

  /* Cliente: só os da carteira de quem vai fazer a tarefa. Rótulo com a conta
     para distinguir homônimos; a escolha é conferida contra a lista. */
  const rotuloLead = (l) => nomeCliente(l) + (l.conta ? ' · conta ' + l.conta : '');
  const clientes = useMemo(() => ativos(leads)
    .filter(l => !l.perdido && l.responsavelId === t.donoId)
    .sort((a,b) => nomeCliente(a).localeCompare(nomeCliente(b))), [leads, t.donoId]);
  const atual = t.leadId ? leads.find(l => l.id === t.leadId) : null;
  const [textoCliente, setTextoCliente] = useState(atual ? rotuloLead(atual) : '');
  const escolherCliente = (txt) => {
    setTextoCliente(txt);
    const achado = clientes.find(l => rotuloLead(l) === txt) || null;
    muda('leadId', achado ? achado.id : '');
  };
  const pessoas = users.filter(u => u.status === 'ativo').sort((a,b) => (a.nome || '').localeCompare(b.nome || ''));
  const atribuida = !nova && inicial.criadoPor && inicial.criadoPor !== inicial.donoId;

  const salvar = async () => {
    if(!t.titulo.trim()){ setErro('Escreva o que precisa ser feito.'); return; }
    if(!t.data){ setErro('Escolha o dia.'); return; }
    if(t.repeticao === 'semana' && !t.diasSemana.length){ setErro('Marque pelo menos um dia da semana.'); return; }
    if(textoCliente.trim() && !t.leadId){ setErro('Escolha o cliente na lista, ou deixe o campo vazio.'); return; }
    setSalvando(true);
    await onSalvar({ ...t, titulo: t.titulo.trim(), nota: (t.nota || '').trim(),
      diasSemana: t.repeticao === 'semana' ? t.diasSemana.slice().sort((a,b) => a - b) : [] });
    setSalvando(false);
  };

  const opcao = (lista, campo) => h('div', { className: 'ag-opcoes', role: 'radiogroup' },
    lista.map(o => h('button', { key: o.key, type: 'button', role: 'radio', 'aria-checked': t[campo] === o.key ? 'true' : 'false',
      className: 'ag-opcao' + (t[campo] === o.key ? ' on' : ''), onClick: () => muda(campo, o.key) }, o.label)));

  return h('div', { className: 'overlay', onClick: (e) => { if(e.target === e.currentTarget) onClose(); } },
    h('div', { className: 'modal ag-form', role: 'dialog', 'aria-modal': 'true', 'aria-label': nova ? 'Nova tarefa' : 'Editar tarefa' },
      h('div', { className: 'modal-head' }, h('h2', null, nova ? 'Nova tarefa' : 'Editar tarefa'),
        h('button', { className: 'modal-close', onClick: onClose, 'aria-label': 'Fechar' }, h(IconX, { size: 18 }))),
      h('div', { className: 'modal-body' },
        atribuida ? h('p', { className: 'field-hint', style: { marginTop: 0, marginBottom: 14 } },
          'Tarefa atribuída por ' + ((users.find(u => u.id === inicial.criadoPor) || {}).nome || 'outra pessoa') + '.') : null,
        h('div', { className: 'field' },
          h('label', { htmlFor: 'ag-titulo' }, 'O que fazer'),
          h('input', { id: 'ag-titulo', value: t.titulo, maxLength: 200, autoFocus: nova,
            placeholder: 'Ex.: Ligar para apresentar o fundo exclusivo', onChange: e => muda('titulo', e.target.value) })),
        h('div', { className: 'field' }, h('label', null, 'Tipo'), opcao(AG_TIPOS, 'tipo')),
        podeAtribuir ? h('div', { className: 'field' },
          h('label', { htmlFor: 'ag-dono' }, 'Para quem'),
          h('select', { id: 'ag-dono', value: t.donoId, onChange: e => { const v = e.target.value; setTextoCliente(''); setErro(''); setT(prev => ({ ...prev, donoId: v, leadId: '' })); } },
            pessoas.map(p => h('option', { key: p.id, value: p.id }, p.id === currentUser.id ? 'Eu (' + p.nome + ')' : p.nome)))) : null,
        h('div', { className: 'field' },
          h('label', { htmlFor: 'ag-cliente' }, 'Cliente (opcional)'),
          h('input', { id: 'ag-cliente', list: 'ag-clientes', value: textoCliente, placeholder: 'Comece a digitar o nome',
            onChange: e => escolherCliente(e.target.value) }),
          h('datalist', { id: 'ag-clientes' }, clientes.map(l => h('option', { key: l.id, value: rotuloLead(l) }))),
          h('div', { className: 'field-hint' }, 'Ao concluir, a atividade é registrada na ficha deste cliente.')),
        h('div', { className: 'field-row' },
          h('div', { className: 'field' },
            h('label', { htmlFor: 'ag-data' }, t.repeticao === 'nao' ? 'Dia' : 'Começa em'),
            h('input', { id: 'ag-data', type: 'date', value: t.data, onChange: e => muda('data', e.target.value) })),
          h('div', { className: 'field' },
            h('label', { htmlFor: 'ag-hora' }, 'Hora (opcional)'),
            h('input', { id: 'ag-hora', type: 'time', value: t.hora, onChange: e => muda('hora', e.target.value) }))),
        h('div', { className: 'field' }, h('label', null, 'Repetir'), opcao(AG_REPETE, 'repeticao'),
          t.repeticao === 'semana' ? h('div', { className: 'ag-dias', role: 'group', 'aria-label': 'Dias da semana' },
            AG_DIAS.map((d, i) => {
              const n = i + 1, on = t.diasSemana.indexOf(n) !== -1;
              return h('button', { key: d, type: 'button', className: 'ag-dia-chip' + (on ? ' on' : ''), 'aria-pressed': on ? 'true' : 'false',
                onClick: () => muda('diasSemana', on ? t.diasSemana.filter(x => x !== n) : t.diasSemana.concat([n])) }, d);
            })) : null,
          t.repeticao === 'mes' && t.data ? h('div', { className: 'field-hint' }, 'Todo dia ' + Number(t.data.slice(8,10)) + '. Em mês mais curto, cai no último dia.') : null),
        h('div', { className: 'field' },
          h('label', { htmlFor: 'ag-nota' }, 'Observação (opcional)'),
          h('textarea', { id: 'ag-nota', value: t.nota, maxLength: 2000, onChange: e => muda('nota', e.target.value) })),
        h('label', { className: 'ag-check-linha' },
          h('input', { type: 'checkbox', checked: t.emailManha, onChange: e => muda('emailManha', e.target.checked) }),
          h('span', null, 'Incluir no e-mail da manhã', h('br'), h('span', { className: 'field-hint' }, 'O e-mail sai nos dias úteis, por volta das 7h, com as tarefas do dia e as atrasadas.'))),
        erro ? h('div', { className: 'field-error', role: 'alert', style: { marginTop: 12 } }, erro) : null),
      h('div', { className: 'modal-foot' },
        h('div', { style: { display: 'flex', gap: 8 } },
          podeApagar ? (confirmaApagar
            ? h('button', { className: 'btn btn-danger-ghost', onClick: () => onApagar(t) }, h(IconTrash, { size: 13 }), 'Confirmar exclusão')
            : h('button', { className: 'btn btn-danger-ghost', onClick: () => setConfirmaApagar(true) }, h(IconTrash, { size: 13 }), 'Excluir'))
          : null),
        h('div', { style: { display: 'flex', gap: 8 } },
          h('button', { className: 'btn btn-ghost', onClick: onClose }, 'Cancelar'),
          h('button', { className: 'btn btn-primary', onClick: salvar, disabled: salvando }, salvando ? 'Salvando…' : (nova ? 'Criar tarefa' : 'Salvar'))))));
}

/* ================= Painel (aba Dashboard) =================
   O cockpit da carteira: a casa inteira para o admin, a própria carteira para
   o assessor. Cada número abre o que o compõe — casa, assessor, cliente — e o
   cliente abre a ficha. Os números vêm dos MESMOS cálculos do cockpit e dos
   indicadores (computeCockpitStats, computeAssessoriaStats): o painel não tem
   conta própria, então não diverge do resto do CRM.

   Onshore e offshore nunca somam aqui: o patrimônio em reais e o em dólares
   aparecem lado a lado, e a rosca da carteira é só onshore. O NNM segue a
   mesma regra do card "NNM no mês" do cockpit (offshore pela cotação), para os
   dois mostrarem o mesmo número.

   O que só chega com a API do BTG (dinheiro parado, posição por ativo, PJ1)
   aparece desligado e dizendo isso, em vez de sumir: o lugar do número já fica
   marcado no painel. Dinheiro parado vai avisar QUALQUER valor em conta
   (decisão de 05/11/2026). */
const CRM_VERSAO = 'versão do CRM 2026.11.05.7';
const PN_CORES = ['#195AB4','#0F766E','#B08A2E','#7C5CC4','#C2557A','#4A7FC9','#2F7A56','#8A97A8'];
const PN_FILTRO_MES = { periodo:'mes', de:'', ate:'', segmento:[], esteira:[], tipoPessoa:[], situacao:[], grupo:[], temperatura:[] };

function pnStats(leads, users, assessorId, cotacao){
  const vivos = ativos(leads);
  const jornadaTodos = vivos.filter(l => (l.funil || 'assessor') !== 'especialista');
  const nomeDe = (id) => ((users.find(u => u.id === id) || {}).nome) || 'Sem assessor';
  const ids = assessorId ? [assessorId]
    : Array.from(new Set(jornadaTodos.map(l => l.responsavelId || null)));
  const partes = ids.map(id => ({ id, nome: nomeDe(id), s: computeCockpitStats(leads, users, id, cotacao) }));
  const junta = (pegar) => partes.reduce((acc, p) =>
    acc.concat(pegar(p.s).map(x => ({ ...x, assessor: p.nome, assessorId: p.id }))), []);
  const jornada = assessorId ? jornadaTodos.filter(l => l.responsavelId === assessorId) : jornadaTodos;
  const geral = computeAssessoriaStats(jornada, users, PN_FILTRO_MES, cotacao);

  const porDias = (a, b) => (b.diasAtraso === null ? -999 : b.diasAtraso) - (a.diasAtraso === null ? -999 : a.diasAtraso);
  const vencimentos = junta(s => s.vencimentos).sort(porDias);
  const contatosAtrasados = junta(s => s.contatosAtrasados).sort((a, b) => b.diasAtraso - a.diasAtraso);
  const regua = junta(s => s.regua).sort((a, b) => b.diasAtraso - a.diasAtraso);
  const aportes = junta(s => s.aportes).sort((a, b) => b.data.localeCompare(a.data));
  const resgates = junta(s => s.resgates).sort((a, b) => b.data.localeCompare(a.data));
  const semAtivar = junta(s => s.contas.semAtivar);
  const pj2 = junta(s => s.receitaPJ2.negocios);

  /* Carteira: quem já é cliente, com o onshore e o offshore de cada um. */
  const carteira = jornada.filter(l => !l.perdido && naCarteira(l)).map(l => ({
    lead: l, id: l.id, nome: (l.cliente || '').trim() || nomeCliente(l),
    onshore: valorEmCarteira(l), offshore: valorEmCarteiraOffshore(l),
    segmento: l.segmento || '', assessorId: l.responsavelId || null, assessor: nomeDe(l.responsavelId || null),
    conta: l.conta || ''
  }));
  const sobGestao = carteira.filter(c => c.onshore > 0 || c.offshore > 0);
  /* Quem está em captação, para o card "Em captação" abrir a lista: o mesmo
     cálculo do Pipe por temperatura dos KPIs. */
  const capt = computeCaptacaoTemperatura(jornada, users, cotacao);
  const captacoes = capt.captacoes.filter(c => c.valorMoeda > 0).map(c => ({
    leadId: c.id, cliente: c.cliente, assessor: nomeDe(c.responsavelId || null), assessorId: c.responsavelId || null,
    temperatura: c.temperatura, valor: c.valor, valorMoeda: c.valorMoeda, custodia: c.custodia, tipo: c.tipo }));

  return {
    partes, vencimentos, contatosAtrasados, regua, aportes, resgates, semAtivar, pj2, captacoes,
    receitaPJ2: pj2.reduce((s, n) => s + (n.valor || 0), 0),
    abertas: partes.reduce((s, p) => s + p.s.contas.abertas, 0),
    ativadas: partes.reduce((s, p) => s + p.s.contas.ativadas, 0),
    nnm: geral.fluxo, emCaptacao: geral.emCaptacao,
    totalOnshore: carteira.reduce((s, c) => s + c.onshore, 0),
    totalOffshoreUsd: carteira.reduce((s, c) => s + c.offshore, 0),
    carteira, clientes: sobGestao.length,
    comOffshore: sobGestao.filter(c => c.offshore >= OFFSHORE_PISO_USD).length,
    assessores: assessorId ? 1 : partes.filter(p => p.id).length
  };
}

/* Agrupa a carteira para a rosca e a lista que se abre. Só onshore no peso. */
function pnGrupos(carteira, por){
  const chaveDe = por === 'assessor' ? (c => c.assessorId || '—') : (c => c.segmento || '—');
  const nomeDe = por === 'assessor' ? (c => c.assessor) : (c => c.segmento || 'Sem segmento');
  const mapa = new Map();
  carteira.forEach(c => {
    if(!(c.onshore > 0 || c.offshore > 0)) return;
    const k = chaveDe(c);
    if(!mapa.has(k)) mapa.set(k, { key: k, nome: nomeDe(c), clientes: [], onshore: 0, offshore: 0 });
    const g = mapa.get(k);
    g.clientes.push(c); g.onshore += c.onshore; g.offshore += c.offshore;
  });
  let grupos = Array.from(mapa.values());
  if(por === 'segmento'){
    const ordem = SEGMENTOS.map(s => s.key);
    grupos.sort((a, b) => (ordem.indexOf(a.key) < 0 ? 99 : ordem.indexOf(a.key)) - (ordem.indexOf(b.key) < 0 ? 99 : ordem.indexOf(b.key)));
  } else {
    grupos.sort((a, b) => b.onshore - a.onshore);
  }
  grupos.forEach((g, i) => { g.cor = PN_CORES[i % PN_CORES.length]; g.clientes.sort((a, b) => b.onshore - a.onshore || b.offshore - a.offshore); });
  return grupos;
}

const pnPct = (v, total) => total > 0 ? (v / total * 100).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%' : '—';
const pnSinal = (v) => (v >= 0 ? '+' : '−') + fmtBRLCompact(Math.abs(v));
const pnData = (iso) => iso ? new Date(iso + 'T12:00:00').toLocaleDateString('pt-BR') : '—';

function PainelRosca({ grupos, total, rotulo, onEscolher }){
  const R = 70, C = 2 * Math.PI * R;
  const [foco, setFoco] = useState(null);
  let acumulado = 0;
  const fatias = grupos.filter(g => g.onshore > 0).map(g => {
    const frac = total > 0 ? g.onshore / total : 0;
    const el = h('circle', { key: g.key, cx: 90, cy: 90, r: R, fill: 'none', stroke: g.cor, strokeWidth: 22,
      strokeDasharray: Math.max(0, frac * C - 2) + ' ' + C, strokeDashoffset: -acumulado * C,
      transform: 'rotate(-90 90 90)', className: 'pn-fatia' + (onEscolher ? ' clica-drill' : '') + (foco === g.key ? ' ativa' : ''),
      onMouseEnter: () => setFoco(g.key), onMouseLeave: () => setFoco(null),
      onClick: onEscolher ? () => onEscolher(g.key) : undefined },
      h('title', null, g.nome + ': ' + fmtBRLCompact(g.onshore) + ' (' + pnPct(g.onshore, total) + ')'));
    acumulado += frac;
    return el;
  });
  return h('div', { className: 'pn-rosca' },
    h('svg', { viewBox: '0 0 180 180', role: 'img', 'aria-label': 'Distribuição da carteira onshore' },
      h('circle', { cx: 90, cy: 90, r: R, fill: 'none', stroke: 'var(--border)', strokeWidth: 22 }),
      fatias),
    (() => { const gf = foco ? grupos.find(g => g.key === foco) : null;
      return h('div', { className: 'pn-rosca-centro' },
        h('span', null, gf ? gf.nome + ' · ' + pnPct(gf.onshore, total) : rotulo),
        h('strong', null, fmtBRLCompact(gf ? gf.onshore : total))); })()
  );
}

function PainelCard({ label, valor, sub, tom, aberto, onClick, disabled }){
  const clicavel = !!onClick && !disabled;
  return h('div', {
    className: 'pn-card' + (tom ? ' ' + tom : '') + (aberto ? ' aberto' : '') + (disabled ? ' desligado' : '') + (clicavel ? ' clicavel' : ''),
    onClick: clicavel ? onClick : undefined, role: clicavel ? 'button' : undefined, tabIndex: clicavel ? 0 : undefined,
    'aria-expanded': clicavel ? !!aberto : undefined,

  },
    h('div', { className: 'pn-card-label' }, label, clicavel ? h('span', { className: 'pn-card-seta' }, h(IconChevron, { size: 13 })) : null),
    h('div', { className: 'pn-card-num' }, valor),
    sub ? h('div', { className: 'pn-card-sub' }, sub) : null
  );
}

function PainelLista({ itens, vazio, linha }){
  return h('div', { className: 'pn-lista' },
    itens.length ? itens.map(linha) : h('div', { className: 'pn-lista-vazio' }, vazio));

        linha: (r, i) => linhaCliente(r, r.label + ' · ' + r.diasAtraso + 'd', r.leadId + ':' + r.tipo) }) : null

  );

  /* ---------- Carteira ---------- */
  const totalGrupos = grupos.reduce((s, g) => s + g.onshore, 0);

          ) : null);

  const rotina = casa
    ? h(Fragment, null, h('div', { className: 'pn-tabela-wrap' },
        h('table', { className: 'pn-tabela' },
          h('thead', null, h('tr', null, h('th', null, 'Assessor'), h('th', { className: 'n' }, 'Onshore'), h('th', { className: 'n' }, 'NNM no mês'),
            h('th', { className: 'n' }, 'Contato atrasado'), h('th', { className: 'n' }, 'Vencimentos'), h('th', { className: 'n' }, 'Régua'), h('th', null, ''))),
          h('tbody', null, st.partes.filter(p => p.id).map(p => {
            const doAssessor = st.carteira.filter(c => c.assessorId === p.id).reduce((s, c) => s + c.onshore, 0);
            return h('tr', { key: p.id, onClick: () => { setVendorFilter(p.id); setAba('rotina'); setAberto(null); } },
              h('td', null, h('strong', null, p.nome)),
              h('td', { className: 'n' }, fmtBRLCompact(doAssessor)),
              h('td', { className: 'n ' + (p.s.nnm.liquido >= 0 ? 'boa' : 'ruim') }, pnSinal(p.s.nnm.liquido)),
              h('td', { className: 'n' + (p.s.contatosAtrasados.length ? ' ruim' : '') }, p.s.contatosAtrasados.length),

        h('div', { className: 'pn-rodape-nota' }, 'Clique num assessor para abrir o painel e a rotina do dia dele.'))
    : h(Cockpit, { leads, users, currentUser, isAdmin, vendorFilter: assessorId, onOpen, onResolverAlerta, onAddActivity });

  return h('div', { className: 'pn' },
    heroi, abas,
