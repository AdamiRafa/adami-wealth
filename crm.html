/* ================= Indicadores navegáveis =================
   Pedido do Emil (05/11/2026): os KPIs eram uma página fixa, recortada por
   um painel de filtros, e ele quer navegar como no Dashboard — clica, abre.
   Em vez de reescrever cada gráfico (e arriscar um número diferente do que
   já foi conferido), o Navegavel pega as seções que as telas JÁ têm e as
   transforma em cartões: o título e o número de abertura de cada uma ficam
   à vista, e a seção abre embaixo ao clicar. Na impressão tudo sai aberto.

   modo 'marcador': o painel do admin, cujas seções começam num cabeçalho
   .painel-secao; o número do cartão é o primeiro Indicador da seção.
   modo 'blocos': as telas do assessor e do especialista, em que cada bloco
   de primeiro nível é uma seção e o nome vem dos títulos h2 dela. */
function knTexto(el){
  if(el === null || el === undefined || el === false || el === true) return '';
  if(typeof el === 'string' || typeof el === 'number') return String(el);
  if(Array.isArray(el)) return el.map(knTexto).join('');
  if(knClasse(el).indexOf('off-tag') !== -1) return '';
  return el.props ? knTexto(el.props.children) : '';
}
function knAchar(el, teste, max){
  const achados = [];
  const andar = (n) => {
    if(achados.length >= (max || 1) || n === null || n === undefined || typeof n !== 'object') return;
    if(Array.isArray(n)){ n.forEach(andar); return; }
    if(teste(n)) achados.push(n);
    if(n.props) andar(n.props.children);
  };
  andar(el);
  return achados;
}
const knClasse = (el) => (el && el.props && typeof el.props.className === 'string') ? el.props.className : '';

function Navegavel({ modo, juntar, numeros, rodape, children }){
  const [aberto, setAberto] = useState(null);
  const itens = React.Children.toArray(children);
  const fixos = [], grupos = [];
  itens.forEach((el, i) => {
    const c = knClasse(el);
    if(c.indexOf('print-header') !== -1 || c.indexOf('kpi-grid') !== -1 || c.indexOf('kn-fixo') !== -1){ fixos.push(el); return; }
    if(modo === 'marcador'){
      if(c.indexOf('painel-secao') !== -1){
        const spans = React.Children.toArray(el.props.children);
        grupos.push({ key: 'g' + i, titulo: knTexto(spans[0]), desc: knTexto(spans[1]), cabeca: el, corpo: [] });
      } else if(grupos.length){
        grupos[grupos.length - 1].corpo.push(el);
      } else {
        fixos.push(el);
      }
    } else {
      /* Seção que é um componente inteiro não mostra os títulos por fora:
         o nome vem desta tabela. */
      const nomeComp = typeof el.type === 'function' ? ({ CarteiraSecoes:'Carteira em detalhe',
        ProducaoSecoes:'Produção', OffshoreGraficos:'Offshore em gráficos', PipelineOverview:'Funil' })[el.type.name] : null;
      const titulos = nomeComp ? [nomeComp] : knAchar(el, n => n.type === 'h2', 4).map(knTexto).filter(Boolean);
      if(!titulos.length){ fixos.push(el); return; }
      grupos.push({ key: 'g' + i, titulo: titulos[0], desc: titulos.slice(1).join(' · '), cabeca: null, corpo: [el] });
    }
  });
  /* Seções do mesmo assunto viram um cartão só (o resumo de Negócios do topo
     e o detalhe de Negócios lá embaixo, por exemplo). */
  const apelido = juntar || {};
  const porTitulo = new Map(), unidos = [];
  grupos.forEach(g => {
    const t = apelido[g.titulo] || g.titulo;
    if(porTitulo.has(t)){
      const f = porTitulo.get(t);
      if(g.cabeca) f.corpo.push(g.cabeca);
      g.corpo.forEach(x => f.corpo.push(x));
    } else { g.titulo = t; porTitulo.set(t, g); unidos.push(g); }
  });
  grupos.length = 0; unidos.forEach(g => grupos.push(g));
  /* O número de abertura de cada seção: o primeiro Indicador dentro dela,
     a menos que a tela diga qual é o número certo (numeros). */
  grupos.forEach(g => {
    const fixo = numeros && numeros[g.titulo];
    if(fixo){ g.valor = fixo.valor; g.sub = fixo.sub; g.tom = fixo.tom || ''; return; }
    const ind = knAchar(g.corpo, n => n.type === Indicador, 1)[0];
    if(ind){
      const p = ind.props;
      g.valor = typeof p.formato === 'function' ? p.formato(p.valor) : String(p.valor);
      g.sub = (p.rotulo || '') + (p.contexto ? ' · ' + knTexto(p.contexto) : '');
      g.tom = p.tom === 'alerta' ? 'ruim' : p.tom === 'verde' ? 'boa' : p.tom === 'ouro' ? 'ouro' : '';
    }
  });
  return h('div', { className: 'kn' },
    fixos,
    grupos.length ? h('div', { className: 'kn-grade' }, grupos.map(g =>
      g.valor !== undefined
        ? h(PainelCard, { key: g.key, label: g.titulo, valor: g.valor, sub: g.sub || g.desc, tom: g.tom,
            aberto: aberto === g.key, onClick: () => setAberto(a => a === g.key ? null : g.key) })
        : h('div', { key: g.key, role: 'button', tabIndex: 0, 'aria-expanded': aberto === g.key,
            className: 'pn-card clicavel kn-card' + (aberto === g.key ? ' aberto' : ''),
            onClick: () => setAberto(a => a === g.key ? null : g.key),
            onKeyDown: (e) => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); setAberto(a => a === g.key ? null : g.key); } } },
            h('div', { className: 'pn-card-label' }, 'Ver seção', h('span', { className: 'pn-card-seta' }, h(IconChevron, { size: 13 }))),
            h('div', { className: 'kn-card-titulo' }, g.titulo),
            g.desc ? h('div', { className: 'pn-card-sub' }, g.desc) : null)
    )) : null,
    grupos.map(g => h('div', { key: g.key + 'c', className: 'kn-corpo' + (aberto === g.key ? ' aberto' : '') },
      g.cabeca, g.corpo)),
    rodape || null
  );
}

/* Topo dos indicadores: o período vira pílula, à vista; o resto dos recortes
   (assessor, produto, especialista, temperatura) fica atrás de "Mais filtros",
   em vez de ocupar uma coluna fixa da tela. */
function KpiTopo({ escopo, filtros, onFiltros, detalhe, assessores, children }){
  const [mais, setMais] = useState(false);
  const extras = (filtros.assessor && filtros.assessor !== 'all') || (filtros.produtos && filtros.produtos.length)
    || (filtros.especialista && filtros.especialista !== 'all') || (filtros.temperatura && filtros.temperatura.length);
  return h(Fragment, null,
    h('section', { className: 'pn-heroi kn-heroi' },
      h('div', { className: 'pn-rotulo' }, 'Indicadores'),
      /* Filtro por assessor à vista (pedido do Emil, 05/11/2026): o head
         comercial abre a reunião individual já no recorte do assessor. */
      assessores && assessores.length ? (() => {
        const ids = ['all'].concat(assessores.map(u => u.id));
        const atual = filtros.assessor || 'all';
        const ir = (delta) => { const i = ids.indexOf(atual); onFiltros({ ...filtros, assessor: ids[(i + delta + ids.length) % ids.length] }); };
        return h('div', { className: 'pn-visao kn-visao' },
          h('button', { className: 'pn-visao-seta', onClick: () => ir(-1), 'aria-label': 'Assessor anterior' }, '‹'),
          h('label', { className: 'pn-visao-caixa' },
            h('span', null, 'Assessor'),
            h('select', { value: atual, onChange: e => onFiltros({ ...filtros, assessor: e.target.value }) },
              h('option', { value: 'all' }, 'Toda a casa'),
              assessores.map(u => h('option', { key: u.id, value: u.id }, u.nome)))),
          h('button', { className: 'pn-visao-seta', onClick: () => ir(1), 'aria-label': 'Próximo assessor' }, '›'));
      })() : h('div', { className: 'pn-ola' }, escopo),
      h('div', { className: 'kn-periodos', role: 'group', 'aria-label': 'Período' },
        PERIODOS.map(p => h('button', { key: p.valor, type: 'button', className: filtros.periodo === p.valor ? 'ativo' : '',
          onClick: () => onFiltros({ ...filtros, periodo: p.valor }) }, p.label)),
        h('button', { type: 'button', className: 'kn-mais' + (mais || extras ? ' ligado' : ''), onClick: () => setMais(v => !v) },
          mais ? 'Fechar filtros' : (extras ? 'Filtros ativos' : 'Mais filtros'))),
      filtros.periodo === 'custom' ? h('div', { className: 'kn-datas' },
        h('input', { type: 'date', value: filtros.de || '', 'aria-label': 'Data inicial', onChange: e => onFiltros({ ...filtros, de: e.target.value }) }),
        h('span', null, 'até'),
        h('input', { type: 'date', value: filtros.ate || '', 'aria-label': 'Data final', onChange: e => onFiltros({ ...filtros, ate: e.target.value }) })) : null,
      detalhe ? h('div', { className: 'pn-meta' }, detalhe) : null),
    mais ? h('div', { className: 'kn-filtros' }, children) : null
  );
}

/* ================= Listas que se abrem em níveis, com Excel =================
   Pedido do Emil (05/11/2026): "clico em quente e baixa a lista primeiro dos
   assessores e depois por cliente", e poder baixar cada lista em Excel.
   A Arvore recebe as linhas (clientes ou negócios) e os níveis de
   agrupamento; cada nível soma as métricas do que está embaixo, e o último
   nível são os próprios clientes, que abrem a ficha. O Excel sai com TODAS
   as linhas da lista, uma por cliente, com as colunas de cada nível. */
let xlsxCarregando = null;
function carregarXlsx(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(!xlsxCarregando){
    xlsxCarregando = new Promise((ok, falha) => {
      const s = document.createElement('script');
      s.src = 'vendor/xlsx-0.18.5.full.min.js';
      s.onload = () => window.XLSX ? ok(window.XLSX) : falha(new Error('Biblioteca do Excel não carregou.'));
      s.onerror = () => { xlsxCarregando = null; falha(new Error('Biblioteca do Excel não carregou.')); };
      document.head.appendChild(s);
    });
  }
  return xlsxCarregando;
}
function baixarExcel(nomeArquivo, colunas, linhas){
  return carregarXlsx().then(X => {
    const dados = linhas.map(l => { const o = {}; colunas.forEach(c => { o[c.titulo] = c.valor(l); }); return o; });
    const ws = X.utils.json_to_sheet(dados, { header: colunas.map(c => c.titulo) });
    ws['!cols'] = colunas.map(c => ({ wch: Math.max(12, Math.min(40, c.titulo.length + 4)) }));
    const wb = X.utils.book_new();
    X.utils.book_append_sheet(wb, ws, 'Lista');
    X.writeFile(wb, nomeArquivo.replace(/[\\/:*?"<>|]/g, '-') + ' ' + todayISO() + '.xlsx');
  });
}

function BotaoExcel({ nome, colunas, linhas }){
  const [estado, setEstado] = useState('');
  return h('button', { type: 'button', className: 'arv-excel', disabled: !linhas.length || estado === 'gerando',
    title: 'Baixa esta lista em Excel, um cliente por linha',
    onClick: (e) => { e.stopPropagation(); setEstado('gerando');
      baixarExcel(nome, colunas, linhas).then(() => setEstado(''), (err) => { console.error(err); setEstado('erro'); }); } },
    h(IconDownload, { size: 13 }), estado === 'gerando' ? 'Gerando…' : estado === 'erro' ? 'Falhou, tente de novo' : 'Baixar Excel');
}

/* niveis: [{ chave(l), nome(chave, l), cor?(chave, i), ordem?: 'valor'|'nome'|[chaves] }]
   metricas: [{ titulo, soma(lista) -> número, formatar(n) }] — a primeira é a principal.
   folha: { nome(l), meta(l), abrir(l) } */
function Arvore({ titulo, desc, linhas, niveis, metricas, folha, colunasExcel, nomeExcel, vazio, abertoInicial, extra }){
  const [abertos, setAbertos] = useState(() => new Set(abertoInicial ? [abertoInicial] : []));
  const alternar = (k) => setAbertos(prev => { const n = new Set(prev); if(n.has(k)) n.delete(k); else n.add(k); return n; });
  const principal = metricas[0];
  const totalGeral = principal.soma(linhas);

  const agrupar = (lista, i) => {
    const nv = niveis[i];
    const mapa = new Map();
    lista.forEach(l => { const k = nv.chave(l); if(!mapa.has(k)) mapa.set(k, []); mapa.get(k).push(l); });
    let grupos = Array.from(mapa.entries()).map(([k, itens]) => ({ k, itens, nome: nv.nome(k, itens[0]), v: principal.soma(itens) }));
    if(Array.isArray(nv.ordem)) grupos.sort((a, b) => (nv.ordem.indexOf(a.k) < 0 ? 99 : nv.ordem.indexOf(a.k)) - (nv.ordem.indexOf(b.k) < 0 ? 99 : nv.ordem.indexOf(b.k)));
    else if(nv.ordem === 'nome') grupos.sort((a, b) => String(a.nome).localeCompare(String(b.nome)));
    else grupos.sort((a, b) => b.v - a.v);
    return grupos;
  };
  const celulas = (itens) => metricas.map((m, j) => h('span', { key: j, className: 'arv-num m' + j + (j === 0 ? ' forte' : '') }, m.formatar(m.soma(itens))));

  const render = (lista, i, caminho, totalPai) => {
    if(i >= niveis.length){
      const ord = lista.slice().sort((a, b) => principal.soma([b]) - principal.soma([a]));
      return ord.map((l, j) => h('button', { key: caminho + '#' + j, className: 'arv-linha arv-folha', style: { paddingLeft: 16 + i * 22 },
        onClick: () => folha.abrir && folha.abrir(l) },
        h('span', { className: 'arv-nome' }, h('strong', null, folha.nome(l)), folha.meta ? h('small', null, folha.meta(l)) : null),
        celulas([l]), h('span', { className: 'arv-seta' }, '›')));
    }
    return agrupar(lista, i).map((g, gi) => {
      const k = caminho + '/' + g.k;
      const ab = abertos.has(k);
      const cor = niveis[i].cor ? niveis[i].cor(g.k, gi) : null;
      const pct = totalPai > 0 ? (g.v / totalPai) : 0;
      return h(Fragment, { key: k },
        h('button', { className: 'arv-linha arv-grupo nivel-' + i + (ab ? ' aberto' : ''), style: { paddingLeft: 16 + i * 22 }, 'aria-expanded': ab, onClick: () => alternar(k) },
          h('span', { className: 'arv-seta-grupo' }, h(IconChevron, { size: 14 })),
          cor ? h('i', { className: 'arv-cor', style: { background: cor } }) : null,
          h('span', { className: 'arv-nome' }, h('strong', null, g.nome),
            h('small', null, g.itens.length + (g.itens.length === 1 ? ' cliente' : ' clientes') + (totalPai > 0 ? ' · ' + pnPct(g.v, totalPai) : ''))),
          i === 0 && totalPai > 0 ? h('span', { className: 'arv-barra' }, h('b', { style: { width: Math.max(2, pct * 100) + '%', background: cor || 'var(--primary)' } })) : null,
          celulas(g.itens), h('span', { className: 'arv-seta' })),
        ab ? render(g.itens, i + 1, k, g.v) : null);
    });
  };

  return h('div', { className: 'arv' },
    h('div', { className: 'arv-topo' },
      h('div', null, h('div', { className: 'arv-titulo' }, titulo), desc ? h('div', { className: 'arv-desc' }, desc) : null),
      colunasExcel ? h(BotaoExcel, { nome: nomeExcel || titulo, colunas: colunasExcel, linhas }) : null),
    extra || null,
    linhas.length ? h(Fragment, null,
      h('div', { className: 'arv-cab' }, h('span', { className: 'arv-nome' }, 'Clique para abrir'), metricas.map((m, j) => h('span', { key: j, className: 'arv-num m' + j }, m.titulo)), h('span', { className: 'arv-seta' })),
      render(linhas, 0, '', totalGeral))
      : h('div', { className: 'arv-vazio' }, vazio || 'Nada para mostrar neste recorte.'));
}

/* Panorama fixo dos KPIs: o que fica sempre à vista, abaixo dos cartões.
   Carteira por segmento, Pipe por temperatura e o ranking de assessores —
   cada um abre em assessor e depois em cliente, e baixa em Excel. */
function KpiPanorama({ jornada, users, admin, onOpen }){
  const cotacao = useCotacao();
  const drillCtx = useDrill();
  const nomeDe = (id) => ((users.find(u => u.id === id) || {}).nome) || 'Sem assessor';
  const dados = useMemo(() => {
    const vivos = jornada.filter(l => !l.excluido && !l.perdido && (l.funil || 'assessor') !== 'especialista');
    const clientes = vivos.map(l => ({ lead: l, cliente: (l.cliente || '').trim() || nomeCliente(l), conta: l.conta || '',
      segmento: l.segmento || '', assessorId: l.responsavelId || '—', assessor: nomeDe(l.responsavelId),
      onshore: valorEmCarteira(l), offshore: valorEmCarteiraOffshore(l), pipe: valorEmCaptacao(l, cotacao),
      pipeMoeda: valorCaptacaoNaMoeda(l), custodiaPipe: captaNova(l) ? custodiaCaptacao(l) : 'onshore',
      temperatura: temperaturaInfo(l.temperatura) ? l.temperatura : 'sem', tipo: captaNova(l) ? 'carteira' : 'novo' }));
    return { clientes,
      carteira: clientes.filter(c => c.onshore > 0 || c.offshore > 0),
      pipe: clientes.filter(c => c.pipeMoeda > 0) };
  }, [jornada, users, cotacao]);

  const soma = (campo) => (lista) => lista.reduce((s, c) => s + (c[campo] || 0), 0);
  const nivelAssessor = { chave: c => c.assessorId, nome: (k, c) => c.assessor };
  const nivelSegmento = { chave: c => c.segmento || '—', nome: k => k === '—' ? 'Sem segmento' : k,
    cor: k => CORES_SEGMENTO[k] || '#95A1B0', ordem: SEGMENTOS.map(s => s.key).concat(['—']) };
  const TEMPS = TEMPERATURAS.map(t => t.key).concat(['sem']);
  const nivelTemp = { chave: c => c.temperatura, nome: k => temperaturaInfo(k) ? temperaturaInfo(k).label : 'Sem classificação',
    cor: k => temperaturaInfo(k) ? temperaturaInfo(k).cor : '#C9D1DC', ordem: TEMPS };
  const folha = { nome: c => c.cliente, abrir: c => onOpen(c.lead),
    meta: c => [c.conta ? 'conta ' + c.conta : null, admin ? c.assessor : null, c.segmento || null].filter(Boolean).join(' · ') };
  const colunasBase = [
    { titulo: 'Cliente', valor: c => c.cliente }, { titulo: 'Conta', valor: c => c.conta },
    { titulo: 'Assessor', valor: c => c.assessor }, { titulo: 'Segmento', valor: c => c.segmento },
    { titulo: 'Sob gestão onshore (R$)', valor: c => Math.round(c.onshore * 100) / 100 },

            return SEGMENTOS.map(s => s.key).concat(['—']).filter(k => m.has(k)).map(k => ({ key: k, nome: k, onshore: m.get(k), cor: CORES_SEGMENTO[k] || '#95A1B0' })); })(),
          total: soma('onshore')(dados.carteira), rotulo: 'onshore', onEscolher: drillCtx ? (k) => drillCtx.abrir(k === '—' ? DR.todos('Sem segmento', 'onshore', l => !l.segmento && (valorEmCarteira(l) > 0 || valorEmCarteiraOffshore(l) > 0)) : DR.seg(k)) : null }), titulo: 'Carteira por segmento', desc: 'segmento → ' + (admin ? 'assessor → ' : '') + 'cliente · onshore em reais, offshore à parte',
          linhas: dados.carteira, niveis: admin ? [nivelSegmento, nivelAssessor] : [nivelSegmento],
          metricas: [{ titulo: 'Onshore', soma: soma('onshore'), formatar: fmtBRLCompact },

          folha, colunasExcel: colunasBase, nomeExcel: 'Carteira por segmento' })),
      h('div', { className: 'kp-caixa' },

          linhas: dados.pipe, niveis: admin ? [nivelTemp, nivelAssessor] : [nivelTemp], abertoInicial: '/quente',
          metricas: [{ titulo: 'Pipe', soma: soma('pipe'), formatar: fmtBRLCompact }, contar],
          folha: { ...folha, meta: c => [c.tipo === 'novo' ? 'cliente novo' : 'carteira', admin ? c.assessor : null,
            c.custodiaPipe === 'offshore' ? fmtUSDCompact(c.pipeMoeda) + ' offshore' : null].filter(Boolean).join(' · ') },
          colunasExcel: colunasBase, nomeExcel: 'Pipe por temperatura', vazio: 'Nada em captação neste recorte.' }))),
    admin ? h('div', { className: 'kp-caixa' },
      h(Arvore, { titulo: 'Ranking de assessores', desc: 'assessor → cliente · clique para abrir a carteira de cada um',
        linhas: dados.clientes.filter(c => c.onshore > 0 || c.offshore > 0 || c.pipeMoeda > 0), niveis: [nivelAssessor],
        metricas: [{ titulo: 'Onshore', soma: soma('onshore'), formatar: fmtBRLCompact },
          { titulo: 'Offshore', soma: soma('offshore'), formatar: n => n > 0 ? fmtUSDCompact(n) : '—' },
          { titulo: 'Pipe', soma: soma('pipe'), formatar: n => n > 0 ? fmtBRLCompact(n) : '—' },
          { titulo: 'Quente', soma: l => l.filter(c => c.temperatura === 'quente').reduce((s, c) => s + c.pipe, 0), formatar: n => n > 0 ? fmtBRLCompact(n) : '—' },
          contar],
        folha, colunasExcel: colunasBase, nomeExcel: 'Ranking de assessores' })) : null
  );
}

/* ================= Detalhe ao clicar em qualquer gráfico =================
   Pedido do Emil (05/11/2026): TODO gráfico e tabela dos KPIs interativo —
   passar o mouse mostra o número, clicar abre a lista. Em vez de montar uma
   lista diferente embaixo de cada gráfico, cada fatia, barra, linha ou número
   carrega uma "receita" (drill: título, o que medir e quem entra), e um painel
   lateral único mostra assessor → cliente (ou responsável → negócio), com
   Excel. Ele usa o MESMO recorte da tela (filtros de período, assessor,
   produto), recebido do App. */
const DrillCtx = createContext(null);
const useDrill = () => useContext(DrillCtx);
const tempChave = (l) => temperaturaInfo(l.temperatura) ? l.temperatura : 'sem';
const DR = {
  todos: (titulo, medida, filtro) => ({ titulo, medida: medida || 'onshore', filtro: filtro || (() => true) }),
  seg: (k) => ({ titulo: 'Segmento ' + k, medida: 'onshore', filtro: l => (l.segmento || '') === k && (valorEmCarteira(l) > 0 || valorEmCarteiraOffshore(l) > 0) }),
  ass: (id, nome) => ({ titulo: 'Carteira de ' + (nome || 'assessor'), medida: 'onshore', filtro: l => l.responsavelId === id && (valorEmCarteira(l) > 0 || valorEmCarteiraOffshore(l) > 0) }),
  temp: (k) => ({ titulo: 'Pipe · ' + (temperaturaInfo(k) ? temperaturaInfo(k).label : 'Sem classificação'), medida: 'pipe',
    filtro: l => valorCaptacaoNaMoeda(l) > 0 && tempChave(l) === k }),
  pipe: () => ({ titulo: 'Pipe da jornada', medida: 'pipe', filtro: l => valorCaptacaoNaMoeda(l) > 0 }),
  assPipe: (id, nome) => ({ titulo: 'Pipe de ' + (nome || 'assessor'), medida: 'pipe', filtro: l => valorCaptacaoNaMoeda(l) > 0 && l.responsavelId === id }),
  cli: (id, nome, medida) => ({ titulo: nome || 'Cliente', medida: medida || 'onshore', filtro: l => l.id === id }),
  etapa: (k) => ({ titulo: 'Etapa ' + etapaCurta(k), medida: 'onshore', filtro: l => l.etapa === k && !l.perdido }),
  origem: (k) => ({ titulo: 'Origem: ' + k, medida: 'onshore', filtro: l => l.origem === k && !l.perdido }),
  off: () => ({ titulo: 'Clientes com offshore', medida: 'offshore', filtro: l => valorEmCarteiraOffshore(l) > 0 }),
  offAss: (id, nome) => ({ titulo: 'Offshore de ' + (nome || 'assessor'), medida: 'offshore', filtro: l => l.responsavelId === id && valorEmCarteiraOffshore(l) > 0 }),
  offSeg: (k) => ({ titulo: 'Offshore · ' + k, medida: 'offshore', filtro: l => (l.segmento || '') === k && valorEmCarteiraOffshore(l) > 0 }),
  produto: (p) => ({ titulo: 'Negócios de ' + p, tipo: 'negocio', filtro: l => l.produto === p }),
  negocios: (titulo, filtro) => ({ titulo, tipo: 'negocio', filtro }),
  espec: (id, nome, produto) => ({ titulo: 'Negócios de ' + (nome || 'especialista') + (produto ? ' · ' + produto : ''), tipo: 'negocio',
    filtro: l => l.responsavelId === id && (!produto || l.produto === produto) }),
  indicou: (id, nome, soFechados) => ({ titulo: (soFechados ? 'Fechados' : 'Indicados') + ' por ' + (nome || 'assessor'), tipo: 'negocio',
    filtro: (l, aux) => { const o = aux.porId.get(l.origemLeadId); return !!o && o.responsavelId === id && (!soFechados || !!l.ganho); } }),
  funil: (etapa) => ({ titulo: 'Funil · ' + (etapa === 'Fechado (venda)' ? etapa : etapaCurta(etapa)), tipo: 'negocio',
    filtro: l => etapa === 'Fechado (venda)' ? !!l.ganho : l.etapa === etapa }),
  mesNeg: (m, campo) => ({ titulo: (campo === 'ganhos' ? 'Ganhos' : campo === 'perdidos' ? 'Perdidos' : 'Criados') + ' em ' + m.label, tipo: 'negocio',
    filtro: l => campo === 'ganhos' ? (!!l.ganhoEm && monthKey(l.ganhoEm) === m.key)
      : campo === 'perdidos' ? (!!l.perdidoEm && monthKey(l.perdidoEm) === m.key) : monthKey(l.criadoEm) === m.key })
};

function DrillProvider({ jornada, negocios, todos, users, onOpen, children }){
  const [spec, setSpec] = useState(null);
  const valor = useMemo(() => ({ abrir: setSpec }), []);
  return h(DrillCtx.Provider, { value: valor }, children,
    spec ? h(DrillPainel, { spec, jornada, negocios, todos, users, onOpen, onClose: () => setSpec(null) }) : null);
}

/* Clientes no formato das listas (o mesmo do panorama). */
function clientesKpi(leads, users, cotacao){
  const nomeDe = (id) => ((users.find(u => u.id === id) || {}).nome) || 'Sem assessor';
  return leads.map(l => ({ lead: l, cliente: (l.cliente || '').trim() || nomeCliente(l), conta: l.conta || '',
    segmento: l.segmento || '', assessorId: l.responsavelId || '—', assessor: nomeDe(l.responsavelId),
    onshore: valorEmCarteira(l), offshore: valorEmCarteiraOffshore(l), pipe: valorEmCaptacao(l, cotacao),
    pipeMoeda: valorCaptacaoNaMoeda(l), custodiaPipe: captaNova(l) ? custodiaCaptacao(l) : 'onshore',
    temperatura: tempChave(l), tipo: captaNova(l) ? 'carteira' : 'novo' }));
}

function DrillPainel({ spec, jornada, negocios, todos, users, onOpen, onClose }){
  useEsc(onClose);
  const cotacao = useCotacao();
  const nomeDe = (id) => ((users.find(u => u.id === id) || {}).nome) || 'Sem responsável';
  const aux = useMemo(() => ({ porId: new Map((todos || []).map(l => [l.id, l])) }), [todos]);
  const soma = (campo) => (lista) => lista.reduce((s, c) => s + (c[campo] || 0), 0);
  const contar = { titulo: 'Qtd.', soma: l => l.length, formatar: n => String(n) };
  const abrir = (l) => { onClose(); onOpen(l); };
  let arvore;
  if(spec.tipo === 'negocio'){
    const linhas = (negocios || []).filter(l => spec.filtro(l, aux)).map(l => ({ lead: l, cliente: nomeCliente(l),
      produto: l.produto || '', assessorId: l.responsavelId || '—', assessor: nomeDe(l.responsavelId),
      status: l.ganho ? 'Fechado' : l.perdido ? 'Perdido' : 'Em aberto',
      valor: parseValor(l.valorFechado) || parseValor(l.valorPotencial) || 0 }));
    arvore = h(Arvore, { titulo: 'Negócios', desc: 'situação → responsável → negócio', linhas,
      niveis: [{ chave: c => c.status, nome: k => k, ordem: ['Fechado', 'Em aberto', 'Perdido'],
        cor: k => k === 'Fechado' ? 'var(--success)' : k === 'Perdido' ? 'var(--danger)' : 'var(--gold)' },
        { chave: c => c.assessorId, nome: (k, c) => c.assessor }],
      metricas: [{ titulo: 'Valor', soma: soma('valor'), formatar: fmtBRLCompact }, contar],
      folha: { nome: c => c.cliente, meta: c => [c.produto, c.assessor].filter(Boolean).join(' · '), abrir: c => abrir(c.lead) },
      colunasExcel: [{ titulo: 'Cliente', valor: c => c.cliente }, { titulo: 'Produto', valor: c => c.produto },
        { titulo: 'Responsável', valor: c => c.assessor }, { titulo: 'Situação', valor: c => c.status },
        { titulo: 'Valor (R$)', valor: c => Math.round(c.valor * 100) / 100 }],
      nomeExcel: spec.titulo, abertoInicial: '/Fechado', vazio: 'Nenhum negócio neste recorte.' });
  } else {
    const linhas = clientesKpi((jornada || []).filter(l => !l.excluido && spec.filtro(l, aux)), users, cotacao);
    const med = spec.medida || 'onshore';
    const metricas = med === 'pipe'
      ? [{ titulo: 'Pipe', soma: soma('pipe'), formatar: fmtBRLCompact }, contar]
      : med === 'offshore'
        ? [{ titulo: 'Offshore', soma: soma('offshore'), formatar: fmtUSDCompact }, { titulo: 'Onshore', soma: soma('onshore'), formatar: fmtBRLCompact }, contar]
        : [{ titulo: 'Onshore', soma: soma('onshore'), formatar: fmtBRLCompact }, { titulo: 'Offshore', soma: soma('offshore'), formatar: n => n > 0 ? fmtUSDCompact(n) : '—' }, contar];
    arvore = h(Arvore, { titulo: 'Clientes', desc: 'assessor → cliente · clique no cliente para abrir a ficha', linhas,
      niveis: [{ chave: c => c.assessorId, nome: (k, c) => c.assessor }],
      metricas, abertoInicial: linhas.length && new Set(linhas.map(c => c.assessorId)).size === 1 ? '/' + linhas[0].assessorId : null,
      folha: { nome: c => c.cliente, abrir: c => abrir(c.lead),
        meta: c => [c.conta ? 'conta ' + c.conta : null, c.segmento || null,
          med === 'pipe' ? ((temperaturaInfo(c.temperatura) ? temperaturaInfo(c.temperatura).label : 'sem temperatura') + (c.custodiaPipe === 'offshore' ? ' · ' + fmtUSDCompact(c.pipeMoeda) : '')) : null].filter(Boolean).join(' · ') },
      colunasExcel: [{ titulo: 'Cliente', valor: c => c.cliente }, { titulo: 'Conta', valor: c => c.conta },
        { titulo: 'Assessor', valor: c => c.assessor }, { titulo: 'Segmento', valor: c => c.segmento },
        { titulo: 'Sob gestão onshore (R$)', valor: c => Math.round(c.onshore * 100) / 100 },
        { titulo: 'Sob gestão offshore (US$)', valor: c => Math.round(c.offshore * 100) / 100 },
        { titulo: 'Pipe (moeda da negociação)', valor: c => Math.round(c.pipeMoeda * 100) / 100 },
        { titulo: 'Moeda do pipe', valor: c => c.pipeMoeda > 0 ? (c.custodiaPipe === 'offshore' ? 'US$' : 'R$') : '' },
        { titulo: 'Temperatura', valor: c => temperaturaInfo(c.temperatura) ? temperaturaInfo(c.temperatura).label : '' }],
      nomeExcel: spec.titulo, vazio: 'Nenhum cliente neste recorte.' });
  }
  return h('div', { className: 'drill-fundo', onClick: (e) => { if(e.target === e.currentTarget) onClose(); } },
    h('aside', { className: 'drill-painel', role: 'dialog', 'aria-label': spec.titulo },
      h('div', { className: 'drill-cab' },
        h('div', null, h('div', { className: 'pn-rotulo-escuro' }, 'Detalhe'), h('h2', null, spec.titulo)),
        h('button', { className: 'modal-close', onClick: onClose, 'aria-label': 'Fechar' }, h(IconX, { size: 18 }))),
      h('div', { className: 'drill-corpo' }, arvore)));
}
