<style>
:root{
  --navy:#1B3A5F; --navy-d:#132B47; --ink:#16324F; --ink-2:#3C4C60; --muted:#7A8698;
  --paper:#EDF0F4; --surface:#FFFFFF; --line:#DCE2EA; --line-2:#EDF1F5;
  --gold:#C0A265; --gold-2:#D9C79B; --blue-2:#3D6D9E; --blue-3:#7FA0C4; --blue-4:#A9C0D8;
  --green:#0A7344; --alert:#A03A2B;
  --display:"Iowan Old Style",Constantia,Cambria,"Palatino Linotype",Georgia,serif;
  --body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono",Consolas,"SF Mono",Menlo,"Courier New",monospace;
  --rail:280px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--body);color:var(--ink);background:var(--paper);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-print-color-adjust:exact;print-color-adjust:exact}
button{font-family:inherit;font-size:13px;cursor:pointer}
h1,h2,h3{margin:0;font-weight:600}
table{border-collapse:collapse;width:100%}
input,select,textarea{font-family:inherit;font-size:13px}

/* ---------- rail ---------- */
.rail{position:fixed;top:0;left:0;bottom:0;width:var(--rail);background:var(--navy-d);color:#C7D3E0;padding:22px 18px;overflow-y:auto}
.rail-brand{font-family:var(--display);font-size:19px;color:#fff;line-height:1.2}
.rail-brand img{width:150px;max-width:100%;height:auto;display:block;margin-bottom:2px}
.rail-brand span{display:block;font-family:var(--body);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue-3);margin-top:7px}
.rail-block{margin-top:24px}
.rail-label{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:#7A8DA3;margin-bottom:9px}
.rail select{width:100%;background:#16283C;color:#EAF1EF;border:1px solid #27394F;border-radius:3px;padding:8px 9px}
.cli-list{margin:0;padding:0;list-style:none}
.cli-list li{padding:9px 10px;border-radius:3px;cursor:pointer;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.cli-list li.grp{padding:12px 4px 5px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#7A8DA3;cursor:default;display:block}
.cli-list li.grp:hover{background:transparent}
.cli-list li:hover{background:#1B2E44}
.cli-list li.on{background:var(--navy);color:#fff}
.cli-list li b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cli-list li i{font-style:normal;font-size:11px;color:#8AA8C6;font-family:var(--mono)}
.rail button{width:100%;background:#1B2E44;color:#DCE7F1;border:1px solid #2B3F57;border-radius:3px;padding:9px;margin-top:8px}
.rail button:hover{background:#22374F}
.rail .mini{font-size:11.5px;color:#7A8DA3;margin-top:14px;line-height:1.5}
.sync{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#8AA8C6;margin-top:16px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.dot.err{background:var(--alert)} .dot.wait{background:var(--gold)}

/* ---------- login ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:1.08fr .92fr}
.auth-side{position:relative;background:var(--navy);color:#fff;padding:46px 54px;display:flex;flex-direction:column;overflow:hidden}
.auth-side:before{content:"";position:absolute;inset:0;
  background:radial-gradient(120% 90% at 12% 88%,rgba(61,109,158,.28) 0%,transparent 62%);
  pointer-events:none}
.auth-side>*{position:relative}
.auth-side img{height:36px;width:auto;align-self:flex-start;flex:none}
.auth-say{margin-top:auto;max-width:none}
.auth-say .rule{width:54px;height:2px;background:var(--gold);margin-bottom:22px}
.auth-say h2{font-family:var(--display);font-size:32px;font-weight:500;line-height:1.26;letter-spacing:.005em;max-width:11em}
.auth-say p{color:#A9C0D8;font-size:13.5px;line-height:1.65;margin:16px 0 0;max-width:24em}
.auth-meta{margin-top:auto;padding-top:44px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.2em;text-transform:uppercase;color:#6E88A4;display:flex;gap:20px;flex-wrap:wrap}
.auth-copy{margin-top:14px;font-size:11px;color:#5E7690;letter-spacing:.01em}
.auth-form{display:flex;align-items:center;justify-content:center;padding:40px 34px;background:#F7F9FB}
.auth-card{width:100%;max-width:344px;animation:sobe .5s ease both}
@keyframes sobe{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.auth-card .rule{width:34px;height:2px;background:var(--gold);margin-bottom:20px}
.auth-card h1{font-family:var(--display);font-size:23px;font-weight:600;color:var(--navy);letter-spacing:.01em;line-height:1.25}
.auth-card .hint{font-size:13px;color:var(--muted);margin:7px 0 28px}
.auth-card label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);margin:0 0 7px}
.auth-card input{width:100%;border:1px solid var(--line);border-radius:2px;padding:12px 13px;
  font-size:14px;background:#fff;color:var(--ink);transition:border-color .12s,box-shadow .12s}
.auth-card input::placeholder{color:#B4BECA}
.auth-card input:focus{outline:0;border-color:var(--navy);box-shadow:0 0 0 3px rgba(27,58,95,.09)}
.auth-card .campo{position:relative;margin-bottom:18px}
.auth-card .campo input{padding-right:50px}
.auth-card .olho{position:absolute;right:2px;top:2px;height:calc(100% - 4px);width:44px;border:0;
  background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0}
.auth-card .olho:hover{color:var(--navy);background:transparent}
.auth-card .olho svg{width:18px;height:18px;display:block}
.auth-card button.entrar{width:100%;background:var(--navy);color:#fff;border:0;border-radius:2px;
  padding:13px;font-size:13.5px;font-weight:600;letter-spacing:.03em;margin-top:6px;transition:background .12s}
.auth-card button.entrar:hover{background:var(--navy-d)}
.auth-card button.entrar[disabled]{opacity:.55}
.auth-card .erro{border-left:2px solid var(--alert);background:#FBEDEB;color:#7E2C20;
  font-size:12.5px;line-height:1.5;padding:11px 13px;margin-bottom:22px}
.auth-card .erro.ok{border-left-color:var(--green);background:#E8F3EC;color:#0A5A36}
.auth-card .pe{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--muted);line-height:1.6}
@media (prefers-reduced-motion:reduce){.auth-card{animation:none}}
@media(max-width:860px){
  .auth{grid-template-columns:1fr;min-height:100vh}
  .auth-side{padding:26px 24px 30px}
  .auth-side .auth-say{margin-top:26px}
  .auth-say h2{font-size:25px}
  .auth-say p,.auth-meta{display:none}
  .auth-form{padding:34px 24px 50px}
}
.rail-user{font-size:11.5px;color:#8AA8C6;margin-top:10px;overflow:hidden;text-overflow:ellipsis}

/* ---------- portal ---------- */
.hub{min-height:100vh;background:var(--navy);color:#fff;padding:0}
.hub-top{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:26px 40px;border-bottom:1px solid #24405F;flex-wrap:wrap}
.hub-top img{height:30px;width:auto;flex:none}

.eqabas{display:flex;gap:6px;margin:0 0 16px;border-bottom:1px solid #E3E7EE}
.eqaba{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;
  font-size:12.5px;color:#8A93A6;cursor:pointer;font-family:inherit;margin-bottom:-1px}
.eqaba:hover{color:#12263F}
.eqaba.on{color:#12263F;border-bottom-color:#C9A24B;font-weight:600}
.eqx .eqsel{padding:5px 7px;border:1px solid #D8DEE8;border-radius:6px;font-size:12px;
  font-family:inherit;background:#fff;max-width:150px}
.eqpend{font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:#8A6D2F;
  border:1px solid #DCC287;border-radius:3px;padding:1px 5px;margin-left:6px}
.eqtag.eu{color:#3D5178;border-color:#3D5178}
.eqprod td{padding-top:0!important;border-bottom:1px solid #F1F4F8}
.eqprodlbl{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#8A93A6;
  margin-right:8px;font-weight:600}
.eqchip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:#26313F;
  border:1px solid #D8DEE8;border-radius:20px;padding:3px 10px;margin:3px 5px 3px 0;cursor:pointer}
.eqchip.on{background:#FBF6EA;border-color:#C9A24B;color:#7A6122}
.eqchip input{width:auto;margin:0}
.eqform{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}
.eqform .eqc{display:flex;flex-direction:column;gap:4px}
.eqform label{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:#8A93A6;font-weight:600}
.eqform input,.eqform select{padding:8px 9px;border:1px solid #D8DEE8;border-radius:7px;
  font-size:13px;font-family:inherit}
.eqform .eqchk{display:flex;align-items:center;gap:6px;font-size:12.5px;text-transform:none;
  letter-spacing:0;color:#26313F;font-weight:400}
.eqform .eqchk input{width:auto}
.eqform .btn{grid-column:1/-1}
.pe-links{display:flex;gap:16px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.pe-links .link{background:none;border:0;color:#8AA8C6;font-size:12.5px;cursor:pointer;
  font-family:inherit;text-decoration:underline;padding:2px}
.pe-links .link:hover{color:#fff}
.eqv{position:fixed;inset:0;background:rgba(12,20,34,.72);z-index:9000;display:flex;
     align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.eqx{background:#fff;border-radius:10px;max-width:760px;width:100%;padding:26px 28px;
     box-shadow:0 18px 60px rgba(0,0,0,.35)}
.eqx h2{margin:0 0 4px;font-family:Georgia,serif;color:#12263F;font-size:19px}
.eqx .eqsub{color:#7D8A9B;font-size:12.5px;margin:0 0 18px;line-height:1.5}
.eqx table{width:100%;border-collapse:collapse;font-size:13.5px}
.eqx th{text-align:left;font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;
        color:#8A93A6;font-weight:600;padding:0 8px 8px 0;border-bottom:1px solid #E3E7EE}
.eqx td{padding:11px 8px 11px 0;border-bottom:1px solid #F1F4F8;vertical-align:middle}
.eqx td.c{text-align:center;width:96px}
.eqx .eqnome{font-weight:600;color:#12263F}
.eqx .eqmail{color:#8A93A6;font-size:12px}
.eqsw{width:40px;height:22px;border-radius:22px;border:0;background:#D3DAE4;position:relative;
      cursor:pointer;transition:background .15s;padding:0}
.eqsw.on{background:#4C7A4C}
.eqsw:disabled{opacity:.4;cursor:not-allowed}
.eqsw span{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;
           background:#fff;transition:left .15s}
.eqsw.on span{left:21px}
.eqtag{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:#C9A24B}
.eqx td.cod{width:132px}
.eqcod{width:84px;padding:5px 7px;border:1px solid #D8DEE8;border-radius:6px;
  font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;letter-spacing:.5px;
  text-transform:uppercase;background:#fff;color:#12263F}
.eqcod:focus{outline:0;border-color:#C9A24B}
.eqcopiar{border:0;background:transparent;color:#8A93A6;font-size:11px;font-family:inherit;
  cursor:pointer;padding:4px 2px;margin-left:2px}
.eqcopiar:hover{color:#12263F;text-decoration:underline}
.eqfoot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px}
.eqmsg{font-size:12.5px;color:#8A93A6;min-height:1em}
.eqmsg.err{color:#B5563A}
.mfa-qr{display:flex;align-items:center;gap:18px;margin-bottom:18px;flex-wrap:wrap}
.mfa-qr img{border:1px solid var(--line);border-radius:6px;background:#fff;padding:8px}
.mfa-secreto{font-size:12px;color:#7D8A9B;max-width:220px}
.mfa-secreto code{display:block;margin-top:6px;font-size:13px;letter-spacing:.04em;
  background:#F4F6F9;padding:7px 9px;border-radius:4px;word-break:break-all;color:#12263F}
.mfa-status{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12.5px;
  font-weight:600;margin-bottom:12px}
.mfa-status.on{background:#E6F1EC;color:#2F7A56}
.mfa-status.off{background:#F4F6F9;color:#7D8A9B}
.app-passos{margin:8px 0 14px;padding-left:20px;font-size:13.5px;line-height:1.6;color:var(--ink-soft,#3C4C60)}
.app-passos li{margin-bottom:4px}
.app-qr{background:#fff;border:1px solid var(--line,#DCE2EA);border-radius:6px;padding:6px;line-height:0;min-width:150px;min-height:150px}
.app-qr svg{width:180px;height:180px;display:block}
.app-conf{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.app-conf input{width:140px;font-size:20px;letter-spacing:.2em;text-align:center;padding:8px 10px;border:1px solid var(--line,#DCE2EA);border-radius:8px}
/* Código de acesso por e-mail e tela Segurança (06/11/2026) */
.auth-card input.cd-codigo{font-size:26px;letter-spacing:.42em;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.auth-card label.cd-lembrar{display:flex;gap:10px;align-items:flex-start;margin:4px 0 16px;font:400 12.5px/1.45 Inter,"Segoe UI",system-ui,sans-serif;color:#5C6B7F;text-transform:none;letter-spacing:0;cursor:pointer;opacity:1}
.auth-card label.cd-lembrar span{font:inherit;text-transform:none;letter-spacing:0}
.cd-lembrar input{margin-top:2px;width:16px;height:16px;flex:0 0 auto;accent-color:#1B3A5F}
.auth-card label.cd-lembrar b{color:#12263F;font-weight:600}
.seg-tit{font-size:13px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#5C6B7F;margin:22px 0 10px}
.seg-so{font-size:11px;font-weight:600;text-transform:none;letter-spacing:0;color:#8A6D1F;background:#F7F0DC;border-radius:999px;padding:2px 8px;margin-left:6px}
.seg-rolagem{max-height:260px;overflow:auto;border:1px solid #E2E6ED;border-radius:10px;padding:0 10px}
.seg-rolagem table{font-size:12.5px}
.seg-rolagem th{position:sticky;top:0;background:var(--m-bg,#fff);padding-top:8px}
.seg-ruim{color:#B3403A;font-weight:600}
.seg-ip{font-variant-numeric:tabular-nums;color:#5C6B7F}
@media screen{
  html[data-cor="noite"] .seg-tit{color:#AAB6C6}
  html[data-cor="noite"] .seg-so{color:#E9CF8F;background:rgba(225,194,122,.12)}
  html[data-cor="noite"] .seg-rolagem{border-color:rgba(255,255,255,.12)}
  html[data-cor="noite"] .seg-ruim{color:#F2A29C}
  html[data-cor="noite"] .seg-ip{color:#AAB6C6}
}
.hub-top .sai{background:transparent;border:1px solid #35516F;color:#C3D2E2;border-radius:3px;padding:8px 16px}
.hub-top .sai:hover{background:#1B3A5F;color:#fff}
.hub-body{max-width:1040px;margin:0 auto;padding:64px 40px 80px}
.hub-hi{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:#8AA8C6}
.hub-body h1{font-family:var(--display);font-size:38px;font-weight:500;margin:14px 0 8px;line-height:1.2}
.hub-body .sub{color:#A9C0D8;font-size:14.5px;max-width:44em}
.hamb{background:transparent;border:0;cursor:pointer;padding:8px 10px;margin-right:4px;
  display:flex;flex-direction:column;gap:4px;border-radius:6px}
.hamb:hover{background:rgba(255,255,255,.07)}
.hamb span{display:block;width:20px;height:2px;background:#C3D2E2;border-radius:2px;transition:background .12s}
.hamb:hover span{background:#fff}
.grupo-atual{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;
  color:#C9A24B;font-weight:600}

/* Secoes do hub. A do processo comercial abre a tela com faixa dourada,
   cards maiores e o texto do grupo a vista; as outras vem depois, mais
   discretas, para o olho cair primeiro no que comeca o dia.           */
.hub-sec{margin-top:40px}
.hub-sec:first-of-type{margin-top:30px}
.hub-sec .sec-cab{margin-bottom:14px}
.hub-sec .sec-desc{margin:7px 0 0;font-size:13.5px;line-height:1.5;color:#A9C0D8;max-width:62ch}
.hub-sec.destaque{position:relative;background:linear-gradient(180deg,rgba(201,162,75,.10),rgba(201,162,75,0));
  border:1px solid rgba(201,162,75,.30);border-radius:10px;padding:26px 26px 30px}
.hub-sec.destaque::before{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:3px;
  background:var(--gold);border-radius:10px 0 0 10px}
.hub-sec.destaque .grupo-atual{font-size:12px}
.hub-grid.g-destaque{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.hub-grid.g-destaque .app{background:#1B3A5B;border-color:rgba(201,162,75,.42);min-height:194px;
  padding:28px 26px 24px}
.hub-grid.g-destaque .app.on:hover{background:#21456B}
.hub-grid.g-destaque .app .ic{width:38px;height:38px;color:var(--gold)}
.hub-grid.g-destaque .app b{font-size:17px}
@media(max-width:620px){
  .hub-sec.destaque{padding:20px 16px 24px}
  .hub-sec{margin-top:30px}
}

.gav-fundo{position:fixed;inset:0;background:rgba(8,14,24,.55);opacity:0;pointer-events:none;
  transition:opacity .18s;z-index:8000}
.gav-fundo.on{opacity:1;pointer-events:auto}
.gav{position:fixed;top:0;left:0;bottom:0;width:290px;background:#14223A;z-index:8001;
  transform:translateX(-100%);transition:transform .2s ease;overflow-y:auto;
  box-shadow:4px 0 24px rgba(0,0,0,.3);display:flex;flex-direction:column}
.gav.on{transform:translateX(0)}
.gav-top{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 14px;
  border-bottom:1px solid rgba(255,255,255,.08)}
.gav-top span{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#7F98B4}
.gav-x{background:none;border:0;color:#8AA8C6;font-size:24px;line-height:1;cursor:pointer;padding:0 4px}
.gav-x:hover{color:#fff}
.gav-grupo{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  text-align:left;background:transparent;border:0;border-left:2px solid transparent;color:#A9C0D8;
  padding:14px 20px 8px;font-size:12px;letter-spacing:1.1px;text-transform:uppercase;
  cursor:pointer;font-family:inherit;font-weight:600}
.gav-grupo:hover{color:#fff}
.gav-grupo.on{color:#C9A24B;border-left-color:#C9A24B}
.gav-grupo span{font-size:11px;letter-spacing:0;color:#7F98B4;background:rgba(255,255,255,.07);
  border-radius:20px;padding:1px 7px}






.gav-lista{padding:8px 0}
.gav-grupo{padding:14px 20px}
.gav-conta{margin-top:auto;border-top:1px solid rgba(255,255,255,.08);padding:8px 0}
.gav-acao{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;
  border:0;color:#C3D2E2;padding:12px 20px;font-size:13.5px;cursor:pointer;font-family:inherit;
  border-left:2px solid transparent}
.gav-acao svg{width:17px;height:17px;flex:0 0 17px}
.gav-acao:hover{background:rgba(255,255,255,.05);color:#fff;border-left-color:rgba(201,162,75,.5)}
.gav-acao.sair:hover{color:#E6A48F;border-left-color:#B5563A}
.hub-vazio{margin-top:14px;padding:34px 26px;border:1px dashed rgba(255,255,255,.14);
  border-radius:12px;color:#7F98B4;font-size:13.5px;text-align:center}
.gav-pe{margin-top:auto;padding:16px 20px;font-size:11px;color:#5F7691;
  border-top:1px solid rgba(255,255,255,.08)}
.hub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:18px;margin-top:0}
.app{background:#17324F;border:1px solid #27455F;border-radius:5px;padding:26px 24px 22px;
  text-align:left;color:#fff;display:flex;flex-direction:column;gap:9px;min-height:172px;
  transition:transform .12s ease,border-color .12s ease,background .12s ease}
.app.on{cursor:pointer}
.app.on:hover{background:#1C3C5D;border-color:var(--gold);transform:translateY(-2px)}
.app .ic{width:34px;height:34px;color:var(--gold-2);margin-bottom:4px}
.app .ic svg{width:100%;height:100%;display:block}
.app b{font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:.01em}
.app span{font-size:12.8px;color:#A9C0D8;line-height:1.55}
.app .tag{margin-top:auto;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.app.off{opacity:.5;cursor:default}
.app.off .tag{color:#7C93AB}
.hub-foot{max-width:1040px;margin:0 auto;padding:0 40px 50px;color:#6E88A4;font-size:11.5px}
.voltar{background:transparent;border:1px solid var(--line);color:var(--ink-2);border-radius:3px;padding:9px 14px}
.voltar:hover{background:#F6F8FA}
@media(max-width:640px){ .hub-body{padding:40px 22px 60px} .hub-body h1{font-size:29px} .hub-top{padding:20px 22px} }

/* ---------- main ---------- */
.main{margin-left:var(--rail);padding:26px 30px 70px}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;background:#DFE5EC;padding:3px;border-radius:4px}
.tabs button{border:0;background:transparent;padding:8px 18px;border-radius:3px;color:var(--ink-2);font-weight:500}
.tabs button.on{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 16px;border-radius:3px}
.btn:hover{background:#F6F8FA}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy-d)}
.btn[disabled]{opacity:.5;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:22px;margin-bottom:18px}
.sec-title{font-family:var(--display);font-size:17px;color:var(--navy);margin-bottom:4px}
.sec-sub{font-size:12px;color:var(--muted);margin-bottom:16px}
.inp{width:100%;border:1px solid var(--line);border-radius:3px;padding:6px 7px;background:#fff}
.inp:focus{outline:0;border-color:var(--blue-2);box-shadow:0 0 0 2px #EBF1F8}
.inp.num{text-align:right;font-family:var(--mono)}
textarea.inp{min-height:150px;line-height:1.6;resize:vertical}
.grid-ind{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}
.grid-ind label{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.xbtn{border:0;background:transparent;color:var(--alert);font-size:15px;padding:2px 6px}
.note{background:#EBF1F8;border-left:3px solid var(--blue-2);padding:12px 14px;font-size:12.5px;color:var(--ink-2);border-radius:0 3px 3px 0;margin-bottom:16px}
.note.err{background:#FBEDEB;border-left-color:var(--alert)}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty h2{font-family:var(--display);color:var(--navy);margin-bottom:8px}
.form th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.form td{padding:7px 8px;border-bottom:1px solid var(--line-2);font-size:13px}
.form tfoot td{font-weight:600;border-top:1px solid var(--line);border-bottom:0;background:#F7F9FB;font-family:var(--mono)}
.num{text-align:right}

/* ---------- editor da carta ---------- */
.tb{display:flex;flex-wrap:wrap;gap:4px;border:1px solid var(--line);border-bottom:0;border-radius:3px 3px 0 0;padding:7px;background:#F7F9FB}
.tb button{border:1px solid transparent;background:transparent;border-radius:3px;padding:6px 10px;color:var(--ink-2);min-width:34px}
.tb button:hover{background:#fff;border-color:var(--line)}
.tb .sep{width:1px;background:var(--line);margin:2px 4px}
.tb select{border:1px solid var(--line);border-radius:3px;padding:5px 7px;background:#fff}
.ed{border:1px solid var(--line);border-radius:0 0 3px 3px;padding:22px 24px;min-height:320px;background:#fff;
    font-size:13.5px;line-height:1.75;color:var(--ink-2);overflow-wrap:anywhere}
.ed:focus{outline:0;border-color:var(--blue-2);box-shadow:0 0 0 2px #EBF1F8}
.ed:empty:before{content:attr(data-ph);color:#AAB4C0}
.ed p{margin:0 0 12px}
.ed h3{font-family:var(--display);font-size:17px;color:var(--navy);margin:18px 0 10px}
.ed img{max-width:100%;height:auto;display:block;margin:14px 0;border-radius:2px}
.ed ul,.ed ol{margin:0 0 12px;padding-left:22px}
.salvo{font-size:12.5px;color:var(--muted)}

/* ================= RELATÓRIO ================= */
.doc{max-width:880px;margin:0 auto}
.pg td,.pg th,.pg p,.pg .dn-rows div{overflow-wrap:anywhere}
.pg{background:#fff;border:1px solid var(--line);border-radius:2px;padding:52px 56px 40px;margin-bottom:22px;position:relative;min-height:560px}
.pg-mark{position:absolute;top:34px;right:52px;text-align:right;line-height:1}
.pg-mark img{height:26px;width:auto;display:block;margin-left:auto}
.pg-num{position:absolute;bottom:18px;right:56px;font-size:10.5px;color:var(--muted)}

/* capa */
.cover{background:#fff;border:1px solid var(--line);padding:96px 62px 62px;min-height:820px;display:flex;flex-direction:column}
.cover .eyebrow{font-size:9.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--blue-3)}
.cover h1{font-family:var(--display);font-size:40px;line-height:1.18;color:var(--navy);font-weight:600;margin:16px 0 0;max-width:9.5em}
.cover .cli{font-size:15px;color:var(--navy);margin-top:36px}
.cover .rule{width:76px;height:1px;background:var(--gold);margin:18px 0 22px}
.cover .ref{font-size:13px;color:var(--blue-3)}
.cover .ref-base{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:7px;letter-spacing:.04em}
.cover .mark{margin-top:auto;text-align:center}
.cover .mark img{width:210px;max-width:56%;height:auto;display:block;margin:0 auto}
.cover .foot{text-align:center;font-size:9.5px;letter-spacing:.34em;color:var(--blue-3);margin-top:54px}

/* cabeçalho de seção */
.shead{display:flex;align-items:baseline;gap:11px;border-bottom:2px solid var(--navy);padding-bottom:7px;margin:34px 0 18px}
.shead:first-of-type{margin-top:0}
.shead .n{font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.06em}
.shead h2{font-family:var(--display);font-size:21px;color:var(--navy);font-weight:600}
.shead .cap{margin-left:auto;font-size:11px;color:var(--muted)}
.dash{display:flex;align-items:baseline;gap:11px;border-bottom:2px solid var(--navy);padding-bottom:7px;margin-bottom:20px}
.dash i{font-style:normal;color:var(--gold)}
.dash h2{font-family:var(--display);font-size:22px;color:var(--navy)}

/* cabeçalho do cliente */
.rep-eyebrow{font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--blue-3)}
.rep-name{font-family:var(--display);font-size:32px;color:var(--navy);margin-top:8px;font-weight:600;letter-spacing:-.01em}
.rep-name:after{content:"";display:block;width:44px;height:2px;background:var(--gold);margin-top:13px}
.rep-ref{font-size:12.5px;color:var(--muted);margin-top:11px}

/* patrimônio + kpis */
.pat{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:22px 0;margin-top:20px;text-align:center}
.pat .l{font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.pat .v{font-family:var(--mono);font-size:34px;color:var(--navy);letter-spacing:.03em;margin:9px 0 4px}
.pat .s{font-size:11.5px;color:var(--muted)}
.pat-duo{display:flex;align-items:center;justify-content:center;gap:30px;flex-wrap:wrap;margin-top:18px}
.pat-col{text-align:center;min-width:135px}
.pat-col .d{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted)}
.pat-col .n{font-family:var(--mono);color:var(--navy);font-variant-numeric:tabular-nums;margin:8px 0 5px;line-height:1.1}
.pat-col .c{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#93A2B4}
.pat-col.ant .n{font-size:19px;color:#78899E;font-weight:500}
.pat-col.atual .n{font-size:36px;font-weight:600;letter-spacing:-.02em}
.pat-col.atual .d{color:var(--navy)}
.pat-col.atual .c{color:var(--blue-3)}
.pat-sep{width:1px;height:46px;background:var(--line-2)}
.pat-rend{margin-top:20px;padding-top:17px;border-top:1px solid var(--line);display:flex;align-items:baseline;justify-content:center;gap:12px;flex-wrap:wrap}
.pat-rend .l{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.pat-rend b{font-family:var(--mono);font-size:21px;font-weight:500;color:var(--navy);font-variant-numeric:tabular-nums}
.pat-rend b.pos{color:var(--green)} .pat-rend b.neg{color:var(--alert)}
.pat-rend i{font-style:normal;font-family:var(--mono);font-size:13px;padding:3px 8px;border-radius:2px;background:#F4F7FA}
.pat-rend i.pos{color:var(--green)} .pat-rend i.neg{color:var(--alert)}
.pat-rend .s{font-size:11px;color:var(--muted)}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
  border-top:1px solid var(--line);border-bottom:3px solid var(--navy)}
.kbox{padding:21px 24px;background:var(--surface)}
.kbox .l{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--blue-3)}
.kbox .v{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--navy);
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.08;margin:11px 0 7px}
.kbox .s{font-size:11px;color:var(--muted)}
.kbox .s b{font-family:var(--mono);font-weight:400;color:var(--ink-2)}
.kbox .v.pos{color:var(--green)} .kbox .v.neg{color:var(--alert)}
/* simbolo de moeda e de porcentagem discretos: os digitos dominam */
.uni{font-style:normal;font-weight:500;font-size:.58em;color:#8FA3B8;letter-spacing:.02em}
.kbox .v .uni:first-child,.pat .v .uni:first-child,.pat-col .n .uni:first-child{margin-right:.26em}
.kbox .v .uni:last-child{margin-left:.1em}

/* blocos */
.chk{border:1px solid var(--line);border-radius:3px;background:#fff;margin-bottom:22px;overflow:hidden}
.chk-top{display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line);background:#FAFBFD}
.chk-top h3{font-family:var(--display);font-size:16px;color:var(--navy);margin:0;flex:1;font-weight:400}
.chk-tag{font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:2px;letter-spacing:.04em}
.chk-tag.ok{background:#E8F3ED;color:var(--green)}
.chk-tag.al{background:#F7E9E6;color:var(--alert)}
.chk-tag.at{background:#FBF3E2;color:#8A6A1F}
.chk-item{display:flex;gap:14px;padding:15px 20px;border-bottom:1px solid var(--line-2)}
.chk-item:last-child{border-bottom:0}
.chk-bar{width:3px;border-radius:2px;flex:none}
.chk-bar.alta{background:var(--alert)} .chk-bar.atencao{background:var(--gold)} .chk-bar.info{background:var(--blue-3)}
.chk-txt{flex:1;min-width:0}
.chk-txt b{display:block;font-size:13.5px;color:var(--ink);font-weight:500;margin-bottom:4px}
.chk-txt span{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.65}
.chk-txt i{font-style:normal;font-family:var(--mono);color:var(--navy)}
.chk-onde{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;display:block}
.chk-mes{display:flex;align-items:baseline;gap:10px;padding:10px 20px;background:#F7F9FB;border-bottom:1px solid var(--line-2);border-top:1px solid var(--line-2)}
.chk-mes b{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--navy);font-weight:400}
.chk-mes span{font-size:11px;color:var(--muted)}
.chk-rodape{padding:14px 20px;font-size:12px;color:var(--muted);border-top:1px solid var(--line-2)}
.chk-vazio{padding:22px 20px;font-size:13px;color:var(--ink-2)}
.sum{margin-top:26px}
.sum-row{display:flex;align-items:baseline;gap:12px;padding:13px 0;border-bottom:1px solid var(--line-2)}
.sum-row:last-child{border-bottom:0}
.sum-row .n{font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.06em;min-width:22px}
.sum-row .t{font-family:var(--display);font-size:15px;color:var(--navy)}
.sum-row .dots{flex:1;border-bottom:1px dotted var(--line);transform:translateY(-4px)}
.sum-row .p{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.panel{border:1px solid var(--line);border-radius:3px;padding:22px;background:#fff}
.panel.tint{background:#FAFBFD}
.rt{width:100%}
.rt th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:400;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.rt td{padding:11px 12px;border-bottom:1px solid var(--line-2);font-size:12.5px}
.rt td.n,.rt th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.rt tr.tot td{border-top:1px solid var(--line);border-bottom:0;font-weight:600;background:#F7F9FB}
.rt tr.tot td:first-child{font-family:var(--body)}
.rt.bm{table-layout:fixed}
.rt.bm th:first-child,.rt.bm td:first-child{width:31%}
.rt.bm th.n,.rt.bm td.n{width:17.25%}
.rt.bm tbody tr.destaque td{background:#F4F7FA;font-weight:600;border-bottom:1px solid var(--line)}
.rt.bm tbody tr.destaque td:first-child{font-family:var(--display);font-size:13.5px;color:var(--navy)}
.rt.bm tbody tr.ratio td{border-top:1px solid var(--line);border-bottom:0;color:var(--muted);font-size:11.5px}
.rt.bm tbody tr.ratio td:first-child{font-family:var(--body);font-style:italic}
.venc-tit{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:#8A6D2F;
  margin:0 0 10px;font-weight:600;font-family:Segoe UI,Arial,sans-serif}
.venc-mes{background:#FBF6EA;border-left:3px solid #C9A24B;padding:14px 16px;border-radius:2px}
.venc-mes .rt th{color:#8A6D2F}
.foot-note{font-size:10.5px;color:var(--muted);line-height:1.6;margin-top:14px}

/* donut */
.dn{display:block;margin:0 auto}
.dn-total{font-size:11.5px;color:var(--muted);margin-top:6px}
.dn-total b{font-family:var(--mono);color:var(--navy);font-weight:400;font-size:13px}
.rt.compact{table-layout:fixed}
.rt.compact th{padding:8px 3px;font-size:9px;letter-spacing:.02em}
.rt.compact td{padding:8px 3px;font-size:10.5px}
.rt.compact th:first-child,.rt.compact td:first-child{width:15%}
.rt.compact th.n,.rt.compact td.n{width:6.07%}
.rt.compact tr.ano td{font-weight:600;background:#F4F7FA}
.rt.compact tr.ano td:first-child{font-family:var(--display);font-size:13px;color:var(--navy)}
.rt.compact tr.sep td{border-bottom:1px solid var(--line)}
.rt.compact td:first-child,.rt.compact th:first-child{white-space:nowrap}
/* Lista de ativos, uma tabela por categoria: renda fixa tem taxa e
   vencimento, as outras não. Colunas não cabem com largura automática — o
   navegador afunilava Ativo e Taxa até quebrar palavra por letra. Largura
   fixa por coluna, só aqui, para não mexer nas outras tabelas .rt. */
.at-cab{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:2px 2px 10px;border-bottom:2px solid var(--navy,#12263F);margin-bottom:2px}
.at-cab b{font-family:var(--display);font-size:15px;color:var(--navy,#12263F);font-weight:600}.at-cab b span{font-weight:400;font-size:12px;color:var(--muted)}
.at-cab>span{font-family:var(--mono);font-size:11.5px;color:var(--ink-2,#3A4A5E)}
.rt.at-tab{table-layout:fixed;width:100%}
.rt.at-tab th:nth-child(1),.rt.at-tab td:nth-child(1){width:37%}
.rt.at-tab th:nth-child(2),.rt.at-tab td:nth-child(2){width:13%}
.rt.at-tab th:nth-child(3),.rt.at-tab td:nth-child(3),.rt.at-tab th:nth-child(4),.rt.at-tab td:nth-child(4){width:7.5%}
.rt.at-tab th:nth-child(n+5),.rt.at-tab td:nth-child(n+5){width:8.75%}
.rt.at-tab td{padding:8px 8px;vertical-align:top}
.rt.at-tab th{letter-spacing:.04em;font-size:9.5px;padding:9px 8px;white-space:nowrap}
.rt.at-tab small.cdi{white-space:nowrap;font-size:9.5px}
.rt.at-tab tr.at-l td:first-child b{display:block;font-weight:600;font-size:12px;color:var(--ink,#12263F);line-height:1.35}
.rt.at-tab small{display:block;font-size:10.5px;color:var(--muted);font-family:Inter,sans-serif;font-weight:400;margin-top:2px;line-height:1.3;white-space:normal}
.rt.at-tab td.n small{font-family:var(--mono)}
.rt.at-tab tr.at-banda td{background:#F1F3F6;font-weight:600;font-size:11.5px;color:var(--navy,#12263F);padding:7px 10px;border-bottom:0}
.rt.at-tab tr.at-banda td small{display:inline;font-weight:400}
.rt.at-tab tr.at-ref td{font-size:11px;color:var(--muted);font-style:italic;padding:6px 10px}
.rt.at-tab tr.at-ref td small{display:inline;font-style:normal}
.rt.ativos-rf{table-layout:fixed}
.rt.ativos-rf th:nth-child(1),.rt.ativos-rf td:nth-child(1){width:13%}
.rt.ativos-rf th:nth-child(2),.rt.ativos-rf td:nth-child(2){width:11%}
.rt.ativos-rf th:nth-child(3),.rt.ativos-rf td:nth-child(3){width:10%}
/* Vencimento e Posição são células numéricas (.rt td.n), que nunca quebram
   linha — precisam de largura que caiba "15/03/2027" e "R$ 1.230.450"
   inteiros numa linha só, senão uma estoura por cima da outra. */
.rt.ativos-rf th:nth-child(4),.rt.ativos-rf td:nth-child(4){width:13%}
.rt.ativos-rf th:nth-child(5),.rt.ativos-rf td:nth-child(5){width:15%}
.rt.ativos-rf th:nth-child(6),.rt.ativos-rf td:nth-child(6),
.rt.ativos-rf th:nth-child(7),.rt.ativos-rf td:nth-child(7),
.rt.ativos-rf th:nth-child(8),.rt.ativos-rf td:nth-child(8),
.rt.ativos-rf th:nth-child(9),.rt.ativos-rf td:nth-child(9){width:9.5%}
.rt.ativos-out{table-layout:fixed}
.rt.ativos-out th:nth-child(1),.rt.ativos-out td:nth-child(1){width:22%}
.rt.ativos-out th:nth-child(2),.rt.ativos-out td:nth-child(2){width:15%}
.rt.ativos-out th:nth-child(3),.rt.ativos-out td:nth-child(3){width:13%}
.rt.ativos-out th:nth-child(n+4),.rt.ativos-out td:nth-child(n+4){width:12.5%}
/* Cabeçalho numérico normalmente não quebra linha (.rt th.n); nesta tabela,
   com coluna estreita, isso fazia um cabeçalho comprido atropelar o
   vizinho em vez de simplesmente quebrar. */
.rt.ativos-rf th.n,.rt.ativos-out th.n{white-space:normal}
.dn-leg{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 22px;margin:18px 0 6px;font-size:11.5px;color:var(--ink-2)}
.dn-leg span{display:inline-flex;align-items:center;gap:6px}
.dn-leg i{width:9px;height:9px;border-radius:2px;display:inline-block}
.dn-rows{margin-top:14px}
.dn-rows div{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid var(--line-2);font-size:12.5px}
.dn-rows b{font-weight:400;font-family:var(--mono)}

/* carta */
.carta{border:1px solid var(--line);border-radius:3px;padding:32px 34px;background:#fff}
.carta h3{font-size:13.5px;color:var(--navy);margin-bottom:12px}
.carta .sub{font-style:italic;color:var(--ink-2);font-size:13px;margin-bottom:16px}
.carta p{margin:0 0 13px;font-size:12.8px;line-height:1.72;color:var(--ink-2);text-align:justify;overflow-wrap:anywhere;word-break:break-word}
.carta .sig{margin-top:20px;font-size:12.5px;color:var(--ink-2)}
.carta img{max-width:100%;height:auto;display:block;margin:14px auto;border-radius:2px}
.carta h3.tit{font-family:var(--display);font-size:16px;color:var(--navy);margin:16px 0 9px;text-align:left}
.carta ul,.carta ol{margin:0 0 13px;padding-left:22px;font-size:12.8px;line-height:1.72;color:var(--ink-2)}
.carta b,.carta strong{color:var(--ink)}

.disc p{font-size:11.6px;color:var(--ink-2);line-height:1.72;margin:0 0 13px;text-align:justify}

@media print{
  .rail,.topbar,.no-print{display:none!important}
  html,body{background:#fff;width:100%}
  .main{margin:0;padding:0}
  .doc{max-width:none;margin:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4;margin:0}
  .pg{border:0;margin:0;padding:15mm 14mm 12mm;min-height:0;border-radius:0;
      break-after:page;page-break-after:always}
  .pg:last-child{break-after:auto;page-break-after:auto}
  .pg-mark{top:13mm;right:14mm}
  .pg-num{bottom:8mm;right:14mm}
  /* capa sangrando na folha inteira */
  .cover{margin:0;padding:46mm 22mm 20mm;height:var(--pg-altura,297mm);border-radius:0;
         background:#fff!important;border:0;display:flex;flex-direction:column}
  .cover h1{font-size:30pt}
  /* manter título junto do bloco e evitar sobras */
  .shead,.dash,.venc-tit{break-after:avoid;page-break-after:avoid;margin:16px 0 11px}
  .panel,.carta,.rt,.kgrid,.pat{break-inside:avoid}
  .panel{padding:14px}
  .panel svg{max-height:46mm;width:auto;max-width:100%}
  .dn{max-height:42mm}
  .pat{padding:14px 0;margin-top:14px}
  .pat .v{font-size:26px}
  .pat-col.atual .n{font-size:28px}
  .pat-col.ant .n{font-size:17px}
  .pat-duo{gap:16px}
  .kbox{padding:13px 15px}
  .kbox .v{font-size:21px;margin:8px 0 5px}
  .kbox .l{letter-spacing:.14em}
  .rep-name{font-size:24px}
  .rt.compact td,.rt.compact th{padding:5px 2px;font-size:7.6pt}
  .rt td,.rt th{padding:6px 8px;font-size:11.5px}
  .dn-rows div{padding:6px 4px}
  .foot-note{margin-top:10px}
}
@media screen and (max-width:900px){
  :root{--rail:0px}
  .rail{position:static;width:auto;bottom:auto}
  .main{margin:0;padding:18px}
  .pg{padding:30px 22px}
  .pg-mark{display:none}
  .kgrid{grid-template-columns:1fr}
  .kbox{padding:16px 15px}
}

/* ================= Visual 2026 (aprovado pelo Emil em 05/11/2026) =================

   por grupo, "Hoje" e Avisos da casa. Modo noite compartilhado com o CRM

@media screen{

html[data-cor="noite"] .hb{--vd:rgba(255,255,255,.06);--vd-forte:rgba(255,255,255,.09);--vd-borda:rgba(255,255,255,.12);--vd-sombra:0 10px 40px rgba(0,0,0,.35);
  --tx:#EEF2F8;--tx2:#B5C0D0;--tx3:#8D9AAE;--ln:rgba(255,255,255,.09);--chip:rgba(255,255,255,.08);--nv:#EEF2F8;--az:#7FB0F0}
.hb-luz{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(720px 720px at -6% -18%,rgba(25,90,180,.26),rgba(25,90,180,0) 68%),
             radial-gradient(640px 640px at 104% 26%,rgba(192,162,101,.26),rgba(192,162,101,0) 66%),
             radial-gradient(820px 820px at 40% 120%,rgba(11,30,63,.16),rgba(11,30,63,0) 70%)}
html[data-cor="noite"] .hb-luz{background:radial-gradient(720px 720px at -6% -18%,rgba(25,90,180,.32),rgba(25,90,180,0) 68%),
             radial-gradient(640px 640px at 104% 26%,rgba(192,162,101,.16),rgba(192,162,101,0) 66%)}
.hb-casca{position:relative;display:flex;gap:20px;align-items:flex-start;padding:20px;max-width:1480px;margin:0 auto}
.hb-vidro{background:var(--vd);border:1px solid var(--vd-borda);box-shadow:var(--vd-sombra);border-radius:22px;
  backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%)}
.hb-menu{width:268px;flex:0 0 auto;padding:14px;display:flex;flex-direction:column;gap:3px;transition:width .2s}

.hb-topo{display:flex;align-items:center;gap:10px;padding:2px 2px 12px}

.hb-nome{flex:1;min-width:0;display:flex;flex-direction:column}
.hb-nome strong{font:600 17px Fraunces,Georgia,serif;color:var(--nv)}
.hb-nome span{font-size:11.5px;color:var(--tx3)}
.hb-redondo{width:34px;height:34px;border-radius:50%;border:1px solid var(--vd-borda);background:var(--vd-forte);color:var(--tx);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;cursor:pointer}
.hb-redondo svg{width:16px;height:16px}
.hb-busca{display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:14px;background:var(--chip);color:var(--tx3);margin-bottom:4px}

.hb-secao{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);font-weight:600;padding:10px 12px 4px}
.hb-item{display:flex;align-items:center;gap:11px;width:100%;min-height:36px;padding:0 12px;border:0;border-radius:12px;background:transparent;color:var(--tx2);

.hb-menu.curto .hb-nome,.hb-menu.curto .rot,.hb-menu.curto .hb-cont,.hb-menu.curto .hb-secao,.hb-menu.curto .hb-busca,.hb-menu.curto .hb-pessoa-txt,.hb-menu.curto .hb-chave{display:none}
.hb-menu.curto .hb-topo,.hb-menu.curto .hb-pessoa{flex-direction:column}
.hb-menu.curto .hb-item{justify-content:center;padding:0}
.hb-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:20px}

.hb-ola h1{margin:0;font:500 clamp(26px,3vw,34px) Fraunces,Georgia,serif;color:var(--nv)}

.hb-pil{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--vd-borda);background:var(--vd-forte);color:var(--tx);font:600 13px Inter,sans-serif;cursor:pointer}

.hb-nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}

.hb-form label{font-size:12px;color:var(--tx3);display:flex;align-items:center;gap:8px}
.hb-form .linha{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.hb-erro{font-size:12px;color:#B3403A}
.hb-pe{font-size:11.5px;color:var(--tx3);padding:4px 4px 0}
@media (max-width:900px){

  .hb-menu .hb-topo{padding:0;flex:1 1 auto;flex-direction:row}
  .hb-menu .hb-nome{display:flex}
  .hb-menu .hb-busca{display:flex;flex:1 1 100%;order:3;margin:0}
  .hb-menu .hb-secao,.hb-menu .hb-item.app-item,.hb-menu .hb-recolher{display:none}
  .hb-menu .hb-rodape{margin:0;padding:0;border:0;flex-direction:row;align-items:center;flex-wrap:wrap}
  .hb-menu .hb-pessoa-txt{display:none}
  .hb-ola{padding:18px}
}



/* ===== 06/11/2026: menu do Hub encostado na borda e maior; seletor de aparência; Carteiras com

/* ============ conexão e sessão ============ */
/* ============================================================
   CONFIGURACAO DA EMPRESA
   Este e o unico trecho que muda entre uma instalacao e outra.
   Todo o resto do arquivo e identico, o que permite portar
   melhorias de um portal para o outro copiando o resto.
   ============================================================ */
var EMPRESA={
  nome:      "Adami Captal",
  hub:       "Hub Adami",
  dominio:   "adamicaptal.com.br",
  produto:   "Consolidado de Carteiras",
  chamada:   "Ambiente administrativo da Adami Captal. Carteiras, planejamento e relat\u00f3rios em um s\u00f3 lugar.",
  sb_url:    "https://ghxjqmjtmbqzvogwzylo.supabase.co",
  sb_key:    "sb_publishable_-M5rRFdjNXtFr1td-NVWPQ_GGkd_liB"
};
var SB_URL=EMPRESA.sb_url;
var SB_KEY=EMPRESA.sb_key;
/* Os logos tambem trocam por instalacao: as variaveis LOGO_AZUL e
   LOGO_BRANCO, logo abaixo, guardam as duas versoes da marca. */

var SESSAO=null;
try{ SESSAO=JSON.parse(localStorage.getItem("aw_sessao")||"null"); }catch(e){}
var PERFIS={}, EU={admin:false,super:false,nome:"",id:null};

function payloadDoToken(tk){
  try{
    var b=tk.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");
    return JSON.parse(decodeURIComponent(escape(atob(b+"===".slice((b.length+3)%4)))));
  }catch(e){ return null; }
}
function idDoToken(tk){ var p=payloadDoToken(tk); return (p&&p.sub)||null; }
function guardarSessao(d){
  var ant=SESSAO||{};
  var novo={access_token:d.access_token,refresh_token:d.refresh_token,
          email:(d.user&&d.user.email)||(payloadDoToken(d.access_token||"")||{}).email||"",
          id:(d.user&&d.user.id)||idDoToken(d.access_token||"")};
  /* Renovar o token não apaga a marca de "código confirmado hoje". */
  if(ant.id&&ant.id===novo.id){ novo.dia=ant.dia; novo.login_dia=ant.login_dia; }
  SESSAO=novo;
  try{ localStorage.setItem("aw_sessao",JSON.stringify(SESSAO)); }catch(e){}
}
/* ===================== Acesso do dia (06/11/2026) =====================
   login_dia: o dia (Brasília) em que a senha foi digitada.
   dia: o dia em que o código de 6 dígitos do e-mail foi confirmado.
   O acesso vale até a meia-noite de Brasília. Quem protege os dados é o
   banco (seguranca.sql); isto aqui só leva a pessoa para a tela certa. */
function hojeBR(){
  try{ return new Date().toLocaleDateString("en-CA",{timeZone:"America/Sao_Paulo"}); }
  catch(e){ return new Date(Date.now()-3*3600*1000).toISOString().slice(0,10); }
}
/* Antes de gravar, pega o token mais novo que outra aba (o CRM) possa ter gravado,
   para não sobrescrever um token novo com o velho da memória. */
function persistirSessao(){ sessaoDeOutraAba(); try{ localStorage.setItem("aw_sessao",JSON.stringify(SESSAO)); }catch(e){} }
function sessaoLiberada(){ return !!(SESSAO&&SESSAO.access_token&&SESSAO.dia===hojeBR()); }
function codigoPendente(){ return !!(SESSAO&&SESSAO.access_token&&SESSAO.dia!==hojeBR()&&SESSAO.login_dia===hojeBR()); }
function novaSessaoPendente(){ if(!SESSAO) return; SESSAO.login_dia=hojeBR(); SESSAO.dia=null; persistirSessao(); }
function marcarLiberado(){ if(!SESSAO) return; SESSAO.dia=hojeBR(); SESSAO.login_dia=SESSAO.login_dia||SESSAO.dia; persistirSessao(); }
function limparSessao(){
  SESSAO=null;
  try{ localStorage.removeItem("aw_sessao"); }catch(e){}
}
/* Primeiro acesso: /auth/v1/signup funciona com a chave publicavel,
   entao a pessoa define a propria senha sem o master precisar criar
   nem guardar senha de ninguem. Quem nao foi convidado e recusado
   por um gatilho no banco, nao por checagem aqui na tela.          */
function primeiroAcesso(email,senha){
  return fetch(SB_URL+"/auth/v1/signup",{
    method:"POST",
    headers:{"apikey":SB_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({email:email,password:senha})
  }).then(function(res){
    return res.json().then(function(j){
      if(!res.ok){
        var m=(j&&(j.msg||j.error_description||j.message))||"Não foi possível criar o acesso.";
        if(/convidad/i.test(m)) m="Este e-mail não foi convidado. Peça o convite a um master.";
        else if(/already regist|already been/i.test(m)) m="Já existe conta com este e-mail. Use Entrar.";
        else if(/password/i.test(m)) m="A senha precisa ter pelo menos 8 caracteres.";
        throw new Error(m);
      }
      return j;
    });
  });
}
/* Recuperação de senha depende de e-mail, e o serviço embutido do
   Supabase entrega 2 por hora no projeto inteiro. Só funciona de
   verdade com SMTP próprio configurado no painel.                  */
function recuperarSenha(email){
  /* redirect_to explícito em vez de depender só do "Site URL" configurado no
     painel do Supabase -- assim o link volta pro endereço que a pessoa está
     usando de verdade (vercel.app ou o domínio próprio), mesmo que o painel
     esteja desatualizado. */
  var volta=encodeURIComponent(location.origin+location.pathname);
  return fetch(SB_URL+"/auth/v1/recover?redirect_to="+volta,{
    method:"POST",
    headers:{"apikey":SB_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({email:email})
  }).then(function(res){
    if(!res.ok) return res.text().then(function(t){
      var j=null; try{ j=t?JSON.parse(t):null; }catch(e){}
      var m=(j&&(j.msg||j.message||j.error_description))||"";
      var cod=(j&&j.error_code)||"";
      if(/after \d+ seconds?/i.test(m)||cod==="over_request_rate_limit")
        m="Já mandamos um e-mail há pouco. Espere um minuto antes de pedir outro.";
      else if(res.status===429||cod==="over_email_send_rate_limit")
        m="Muitos e-mails de senha pedidos na última hora. Tente de novo mais tarde, ou peça a um master para trocar sua senha.";
      else if(res.status>=500)
        m="O servidor de e-mail não conseguiu enviar agora. Tente de novo em alguns minutos, ou peça a um master para trocar sua senha.";
      else if(!m) m="Não foi possível enviar o e-mail.";
      throw new Error(m);
    });
    return true;
  });
}
function entrar(email,senha){
  return fetch(SB_URL+"/auth/v1/token?grant_type=password",{
    method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({email:email,password:senha})
  }).then(function(res){
    return res.json().then(function(d){
      if(!res.ok) throw new Error(d.error_description||d.msg||d.message||"E-mail ou senha incorretos.");
      SESSAO=null;
      guardarSessao(d);
      novaSessaoPendente();
    });
  });
}
/* 10/11/2026: outra aba (o CRM, o Hub, outro módulo) pode já ter renovado o token.
   Antes de renovar, olha o aw_sessao: se lá tem um token mais novo e ainda válido da
   mesma pessoa, usa ele; se não, renova com o refresh_token mais novo de lá, nunca com
   o velho da memória (o Supabase recusa o velho e pode derrubar a sessão inteira). */
function sessaoDeOutraAba(){
  var ls=null; try{ ls=JSON.parse(localStorage.getItem("aw_sessao")||"null"); }catch(e){}
  if(!ls||!ls.access_token||!SESSAO) return false;
  if(SESSAO.id&&ls.id&&ls.id!==SESSAO.id) return false;
  if(ls.refresh_token) SESSAO.refresh_token=ls.refresh_token;
  if(ls.access_token===SESSAO.access_token) return Date.now()-RENOVADA_EM<20000;
  var exp=0;
  try{ var b=ls.access_token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"); exp=JSON.parse(atob(b+"===".slice((b.length+3)%4))).exp||0; }catch(e){}
  if(exp*1000<Date.now()+30000) return false;
  SESSAO.access_token=ls.access_token;
  RENOVADA_EM=Date.now();
  return true;
}
/* Várias consultas que dão 401 juntas esperam uma renovação só. A que chega logo
   depois de uma renovação (até 20 s) só repete com o token novo. */
var RENOVACAO=null, RENOVADA_EM=0;
function renovar(){
  if(sessaoDeOutraAba()) return Promise.resolve(SESSAO);
  if(RENOVACAO) return RENOVACAO;
  RENOVACAO=renovarAgora().then(function(x){ RENOVADA_EM=Date.now(); RENOVACAO=null; return x; },
                                function(e){ RENOVACAO=null; throw e; });
  return RENOVACAO;
}
function renovarAgora(){
  if(!SESSAO||!SESSAO.refresh_token) return Promise.reject(new Error("sem sessão"));
  return fetch(SB_URL+"/auth/v1/token?grant_type=refresh_token",{
    method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({refresh_token:SESSAO.refresh_token})
  }).then(function(res){
    if(!res.ok) throw new Error("sessão expirada");
    return res.json().then(guardarSessao);
  });
}

/* ---------- Perfis e acessos (2.94, permissoes.sql) ----------
   Linhas: ferramentas e atribuições. Colunas: os perfis. Cada caixinha grava na
   hora (permissoes_definir) e fica na auditoria. A pessoa tem a soma dos perfis
   dela: as chaves Master, Admin, Mesa RV e Financeiro e o papel no CRM.
   O banco obedece à tabela: ferramenta desmarcada não devolve dado. */
function matrizLiberado(perfil,perm){
  if(!MATRIZ||!MATRIZ.matriz) return false;
  for(var i=0;i<MATRIZ.matriz.length;i++){ var m=MATRIZ.matriz[i]; if(m.perfil===perfil&&m.permissao===perm) return !!m.liberado; }
  return false;
}
function qtdNoPerfil(perfil){ return EQUIPE.filter(function(p){ return !p.revogado&&(p.perfis||[]).indexOf(perfil)>=0; }).length; }
function blocoPermissoes(){
  if(!MATRIZ||!MATRIZ.perfis) return '<p class="eqsub err">Não foi possível carregar a tabela de permissões. Recarregue a página; se continuar, falta instalar o permissoes.sql no Supabase.</p>';
  var pf=MATRIZ.perfis, grupos=[["ferramenta","Ferramentas: quem abre cada uma"],["atribuicao","Atribuições: o que cada perfil pode fazer"]];
  var h='<p class="eqsub">Marque o que cada perfil pode usar. Vale na hora, para todo mundo do perfil, e o banco obedece: '+
    'ferramenta desmarcada some do menu e não mostra os dados nem para quem abrir o endereço direto.</p>'+
    '<p class="eqsub">Cada pessoa tem a <b>soma</b> dos perfis dela. Exemplo: quem é Administrador e Assessor no CRM abre tudo o que um ou outro abre. '+
    'Os perfis vêm das chaves da aba <b>Quem já tem conta</b> (Master, Admin, Mesa RV, Financeiro) e do papel no CRM.</p>'+
    '<div class="eqmatriz-rolagem"><table class="eqmatriz"><thead><tr><th class="eqm-rot"></th>'+
    pf.map(function(f){ var n=qtdNoPerfil(f.chave);
      return '<th class="c" title="'+esc(f.descricao)+'">'+esc(f.nome)+'<span class="eqm-qtd">'+n+(n===1?" pessoa":" pessoas")+'</span></th>'; }).join("")+
    '</tr></thead><tbody>';
  grupos.forEach(function(g){
    h+='<tr class="eqm-grupo"><td colspan="'+(pf.length+1)+'">'+esc(g[1])+'</td></tr>';
    MATRIZ.permissoes.filter(function(x){ return x.tipo===g[0]; }).forEach(function(x){
      h+='<tr><td class="eqm-rot"><div class="eqm-nome">'+esc(x.nome)+'</div>'+(x.descricao?'<div class="eqm-desc">'+esc(x.descricao)+'</div>':'')+'</td>';
      pf.forEach(function(f){
        var on=matrizLiberado(f.chave,x.chave), trava=!!x.so_master;
        var rot=(on?"Tirar ":"Liberar ")+x.nome+(on?" de ":" para ")+f.nome;
        h+='<td class="c"><input type="checkbox" class="eqm-cx"'+(on?" checked":"")+(trava?' disabled title="Só o master, sempre"':' title="'+esc(rot)+'"')+
           ' aria-label="'+esc(x.nome+" para "+f.nome)+'" onchange="definirPermissao('+jsStr(f.chave)+','+jsStr(x.chave)+',this)"></td>';
      });
      h+='</tr>';
    });
  });
  return h+'</tbody></table></div>';
}
function definirPermissao(perfil,perm,cx){
  var valor=!!cx.checked; cx.disabled=true;
  var nomePf=(MATRIZ.perfis.filter(function(f){return f.chave===perfil;})[0]||{}).nome||perfil;
  var nomePm=(MATRIZ.permissoes.filter(function(x){return x.chave===perm;})[0]||{}).nome||perm;
  msgEq("Salvando…");
  api("rpc/permissoes_definir",{method:"POST",body:{p_perfil:perfil,p_permissao:perm,p_liberado:valor}})
    .then(function(){
      var achou=false;
      MATRIZ.matriz.forEach(function(m){ if(m.perfil===perfil&&m.permissao===perm){ m.liberado=valor; achou=true; } });
      if(!achou) MATRIZ.matriz.push({perfil:perfil,permissao:perm,liberado:valor});
      cx.disabled=false;
      msgEq(nomePm+(valor?" liberado para ":" tirado de ")+nomePf+".");
    })
    .catch(function(e){ cx.checked=!valor; cx.disabled=false; msgEq(String(e.message||e),true); });
}

  var abre=MATRIZ.permissoes.filter(function(x){ return meus.some(function(f){ return matrizLiberado(f,x.chave); }); });

function alternarPriv(i,campo){

      body:{p_user_id:p.user_id,p_campo:campo,p_valor:novo}})

/* Trocar o codigo e trocar o vinculo de uma carteira inteira na proxima
   importacao: a confirmacao vem do banco, nao da tela. Enquanto ela nao
   volta, o campo continua mostrando o que foi digitado; se o banco recusar
   (codigo repetido, formato invalido), o valor antigo volta na hora --
   deixar o novo na tela daria a entender que gravou. */
function salvarCodigo(i,valor){
  var p=EQUIPE[i]; if(!p) return;
  var novo=String(valor||"").trim().toUpperCase();
  var campo=document.getElementById("eqcod"+i);
  if(novo===(p.codigo||"")) return;
  if(!novo){
    if(campo) campo.value=p.codigo||"";
    msgEq("O código não pode ficar em branco.",true); return;
  }
  msgEq("Salvando…");
  api("rpc/definir_codigo",{method:"POST",body:{p_user_id:p.user_id,p_codigo:novo}})
    .then(function(){
      p.codigo=novo;
      if(campo) campo.value=novo;
      msgEq("Código de "+(p.nome||p.email)+" agora é "+novo+".");
    })
    .catch(function(e){
      if(campo) campo.value=p.codigo||"";
      msgEq(String(e.message||e),true);
    });
}
function copiarCodigo(i){
  var p=EQUIPE[i]; if(!p||!p.codigo) return;
  var pronto=function(){ msgEq("Código "+p.codigo+" copiado."); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(p.codigo).then(pronto,function(){ selecionarCodigo(i); });
  } else { selecionarCodigo(i); }
}
/* Sem area de transferencia (http, permissao negada): seleciona o texto
   para que Ctrl+C resolva, em vez de nao acontecer nada. */
function selecionarCodigo(i){
  var campo=document.getElementById("eqcod"+i);
  if(campo){ campo.focus(); campo.select(); msgEq("Use Ctrl+C para copiar."); }
}

function definirPapelCrm(i,papel){
  var p=EQUIPE[i]; if(!p) return;
  /* Assessor puro não carrega produto de especialista — mas um admin pode
     também atender produto (ex.: admin que também é especialista em
     Consórcio), então só zera produtos ao virar "vendedor". */
  var mantemProdutos=papel==="especialista"||papel==="admin";
  msgEq("Salvando…");
  api("rpc/definir_papel_crm",{method:"POST",
      body:{p_user_id:p.user_id,p_role:papel,p_status:"ativo",
            p_produtos:(mantemProdutos?(p.crm_produtos||[]):[])}})
    .then(function(){
      p.crm_role=papel; p.crm_status="ativo";
      if(!mantemProdutos) p.crm_produtos=[];
      pintarEquipe();
      msgEq("Papel no CRM de "+(p.nome||p.email)+" agora é "+papel+".");
    })
    .catch(function(e){ msgEq(String(e.message||e),true); });
}
function alternarProduto(i,prod,ligado){
  var p=EQUIPE[i]; if(!p) return;
  var lista=(p.crm_produtos||[]).slice();
  var k=lista.indexOf(prod);
  if(ligado && k<0) lista.push(prod);
  if(!ligado && k>=0) lista.splice(k,1);
  msgEq("Salvando…");
  /* Mantém o papel atual (admin continua admin) — só o especialista puro
     precisava ser forçado aqui antes de existir a opção de marcar produto
     no admin também. */
  api("rpc/definir_papel_crm",{method:"POST",
      body:{p_user_id:p.user_id,p_role:p.crm_role||"especialista",p_status:p.crm_status||"ativo",p_produtos:lista}})
    .then(function(){ p.crm_produtos=lista; pintarEquipe();
      msgEq("Produtos de "+(p.nome||p.email)+": "+(lista.join(", ")||"nenhum")); })
    .catch(function(e){ msgEq(String(e.message||e),true); });
}

function enviarConvite(){
  var g=function(id){ var e=document.getElementById(id); return e?e.value.trim():""; };
  var c=function(id){ var e=document.getElementById(id); return !!(e&&e.checked); };
  var email=g("cvEmail").toLowerCase(), nome=g("cvNome");
  if(!nome){ msgEq("Informe o nome.",true); return; }
  if(email.indexOf("@")<1){ msgEq("E-mail inválido.",true); return; }
  msgEq("Enviando…");
  api("rpc/convidar",{method:"POST",body:{
    p_email:email, p_nome:nome, p_role:g("cvRole"),
    p_master:c("cvMaster"), p_admin:c("cvAdmin"), p_mesa_rv:c("cvRv"), p_produtos:[], p_financeiro:c("cvFin")}})
    .then(function(){
      msgEq("Convite criado. Enviando o e-mail de boas-vindas…");
      return enviarEmailConvite(email).then(function(){
        msgEq("Convite enviado. "+nome+" recebeu o e-mail de boas-vindas em "+email+".");
      },function(err){
        msgEq("Convite criado, mas o e-mail não saiu: "+String(err.message||err)+
              " Avise "+nome+" para entrar em adamicaptal.com.br/hub pelo \"Primeiro acesso\", "+
              "ou use \"reenviar e-mail\" na lista abaixo.",true);
      }).then(function(){ return abrirEquipe(); });
    })
    .catch(function(e){ msgEq(String(e.message||e),true); });
}
/* O e-mail de boas-vindas sai pela função enviar-convite do Supabase
   (supabase/functions/enviar-convite). Ela só envia para convite pendente e só
   para master: quem confere é o banco, pela mesma sessão de quem clicou. */
function enviarEmailConvite(email,jaTentou){
  var tk=(SESSAO&&SESSAO.access_token)||"";
  return fetch(SB_URL+"/functions/v1/enviar-convite",{
    method:"POST",
    headers:{"apikey":SB_KEY,"Authorization":"Bearer "+tk,"Content-Type":"application/json"},
    body:JSON.stringify({email:email})
  }).then(function(res){
    if(res.status===401&&SESSAO&&!jaTentou)
      return renovar().then(function(){ return enviarEmailConvite(email,true); });
    return res.text().then(function(t){
      var j=null; try{ j=t?JSON.parse(t):null; }catch(e){}
      if(res.status===404) throw new Error("A função de e-mail ainda não foi instalada no Supabase.");
      if(!res.ok) throw new Error((j&&(j.erro||j.message||j.msg))||("Erro "+res.status+"."));
      return j;
    });
  });
}
function reenviarConvite(email){
  msgEq("Reenviando o e-mail de boas-vindas para "+email+"…");
  enviarEmailConvite(email)
    .then(function(){ msgEq("E-mail de boas-vindas reenviado para "+email+"."); })
    .catch(function(e){ msgEq("O e-mail não saiu: "+String(e.message||e),true); });
}

}

function api(path,opts,jaTentou){
  opts=opts||{};
  var tk=(SESSAO&&SESSAO.access_token)||SB_KEY;
  var h={"apikey":SB_KEY,"Authorization":"Bearer "+tk,"Content-Type":"application/json"};
  if(opts.prefer) h["Prefer"]=opts.prefer;
  return fetch(SB_URL+"/rest/v1/"+path,{method:opts.method||"GET",headers:h,body:opts.body?JSON.stringify(opts.body):undefined})
    .then(function(res){
      if(res.status===401&&SESSAO&&!jaTentou){
        return renovar().then(function(){ return api(path,opts,true); })
          .catch(function(){ limparSessao(); render(); throw new Error("Sua sessão expirou. Entre novamente."); });
      }
      if(!res.ok) return res.text().then(function(t){ throw new Error(t||("HTTP "+res.status)); });
      return res.status===204?null:res.json();
    });
}

}

function brl2(v){ return "R$ "+(v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function brlC(v){ var a=Math.abs(v||0); if(a>=1e6) return "R$ "+(v/1e6).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})+" mi"; if(a>=1e3) return "R$ "+(v/1e3).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+" mil"; return brl(v); }
function usd(v){ return "US$ "+Math.round(v||0).toLocaleString("pt-BR"); }
function usd2(v){ return "US$ "+(v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function usdC(v){ var a=Math.abs(v||0); if(a>=1e6) return "US$ "+(v/1e6).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})+" mi"; if(a>=1e3) return "US$ "+(v/1e3).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+" mil"; return usd(v); }
function mo(v,cur){ return cur==="USD"?usd(v):brl(v); }
function mo2(v,cur){ return cur==="USD"?usd2(v):brl2(v); }
function moC(v,cur){ return cur==="USD"?usdC(v):brlC(v); }
function ptaxFmt(v){ return v?"R$ "+Number(v).toLocaleString("pt-BR",{minimumFractionDigits:4,maximumFractionDigits:4}):"\u2014"; }
function pct(v,d){ d=d==null?2:d; return (v||0).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d})+"%"; }
function sinal(v){ return v>0?"pos":(v<0?"neg":""); }
/* destaca os digitos: simbolo de moeda e de % ficam menores e discretos */
function nv(txt){
  return String(txt==null?"":txt)
    .replace(/^(R\$|US\$)\s*/,'<span class="uni">$1</span>')
    .replace(/%$/,'<span class="uni">%</span>');
}
function ref(m,a){ return MESES_C[m-1]+"/"+String(a).slice(2); }
function dataBase(m,a){

  return String(ultimo).padStart(2,"0")+"/"+String(m).padStart(2,"0")+"/"+a;
}
function moedaParse(str){
  var t=String(str==null?"":str).replace(/\./g,"").replace(",",".").replace(/[^0-9.\-]/g,"");
  var v=parseFloat(t); return isNaN(v)?0:v;
}
function moedaFmt(v){
  if(!v) return "";
  return Number(v).toLocaleString("pt-BR",{minimumFractionDigits:0,maximumFractionDigits:2});
}
/* Aplicacoes e resgates sao MOVIMENTOS, sempre positivos: o sinal ja
   esta na formula da abertura (saldo - rend - apl + res). Um resgate
   negativo inverte a soma e erra a abertura em DUAS vezes o valor.   */
function onMoedaPos(el,cb){
  el.value=String(el.value).replace(/-/g,"");
  return onMoeda(el,function(v){ cb(Math.abs(v)); });
}
function onMoeda(el,cb){
  var bruto=el.value, fim=(el.selectionStart===bruto.length);
  var v=moedaParse(bruto);
  cb(v);
  var f=/,\d{0,2}$/.test(bruto)?bruto.replace(/[^0-9.,]/g,""):moedaFmt(v);
  el.value=f;
  if(fim){ try{ el.selectionStart=el.selectionEnd=el.value.length; }catch(e){} }
}
function contaVazia(cur){ return {nome:"",inst:"",saldo:0,apl:0,res:0,rendPct:0,rendRs:0,moeda:(cur==="USD"?"USD":"BRL")}; }
function curDe(c){ return (c&&c.moeda==="USD")?"USD":"BRL"; }
function contasDe(r,cur){ cur=(cur==="USD")?"USD":"BRL"; return ((r&&r.contas)?r.contas:[]).filter(function(c){ return curDe(c)===cur; }); }
function indVazio(){ var o={}; IND.forEach(function(p){o[p[0]]=0;}); o.carta=""; o.vencimentos=[]; o.ativos=[]; o.estrategias={}; ESTRAT.forEach(function(e){o.estrategias[e[0]]=0;}); return o; }
/* Distribuição por estratégia: soma a posição de cada ativo pela subcategoria
   que o assessor marcou nele, e converte em % da carteira. Enquanto o mes
   nao tiver nenhum ativo com subcategoria marcada — relatorios antigos, de
   antes deste campo existir — cai no formato velho (percentuais digitados
   à mao em ind.estrategias), pra esses meses nao ficarem com o gráfico
   vazio do nada. */
function listaEstrat(ind){
  var ativos=listaAtivos(ind);
  var porSub={};
  ativos.forEach(function(x){
    var s=x.subcategoria; if(!s) return;
    porSub[s]=(porSub[s]||0)+n(x.posicao);
  });
  var total=SUBCATEGORIAS_ATIVO.reduce(function(a,s){ return a+Math.max(0,porSub[s]||0); },0);
  if(total>0){
    return SUBCATEGORIAS_ATIVO.map(function(s){ return {nome:s,pc:porSub[s]?(porSub[s]/total*100):0}; })
      .filter(function(x){ return x.pc>0; });
  }
  var e=(ind&&ind.estrategias)||{};
  return ESTRAT.map(function(x){ return {nome:x[1],pc:n(e[x[0]])}; }).filter(function(x){ return x.pc>0; });
}
function vencVazio(){ return {ativo:"",inst:"",taxa:"",data:"",valor:0}; }
var CATEGORIAS_ATIVO=["Renda Fixa","COE","Fundos","Previdência","Renda Variável"];
/* Taxa e vencimento fazem sentido nessas duas — as demais não têm
   essa mecânica (fundo e previdência não vencem; renda variável não tem taxa). */
var CATEGORIAS_COM_PRAZO=["Renda Fixa","COE"];
var SUBCATEGORIAS_ATIVO=["Pós-fixado","Pré-fixado","Inflação","Multimercado","Alternativo","Derivativo"];
/* Quantas linhas de ativo cabem numa página impressa, calibrado com
   Playwright (renderizando nomes reais de ativo, que quebram linha em
   colunas estreitas) contra a altura útil de uma folha A4. Usa sempre o
   orçamento da paisagem (297x210mm), que é o mais apertado dos dois formatos
   de impressão — assim a mesma lista de páginas nunca estoura nem em
   retrato nem em paisagem, sem precisar saber de antemão qual botão de
   impressão o usuário vai clicar. Valores em pixels a 96dpi (1mm=3,7795px).
   alturaPagina já vem com ~5% de folga sobre os 210mm físicos (794px). */
var PADRAO_LINHAS_ATIVOS={
  alturaPagina:754,
  overheadComTitulo:360,  // cabeçalho da seção + título da categoria + preenchimentos + cabeçalho da tabela
  overheadSemTitulo:240,  // sem o cabeçalho da seção (só acontece na 1ª página de toda a Lista de ativos)
  subtotal:35,
  linhaComTaxa:95,        // Renda Fixa/COE: colunas mais estreitas (têm taxa e vencimento), quebram mais
  linhaSemTaxa:55         // Fundos/Previdência/Renda Variável: coluna do ativo mais larga
};
/* Altura de uma página inteira de ativos (mesmo cálculo do maxLinhas, só que
   pra frente: dado o nº de linhas que already vai ter, quanto ela mede).
   Como maxLinhas() nunca deixa um pedaço passar desse valor, todo pedaço de
   Lista de ativos entra no empacotador de páginas com uma estimativa seura. */
function alturaAtivosChunk(comRF,nLinhas,primeiraPagina){
  var p=PADRAO_LINHAS_ATIVOS;
  var overhead=primeiraPagina?p.overheadComTitulo:p.overheadSemTitulo;
  var porLinha=comRF?p.linhaComTaxa:p.linhaSemTaxa;
  return overhead+nLinhas*porLinha+p.subtotal;
}
/* Estimativas de altura (px a 96dpi) das demais seções "pequenas" do
   relatório — calibradas com Playwright contra conteúdo real (mesma técnica
   da Lista de ativos), com folga extra por cima do que foi medido, porque
   aqui só há um cliente de referência pra calibrar. Servem só pra decidir
   se duas seções cabem juntas na mesma folha impressa; sem estimativa
   (carta do mês, offshore, patrimônio de abertura), a seção sempre fica
   sozinha na página dela — igual já era antes desta otimização. */
function alturaTabelaSimples(nLinhas){ return 160+nLinhas*82; }
function alturaPizzaComLista(nItens){ return 530+nItens*50; }
function alturaPizzaComTabela(nItens){ return 640+nItens*12; }
var ALTURA_DISCLAIMER=550;
function ativoVazio(){ return {nome:"",categoria:CATEGORIAS_ATIVO[0],subcategoria:"",inst:"",taxa:"",vencimento:"",posicao:0,rentMes:0,rentAno:0,rent12m:0,rentInicio:0}; }
/* Distribuição por categoria: mesma soma por posição de listaEstrat, só que
   agrupando pela categoria do ativo (Renda Fixa, COE, Fundos...) em vez da
   subcategoria. */
function listaConsolidado(ind){
  var ativos=listaAtivos(ind);
  var porCat={};
  ativos.forEach(function(x){
    var c=x.categoria||CATEGORIAS_ATIVO[0];
    porCat[c]=(porCat[c]||0)+n(x.posicao);
  });
  var total=CATEGORIAS_ATIVO.reduce(function(a,c){ return a+Math.max(0,porCat[c]||0); },0);
  if(total<=0) return [];
  return CATEGORIAS_ATIVO.map(function(c){ return {nome:c,pc:porCat[c]?(porCat[c]/total*100):0}; })
    .filter(function(x){ return x.pc>0; });
}
/* separa o que vence DENTRO do mes de referencia do que ainda esta por vir.
   O relatorio de agosto sai em setembro: um vencimento de 15/08 nao e
   "proximo", ja aconteceu, e o cliente quer saber o que foi feito com ele. */
function vencDoMes(lista,mes,ano){
  var ini=ano+"-"+(mes<10?"0":"")+mes+"-01";
  var pm=mes===12?1:mes+1, pa=mes===12?ano+1:ano;
  var fim=pa+"-"+(pm<10?"0":"")+pm+"-01";
  var dentro=[],futuros=[];
  lista.forEach(function(v){
    if(v.data && String(v.data)>=ini && String(v.data)<fim) dentro.push(v);
    else futuros.push(v);
  });
  return {dentro:dentro,futuros:futuros};
}
/* Próximos vencimentos a partir da lista de ativos (3.22): todo título (CDB, CRA, NTN-B...)
   que vence entre o começo do mês de referência e os próximos HORIZONTE_VENC_MESES meses
   entra sozinho, marcado como automático. A cada mês o rascunho novo refaz a conta: o que
   venceu sai, o que entrou na janela aparece, e o valor acompanha a posição. Os lançados à
   mão nunca são apagados por aqui. */
var HORIZONTE_VENC_MESES=12;
function atualizarVencimentos(r,mes,ano){
  if(!r||!r.ind) return {novos:0,removidos:0};
  var dt=function(m,a){ while(m>12){ m-=12; a++; } return a+"-"+(m<10?"0":"")+m+"-01"; };
  var ini=dt(mes,ano), fimMes=dt(mes+1,ano), lim=dt(mes+1+HORIZONTE_VENC_MESES,ano);
  var titulos=((r.ind.ativos)||[]).filter(function(x){ var d=String(x.vencimento||""); return ehTitulo(x)&&d.length===10&&d>=ini&&d<lim&&n(x.posicao)>0; });
  var mesmo=function(v,t){ return v.data===t.vencimento&&instChave(v.inst)===instChave(t.inst)&&ativoNomeChave({nome:v.ativo})===ativoNomeChave(t); };
  var parecido=function(v,t){ if(v.data!==t.vencimento||instChave(v.inst)!==instChave(t.inst)) return false;
    var a=ativoNomeChave({nome:v.ativo}), b=ativoNomeChave(t), w=function(p,q){ var x=p.split(" "), y=" "+q+" "; return x.every(function(k){ return y.indexOf(" "+k+" ")>=0; }); };
    return w(a,b)||w(b,a)||(n(t.posicao)>0&&Math.abs(n(v.valor)-n(t.posicao))/n(t.posicao)<0.15); };
  var lista=((r.ind.vencimentos)||[]).filter(function(v){ return (v.ativo||"").trim()||n(v.valor)||v.data; });
  var removidos=0, novos=0;
  lista=lista.filter(function(v){
    if(!v.auto) return true;
    if(!v.data||v.data<ini) return false;
    if(v.data<fimMes) return true;                 /* venceu dentro do mês: fica para o "Venceu em" */
    var fica=titulos.some(function(t){ return mesmo(v,t); });
    /* só conta como "saiu" se nenhum título da mesma instituição vence na mesma data (troca de nome não é saída) */
    if(!fica&&!titulos.some(function(t){ return t.vencimento===v.data&&(!instChave(v.inst)||instChave(t.inst)===instChave(v.inst)); })) removidos++;
    return fica;
  });
  titulos.forEach(function(t){
    var auto=lista.filter(function(v){ return v.auto&&mesmo(v,t); })[0];
    if(auto){ auto.valor=Math.round(n(t.posicao)*100)/100; auto.taxa=t.taxa||auto.taxa; return; }
    if(lista.some(function(v){ return !v.auto&&parecido(v,t); })) return;   /* já lançado à mão */
    lista.push({ativo:t.nome,inst:t.inst||"",taxa:t.taxa||"",data:t.vencimento,valor:Math.round(n(t.posicao)*100)/100,auto:true}); novos++;
  });
  lista.sort(function(a,b){ return (a.data||"9999").localeCompare(b.data||"9999"); });
  r.ind.vencimentos=lista;
  return {novos:novos,removidos:removidos,total:lista.length};
}

}

}
/* Ativo sem rentabilidade de 12 meses: comprado há menos de 12 meses (o BTG mostra "-").
   Meses gravados antes da 3.22 têm 0 nesse caso; 12 meses zerado com rentabilidade desde o
   início diferente de zero é esse caso, não um 0,00% de verdade. */
function semDozeMeses(x){
  var v=x.rent12m;
  if(v===null||v===undefined||v==="") return true;
  return n(v)===0&&n(x.rentInicio)!==0;
}

}

  return p.length===3?(p[2]+"/"+p[1]+"/"+p[0]):d;
}
