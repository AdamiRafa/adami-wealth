/* ============ carga ============ */
function carregar(){
  status("wait","Carregando…");
  return Promise.all([
    api("clientes?select=id,nome,assessor_id,contas_btg,lead_id,emails_relatorio&order=nome.asc").catch(function(){ return api("clientes?select=id,nome,assessor_id,contas_btg&order=nome.asc"); }).catch(function(){ return api("clientes?select=id,nome,assessor_id&order=nome.asc").catch(function(){ return api("clientes?select=id,nome&order=nome.asc"); }); }),
    api("lancamentos?select=cliente_id,mes,ano,contas,indicadores,atualizado_em,feito_em,feito_por")
      .catch(function(){ return api("lancamentos?select=cliente_id,mes,ano,contas,indicadores"); }),
    api("cartas?select=mes,ano,conteudo").catch(function(){ return []; }),
    api("perfis?select=user_id,nome,admin,mesa_rv,super").catch(function(){ return api("perfis?select=user_id,nome,admin").catch(function(){ return []; }); }),
    api("rpc/minhas_permissoes",{method:"POST",body:{}}).catch(function(){ return null; })
  ]).then(function(r){
    if(SESSAO&&!SESSAO.id){ SESSAO.id=idDoToken(SESSAO.access_token||""); try{ localStorage.setItem("aw_sessao",JSON.stringify(SESSAO)); }catch(e){} }
    PERFIS={}; (r[3]||[]).forEach(function(x){ PERFIS[x.user_id]={nome:x.nome||"",admin:!!x.admin,mesa_rv:!!x.mesa_rv,super:!!x.super}; });
    EU.id=(SESSAO&&SESSAO.id)||null;
    EU.admin=!!(EU.id&&PERFIS[EU.id]&&(PERFIS[EU.id].admin||PERFIS[EU.id].super));
    EU.super=!!(EU.id&&PERFIS[EU.id]&&PERFIS[EU.id].super);
    /* Perfis e acessos (2.94): o que a matriz da Equipe libera para esta pessoa.
       null = o banco ainda não tem a matriz (permissoes.sql): vale a regra antiga. */
    EU.perm=(r[4]&&r[4].permissoes)?r[4].permissoes:null;
    EU.perfis=(r[4]&&r[4].perfis)?r[4].perfis:[];
    if(EU.perm) EU.admin=EU.perm.indexOf("carteiras.todas")>=0;
    EU.nome=(EU.id&&PERFIS[EU.id]&&PERFIS[EU.id].nome)||((SESSAO&&SESSAO.email)||"").split("@")[0];
    db.clientes=r[0]||[];
    db.dados={};
    (r[1]||[]).forEach(function(l){
      db.dados[chave(l.cliente_id,l.mes,l.ano)]={contas:l.contas||[],ind:l.indicadores||indVazio(),
        atualizado_em:l.atualizado_em||null,feito_em:l.feito_em||null,feito_por:l.feito_por||null};
    });
    db.cartas={};
    (r[2]||[]).forEach(function(k){ db.cartas[chaveCarta(k.mes,k.ano)]=k.conteudo||""; });
    S.erro=null; status("ok","Sincronizado");
  }).catch(function(e){ S.erro=e.message; status("err","Sem conexão"); });
}
function recarregar(){
  var atual=S.cliente;
  carregar().then(function(){
    var existe=db.clientes.some(function(c){return c.id===atual;});
    S.cliente=existe?atual:(db.clientes.length?db.clientes[0].id:null);
    montarRascunho(); render();
  });
}
function montarRascunho(){
  PERF_RES=null;
  var id=S.cliente; if(!id){S.rasc=null;return;}
  var r=reg(id,S.mes,S.ano);
  if(r){ S.rasc=JSON.parse(JSON.stringify(r)); if(!S.rasc.ind) S.rasc.ind=indVazio(); S.rasc._herdado=false; aplicarIndices(); herdarOnshore(); herdarOffshore(); return; }
  var p=anterior(S.mes,S.ano),ant=null,t=0;
  while(t<24&&!ant){ ant=reg(id,p.mes,p.ano); if(!ant)p=anterior(p.mes,p.ano); t++; }
  if(ant){
    S.rasc={_herdado:true,contas:ant.contas.map(function(c){return {nome:c.nome,inst:c.inst,saldo:n(c.saldo),apl:0,res:0,rendPct:0,rendRs:0,moeda:curDe(c)};}),ind:indVazio()};
    if(ant.ind&&ant.ind.secoes) S.rasc.ind.secoes=JSON.parse(JSON.stringify(ant.ind.secoes));
    if(ant.ind&&ant.ind.bench) S.rasc.ind.bench=JSON.parse(JSON.stringify(ant.ind.bench));
    /* vencimentos passam de um mes para o outro; os que ja venceram ficam para tras.
       Sem data preenchida, o item segue em frente para nao sumir sem o usuario ver. */
    if(ant.ind&&ant.ind.vencimentos&&ant.ind.vencimentos.length){
      var corte=S.ano+"-"+(S.mes<10?"0":"")+S.mes+"-01";
      var trazidos=ant.ind.vencimentos.filter(function(x){
        if(!((x.ativo||"").trim()||n(x.valor)||x.data)) return false;   // linha em branco
        if(!x.data) return true;                                         // sem data: mantem
        return String(x.data)>=corte;                                    // ainda nao venceu
      });
      if(trazidos.length){
        S.rasc.ind.vencimentos=JSON.parse(JSON.stringify(trazidos));
        S.rasc._vencHerdados=trazidos.length;
      }
    }
    /* ativos passam de um mes para o outro: nome, categoria, subcategoria,
       instituicao, taxa, vencimento e posicao sao o ponto de partida ate o
       assessor atualizar. So a rentabilidade nasce zerada — o que rendeu no
       mes passado nao diz nada sobre este mes. */
    if(ant.ind&&ant.ind.ativos&&ant.ind.ativos.length){
      var ativosTrazidos=ant.ind.ativos.filter(function(x){ return (x.nome||"").trim()||n(x.posicao); })
        .map(function(x){
          return {nome:x.nome,categoria:x.categoria,subcategoria:x.subcategoria,inst:x.inst,
            taxa:x.taxa,vencimento:x.vencimento,posicao:x.posicao,
            rentMes:0,rentAno:0,rent12m:0,rentInicio:0};
        });
      if(ativosTrazidos.length){
        S.rasc.ind.ativos=ativosTrazidos;
        S.rasc._ativosHerdados=ativosTrazidos.length;
      }
      atualizarVencimentos(S.rasc,S.mes,S.ano);
    }
  }else{
    S.rasc={_herdado:false,contas:[contaVazia(),contaVazia()],ind:indVazio()};
  }
  aplicarIndices(); herdarOnshore(); herdarOffshore();
}
/* Conta em reais que existe no mes anterior mas nao neste. Acontece quando
   uma conta e cadastrada depois que os meses seguintes ja foram salvos: sem
   isso, cada mes seguinte teria de ser corrigido a mao.
   So traz conta que fechou o mes anterior com saldo POSITIVO — conta
   encerrada corretamente termina zerada e com resgate lancado, entao nao
   volta sozinha depois de ter sido fechada. */
function chaveConta(c){
  return ((c.nome||"").trim().toLowerCase())+"|"+((c.inst||"").trim().toLowerCase());
}
function herdarOnshore(){
  if(!S.rasc) return;
  S.rasc._onHerdado=0;
  var p=anterior(S.mes,S.ano),ant=null,t=0;
  while(t<24&&!ant){
    var rr=reg(S.cliente,p.mes,p.ano);
    if(rr&&contasDe(rr,"BRL").length) ant=rr; else p=anterior(p.mes,p.ano);
    t++;
  }
  if(!ant) return;
  var tem={};
  contasDe(S.rasc,"BRL").forEach(function(c){ tem[chaveConta(c)]=1; });
  contasDe(ant,"BRL").forEach(function(c){
    if(n(c.saldo)<=0) return;

                        apl:0,res:0,rendPct:0,rendRs:0,moeda:"BRL"});
    S.rasc._onHerdado++;
  });
}

function replicarIndices(mes,ano,origemId,ind){
  var vals={},chaves=[];
  INDGLOB.forEach(function(k){ var v=n(ind&&ind[k]); if(v){ vals[k]=v; chaves.push(k); } });
  if(!chaves.length) return Promise.resolve(0);
  var fila=[],qtd=0;
  db.clientes.forEach(function(c){
    if(c.id===origemId) return;
    var rr=reg(c.id,mes,ano); if(!rr) return;

    if(!dif) return;

    chaves.forEach(function(k){ novo[k]=vals[k]; });

      {method:"PATCH",prefer:"return=minimal",body:{indicadores:novo,atualizado_em:new Date().toISOString()}})
      .then(function(){ var d=db.dados[chave(c.id,mes,ano)]; if(d) d.ind=novo; }));
  });

/* ============ cálculos ============ */
/* saldo de abertura de uma conta = saldo final - rendimento - aplicações + resgates */
function abertura(c){
  var b=n(c.saldo)-n(c.rendRs)-n(c.apl)+n(c.res);
  return b>0?b:n(c.saldo);
}
function totais(r,cur){
  cur=(cur==="USD")?"USD":"BRL";
  if(!r) return {pl:0,rendRs:0,rendPct:0,apl:0,res:0,base:0};
  var pl=0,rs=0,apl=0,res=0,peso=0,pond=0;
  contasDe(r,cur).forEach(function(c){
    pl+=n(c.saldo); rs+=n(c.rendRs); apl+=n(c.apl); res+=n(c.res);
    var b=abertura(c);
    if(b>0){ peso+=b; pond+=n(c.rendPct)*b; }
  });
  return {pl:pl,rendRs:rs,rendPct:peso>0?pond/peso:0,apl:apl,res:res,base:peso};
}
function serieAno(id,ano,ateMes,cur){
  cur=(cur==="USD")?"USD":"BRL";
  var out=[],lim=ateMes||12;
  for(var m=1;m<=lim;m++){ var r=reg(id,m,ano); if(!r) continue; if(!contasDe(r,cur).length) continue; var t=totais(r,cur);
    out.push({mes:m,ano:ano,pl:t.pl,rendPct:t.rendPct,rendRs:t.rendRs,apl:t.apl,res:t.res,cdi:n(r.ind&&r.ind.cdi)}); }
  return out;
}
function comp(vals){ var f=1; vals.forEach(function(v){ f*=(1+v/100); }); return (f-1)*100; }
/* serie mes a mes ate (mes/ano); nMeses=0 -> desde o primeiro lancamento */
function serieHist(id,mes,ano,cur,nMeses){
  cur=(cur==="USD")?"USD":"BRL";
  var out=[],p={mes:mes,ano:ano},lim=nMeses||600,vazios=0;
  for(var i=0;i<lim;i++){
    var r=reg(id,p.mes,p.ano);
    if(r&&contasDe(r,cur).length){
      var t=totais(r,cur);
      out.unshift({mes:p.mes,ano:p.ano,pl:t.pl,rendPct:t.rendPct,rendRs:t.rendRs,ind:r.ind||{}});
      vazios=0;
    }else{
      vazios++;
      if(!nMeses&&out.length&&vazios>24) break;
      if(!nMeses&&!out.length&&vazios>240) break;
    }
    p=anterior(p.mes,p.ano);
  }
  return out;
}
/* rentabilidade composta da carteira e resultado somado num recorte */
function agregado(serie){
  return { pct:comp(serie.map(function(x){return x.rendPct;})),
           rs:serie.reduce(function(a,x){return a+x.rendRs;},0),
           meses:serie.length };
}
/* rentabilidade composta de um indicador no recorte; null se nunca informado */
function benchAcum(serie,chaveInd){
  var tem=false,vals=serie.map(function(x){ var v=n(x.ind&&x.ind[chaveInd]); if(v) tem=true; return v; });
  return tem?comp(vals):null;
}
/* quantos meses do recorte tem o indicador preenchido */
function benchMeses(serie,chaveInd){
  return serie.filter(function(x){ return n(x.ind&&x.ind[chaveInd])!==0; }).length;
}
/* rentabilidade composta de uma conta nos últimos N meses até (mes/ano) */
function contaAcum(id,nome,mes,ano,nMeses){
  var vals=[],p={mes:mes,ano:ano};
  for(var i=0;i<nMeses;i++){
    var r=reg(id,p.mes,p.ano);
    if(r){ r.contas.forEach(function(c){ if((c.nome||"")===nome) vals.unshift(n(c.rendPct)); }); }
    p=anterior(p.mes,p.ano);
  }
  return vals.length?comp(vals):null;
}
function porInstituicao(r,cur){
  var map={},tot=0;
  contasDe(r,cur).forEach(function(c){
    var k=((c.inst||"").trim())||"Sem instituição";
    if(!map[k]) map[k]={nome:k,valor:0,rendRs:0};
    map[k].valor+=n(c.saldo); map[k].rendRs+=n(c.rendRs); tot+=n(c.saldo);
  });
  return Object.keys(map).map(function(k){var o=map[k];o.pc=tot>0?o.valor/tot*100:0;return o;}).sort(function(a,b){return b.valor-a.valor;});
}

/* ============ ações ============ */
/* ===================== Puxar do BTG (fase 3, btg_rentabilidade.sql) =====================
   Lê a Rentabilidade Mensal do BTG das contas BTG do cliente e preenche o rascunho do mês:
   a conta BTG (saldo, movimentação, resultado), os ativos do BTG, a alocação por estratégia
   e os índices que estiverem vazios. Contas e ativos de outros bancos ficam como estão.
   Nada grava até "Salvar mês". Números do BTG chegam como texto ("1.234,56", "0,0105",
   "1.06E+07"), e rentabilidade em fração (0,0105 = 1,05%). */
function numBtg(v){
  var s=String(v==null?"":v).trim(); if(!s) return 0;
  if(/^-?[0-9.]+,[0-9]+$/.test(s)) s=s.replace(/\./g,"").replace(",",".");
  else if(/^-?[0-9]+,[0-9]+$/.test(s)) s=s.replace(",",".");
  var x=parseFloat(s); return isNaN(x)?0:x;
}
function pctBtg(v){ return Math.round(numBtg(v)*100*10000)/10000; }
function ehBtg(inst){ return /btg/i.test(String(inst||"")); }
function categoriaBtg(m){
  var t=String(m||"").toUpperCase();
  if(/COE/.test(t)) return "COE";
  if(/PREV/.test(t)) return "Previdência";
  if(/RV|ACAO|ACOES|AÇÃO|AÇÕES|EQUIT|BOLSA|FII|OPC|DERIV|CRIPT|CRYPT|BDR|ETF/.test(t)) return "Renda Variável";
  if(/FUND|^FI/.test(t)) return "Fundos";
  return "Renda Fixa";
}
function estratBtg(nome){
  var t=String(nome||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  if(/pos/.test(t)) return "pos";
  if(/pre/.test(t)) return "pre";
  if(/infla/.test(t)) return "infl";
  if(/multi|retorno absoluto/.test(t)) return "ma";
  if(/variavel|acoes/.test(t)) return "rv";
  if(/intern|global|exterior|offshore/.test(t)) return "intl";
  if(/altern/.test(t)) return "alt";
  return null;
}
function editarContasBtg(){

    var v=prompt(txt, atual||(sug&&sug.length?sug.map(function(x){return x.nr_conta;}).filter(function(x,i,a){return a.indexOf(x)===i;}).join(", "):""));

      .catch(function(e){ status("err","Não salvou"); alert("Não foi possível salvar as contas: "+(e.message||e)+"\n\nSe o erro falar de \"contas_btg\", falta instalar o btg_rentabilidade.sql no Supabase."); });
  });

function puxarBtg(){
  var c=cli(); if(!c||!S.rasc) return;
  if(!c.contas_btg||!c.contas_btg.length){
    if(confirm("Informe antes a conta BTG de "+c.nome+". Abrir agora?")) editarContasBtg();

  }
  status("wait","Buscando no BTG…");
  api("rpc/btg_rent_cliente",{method:"POST",body:{p_cliente:c.id,p_mes:S.mes,p_ano:S.ano}}).then(function(d){
    status("ok","Sincronizado");
    var mesTxt=MESES[S.mes-1]+"/"+S.ano;
    var fmtMes=function(iso){ if(!iso) return null; var p=String(iso).slice(0,7).split("-"); return MESES[Number(p[1])-1]+"/"+p[0]; };
    if(!d||!d.carteira||!d.carteira.length){
      var msg="O BTG ainda não mandou "+mesTxt+" para a(s) conta(s) "+((d&&d.contas)||c.contas_btg).join(", ")+".";
      if(d&&d.ultimo_mes) msg+="\n\nÚltimo mês recebido para este cliente: "+fmtMes(d.ultimo_mes)+".";

      alert(msg); return;
    }
    var contas=d.carteira.map(function(x){
      var k=x.dados||{}, liq=numBtg(k.inflow_and_outflow);
      return {nome:"BTG "+x.nr_conta, inst:"BTG Pactual", saldo:numBtg(k.auc_end), apl:liq>0?liq:0, res:liq<0?-liq:0,
              rendRs:numBtg(k.profit_mtd), rendPct:pctBtg(k.profitability_mtd), moeda:"BRL"};
    });
    var ativos=(d.produtos||[]).filter(function(x){ return Math.abs(numBtg((x.dados||{}).auc_end))>0.005; }).map(function(x){
      var k=x.dados||{};
      return {nome:k.product_name||k.product_key||("Produto "+(k.product_id||"")), categoria:categoriaBtg(k.market_id), subcategoria:"",
              inst:"BTG Pactual", taxa:"", vencimento:"", posicao:numBtg(k.auc_end),
              rentMes:pctBtg(k.profitability_mtd), rentAno:pctBtg(k.profitability_ytd), rent12m:pctBtg(k.profitability_12m), rentInicio:pctBtg(k.profitability_ttd)};
    });
    var porEst={}, totEst=0, semMapa=[];
    (d.estrategias||[]).forEach(function(x){
      var v=numBtg((x.dados||{}).auc_end); if(v<=0) return;
      var k=estratBtg(x.estrategia); totEst+=v;
      if(k) porEst[k]=(porEst[k]||0)+v; else if(semMapa.indexOf(x.estrategia)<0) semMapa.push(x.estrategia);
    });
    var k0=(d.carteira[0]&&d.carteira[0].dados)||{};
    var indBtg={cdi:k0.cdi_mtd, ipca:k0.imab_mtd, ibov:k0.ibovespa_mtd, dolar:k0.dolar_mtd, ifix:k0.ifix_mtd};
    var indNovos=Object.keys(indBtg).filter(function(x){ return indBtg[x]!=null&&String(indBtg[x]).trim()!==""&&!n(S.rasc.ind[x]); });

    var saldo=contas.reduce(function(a,x){return a+x.saldo;},0), res=contas.reduce(function(a,x){return a+x.rendRs;},0);
    var outrasContas=S.rasc.contas.filter(function(x){ return !ehBtg(x.inst)&&((x.nome||"").trim()||n(x.saldo)); }).length;
    var outrosAtivos=(S.rasc.ind.ativos||[]).filter(function(x){ return !ehBtg(x.inst)&&((x.nome||"").trim()||n(x.posicao)); }).length;
    var txt="BTG, "+mesTxt+", "+contas.length+" conta(s):\n\n"+
      "Saldo: "+brl2(saldo)+"\nResultado do mês: "+brl2(res)+(contas.length===1?" ("+pct(contas[0].rendPct)+")":"")+"\n"+
      "Ativos: "+ativos.length+"\n"+
      (totEst?"Alocação por estratégia: "+Object.keys(porEst).length+" estratégia(s)"+(semMapa.length?" (sem correspondência: "+semMapa.join(", ")+")":"")+"\n":"")+
      (indNovos.length?"Índices preenchidos (estavam vazios): "+indNovos.map(function(x){ return ({cdi:"CDI",ipca:"IMA-B",ibov:"Ibovespa",dolar:"Dólar",ifix:"IFIX"})[x]; }).join(", ")+"\n":"")+
      "\nIsso substitui a conta e os ativos do BTG deste mês."+
      ((outrasContas||outrosAtivos)?" Ficam como estão "+outrasContas+" conta(s) e "+outrosAtivos+" ativo(s) de outros bancos.":"")+
      "\nNada é gravado até você clicar em \"Salvar mês\". Continuar?";
    if(!confirm(txt)) return;

    guardarAntesImportacao("BTG");
    S.rasc.contas=S.rasc.contas.filter(function(x){ return !(curDe(x)==="BRL"&&ehBtg(x.inst)); }).concat(contas);
    S.rasc.ind.ativos=(S.rasc.ind.ativos||[]).filter(function(x){ return !ehBtg(x.inst); }).concat(ativos);
    if(totEst){ var e={}; ESTRAT.forEach(function(x){ e[x[0]]=porEst[x[0]]?Math.round(porEst[x[0]]/totEst*10000)/100:0; }); S.rasc.ind.estrategias=e; }
    indNovos.forEach(function(x){ S.rasc.ind[x]=pctBtg(indBtg[x]); });
    S.rasc._herdado=false; S.rasc._btg=true;
    registrar("puxou do BTG",c.nome,mesTxt);
    render(true);
    alert("Pronto. A Conferência, no alto, mostra o que mudou e o que não bate. Confira e salve.");
  }).catch(function(e){
    status("err","Erro");
    var m=String(e.message||e);
    alert(/btg_rent_cliente|does not exist|404/.test(m)?"O \"Puxar do BTG\" ainda não foi instalado no Supabase (btg_rentabilidade.sql).":"Não foi possível buscar no BTG: "+m);
  });
}

function renomear(){
  var c=cli(); if(!c) return;
  var nome=prompt("Nome do cliente:",c.nome); if(!nome) return;
  status("wait","Salvando…");
  api("clientes?id=eq."+c.id,{method:"PATCH",body:{nome:nome.trim()}})
    .then(function(){ registrar("renomeou cliente",c.nome,"para "+nome.trim()); c.nome=nome.trim(); status("ok","Sincronizado"); render(); }).catch(falha);
}
function excluirCliente(){
  var c=cli(); if(!c) return;
  if(!confirm("Excluir "+c.nome+" e todos os meses lançados? Não é possível desfazer.")) return;
  status("wait","Excluindo…");
  var nomeExcluido=c.nome;
  api("clientes?id=eq."+c.id,{method:"DELETE"}).then(function(){
    registrar("excluiu cliente",nomeExcluido,"");
    db.clientes=db.clientes.filter(function(x){return x.id!==c.id;});
    Object.keys(db.dados).forEach(function(k){ if(k.indexOf(c.id+"|")===0) delete db.dados[k]; });
    S.cliente=db.clientes.length?db.clientes[0].id:null;
    status("ok","Sincronizado"); montarRascunho(); render();
  }).catch(falha);
}
function salvarMes(opts){
  opts=opts||{};
  if(!S.cliente){ alert("Selecione um cliente."); return; }
  var contas=S.rasc.contas.filter(function(c){return (c.nome||"").trim()||n(c.saldo);});
  if(!contas.length){ alert("Informe ao menos uma conta com nome ou saldo."); return; }
  var b=document.getElementById("btnSalvar"); if(b){b.disabled=true;b.textContent="Salvando…";}
  status("wait","Salvando…");
  var agora=new Date().toISOString(), corpo={cliente_id:S.cliente,mes:S.mes,ano:S.ano,contas:contas,indicadores:limparInternos(S.rasc.ind),atualizado_em:agora};
  if(opts.feito) corpo.feito_em=agora;
  var antes=reg(S.cliente,S.mes,S.ano)||{};
  api("lancamentos?on_conflict=cliente_id,mes,ano",{method:"POST",prefer:"resolution=merge-duplicates,return=representation",body:corpo})
    .then(function(rows){
      var x=(rows&&rows[0])||{};
      db.dados[chave(S.cliente,S.mes,S.ano)]={contas:contas,ind:corpo.indicadores,atualizado_em:agora,
        feito_em:x.feito_em!==undefined?x.feito_em:(opts.feito?agora:antes.feito_em||null),
        feito_por:x.feito_por!==undefined?x.feito_por:(opts.feito?EU.id:antes.feito_por||null)};
      if(opts.feito) registrar("marcou mês como feito",(cli()||{}).nome||"",MESES[S.mes-1]+"/"+S.ano);
      var cc=cli(), contaP=S.rasc&&S.rasc._contaPerf;
      if(cc&&contaP&&!(cc.contas_btg&&cc.contas_btg.length)){ cc.contas_btg=[contaP]; api("clientes?id=eq."+cc.id,{method:"PATCH",prefer:"return=minimal",body:{contas_btg:[contaP]}}).catch(function(){}); }
      registrar("salvou lançamento",(cli()||{}).nome||"",MESES[S.mes-1]+"/"+S.ano+" · "+contas.length+(contas.length===1?" conta · ":" contas · ")+brl(totais({contas:contas}).pl));
      return replicarIndices(S.mes,S.ano,S.cliente,S.rasc.ind);
    })
    .then(function(qtd){
      status("ok",qtd?("Sincronizado · índices replicados para "+qtd+(qtd===1?" cliente":" clientes")):"Sincronizado");
      montarRascunho();
      /* Salvar sozinho leva ao relatório, como antes; "Salvar e marcar como feito" fica no
         Preencher, com o atalho para o próximo cliente pendente. */
      if(!opts.feito) S.tab="relatorio";
      render(); if(opts.feito) window.scrollTo(0,0);
    }).catch(function(e){
      if(opts.feito&&/feito_em|column/.test(String(e.message))) e=new Error("Falta instalar o carteiras_feito.sql no Supabase. O mês não foi salvo.");
      falha(e); if(b){b.disabled=false;b.textContent="Salvar mês e ver relatório";}
    });
}

function matchOpcaoAtivo(v,lista){
  var s=String(v||"").trim(); if(!s) return "";
  var achou=lista.filter(function(o){ return o.toLowerCase()===s.toLowerCase(); });
  return achou.length?achou[0]:null;
}
function parseNumPlanilha(v){
  if(v===undefined||v===null||v==="") return 0;
  if(typeof v==="number") return v;
  var s=String(v).trim().replace(/^R\$\s*/i,"").replace(/\s+/g,"");
  if(!s) return 0;
  if(s.indexOf(",")>=0 && s.indexOf(".")>=0){
    if(s.lastIndexOf(",")>s.lastIndexOf(".")) s=s.replace(/\./g,"").replace(",",".");
    else s=s.replace(/,/g,"");
  } else if(s.indexOf(",")>=0){ s=s.replace(",","."); }
  var x=parseFloat(s);
  return isNaN(x)?0:x;
}
function parseVencPlanilha(v){
  if(!v) return "";
  if(v instanceof Date) return v.toISOString().slice(0,10);
  var s=String(v).trim(); if(!s) return "";
  var m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[0].slice(0,10);
  m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/); if(m) return m[3]+"-"+m[2]+"-"+m[1];
  return s;
}
function importarAtivosArquivo(input){
  var f=input.files[0]; if(!f) return;
  if(typeof XLSX==="undefined"){ alert("A planilha ainda não carregou. Recarregue a página (Cmd+Shift+R) e tente de novo."); input.value=""; return; }
  var fr=new FileReader();
  fr.onload=function(){
    var linhas;
    try{
      var wb=XLSX.read(fr.result,{type:"array",cellDates:true});
      var ws=wb.Sheets["Ativos"]||wb.Sheets[wb.SheetNames[0]];
      linhas=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:true});
    }catch(e){
      alert("Não consegui ler esse arquivo. Confira se é um .xlsx e se as colunas não foram alteradas.\n\n"+e.message);
      input.value=""; return;
    }
    if(!linhas||linhas.length<2){ alert("Essa planilha não tem nenhuma linha de ativo preenchida."); input.value=""; return; }
    var novos=[], erros=[];
    for(var i=1;i<linhas.length;i++){
      var l=linhas[i]; if(!l) continue;
      var categoria=String(l[0]||"").trim();
      var subcategoria=String(l[1]||"").trim();
      var nome=String(l[2]||"").trim();
      var inst=String(l[3]||"").trim();
      var taxa=String(l[4]||"").trim();
      var vencimento=parseVencPlanilha(l[5]);
      var posicao=parseNumPlanilha(l[6]);
      var vaz=function(v){ return v===undefined||v===null||String(v).trim()===""?null:parseNumPlanilha(v); };
      var rentMes=vaz(l[7]), rentAno=vaz(l[8]), rent12m=vaz(l[9]), rentInicio=vaz(l[10]), dataIni=parseVencPlanilha(l[11]);
      if(!nome && !categoria && !posicao) continue;
      var linhaNum=i+1;
      if(!nome){ erros.push("Linha "+linhaNum+": falta o nome do ativo."); continue; }
      var categoriaOk=matchOpcaoAtivo(categoria,CATEGORIAS_ATIVO);
      if(categoriaOk===null){ erros.push("Linha "+linhaNum+" (\""+nome+"\"): categoria \""+categoria+"\" não é válida. Use: "+CATEGORIAS_ATIVO.join(", ")+"."); continue; }
      var subcategoriaOk=subcategoria?matchOpcaoAtivo(subcategoria,SUBCATEGORIAS_ATIVO):"";
      if(subcategoria && subcategoriaOk===null){ erros.push("Linha "+linhaNum+" (\""+nome+"\"): subcategoria \""+subcategoria+"\" não é válida. Use: "+SUBCATEGORIAS_ATIVO.join(", ")+" ou deixe em branco."); continue; }
      var nv={nome:nome,categoria:categoriaOk,subcategoria:subcategoriaOk||"",inst:inst,taxa:taxa,vencimento:vencimento,
        posicao:posicao,rentMes:rentMes,rentAno:rentAno,rent12m:rent12m,rentInicio:rentInicio};
      if(dataIni) nv.dataInicial=dataIni;
      novos.push(nv);
    }
    if(erros.length){
      alert("A planilha tem "+erros.length+" linha(s) com problema, então nada foi importado — corrija e tente de novo:\n\n"+erros.slice(0,12).join("\n")+(erros.length>12?"\n… e mais "+(erros.length-12)+".":""));
      input.value=""; return;
    }
    if(!novos.length){ alert("Não encontrei nenhum ativo preenchido nessa planilha."); input.value=""; return; }
    /* 3.24: troca só os ativos das instituições que vieram na planilha (os do BTG, por
       exemplo, ficam). Planilha sem instituição nenhuma troca a lista inteira, como antes.
       A aba "Contas", quando existe, preenche saldo, aplicações, resgates e rendimento. */
    var insts={}; novos.forEach(function(x){ var k=instChave(x.inst); if(k) insts[k]=x.inst.split(" (")[0]; });
    var porInst=Object.keys(insts).length>0&&novos.every(function(x){ return instChave(x.inst); });
    var contasPl=[];
    try{
      var wsC=wb.Sheets["Contas"];
      if(wsC) XLSX.utils.sheet_to_json(wsC,{header:1,defval:"",raw:true}).slice(1).forEach(function(l){
        var ins=String(l[0]||"").trim(); if(!ins) return;
        contasPl.push({inst:ins,saldo:parseNumPlanilha(l[1]),apl:parseNumPlanilha(l[2]),res:parseNumPlanilha(l[3]),rendRs:parseNumPlanilha(l[4]),rendPct:parseNumPlanilha(l[5])});
      });
    }catch(e){ contasPl=[]; }
    var nomesInst=Object.keys(insts).map(function(k){ return insts[k]; });
    if(!confirm("Importar "+novos.length+" ativo(s) da planilha"+(porInst?" ("+nomesInst.join(", ")+")":"")+"?\n\n"+
      (porInst?"Troca só os ativos dessas instituições; os das outras ficam.":"Isso substitui a lista de ativos inteira.")+
      (contasPl.length?"\nA aba Contas atualiza saldo, aplicações, resgates e rendimento de: "+contasPl.map(function(c){ return c.inst; }).join(", ")+".":"")+
      "\n\nNada é gravado até você salvar.")){ input.value=""; return; }
    guardarAntesImportacao("planilha");
    if(porInst) S.rasc.ind.ativos=(S.rasc.ind.ativos||[]).filter(function(x){ return !insts[instChave(x.inst)]; }).concat(novos);
    else S.rasc.ind.ativos=novos;
    var avisoC=[];
    contasPl.forEach(function(cp){
      var k=instChave(cp.inst);
      var alvo=S.rasc.contas.filter(function(x){ return curDe(x)==="BRL"&&instChave(x.inst||x.nome)===k; });
      if(alvo.length>1){ avisoC.push(cp.inst+": há "+alvo.length+" contas dessa instituição; preencha à mão."); return; }
      var c0=alvo[0]; if(!c0){ c0={nome:cp.inst,inst:cp.inst,saldo:0,apl:0,res:0,rendPct:0,rendRs:0,moeda:"BRL"}; S.rasc.contas.push(c0); }
      c0.saldo=Math.round(cp.saldo*100)/100; c0.apl=Math.round(cp.apl*100)/100; c0.res=Math.round(cp.res*100)/100;
      c0.rendRs=Math.round(cp.rendRs*100)/100; c0.rendPct=Math.round(cp.rendPct*10000)/10000;
    });
    atualizarVencimentos(S.rasc,S.mes,S.ano);
    render(true);
    if(avisoC.length) alert(avisoC.join("\n"));
    input.value="";
  };
  fr.onerror=function(){ alert("Não consegui ler o arquivo."); input.value=""; };
  fr.readAsArrayBuffer(f);
}

/* ---- Importar ativos de PDF (Relatório de Performance BTG/Necton, Extrato Sinosserra) ---- */
function pdfParseMoeda(s){
  if(!s) return 0;
  var t=String(s).replace(/^R\$\s*/,"").replace(/\s+/g,"");
  var neg=/^-/.test(t); t=t.replace(/^-/,"");
  if(!t || t==="-") return 0;
  t=t.replace(/\./g,"").replace(",",".");
  var x=parseFloat(t);
  return isNaN(x)?0:(neg?-x:x);
}
function pdfDataParaISO(s){
  var m=String(s||"").match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  return m? (m[3]+"-"+m[2]+"-"+m[1]) : "";
}
var SECOES_VALIDAS_BTG={
  "Pós-fixado": {categoria:"Renda Fixa", subcategoria:"Pós-fixado"},
  "Pré-fixado": {categoria:"Renda Fixa", subcategoria:"Pré-fixado"},
  "Inflação": {categoria:"Renda Fixa", subcategoria:"Inflação"},
  "Alternativo": {categoria:"Fundos", subcategoria:"Alternativo"},
  "Renda Variável": {categoria:"Renda Variável", subcategoria:""},
  "Retorno Absoluto (MM)": {categoria:"Fundos", subcategoria:"Multimercado"},
};
/* O pdf.js as vezes nao consegue decodificar um glifo (ligadura "fi", "ç")
   e devolve um caractere nulo no lugar -- "Pós-fixado" chega como
   "Pós-\u0000xado". Normaliza tirando acento, nulo e espaco antes de
   comparar, e usa "e subsequencia de" em vez de igualdade: como so FALTA
   caractere (nunca sobra), o nome normalizado sempre cabe dentro do nome
   oficial, na mesma ordem. */
function pdfNormalizarTexto(s){
  return String(s||"")
    .replace(/\u0000/g,"")
    .normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-zA-Z0-9]/g,"")
    .toLowerCase();
}
function pdfEhSubsequencia(pequena, grande){
  if(!pequena) return false;
  var i=0;
  for(var j=0;j<grande.length && i<pequena.length;j++){
    if(grande[j]===pequena[i]) i++;
  }
  return i===pequena.length;
}
function pdfIdentificarSecao(textoAntesDeEmCarteira){
  var alvo=pdfNormalizarTexto(textoAntesDeEmCarteira);
  if(!alvo) return null;
  var nomes=Object.keys(SECOES_VALIDAS_BTG);
  for(var i=0;i<nomes.length;i++){
    if(pdfEhSubsequencia(pdfNormalizarTexto(nomes[i]), alvo) || pdfEhSubsequencia(alvo, pdfNormalizarTexto(nomes[i]))) return nomes[i];
  }
  return null;
}
/* ===================== Relatório de Performance do BTG (3.21) =====================
   O PDF inteiro que o BTG gera para o cliente ("Relatório de Performance"). Lê:
   - capa: nome, conta e período (o mês de referência é o fim do período);
   - "Rentabilidade", linha Mês: resultado em R$, % da carteira e os índices (CDI, Ibovespa, IPCA);
   - "Evolução do saldo bruto": saldo anterior, entradas, saídas, rendimento e saldo final;
   - "A rentabilidade completa": todos os ativos, com classe, estratégia, taxa, saldo e a
     rentabilidade do mês, do ano, de 12 meses e desde o início;
   - "Detalhamento dos Ativos": o vencimento exato de cada título (casado pelo saldo).
   O pdf.js quebra palavras ("Tot al", "At ivo") e perde ligaduras ("Pós-xado"), por isso
   as comparações de texto usam o texto sem espaços e sem acento. */
function pdfSq(s){ return String(s||"").replace(/\u0000/g,"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g,"").toLowerCase(); }
function pdfNum(s){
  s=String(s||"").replace(/\s+/g,"").replace(/R\$/g,"").replace(/%$/,"");
  if(!s||s==="-") return 0;
  var neg=/^-/.test(s); s=s.replace(/^-/,"").replace(/\./g,"").replace(",",".");
  var v=parseFloat(s); return isNaN(v)?0:(neg?-v:v);
}
/* "-" no BTG quer dizer "não existe" (ativo com menos de 12 meses não tem 12 meses): fica null,
   e o relatório mostra "—" em vez de 0,00%. */
function pdfNumOuVazio(t){ return String(t).trim()==="-"?null:pdfNum(t); }
/* separa o fim numérico de uma linha: "NOME 274.552,17 39,70 4,80 12/09/2024" ->
   {texto:"NOME", nums:["274.552,17","39,70","4,80","12/09/2024"]} */
function pdfCauda(linha){

function pdfParseBtgDetalhamento(todasLinhas){

/* Junta os itens de texto do pdf.js em linhas visuais (por Y, com tolerancia

   itens por causa de ligadura/kerning (ex: "Pós-" + [glifo ilegivel] +

   "Pós-fixado". */
function pdfAgruparLinhas(textContent){

  var linhas=[];
  itens.forEach(function(it){
    var y=Math.round(it.transform[5]);
    var linha=null;
    for(var i=0;i<linhas.length;i++){ if(Math.abs(linhas[i].y-y)<=2){ linha=linhas[i]; break; } }
    if(!linha){ linha={y:y,itens:[]}; linhas.push(linha); }
    linha.itens.push({x:it.transform[4], str:it.str, width:it.width||0});
  });
  linhas.sort(function(a,b){ return b.y-a.y; });

    l.itens.sort(function(a,b){ return a.x-b.x; });
    var partes=[]; var anterior=null;
    l.itens.forEach(function(it){

        if(gap>1) partes.push(' ');

      partes.push(it.str);

/* Lê um PDF de extrato: {leitor, ativos, texto} ou rejeita com uma mensagem clara. */
function lerPdfExtrato(arquivo){
  return new Promise(function(ok,erro){
    if(typeof pdfjsLib==="undefined") return erro(new Error("O leitor de PDF ainda não carregou. Recarregue a página (Cmd+Shift+R) e tente de novo."));
    pdfjsLib.GlobalWorkerOptions.workerSrc="vendor/pdfjs-3.11.174.worker.min.js";
    var fr=new FileReader();
    fr.onerror=function(){ erro(new Error("Não consegui ler o arquivo.")); };
    fr.onload=function(){
      pdfjsLib.getDocument({data:new Uint8Array(fr.result)}).promise.then(function(pdf){
        var linhas=[], paginas=[], i=1;
        var proxima=function(){
          if(i>pdf.numPages){
            var texto=linhas.join("\n"), topo=linhas.slice(0,25).join("\n");
            var prontos=LEITORES_EXTRATO.filter(function(l){ return l.pronto; });
            var lt=prontos.filter(function(l){ return l.detectar(texto,topo); })[0]||LEITORES_EXTRATO.filter(function(l){ return !l.pronto&&l.detectar(texto,topo); })[0];
            if(!lt) return erro(new Error("Não reconheci o banco deste PDF. Hoje leio: "+prontos.map(function(l){ return l.nome; }).join(", ")+"."));
            if(!lt.pronto) return erro(new Error("Reconheci um extrato "+lt.nome+", mas o leitor deste banco ainda não está pronto. Mande um PDF de exemplo ao master para ele ser ensinado."));
            var res=lt.ler(linhas,paginas);
            if(res.erro) return erro(new Error(res.erro));
            res.ativos.forEach(function(a){ if(!(a.inst||"").trim()) a.inst=lt.inst; });
            ok({leitor:lt,ativos:res.ativos,texto:texto,performance:res.performance||null});
            return;
          }
          pdf.getPage(i).then(function(pg){ return pg.getTextContent().then(function(tc){
            linhas=linhas.concat(pdfAgruparLinhas(tc));
            paginas.push(tc.items.filter(function(it){ return it.str&&it.str.trim(); })
              .map(function(it){ return {str:it.str.replace(/\u0000/g,"").trim(),x:it.transform[4],y:it.transform[5]}; })
              .filter(function(it){ return it.str; }));
            i++; proxima();
          }); }).catch(function(e){ erro(new Error("Não consegui ler a página "+i+" do PDF. "+e.message)); });
        };
        proxima();
      }).catch(function(e){ erro(new Error("Não consegui abrir esse PDF. Confira se o arquivo não está corrompido. "+e.message)); });
    };
    fr.readAsArrayBuffer(arquivo);
  });
}
/* Troca os ativos de uma instituição pelos do extrato e, se ela tiver uma conta só, põe
   no saldo a soma dos ativos. Resultado, aplicações e resgates ficam para preencher. */
function aplicarAtivosExtrato(r,ativos,instNome){
  /* ativos sem instituição vieram de importações antigas de PDF (antes da 3.20 o leitor
     do BTG não preenchia a instituição): saem junto, senão ficariam em dobro */
  var k=instChave(instNome);
  r.ind.ativos=(r.ind.ativos||[]).filter(function(x){ var kx=instChave(x.inst); return kx&&kx!==k; }).concat(ativos);
  var contas=r.contas.filter(function(x){ return curDe(x)==="BRL"&&instChave(x.inst)===k; });
  var soma=ativos.reduce(function(a,x){ return a+n(x.posicao); },0);
  atualizarVencimentos(r,S.mes,S.ano);
  if(contas.length===1){ contas[0].saldo=Math.round(soma*100)/100; return {saldo:true,soma:soma}; }
  return {saldo:false,soma:soma,semConta:!contas.length};
}
/* Preenche o mês com o Relatório de Performance do BTG: conta do BTG (saldo, entradas,
   saídas, resultado em R$ e %), ativos do BTG (trocados inteiros) e os índices que estiverem
   em branco. Devolve o que conferiu e o que precisa de atenção. */
function contaDoBtg(r,p){
  var brl=r.contas.filter(function(x){ return curDe(x)==="BRL"&&/^(btg|necton)$/.test(instChave(x.inst||x.nome)); });
  if(brl.length<=1) return brl[0]||null;
  var porSaldo=brl.filter(function(x){ return Math.abs(n(x.saldo)-p.saldoAnterior)<1; });
  return porSaldo[0]||brl[0];
}
function aplicarPerformance(r,p,arquivo){
  var res={ok:[],aviso:[]};
  var conta=contaDoBtg(r,p);
  if(!conta){ conta={nome:"BTG",inst:"BTG Pactual",saldo:0,apl:0,res:0,rendPct:0,rendRs:0,moeda:"BRL"}; r.contas.push(conta); res.aviso.push("A carteira não tinha conta do BTG em reais: criei a conta \u201cBTG\u201d."); }
  var ant=n(conta.saldo);
  conta.saldo=Math.round(p.saldo*100)/100; conta.apl=Math.round(p.entradas*100)/100; conta.res=Math.round(p.saidas*100)/100;
  conta.rendRs=Math.round(p.rendRs*100)/100; conta.rendPct=Math.round(p.rendPct*10000)/10000;
  if(ant&&Math.abs(ant-p.saldoAnterior)<1) res.ok.push("O saldo de abertura do relatório ("+brl2(p.saldoAnterior)+") bate com o mês anterior no Hub.");
  else if(ant) res.aviso.push("O relatório começa o mês com "+brl2(p.saldoAnterior)+", e o Hub tinha "+brl2(ant)+" no mês anterior.");
  var k=instChave("BTG Pactual");
  r.ind.ativos=(r.ind.ativos||[]).filter(function(x){ var kx=instChave(x.inst); return kx&&kx!==k&&kx!=="necton"; })
    .concat(p.ativos.map(function(a){ var x=JSON.parse(JSON.stringify(a)); if(!x.dataInicial) delete x.dataInicial; return x; }));
  var soma=p.ativos.reduce(function(a,x){ return a+n(x.posicao); },0), dif=p.saldo-soma;
  if(Math.abs(dif)<=Math.max(1,p.saldo*0.005)) res.ok.push("Os "+p.ativos.length+" ativos somam "+brl2(soma)+(Math.abs(dif)>=0.01?"; a diferença de "+brl2(dif)+" é conta corrente e valor em trânsito":"")+".");
  else res.aviso.push("Os ativos somam "+brl2(soma)+" e o saldo é "+brl2(p.saldo)+": diferença de "+brl2(dif)+".");
  var NOMES={cdi:"CDI",ibov:"Ibovespa",ipca:"IPCA"};
  Object.keys(NOMES).forEach(function(ix){
    if(p.ind[ix]===undefined) return;
    if(!n(r.ind[ix])){ r.ind[ix]=p.ind[ix]; res.ok.push(NOMES[ix]+" do mês preenchido: "+String(p.ind[ix]).replace(".",",")+"%."); }
    else if(Math.abs(n(r.ind[ix])-p.ind[ix])>0.005) res.aviso.push(NOMES[ix]+" do mês já estava em "+String(n(r.ind[ix])).replace(".",",")+"% (vale para todos os clientes); o relatório do BTG diz "+String(p.ind[ix]).replace(".",",")+"%. Mantive o que estava.");
  });
  (p.avisos||[]).forEach(function(a){ res.aviso.push(a); });
  var vx=atualizarVencimentos(r,S.mes,S.ano), vb=(r.ind.vencimentos||[]).filter(function(v){ return v.auto&&/^(btg|necton)$/.test(instChave(v.inst)); });
  res.ok.push("Próximos vencimentos (12 meses): "+(vb.length?vb.map(function(v){ return v.ativo+" em "+dataBR(v.data); }).join(", "):"nenhum título do BTG vence nesse prazo")+(vx.removidos?"; "+vx.removidos+" que já não estão na carteira saíram":"")+".");
  r.ind.performance={arquivo:arquivo||"",conta:p.conta,nome:p.nome,mes:p.mes,ano:p.ano,em:new Date().toISOString()};
  return res;
}
/* confere mês e conta antes de aplicar; devolve o texto do aviso ou "" */
function checarPerformance(c,p){

  if(p.mes&&(p.mes!==S.mes||p.ano!==S.ano)) av.push("O relatório é de "+MESES[p.mes-1].toLowerCase()+"/"+p.ano+", e a tela está em "+MESES[S.mes-1].toLowerCase()+"/"+S.ano+".");

/* Carta do mês: o editor grava HTML, e esse HTML aparece no relatório de todo
   mundo. Sem esta limpeza, um texto com código escondido (ex.: <img onerror>) rodaria
   na tela de quem abrisse o relatório e poderia roubar a sessão (varredura de
   06/11/2026). Fica só a formatação que o editor produz. */
var CARTA_TAGS={P:1,BR:1,B:1,STRONG:1,I:1,EM:1,U:1,H1:1,H2:1,H3:1,H4:1,UL:1,OL:1,LI:1,DIV:1,SPAN:1,BLOCKQUOTE:1,IMG:1,FONT:1,SUB:1,SUP:1,HR:1};
var CARTA_FORA={SCRIPT:1,STYLE:1,IFRAME:1,OBJECT:1,EMBED:1,SVG:1,MATH:1,LINK:1,META:1,TEMPLATE:1,NOSCRIPT:1,FORM:1,INPUT:1,BUTTON:1,TEXTAREA:1,SELECT:1,VIDEO:1,AUDIO:1,CANVAS:1,FRAME:1,FRAMESET:1,BASE:1};
function limparHtmlCarta(html){
  if(!html) return "";
  var doc;
  try{ doc=new DOMParser().parseFromString('<div id="cartaRaiz">'+html+'</div>',"text/html"); }catch(e){ return esc(html); }
  var raiz=doc.getElementById("cartaRaiz"); if(!raiz) return "";
  (function limpa(no){
    [].slice.call(no.childNodes).forEach(function(f){
      if(f.nodeType===3) return;
      if(f.nodeType!==1){ no.removeChild(f); return; }
      var t=f.tagName.toUpperCase();
      if(CARTA_FORA[t]){ no.removeChild(f); return; }
      if(!CARTA_TAGS[t]){ limpa(f); while(f.firstChild) no.insertBefore(f.firstChild,f); no.removeChild(f); return; }
      [].slice.call(f.attributes).forEach(function(a){
        var n=a.name.toLowerCase(), v=String(a.value||"");
        var ok=(n==="style"&&!/url\s*\(|expression|javascript:|behavior|@import|-moz-binding/i.test(v))||
          (t==="IMG"&&n==="src"&&/^(data:image\/(png|jpe?g|gif|webp);base64,|https:\/\/)/i.test(v.trim()))||
          (t==="IMG"&&(n==="width"||n==="height"||n==="alt"))||
          (t==="FONT"&&(n==="size"||n==="color"||n==="face"))||
          n==="align";
        if(!ok) f.removeAttribute(a.name);
      });
      if(t==="IMG"&&!f.getAttribute("src")){ no.removeChild(f); return; }
      limpa(f);
    });
  })(raiz);
  return raiz.innerHTML;
}

function inserirImagem(inp){
  var f=inp.files[0]; if(!f) return;
  if(f.size>8*1024*1024){ alert("Imagem muito grande. Use um arquivo de até 8 MB."); inp.value=""; return; }
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var max=900, esc2=Math.min(1,max/img.width);
      var cv=document.createElement("canvas");
      cv.width=Math.round(img.width*esc2); cv.height=Math.round(img.height*esc2);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      var dados=cv.toDataURL("image/jpeg",0.82);

function restaurarBackup(id,rotulo){
  if(!confirm("Restaurar a cópia de "+rotulo+"?\n\nTudo o que foi lançado depois dessa data será substituído. Esta ação não pode ser desfeita.")) return;
  status("wait","Restaurando…");
  api("backups?id=eq."+id+"&select=conteudo").then(function(r){
    if(!r||!r[0]) throw new Error("Cópia não encontrada.");
    var b=r[0].conteudo;
    var fila=[];
    (b.clientes||[]).forEach(function(c){
      fila.push(api("clientes?on_conflict=id",{method:"POST",prefer:"resolution=merge-duplicates,return=minimal",body:{id:c.id,nome:c.nome}}));
    });
    Object.keys(b.dados||{}).forEach(function(k){
      var partes=k.split("|"), cid=partes[0], ano=parseInt(partes[1].slice(0,4),10), mes=parseInt(partes[1].slice(5,7),10);
      var d=b.dados[k];
      fila.push(api("lancamentos?on_conflict=cliente_id,mes,ano",{method:"POST",prefer:"resolution=merge-duplicates,return=minimal",
        body:{cliente_id:cid,mes:mes,ano:ano,contas:d.contas||[],indicadores:d.ind||{}}}));
    });
    Object.keys(b.cartas||{}).forEach(function(k){
      fila.push(api("cartas?on_conflict=mes,ano",{method:"POST",prefer:"resolution=merge-duplicates,return=minimal",
        body:{mes:parseInt(k.slice(5,7),10),ano:parseInt(k.slice(0,4),10),conteudo:b.cartas[k]}}));
    });
    return Promise.all(fila);
  }).then(function(){
    return registrar("restaurou backup","",rotulo);
  }).then(function(){
    return carregar();
  }).then(function(){
    S.cliente=db.clientes.length?db.clientes[0].id:null;
    montarRascunho(); render();
    alert("Cópia restaurada.");
  }).catch(falha);
}

  var limpa=function(cs){ return (cs||[]).filter(function(c){return (c.nome||"").trim()||n(c.saldo);}); };
  var semInterno=function(o){ var x={}; Object.keys(o||{}).forEach(function(k){ if(k.charAt(0)!=="_") x[k]=o[k]; }); return x; };
  return JSON.stringify(limpa(S.rasc.contas))!==JSON.stringify(limpa(r.contas))||JSON.stringify(semInterno(S.rasc.ind))!==JSON.stringify(semInterno(r.ind));

function marcarFeito(feito){
  var c=cli(); if(!c) return;
  if(feito){
    var crit=(conferirRascunho().itens||[]).filter(function(x){ return x.nivel==="alta"; }).length;
    if(crit&&!confirm("A conferência aponta "+crit+(crit===1?" ponto crítico":" pontos críticos")+" neste mês. Marcar como feito mesmo assim?")) return;
    if(!reg(c.id,S.mes,S.ano)||rascunhoAlterado()){ salvarMes({feito:true}); return; }
  }else if(!confirm("Reabrir "+MESES[S.mes-1]+"/"+S.ano+" de "+c.nome+"? O mês volta a aparecer como pendente.")) return;
  status("wait","Salvando…");
  api("lancamentos?cliente_id=eq."+c.id+"&mes=eq."+S.mes+"&ano=eq."+S.ano,{method:"PATCH",prefer:"return=representation",
    body:{feito_em:feito?new Date().toISOString():null}}).then(function(rows){
    var r=reg(c.id,S.mes,S.ano), x=(rows&&rows[0])||{};
    if(r){ r.feito_em=x.feito_em!==undefined?x.feito_em:(feito?new Date().toISOString():null); r.feito_por=x.feito_por!==undefined?x.feito_por:(feito?EU.id:null); }

function ptaxAuto(){
  var k=S.cliente+"|"+S.mes+"|"+S.ano;
  if(PTAX_TENTADO[k]) return;
  if(n(S.rasc&&S.rasc.ind&&S.rasc.ind.ptax)>0) return;
  PTAX_TENTADO[k]=1; buscarPtax();
}
function buscarPtax(){
  var msg=document.getElementById("ptaxMsg");
  if(msg){ msg.textContent="Consultando Banco Central..."; msg.style.color="var(--muted)"; }
  function f(d){ return String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+"-"+d.getFullYear(); }
  var ini=new Date(S.ano,S.mes-1,1), fim=new Date(S.ano,S.mes,0);
  var url="https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata/CotacaoDolarPeriodo(dataInicial=@dataInicial,dataFinalCotacao=@dataFinalCotacao)"+
    "?@dataInicial='"+f(ini)+"'&@dataFinalCotacao='"+f(fim)+"'&$format=json&$select=cotacaoVenda,dataHoraCotacao";
  fetch(url).then(function(res){ if(!res.ok) throw new Error("HTTP "+res.status); return res.json(); })
  .then(function(j){
    var arr=(j&&j.value)||[]; if(!arr.length) throw new Error("sem cotacao");
    var ult=arr[arr.length-1], v=Number(ult.cotacaoVenda);
    if(!v) throw new Error("cotacao invalida");
    setInd("ptax",v);
    var el=document.getElementById("inpPtax"); if(el) el.value=v;
    var d=String(ult.dataHoraCotacao||"").slice(0,10).split("-");
    if(msg){ msg.textContent="PTAX venda de "+(d.length===3?d[2]+"/"+d[1]+"/"+d[0]:"fechamento")+"."; msg.style.color="var(--muted)"; }
  })
  .catch(function(){
    if(msg){ msg.textContent="Nao foi possivel consultar. Digite a PTAX manualmente."; msg.style.color="var(--alert)"; }
  });
}

function eixoY(max,H,pt,pb,W,fmt){
  var out="",linhas=5;
  for(var i=0;i<linhas;i++){
    var v=max*i/(linhas-1), y=H-pb-(v/max)*(H-pt-pb);
    out+='<line x1="52" y1="'+y+'" x2="'+(W-8)+'" y2="'+y+'" stroke="#EDF1F5"/>'+
         '<text x="46" y="'+(y+3)+'" text-anchor="end" font-size="8.5" fill="#9AA6B5" font-family="Segoe UI, Arial, sans-serif">'+fmt(v)+'</text>';
  }
  return out;
}
function pizza(items){
  var R=88,cx=100,cy=100,ang=-Math.PI/2,out="";
  var tot=items.reduce(function(a,b){return a+b.valor;},0);
  if(tot<=0) return "";
  if(items.length===1){
    out='<circle cx="100" cy="100" r="88" fill="'+CORES[0]+'"/>';
  }else{
    items.forEach(function(it,i){
      var a2=ang+(it.valor/tot)*Math.PI*2,big=(a2-ang)>Math.PI?1:0;
      var x1=cx+R*Math.cos(ang),y1=cy+R*Math.sin(ang),x2=cx+R*Math.cos(a2),y2=cy+R*Math.sin(a2);
      out+='<path d="M'+cx+' '+cy+' L'+x1+' '+y1+' A'+R+' '+R+' 0 '+big+' 1 '+x2+' '+y2+' Z" fill="'+CORES[i%CORES.length]+'" stroke="#fff" stroke-width="1.5"/>';
      ang=a2;
    });
  }
  return '<svg class="dn" viewBox="0 0 200 200" width="210" height="210">'+out+'</svg>';
}
/* numero bem curto para caber sob a coluna: 57600 -> "58k", 1250000 -> "1,3M" */
function moCurto(v){
  var a=Math.abs(v);
  if(a>=1e6) return (v/1e6).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+"M";
  if(a>=1000) return Math.round(v/1000).toLocaleString("pt-BR")+"k";
  return Math.round(v).toLocaleString("pt-BR");
}
function chartEvolucao(serie,cur){
  if(!serie.length) return "";
  var W=Math.max(420,serie.length*84+70),H=222,pt=30,pb=34;
  var vals=serie.map(function(s){return s.pl;});
  var vmax=Math.max.apply(null,vals), vmin=Math.min.apply(null,vals);

  /* Escala com zoom: barra a partir do zero achata a diferenca entre meses
     quando o patrimonio e alto e a variacao pequena. A base sobe para logo
     abaixo do menor mes, e a linha de base fica escrita no eixo para que
     ninguem leia altura de barra como proporcao do total.                */
  var amplitude=vmax-vmin;
  var base, topo;
  if(serie.length<2 || amplitude<=0 || amplitude < vmax*0.005){
    base=0; topo=vmax*1.12||1;                     /* variacao irrelevante: escala cheia */
  } else {
    var folga=amplitude*0.35;
    base=Math.max(0,vmin-folga);
    topo=vmax+folga*0.7;
  }
  var zoom = base>0;
  var faixa=(topo-base)||1;
  var slot=(W-62)/serie.length, bw=Math.min(62,slot-26);
  var alturaUtil=H-pt-pb;

  var out=eixoY2(base,topo,H,pt,pb,W,function(v){return moC(v,cur);});

  /* com muitos meses o valor cheio encosta no vizinho; a partir de 9 usa forma curta */
  var curto=serie.length>8;
  serie.forEach(function(s,i){
    var rotuloTopo = curto ? moCurto(s.pl) : mo(s.pl,cur);
    var hh=Math.max(2,((s.pl-base)/faixa)*alturaUtil);
    var x=52+i*slot+(slot-bw)/2, y=H-pb-hh;
    out+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+hh+'" fill="#1B3A5F"/>'+
         '<text x="'+(x+bw/2)+'" y="'+(y-7)+'" text-anchor="middle" font-size="9" fill="#3C4C60" font-family="Consolas, Menlo, monospace">'+rotuloTopo+'</text>'+
         '<text x="'+(x+bw/2)+'" y="'+(H-13)+'" text-anchor="middle" font-size="9" fill="#7A8698">'+ref(s.mes,s.ano)+'</text>';
  });

  out+='<line x1="52" y1="'+(H-pb)+'" x2="'+(W-8)+'" y2="'+(H-pb)+'" stroke="#DCE2EA"/>';
  if(zoom){
    /* marca de corte: avisa que o eixo nao comeca em zero */
    out+='<text x="46" y="'+(H-pb+3)+'" text-anchor="end" font-size="8.5" fill="#9AA6B5" font-family="Segoe UI, Arial, sans-serif">'+moC(base,cur)+'</text>'+
         '<line x1="49" y1="'+(H-pb-5)+'" x2="55" y2="'+(H-pb+1)+'" stroke="#C6CED8" stroke-width="1"/>'+
         '<line x1="49" y1="'+(H-pb-1)+'" x2="55" y2="'+(H-pb+5)+'" stroke="#C6CED8" stroke-width="1"/>';
  }
  var legenda=zoom?('<p class="foot-note" style="margin:8px 0 0;font-size:9.5px">'+
    'A escala come\u00e7a em '+moC(base,cur)+', n\u00e3o em zero, para que a varia\u00e7\u00e3o entre os meses fique vis\u00edvel.</p>'):'';

  return '<div style="overflow-x:auto"><svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:'+W+'px;display:block;margin:0 auto">'+out+'</svg></div>'+legenda;
}

/* eixo com base e topo livres (a versao antiga sempre partia de zero) */
function eixoY2(base,topo,H,pt,pb,W,fmt){
  var out="",linhas=5,faixa=(topo-base)||1;
  for(var i=1;i<linhas;i++){
    var v=base+faixa*i/(linhas-1), y=H-pb-((v-base)/faixa)*(H-pt-pb);
    out+='<line x1="52" y1="'+y+'" x2="'+(W-8)+'" y2="'+y+'" stroke="#EDF1F5"/>'+
         '<text x="46" y="'+(y+3)+'" text-anchor="end" font-size="8.5" fill="#9AA6B5" font-family="Segoe UI, Arial, sans-serif">'+fmt(v)+'</text>';
  }
  return out;
}

/* tabela de retornos por ano (carteira x CDI) */
function tabelaRetornos(id,cur){
  cur=(cur==="USD")?"USD":"BRL";
  var anos=[];
  Object.keys(db.dados).forEach(function(k){
    if(k.indexOf(id+"|")===0){
      var y=parseInt(k.split("|")[1].slice(0,4),10);
      if(anos.indexOf(y)<0) anos.push(y);
    }
  });
  anos.sort(function(a,b){return a-b;});
  var fc=1,fd=1,linhas=[];
  anos.forEach(function(y){
    var meses=[];
    for(var m=1;m<=12;m++){
      var r=reg(id,m,y);
      var ok=r&&contasDe(r,cur).length;
      meses.push(ok?{p:totais(r,cur).rendPct,c:(cur==="BRL"?n(r.ind&&r.ind.cdi):0)}:null);
    }
    var vivos=meses.filter(function(x){return x;});
    if(!vivos.length) return;
    var noAnoP=comp(vivos.map(function(x){return x.p;}));
    var noAnoC=comp(vivos.map(function(x){return x.c;}));
    fc*=(1+noAnoP/100); fd*=(1+noAnoC/100);
    linhas.push({ano:y,meses:meses,noAnoP:noAnoP,noAnoC:noAnoC,accP:(fc-1)*100,accC:(fd-1)*100});
  });
  return linhas.reverse();
}

           }).join("")+
           (L.noAnoC>0?'<td class="n">'+pct(L.noAnoP/L.noAnoC*100,0)+'</td>':'<td class="n" style="color:#B7C0CB">–</td>')+
           (L.accC>0?'<td class="n">'+pct(L.accP/L.accC*100,0)+'</td>':'<td class="n" style="color:#B7C0CB">–</td>')+'</tr>';

}

var SNUM=0;
/* ===== conferencia de consistencia dos lancamentos =====
   Regras deterministicas: cada achado aponta a conta, o numero encontrado
   e o numero esperado, para dar pra conferir na mao. */
function conferir(id,mes,ano,rOpt){
  var r=rOpt||reg(id,mes,ano), out=[];
  if(!r) return out;
  var add=function(nivel,onde,titulo,detalhe){ out.push({nivel:nivel,onde:onde,titulo:titulo,detalhe:detalhe}); };
  var ant=null,pa=anterior(mes,ano),tt=0;
  while(tt<24&&!ant){ var rr=reg(id,pa.mes,pa.ano); if(rr) ant=rr; else pa=anterior(pa.mes,pa.ano); tt++; }

  ["BRL","USD"].forEach(function(cur){
    var contas=contasDe(r,cur); if(!contas.length) return;
    var fm=function(v){ return mo2(v,cur); };
    var antC=ant?contasDe(ant,cur):[];
    var achaAnt=function(nome){
      for(var i=0;i<antC.length;i++){ if((antC[i].nome||"")===(nome||"")) return antC[i]; }
      return null;
    };

    contas.forEach(function(c){
      var nome=(c.nome||"sem nome")+(cur==="USD"?" (offshore)":"");
      var saldo=n(c.saldo), rs=n(c.rendRs), pc=n(c.rendPct), apl=n(c.apl), res=n(c.res);
      var base=saldo-rs-apl+res;

      if(saldo===0&&rs===0&&pc===0&&apl===0&&res===0) return;

      if(res<0||apl<0){
        var qual=(res<0&&apl<0)?"Aplica\u00e7\u00e3o e resgate negativos":(res<0?"Resgate negativo":"Aplica\u00e7\u00e3o negativa");
        var errado=(res<0?Math.abs(res)*2:0)+(apl<0?Math.abs(apl)*2:0);
        add("alta",nome,qual,
          "Aplica\u00e7\u00f5es e resgates s\u00e3o movimentos e devem ser sempre positivos \u2014 o sinal j\u00e1 est\u00e1 na f\u00f3rmula. "+
          "Com o valor negativo, a abertura do m\u00eas sai <i>"+fm(errado)+"</i> menor que a real, "+
          "o que distorce o peso desta conta na rentabilidade da carteira. Troque para positivo e salve.");
      }

      if(base<0){
        add("alta",nome,"Saldo de abertura negativo",
          "Pelo saldo final de "+fm(saldo)+", resultado de "+fm(rs)+", aplica\u00e7\u00f5es de "+fm(apl)+" e resgates de "+fm(res)+
          ", a abertura do m\u00eas daria <i>"+fm(base)+"</i>. Algum dos quatro campos est\u00e1 trocado ou com sinal invertido.");
      }else if(base===0&&saldo>0&&(rs!==0||apl!==0)){
        add("atencao",nome,"Abertura zerada",
          "A conta fecha em "+fm(saldo)+" mas a abertura calculada d\u00e1 zero. Confira se a aplica\u00e7\u00e3o e o resultado est\u00e3o certos.");
      }

      var foraEscala=Math.abs(pc)>50;
      if(foraEscala){
        add("alta",nome,"Rentabilidade fora de escala",
          "Foi informado <i>"+pct(pc)+"</i> no m\u00eas. Se a inten\u00e7\u00e3o era "+pct(pc/100)+", o valor foi digitado cem vezes maior.");
      }

      if(base>0&&rs!==0&&pc!==0&&!foraEscala){
        var impl=(rs/base)*100, dif=Math.abs(impl-pc);
        var tol=Math.max(0.20,Math.abs(pc)*0.25);
        if(dif>tol){
          add(dif>Math.max(1,Math.abs(pc))?"alta":"atencao",nome,"Resultado e percentual n\u00e3o batem",
            "O resultado de "+fm(rs)+" sobre uma abertura de "+fm(base)+" equivale a <i>"+pct(impl)+"</i>, mas foi informado <i>"+pct(pc)+"</i>. "+
            "Os dois campos s\u00e3o independentes de prop\u00f3sito, ent\u00e3o alguma diferen\u00e7a \u00e9 normal \u2014 essa est\u00e1 grande.");
        }
      }
      if(saldo>0&&pc!==0&&rs===0)
        add("atencao",nome,"Falta o resultado em "+(cur==="USD"?"d\u00f3lar":"reais"),
          "A rentabilidade de "+pct(pc)+" foi informada, mas o campo de resultado est\u00e1 zerado. Ele alimenta o resultado da carteira.");
      if(saldo>0&&rs!==0&&pc===0)
        add("atencao",nome,"Falta a rentabilidade em %",
          "O resultado de "+fm(rs)+" foi informado, mas o percentual est\u00e1 zerado. Ele alimenta a rentabilidade da carteira, que \u00e9 m\u00e9dia ponderada.");
      if(saldo>0&&rs===0&&pc===0&&apl===0)
        add("atencao",nome,"M\u00eas sem resultado",
          "A conta tem "+fm(saldo)+" em saldo e nenhum resultado informado. Se ficou parada mesmo, ignore.");

      var a=achaAnt(c.nome);
      if(a){
        var fech=n(a.saldo), delta=base-fech, lim=Math.max(1,Math.abs(fech)*0.005);
        if(Math.abs(delta)>lim){
          /* a abertura NAO e digitada: e derivada. Mostrar a conta evita o
             assessor procurar um campo de abertura que nao existe.        */
          var conta="Saldo final "+fm(saldo)+" \u2212 resultado "+fm(rs)+
                    " \u2212 aplica\u00e7\u00f5es "+fm(apl)+" + resgates "+fm(res)+" = "+fm(base);
          var causa = delta<0
            ? "A abertura ficou <b>abaixo</b> do fechamento anterior. As causas usuais, nesta ordem: "+
              "<b>resgate de "+fm(-delta)+" que n\u00e3o foi lan\u00e7ado</b>; resultado em reais "+fm(-delta)+
              " maior que o real; ou aplica\u00e7\u00e3o lan\u00e7ada a mais."
            : "A abertura ficou <b>acima</b> do fechamento anterior. As causas usuais, nesta ordem: "+
              "<b>aporte de "+fm(delta)+" que n\u00e3o foi lan\u00e7ado</b>; resultado em reais "+fm(delta)+
              " menor que o real; ou resgate lan\u00e7ado a mais.";
          add(Math.abs(delta)>Math.abs(fech)*0.05?"alta":"atencao",nome,"N\u00e3o fecha com o m\u00eas anterior",
            "O m\u00eas anterior fechou em "+fm(fech)+" e a abertura deste m\u00eas d\u00e1 "+fm(base)+
            ", diferen\u00e7a de <i>"+fm(delta)+"</i>.<br><br>"+
            "<b>Voc\u00ea n\u00e3o digita a abertura</b> \u2014 ela \u00e9 calculada para reconstruir o saldo do dia 1\u00ba: "+
            "<i>"+conta+"</i>.<br><br>"+causa);
        }
      }else if(ant&&antC.length&&saldo>0&&apl===0){
        add("atencao",nome,"Conta nova sem aplica\u00e7\u00e3o",
          "N\u00e3o existia no m\u00eas anterior e entrou com "+fm(saldo)+" sem aplica\u00e7\u00e3o lan\u00e7ada. O saldo inteiro vira abertura e derruba a rentabilidade ponderada.");
      }

      var hist=[],hp=anterior(mes,ano),h=0;
      while(h<12){
        var hr=reg(id,hp.mes,hp.ano);
        if(hr){ var hc=contasDe(hr,cur).filter(function(x){return (x.nome||"")===(c.nome||"");})[0];
                if(hc&&n(hc.rendPct)) hist.push(n(hc.rendPct)); }
        hp=anterior(hp.mes,hp.ano); h++;
      }
      if(hist.length>=4&&pc!==0){
        var m=hist.reduce(function(x,y){return x+y;},0)/hist.length;
        var dv=Math.sqrt(hist.reduce(function(x,y){return x+(y-m)*(y-m);},0)/hist.length);
        if(dv>0&&Math.abs(pc-m)>4*dv)
          add("atencao",nome,"Fora do padr\u00e3o da conta",
            "Os "+hist.length+" meses anteriores giraram em torno de "+pct(m)+". Este m\u00eas veio <i>"+pct(pc)+"</i>. Pode estar certo, mas vale conferir.");
      }
    });

    antC.forEach(function(a){
      var achou=contas.filter(function(x){return (x.nome||"")===(a.nome||"");})[0];
      if(!achou&&n(a.saldo)>0)
        add("atencao",(a.nome||"sem nome")+(cur==="USD"?" (offshore)":""),"Conta sumiu",
          "Existia no m\u00eas anterior com "+mo2(n(a.saldo),cur)+" e n\u00e3o aparece neste m\u00eas. Se foi encerrada, lance o resgate para o hist\u00f3rico fechar.");
    });

    var t=totais(r,cur);
    var somaBase=0; contas.forEach(function(c){ var b=n(c.saldo)-n(c.rendRs)-n(c.apl)+n(c.res); somaBase+=(b>0?b:n(c.saldo)); });
    if(somaBase>0&&t.rendRs!==0&&t.rendPct!==0){
      var implT=(t.rendRs/somaBase)*100, difT=Math.abs(implT-t.rendPct);
      if(difT>Math.max(0.25,Math.abs(t.rendPct)*0.25))
        add("alta",(cur==="USD"?"Carteira offshore":"Carteira onshore"),"Carteira: percentual e resultado divergem",
          "A soma dos resultados d\u00e1 <i>"+pct(implT)+"</i> sobre a abertura total, mas a m\u00e9dia ponderada dos percentuais informados d\u00e1 <i>"+pct(t.rendPct)+"</i>.");
    }
  });

  if(!n(r.ind&&r.ind.cdi))
    add("info","Indicadores","CDI do m\u00eas em branco",
      "Sem o CDI o relat\u00f3rio n\u00e3o consegue mostrar o comparativo nem o \u201c% do CDI\u201d.");
  if(contasDe(r,"USD").length&&!n(r.ind&&r.ind.ptax))
    add("info","Indicadores","PTAX em branco",
      "H\u00e1 conta offshore neste m\u00eas e a PTAX de fechamento n\u00e3o foi informada.");

  var ordem={alta:0,atencao:1,info:2};
  out.sort(function(a,b){ return ordem[a.nivel]-ordem[b.nivel]; });
  return out;
}
/* ===================== Conferência ao vivo do Preencher (3.11) =====================
   Roda sobre o rascunho (o que está na tela, antes de salvar): a conferência das contas
   (conferir) mais a dos ativos e a das instituições. Aponta o que ainda é do mês anterior,
   o que não bate entre ativos e saldo, categoria que mudou, campo faltando, ativo repetido,
   vencido ou que sumiu. */
function limparInternos(o){ var x={}; Object.keys(o||{}).forEach(function(k){ if(k.charAt(0)!=="_") x[k]=o[k]; }); return x; }
function semAc(s){ return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase(); }
function instChave(s){ var t=semAc(s).replace(/[^a-z0-9 ]/g," ").trim().split(/\s+/)[0]||""; return t; }
/* Nome do ativo para comparar entre meses: sem acento, sem o "*" de nota de rodapé do BTG,
   sem o " | taxa | ano" e sem pontuação. */
function ativoNomeChave(x){ return semAc(String(x.nome||"").split("|")[0]).replace(/\*/g,"").replace(/[^a-z0-9]+/g," ").trim(); }
function ativoChave(x){ return ativoNomeChave(x)+"|"+instChave(x.inst); }
function regAnterior(id,mes,ano){
  var p=anterior(mes,ano),t=0;
  while(t<24){ var rr=reg(id,p.mes,p.ano); if(rr) return {r:rr,mes:p.mes,ano:p.ano}; p=anterior(p.mes,p.ano); t++; }
  return null;
}
function ativosValidos(r){ return ((r&&r.ind&&r.ind.ativos)||[]).filter(function(x){ return (x.nome||"").trim()||n(x.posicao); }); }
/* Casa cada ativo deste mês com o mesmo ativo do mês anterior. Nome igual não basta: há
   títulos com o mesmo nome e vencimentos diferentes (três NTN-B, dois fundos de previdência
   iguais), e meses antigos sem instituição. Ordem: nome+instituição+vencimento, nome+
   vencimento, nome com a posição mais próxima e, por fim, título com o mesmo vencimento,
   a mesma subcategoria e a mesma taxa (o nome mudou de formato entre um mês e outro).
   Devolve um vetor com o par de cada ativo (ou null). */
function casarAtivos(atuais,anteriores){
  var usado=anteriores.map(function(){ return false; }), par=atuais.map(function(){ return null; });
  var nomeA=anteriores.map(ativoNomeChave), instA=anteriores.map(function(x){ return instChave(x.inst); });
  var passo=function(teste){
    atuais.forEach(function(x,i){
      if(par[i]) return;
      var nx=ativoNomeChave(x), ix=instChave(x.inst), melhor=-1, dist=Infinity;
      anteriores.forEach(function(a,j){
        if(usado[j]||!teste(x,nx,ix,a,nomeA[j],instA[j])) return;
        var d=Math.abs(n(a.posicao)-n(x.posicao)); if(d<dist){ dist=d; melhor=j; }
      });
      if(melhor>=0){ usado[melhor]=true; par[i]=anteriores[melhor]; }
    });
  };
  passo(function(x,nx,ix,a,na,ia){ return nx&&nx===na&&ix===ia&&(x.vencimento||"")===(a.vencimento||""); });
  passo(function(x,nx,ix,a,na,ia){ return nx&&nx===na&&(x.vencimento||"")===(a.vencimento||""); });
  passo(function(x,nx,ix,a,na,ia){ return nx&&nx===na; });
  /* nome curto contido no nome longo ("CDB BANCO ORIGINAL" e "BANCO ORIGINAL S/A - CDB-CDB9245OQHW") */
  var contido=function(p1,p2){ var w1=p1.split(" "), w2=" "+p2+" "; return w1.length>=2&&w1.every(function(w){ return w2.indexOf(" "+w+" ")>=0; }); };
  passo(function(x,nx,ix,a,na){ return nx&&na&&(x.vencimento||"")===(a.vencimento||"")&&(contido(nx,na)||contido(na,nx)); });
  passo(function(x,nx,ix,a){ return x.vencimento&&String(x.vencimento).length===10&&x.vencimento===a.vencimento&&(x.subcategoria||"")===(a.subcategoria||"")&&semAc(x.taxa).replace(/[^0-9,]/g,"")===semAc(a.taxa).replace(/[^0-9,]/g,""); });
  passo(function(x,nx,ix,a){ var pa=n(a.posicao), px=n(x.posicao); return x.vencimento&&String(x.vencimento).length===10&&x.vencimento===a.vencimento&&(x.subcategoria||"")===(a.subcategoria||"")&&pa>0&&Math.abs(px-pa)/pa<0.15; });
  return par;
}
/* Conta igual à do mês anterior e sem movimento nem resultado: ainda não foi atualizada. */
function contaHerdada(c,antR){
  if(!antR||n(c.rendRs)||n(c.rendPct)||n(c.apl)||n(c.res)) return false;
  var a=contasDe(antR,curDe(c)).filter(function(x){ return chaveConta(x)===chaveConta(c); })[0];
  return !!a&&Math.abs(n(a.saldo)-n(c.saldo))<0.005&&n(c.saldo)>0;

function mesesDoCliente(id){
  var out=[];
  Object.keys(db.dados).forEach(function(k){
    if(k.indexOf(id+"|")!==0) return;
    var mm=(k.split("|")[1]||"").split("-");
    if(mm.length!==2) return;
    out.push({ano:parseInt(mm[0],10),mes:parseInt(mm[1],10)});
  });
  out.sort(function(a,b){ return (b.ano-a.ano)||(b.mes-a.mes); });
  return out;
}

  }else{
    corpo=grupos.map(function(g){

  IND.forEach(function(par){

/* Agrupa candidatos de página consecutivos que cabem juntos numa folha, pra
   não gastar página impressa inteira com uma seção pequena (pizza sozinha,
   tabela de poucas linhas). Cada candidato marcado "capa" ou "solo" — ou
   sem estimativa de altura — sempre fica sozinho na própria página, exatamente
   como já era antes desta otimização; nunca reordena o conteúdo, só decide
   se o próximo candidato cabe atrás do que já está na página aberta.
   mapaIdx[i] devolve, pro candidato de índice i, o índice da página física
   final em que ele caiu — usado pra corrigir os números de página do
   Sumário, que foram gravados como índice de candidato, não de página. */
function empacotarPaginas(candidatos,orcamento){
  var paginas=[], mapaIdx=[], grupoHtml="", grupoAltura=0, grupoAberto=false;
  function fecha(){
    if(grupoAberto) paginas.push({html:grupoHtml});
    grupoHtml=""; grupoAltura=0; grupoAberto=false;
  }
  candidatos.forEach(function(cnd,ci){
    if(cnd.capa){
      fecha();
      paginas.push({html:cnd.html,capa:true});
      mapaIdx[ci]=paginas.length-1;
      return;
    }
    if(cnd.solo||cnd.altura==null){
      fecha();
      paginas.push({html:cnd.html});
      mapaIdx[ci]=paginas.length-1;
      return;
    }
    if(grupoAberto && grupoAltura+cnd.altura<=orcamento){
      grupoHtml+=cnd.html; grupoAltura+=cnd.altura;
    } else {
      fecha();
      grupoHtml=cnd.html; grupoAltura=cnd.altura; grupoAberto=true;
    }
    mapaIdx[ci]=paginas.length;
  });
  fecha();
  return {paginas:paginas, mapaIdx:mapaIdx};
}

       cabeçalho da tabela 34. As alturas estimadas valem para os dois formatos. */
    var altLinha=function(x){ var a=Math.max(1,Math.ceil(String(x.nome||"—").length/30)), sl=subLinha(x), b=Math.max(1,sl?Math.ceil(sl.length/56):1); return 18+a*16+b*14; };
    var UTIL=692, OH_T=155, OH=112, THEAD=34, FOLGA=12, NOTA=64;
    var ALT={banda:32,ref:30,tot:34};

        '<td class="n">'+rp(x.rentMes)+(pc!==null?'<small class="cdi">'+pct(pc,0)+' CDI</small>':'')+'</td><td class="n">'+rp(x.rentAno)+'</td>'+
        '<td class="n">'+(semDozeMeses(x)?"—":rp(x.rent12m))+'</td><td class="n">'+rp(x.rentInicio)+'</td></tr>';
    };
    var linhaRef=function(rotulo,ref){ return ref?'<tr class="at-ref"><td>'+rotulo+' <small>referência</small></td><td></td><td></td><td></td>'+
      '<td class="n">'+pct(ref.mes)+'</td><td class="n">'+(ref.ano!=null?pct(ref.ano):"—")+'</td><td class="n">'+(ref.m12!=null?pct(ref.m12):"—")+'</td><td class="n">—</td></tr>':""; };
    var cabTabela='<table class="rt at-tab"><thead><tr><th>Ativo</th><th class="n">Posição</th><th class="n">% classe</th><th class="n">% cart.</th>'+
      '<th class="n">Mês</th><th class="n">Ano</th><th class="n">12 m</th><th class="n">Início</th></tr></thead><tbody>';
    var gruposComDados=CATEGORIAS_ATIVO.map(function(cat){
      var l=ativosRel.filter(function(x){ return (x.categoria||CATEGORIAS_ATIVO[0])===cat; });
      l=l.map(function(x,i){ return {x:x,i:i}; }).sort(function(a,b){ return (ordemSub(a.x.subcategoria)-ordemSub(b.x.subcategoria))||(a.i-b.i); }).map(function(o){ return o.x; });
      return {cat:cat,lista:l};
    }).filter(function(g){ return g.lista.length; });
    var P=PADRAO_LINHAS_ATIVOS, primeiraPaginaGeral=true;
    gruposComDados.forEach(function(g,gi){
      var totCat=g.lista.reduce(function(a,x){return a+n(x.posicao);},0);

      var temBandas=Object.keys(porSub).length>1||!!Object.keys(porSub)[0];
      var ref=g.cat==="Renda Variável"?["Ibovespa",refIbov]:["CDI",refCdi];

      itens.forEach(function(it){

      folhas.forEach(function(f,fi){

        /* o empacotador de páginas trabalha na escala de PADRAO_LINHAS_ATIVOS.alturaPagina */

        '<span class="s">'+(desdeU?"desde "+desdeU:acumU.meses+" meses")+'</span></div>'

      rend12+'</div>';

     '<p>Investimentos envolvem riscos, inclusive de perda do capital investido. Produtos de renda fixa emitidos por instituições financeiras contam com a cobertura do Fundo Garantidor de Créditos nos limites e condições previstos em seu regulamento; demais ativos não contam com garantia do FGC nem do administrador. Leia atentamente os documentos de cada produto antes de investir.</p>'+
     '<p>Dúvidas sobre este relatório devem ser tratadas diretamente com o assessor responsável.</p>'+

  /* --- empacota candidatos em páginas físicas ---
     Até aqui, PGS só tem candidatos (um por pag()); a partir daqui vira a

  var empacotado=empacotarPaginas(PGS,PADRAO_LINHAS_ATIVOS.alturaPagina);

  if(SUM.length){

    }).join("");
    PGS.splice(1,0,{html:'<div class="dash"><i>\u2014</i><h2>Sum\u00e1rio</h2></div>'+
      '<div class="sum">'+linhas+'</div>',capa:false});
  }

  /* --- montagem com numeração real --- */
  var total=PGS.length;
  PGS.forEach(function(P,i){

  });

  h+='</div>';
  return h;
}

var avisoImpressao=true;

/* Nome padrao de arquivo: empresa, ano-mes, cliente, tipo.

}

function setOrientacaoImpressao(o){

function imprimir(orientacao){

  }

/* ===================== Gerar PDF direto (3.10) =====================
   Sem a janela de impressão: cada página do relatório (.pg) vira uma imagem A4 com as
   mesmas regras de impressão (@media print) e entra num PDF, que baixa com o nome
   padrão (tituloPdf). "PDF de todos" faz o mesmo para todos os clientes com lançamento
   no mês, e pode gravar cada um na ficha do cliente no CRM. Para a versão em vetor
   (texto selecionável), o Imprimir continua igual. */
var REL_PDF={cancelar:false,rodando:false};
function relCarregar(src){
  return new Promise(function(ok,erro){
    if(document.querySelector('script[data-rel="'+src+'"]')) return ok();
    var x=document.createElement("script"); x.src=src; x.setAttribute("data-rel",src);
    x.onload=function(){ ok(); }; x.onerror=function(){ erro(new Error("Não foi possível carregar "+src)); };
    document.head.appendChild(x);
  });
}
function relLibs(){ return relCarregar("vendor/jspdf-2.5.1.umd.min.js").then(function(){ return relCarregar("vendor/html2canvas-1.4.1.min.js"); }); }
var REL_REGRAS=null;
function relRegrasImpressao(){
  if(REL_REGRAS!==null) return REL_REGRAS;
  var out=[];
  [].forEach.call(document.styleSheets,function(sh){
    var rs; try{ rs=sh.cssRules; }catch(e){ return; }
    [].forEach.call(rs||[],function(r){
      if(r.type===4&&/\bprint\b/.test(r.media.mediaText)&&!/screen/.test(r.media.mediaText))
        [].forEach.call(r.cssRules,function(x){ if(x.type===1) out.push(x.cssText); });
    });
  });
  REL_REGRAS=out.join("\n");
  return REL_REGRAS;
}
/* Uma página (.pg) em canvas, do jeito que sairia na impressão (largura A4 = 794 px). */
function relPaginaCanvas(pg,idx){
  pg.setAttribute("data-relpg",idx);
  return window.html2canvas(pg,{scale:2,backgroundColor:"#ffffff",logging:false,windowWidth:1280,
    onclone:function(doc){
      var st=doc.createElement("style"); st.textContent=relRegrasImpressao()+"\n[data-relpg]{width:794px!important;max-width:none!important;box-sizing:border-box!important}";
      doc.head.appendChild(st);
      var alvo=doc.querySelector('[data-relpg="'+idx+'"]'); if(!alvo) return;
      /* SVG com largura em % sai em branco no html2canvas: cada gráfico vira <img>. */
      [].forEach.call(alvo.querySelectorAll("svg"),function(sv){
        var vb=(sv.getAttribute("viewBox")||"").split(/[\s,]+/).map(Number);
        var c=sv.cloneNode(true);
        if(vb.length===4&&vb[2]>0){ if(!/^\d+$/.test(c.getAttribute("width")||"")) c.setAttribute("width",vb[2]); if(!/^\d+$/.test(c.getAttribute("height")||"")) c.setAttribute("height",vb[3]); }
        c.setAttribute("xmlns","http://www.w3.org/2000/svg"); c.removeAttribute("style");
        var img=doc.createElement("img");
        img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(new XMLSerializer().serializeToString(c));
        img.className=(sv.getAttribute("class")||"");
        var noPainel=!!sv.closest(".panel");
        img.style.cssText="display:block;margin:0 auto;max-width:100%;height:auto;"+(noPainel?"max-height:46mm;width:auto;":"")+(sv.getAttribute("style")||"").replace(/width:[^;]*;?/,"");
        sv.parentNode.replaceChild(img,sv);
      });
    }}).then(function(cv){ pg.removeAttribute("data-relpg"); return cv; },function(e){ pg.removeAttribute("data-relpg"); throw e; });
}
function relPdfDasPaginas(paginas,progresso){
  var pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4",compress:true});
  var passo=Promise.resolve();
  [].forEach.call(paginas,function(pg,i){
    passo=passo.then(function(){
      if(REL_PDF.cancelar) throw new Error("cancelado");
      if(progresso) progresso(i+1,paginas.length);
      return relPaginaCanvas(pg,i);
    }).then(function(cv){
      if(i>0) pdf.addPage();
      var alt=cv.height*210/cv.width, larg=210;
      if(alt>297){ larg=210*297/alt; alt=297; }
      pdf.addImage(cv.toDataURL("image/jpeg",0.86),"JPEG",(210-larg)/2,0,larg,alt);
    });
  });
  return passo.then(function(){ return pdf.output("blob"); });
}
function relBaixar(blob,nome){
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=nome;
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },2000);
}
function relAviso(txt){

/* Liga um cliente das Carteiras a um cliente do CRM: pela conta do BTG, depois pelo nome. */
function relLeadDe(c,leads){
  if(c.lead_id){ var lig=leads.filter(function(l){ return l.id===c.lead_id; })[0]; if(lig) return lig; }
  var soNum=function(x){ return String(x||"").replace(/\D/g,"").replace(/^0+/,""); };
  var contas=(c.contas_btg||[]).map(soNum).filter(Boolean);
  var porConta=leads.filter(function(l){ return l.conta&&contas.indexOf(soNum(l.conta))!==-1; });
  if(porConta.length===1) return porConta[0];
  var nm=hbSemAcento(c.nome).trim();
  var porNome=leads.filter(function(l){ return hbSemAcento(l.cliente).trim()===nm; });
  return porNome.length===1?porNome[0]:null;
}

    if(!window.AdamiCRM||!window.AdamiCRM.enviar) throw new Error("ligação com o CRM indisponível");
    return window.AdamiCRM;

function acharClienteDoExtrato(texto){
  /* números do PDF com 4 dígitos ou mais (sem os zeros da frente); ano solto não conta */
  var dig={}; (String(texto).match(/\d[\d.\-]{2,16}\d/g)||[]).forEach(function(t){ dig[t.replace(/\D/g,"").replace(/^0+/,"")]=1; });
  var soNum=function(x){ return String(x||"").replace(/\D/g,"").replace(/^0+/,""); };
  var valida=function(k){ return k&&k.length>=4&&!(k.length===4&&+k>=1990&&+k<=2099); };
  var porConta=db.clientes.filter(function(c){
    var contas=(c.contas_btg||[]).map(soNum); var l=FICHAS&&FICHAS.porId[c.lead_id]; if(l&&l.conta) contas.push(soNum(l.conta));
    return contas.some(function(k){ return valida(k)&&dig[k]; });
  });
  if(porConta.length===1) return {c:porConta[0],como:"conta"};
  var tx=semAc(texto).replace(/\s+/g," ");
  /* pelo nome só com o nome completo: o da ficha ligada (2 palavras ou mais) ou o da
     carteira com 3 palavras ou mais. Primeiro nome sozinho bate com gente demais. */
  var porNome=db.clientes.filter(function(c){ var l=FICHAS&&FICHAS.porId[c.lead_id]; var nm=semAc(l?l.cliente:c.nome).replace(/\s+/g," ").trim(); return nm.split(" ").length>=(l?2:3)&&tx.indexOf(nm)>=0; });
  if(porNome.length===1) return {c:porNome[0],como:"nome"};
  return null;
}

function salvarLote(){
  var itens=FECH.lote.filter(function(x){ return x.estado==="pronto"&&x.cliente; });
  var porCliente={}; itens.forEach(function(x){ (porCliente[x.cliente]=porCliente[x.cliente]||[]).push(x); });
  var ids=Object.keys(porCliente);
  var jaFeitos=ids.filter(function(id){ return statusMes(id,S.mes,S.ano)==="feito"; });
  if(!confirm("Salvar "+itens.length+" extrato(s) em "+ids.length+" cliente(s) de "+MESES[S.mes-1].toLowerCase()+"/"+S.ano+"?"+(jaFeitos.length?"\n\nAtenção: "+jaFeitos.length+" deles já estão marcados como feitos. O mês continua feito, mas os ativos mudam.":""))) return;
  status("wait","Salvando…");
  var passo=Promise.resolve(), ok=0, erros=[];
  ids.forEach(function(id){
    passo=passo.then(function(){
      var r=rascunhoDe(id); if(!r) throw new Error("sem rascunho");
      /* dois extratos do mesmo banco para o mesmo cliente (duas contas): os ativos somam */
      var porInst={}, saldoOk=true, cliX=db.clientes.filter(function(c){ return c.id===id; })[0];
      porCliente[id].forEach(function(x){
        if(x.performance){ aplicarPerformance(r,x.performance,x.arquivo);
          if(x.performance.conta&&cliX&&!(cliX.contas_btg&&cliX.contas_btg.length)){ cliX.contas_btg=[x.performance.conta]; api("clientes?id=eq."+id,{method:"PATCH",prefer:"return=minimal",body:{contas_btg:[x.performance.conta]}}).catch(function(){}); }
          return; }
        var k=x.leitor.inst; (porInst[k]=porInst[k]||[]).push.apply(porInst[k],JSON.parse(JSON.stringify(x.ativos))); });
      Object.keys(porInst).forEach(function(k){ if(!aplicarAtivosExtrato(r,porInst[k],k).saldo) saldoOk=false; });
      var contas=r.contas.filter(function(c){ return (c.nome||"").trim()||n(c.saldo); }), agora=new Date().toISOString(), ind=limparInternos(r.ind);
      return api("lancamentos?on_conflict=cliente_id,mes,ano",{method:"POST",prefer:"resolution=merge-duplicates,return=representation",
        body:{cliente_id:id,mes:S.mes,ano:S.ano,contas:contas,indicadores:ind,atualizado_em:agora}}).then(function(rows){
        var antes=reg(id,S.mes,S.ano)||{}, x0=(rows&&rows[0])||{};
        db.dados[chave(id,S.mes,S.ano)]={contas:contas,ind:ind,atualizado_em:agora,feito_em:x0.feito_em!==undefined?x0.feito_em:antes.feito_em||null,feito_por:x0.feito_por!==undefined?x0.feito_por:antes.feito_por||null};
        porCliente[id].forEach(function(x){ x.estado="salvo"; x.saldoOk=saldoOk; }); ok++;
        registrar("importou extrato em lote",(db.clientes.filter(function(c){return c.id===id;})[0]||{}).nome||"",MESES[S.mes-1]+"/"+S.ano+" · "+porCliente[id].length+" extrato(s)");
      });
    }).catch(function(e){ erros.push(e.message||e); });
  });
  passo.then(function(){ status(erros.length?"err":"ok",erros.length?"Erro em "+erros.length:"Sincronizado"); montarRascunho(); render(true);
    if(erros.length) alert("Salvos: "+ok+". Com erro: "+erros.length+"\n\n"+erros.slice(0,5).join("\n")); });
}
