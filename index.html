function puxarBtg(){
  var c=cli(); if(!c||!S.rasc) return;
  if(!c.contas_btg||!c.contas_btg.length){
    if(confirm("Informe antes a conta BTG de "+c.nome+". Abrir agora?")) editarContasBtg();
    return;
  }
  status("wait","Buscando no BTG…");
  api("rpc/btg_rent_cliente",{method:"POST",body:{p_cliente:c.id,p_mes:S.mes,p_ano:S.ano}}).then(function(d){
    status("ok","Sincronizado");
    var mesTxt=MESES[S.mes-1]+"/"+S.ano;
    var fmtMes=function(iso){ if(!iso) return null; var p=String(iso).slice(0,7).split("-"); return MESES[Number(p[1])-1]+"/"+p[0]; };
    if(!d||!d.carteira||!d.carteira.length){
      var msg="O BTG ainda não mandou "+mesTxt+" para a(s) conta(s) "+((d&&d.contas)||c.contas_btg).join(", ")+".";
      if(d&&d.ultimo_mes) msg+="\n\nÚltimo mês recebido para este cliente: "+fmtMes(d.ultimo_mes)+".";
      else if(d&&d.ultimo_mes_casa) msg+="\n\nO BTG já mandou "+fmtMes(d.ultimo_mes_casa)+" para outras contas: confira se o número da conta deste cliente está certo.";
      else msg+="\n\nNenhum relatório de rentabilidade chegou ainda. A integração com o BTG precisa estar ligada (webhooks cadastrados), e o pedido sai nos dias 2 e 5 de cada mês.";
      alert(msg); return;
    }
    var contas=d.carteira.map(function(x){
      var k=x.dados||{}, liq=numBtg(k.inflow_and_outflow);
      return {nome:"BTG "+x.nr_conta, inst:"BTG Pactual", saldo:numBtg(k.auc_end), apl:liq>0?liq:0, res:liq<0?-liq:0,
              rendRs:numBtg(k.profit_mtd), rendPct:pctBtg(k.profitability_mtd), moeda:"BRL"};
    });
    var ativos=(d.produtos||[]).filter(function(x){ return Math.abs(numBtg((x.dados||{}).auc_end))>0.005; }).map(function(x){
      var k=x.dados||{};
      return {nome:k.product_name||k.product_key||("Produto "+(k.product_id||"")), categoria:categoriaBtg(k.market_id), subcategoria:"",
              inst:"BTG Pactual", taxa:"", vencimento:"", posicao:numBtg(k.auc_end),
              rentMes:pctBtg(k.profitability_mtd), rentAno:pctBtg(k.profitability_ytd), rent12m:pctBtg(k.profitability_12m), rentInicio:pctBtg(k.profitability_ttd)};
    });
    var porEst={}, totEst=0, semMapa=[];
    (d.estrategias||[]).forEach(function(x){
      var v=numBtg((x.dados||{}).auc_end); if(v<=0) return;
      var k=estratBtg(x.estrategia); totEst+=v;
      if(k) porEst[k]=(porEst[k]||0)+v; else if(semMapa.indexOf(x.estrategia)<0) semMapa.push(x.estrategia);
    });
    var k0=(d.carteira[0]&&d.carteira[0].dados)||{};
    var indBtg={cdi:k0.cdi_mtd, ipca:k0.imab_mtd, ibov:k0.ibovespa_mtd, dolar:k0.dolar_mtd, ifix:k0.ifix_mtd};
    var indNovos=Object.keys(indBtg).filter(function(x){ return indBtg[x]!=null&&String(indBtg[x]).trim()!==""&&!n(S.rasc.ind[x]); });

    var saldo=contas.reduce(function(a,x){return a+x.saldo;},0), res=contas.reduce(function(a,x){return a+x.rendRs;},0);
    var outrasContas=S.rasc.contas.filter(function(x){ return !ehBtg(x.inst)&&((x.nome||"").trim()||n(x.saldo)); }).length;
    var outrosAtivos=(S.rasc.ind.ativos||[]).filter(function(x){ return !ehBtg(x.inst)&&((x.nome||"").trim()||n(x.posicao)); }).length;
    var txt="BTG, "+mesTxt+", "+contas.length+" conta(s):\n\n"+
      "Saldo: "+brl2(saldo)+"\nResultado do mês: "+brl2(res)+(contas.length===1?" ("+pct(contas[0].rendPct)+")":"")+"\n"+
      "Ativos: "+ativos.length+"\n"+
      (totEst?"Alocação por estratégia: "+Object.keys(porEst).length+" estratégia(s)"+(semMapa.length?" (sem correspondência: "+semMapa.join(", ")+")":"")+"\n":"")+
      (indNovos.length?"Índices preenchidos (estavam vazios): "+indNovos.map(function(x){ return ({cdi:"CDI",ipca:"IMA-B",ibov:"Ibovespa",dolar:"Dólar",ifix:"IFIX"})[x]; }).join(", ")+"\n":"")+
      "\nIsso substitui a conta e os ativos do BTG deste mês."+
      ((outrasContas||outrosAtivos)?" Ficam como estão "+outrasContas+" conta(s) e "+outrosAtivos+" ativo(s) de outros bancos.":"")+
      "\nNada é gravado até você clicar em \"Salvar mês\". Continuar?";
    if(!confirm(txt)) return;

    S.rasc.contas=S.rasc.contas.filter(function(x){ return !(curDe(x)==="BRL"&&ehBtg(x.inst)); }).concat(contas);
    S.rasc.ind.ativos=(S.rasc.ind.ativos||[]).filter(function(x){ return !ehBtg(x.inst); }).concat(ativos);
    if(totEst){ var e={}; ESTRAT.forEach(function(x){ e[x[0]]=porEst[x[0]]?Math.round(porEst[x[0]]/totEst*10000)/100:0; }); S.rasc.ind.estrategias=e; }
    indNovos.forEach(function(x){ S.rasc.ind[x]=pctBtg(indBtg[x]); });
    S.rasc._herdado=false; S.rasc._btg=true;
    registrar("puxou do BTG",c.nome,mesTxt);
    render(true);
    alert("Pronto. Confira os números e a categoria de cada ativo, e clique em \"Salvar mês e ver relatório\".");
  }).catch(function(e){
    status("err","Erro");
    var m=String(e.message||e);
    alert(/btg_rent_cliente|does not exist|404/.test(m)?"O \"Puxar do BTG\" ainda não foi instalado no Supabase (btg_rentabilidade.sql).":"Não foi possível buscar no BTG: "+m);
  });
}

function parseNumPlanilha(v){
  if(v===undefined||v===null||v==="") return 0;
  if(typeof v==="number") return v;
  var s=String(v).trim().replace(/^R\$\s*/i,"").replace(/\s+/g,"");
  if(!s) return 0;
  if(s.indexOf(",")>=0 && s.indexOf(".")>=0){
    if(s.lastIndexOf(",")>s.lastIndexOf(".")) s=s.replace(/\./g,"").replace(",",".");
    else s=s.replace(/,/g,"");
  } else if(s.indexOf(",")>=0){ s=s.replace(",","."); }
  var x=parseFloat(s);
  return isNaN(x)?0:x;
}
function parseVencPlanilha(v){
  if(!v) return "";

  m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/); if(m) return m[3]+"-"+m[2]+"-"+m[1];
  return s;
}

/* ---- Importar ativos de PDF (Relatório de Performance BTG/Necton, Extrato Sinosserra) ---- */
function pdfParseMoeda(s){
  if(!s) return 0;
  var t=String(s).replace(/^R\$\s*/,"").replace(/\s+/g,"");
  var neg=/^-/.test(t); t=t.replace(/^-/,"");
  if(!t || t==="-") return 0;
  t=t.replace(/\./g,"").replace(",",".");
  var x=parseFloat(t);
  return isNaN(x)?0:(neg?-x:x);
}
function pdfDataParaISO(s){
  var m=String(s||"").match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  return m? (m[3]+"-"+m[2]+"-"+m[1]) : "";
}
var SECOES_VALIDAS_BTG={
  "Pós-fixado": {categoria:"Renda Fixa", subcategoria:"Pós-fixado"},
  "Pré-fixado": {categoria:"Renda Fixa", subcategoria:"Pré-fixado"},
  "Inflação": {categoria:"Renda Fixa", subcategoria:"Inflação"},
  "Alternativo": {categoria:"Fundos", subcategoria:"Alternativo"},
  "Renda Variável": {categoria:"Renda Variável", subcategoria:""},
  "Retorno Absoluto (MM)": {categoria:"Fundos", subcategoria:"Multimercado"},
};
/* O pdf.js as vezes nao consegue decodificar um glifo (ligadura "fi", "ç")
   e devolve um caractere nulo no lugar -- "Pós-fixado" chega como
   "Pós-\u0000xado". Normaliza tirando acento, nulo e espaco antes de
   comparar, e usa "e subsequencia de" em vez de igualdade: como so FALTA
   caractere (nunca sobra), o nome normalizado sempre cabe dentro do nome
   oficial, na mesma ordem. */
function pdfNormalizarTexto(s){
  return String(s||"")
    .replace(/\u0000/g,"")
    .normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-zA-Z0-9]/g,"")
    .toLowerCase();
}
function pdfEhSubsequencia(pequena, grande){
  if(!pequena) return false;
  var i=0;
  for(var j=0;j<grande.length && i<pequena.length;j++){
    if(grande[j]===pequena[i]) i++;
  }
  return i===pequena.length;
}
function pdfIdentificarSecao(textoAntesDeEmCarteira){
  var alvo=pdfNormalizarTexto(textoAntesDeEmCarteira);
  if(!alvo) return null;
  var nomes=Object.keys(SECOES_VALIDAS_BTG);
  for(var i=0;i<nomes.length;i++){
    if(pdfEhSubsequencia(pdfNormalizarTexto(nomes[i]), alvo) || pdfEhSubsequencia(alvo, pdfNormalizarTexto(nomes[i]))) return nomes[i];
  }
  return null;
}
function pdfDetectarFormato(todasLinhas){
  var texto=todasLinhas.join('\n');
  if(/Detalhamento dos Ativos/i.test(texto) && /necton|BTG Pactual/i.test(texto)) return "btg";
  if(/SINOSSERRA FINANCEIRA/i.test(texto) || /Extrato de cliente/i.test(texto)) return "sinosserra";
  return null;
}
function pdfParseBtgDetalhamento(todasLinhas){
  var inicio=-1;
  for(var i=0;i<todasLinhas.length;i++){
    if(/Detalhamento dos Ativos/i.test(todasLinhas[i])){ inicio=i; break; }
  }
  if(inicio===-1) return {ativos:[], erro:'Não encontrei a seção "Detalhamento dos Ativos" neste PDF.'};
  var secaoAtual=null;
  var ativos=[];
  var DATA_RE=/\d{2}\/\d{2}\/\d{4}/g;
  var MOEDA_RE=/R\$\s*-?[\d.]*\d,\d{2}/g;
  var EM_CARTEIRA_RE=/Em\s*cart\s*eir\s*a?\b/i;
  for(var li=inicio+1; li<todasLinhas.length; li++){
    var linha=todasLinhas[li].trim();
    if(!linha) continue;
    if(/^Relat[óo]rio de Performance$/i.test(linha) || /^Per[íi]odo de /i.test(linha) || /^P[áa]gina \d+/i.test(linha)) continue;

    var posEmCarteira=linha.search(EM_CARTEIRA_RE);
    if(posEmCarteira!==-1){
      secaoAtual=pdfIdentificarSecao(linha.slice(0,posEmCarteira));
      continue;
    }
    if(!secaoAtual) continue;
    if(/^TOTAL\b/i.test(linha)) continue;
    /* "Distribuição por classe de ativos" se repete como resumo em varias
       paginas do relatorio -- sem este corte, "Em Fundo de Investimento
       48,65% do Total" vira um "ativo" fantasma na ultima secao aberta. */
    if(/^Em\s+\S.*%\s*do\s*Tot/i.test(linha)) continue;

    var datas=linha.match(DATA_RE)||[];
    var moedas=linha.match(MOEDA_RE)||[];
    if(!moedas.length) continue; // pula a linha de cabecalho da tabela (nao tem R$ nenhum)

    var nome;
    if(datas.length){
      nome=linha.slice(0, linha.indexOf(datas[0])).trim();
    } else {
      var primeiroEspaco=linha.indexOf(' ');
      var candidato=primeiroEspaco===-1?linha:linha.slice(0,primeiroEspaco);
      nome=/^[A-Z]{3,6}\d{1,2}$/.test(candidato) ? candidato : linha.slice(0, linha.indexOf(moedas[0])).trim();
      // sem data, a "Quantidade" fica colada no fim do nome (ex: "XBT BITCOIN (XBT) 0,01") -- tira.
      nome=nome.replace(/\s+[\d.,]+\s*$/,"");
    }
    if(!nome) continue;

    var vencimento=datas.length>=2?pdfDataParaISO(datas[1]):"";
    /* So existe taxa de verdade quando tem as DUAS datas (inicial e
       vencimento): o texto entre elas e o "R$" e a taxa, sem mais nada no
       meio. Com uma data so (fundo/CrPr), o que vem depois e Quantidade e
       a janela de resgate (D+N) -- nunca taxa, por isso fica em branco. */
    var taxa="";
    if(datas.length>=2){
      var finalPrefixo=linha.indexOf(datas[1])+datas[1].length;
      var inicioMoeda=linha.indexOf(moedas[0]);
      taxa=linha.slice(finalPrefixo,inicioMoeda).trim().replace(/\s+/g," ");
    }
    var saldoBruto=pdfParseMoeda(moedas[0]);
    var info=SECOES_VALIDAS_BTG[secaoAtual];
    ativos.push({nome:nome, categoria:info.categoria, subcategoria:info.subcategoria, inst:"", taxa:taxa,
      vencimento:vencimento, posicao:saldoBruto,
      rentMes:0, rentAno:0, rent12m:0, rentInicio:0});
  }
  return {ativos:ativos, erro: ativos.length?null:"Não encontrei nenhuma linha de ativo na seção Detalhamento dos Ativos."};
}
/* Esse extrato não dá pra reconstruir por LINHA como o BTG: cada campo
   (coluna visual) fica numa faixa de Y própria espalhada pela página toda, e
   os 5 valores de um mesmo campo (um por ativo) ficam em X fixo (um "slot"
   por ativo) mas deslocados do rótulo do campo em Y por uma quantidade que
   varia campo a campo (Cód. B3: ~20 abaixo do rótulo; Vlr. aplicado: ~0-9
   acima). A janela -22/+13 em volta de cada rótulo cobre todo deslocamento
   visto nos PDFs reais sem nunca alcançar o rótulo vizinho (menor
   espaçamento entre dois rótulos consecutivos: ~26). Por isso essa função
   recebe os ITENS da página (com x/y), não linhas já montadas. */
function pdfAcharRotulo(itens, re){ return itens.filter(function(it){ return re.test(it.str); })[0] || null; }
function pdfParseSinosserraPorItens(itensPagina){
  if(!itensPagina.some(function(it){ return /SINOSSERRA FINANCEIRA|Extrato de cliente/i.test(it.str); })) return [];
  var rPapel=pdfAcharRotulo(itensPagina, /^Papel\b/);
  if(!rPapel) return [];
  // "Papel" é o único rótulo cujos valores ficam exatamente no mesmo Y dele -- usa pra achar os slots de X com segurança.
  var slotsX=itensPagina.filter(function(it){
    return it!==rPapel && it.x>rPapel.x && Math.abs(it.y-rPapel.y)<=2 && !/^Total/i.test(it.str) && !/^geral:?$/i.test(it.str);
  }).sort(function(a,b){ return a.x-b.x; }).map(function(it){ return it.x; });
  var n=slotsX.length;
  if(!n) return [];

  function slotMaisProximo(x){
    var melhor=0, menorDist=Infinity;
    for(var i=0;i<slotsX.length;i++){
      var d=Math.abs(x-slotsX[i]);
      if(d<menorDist){ menorDist=d; melhor=i; }
    }
    return melhor;
  }
  function valoresPorSlot(rotuloItem, filtro){
    if(!rotuloItem) return new Array(n).fill("");
    var cand=itensPagina.filter(function(it){
      return it!==rotuloItem && it.y>=rotuloItem.y-22 && it.y<=rotuloItem.y+13 && filtro(it.str);
    });
    var porSlot=new Array(n).fill(null).map(function(){ return []; });
    cand.forEach(function(it){
      var s=slotMaisProximo(it.x);
      var distSlot=Math.abs(it.x-slotsX[s]);
      if(distSlot<=15) porSlot[s].push(it);
    });
    porSlot.forEach(function(lista){ lista.sort(function(a,b){ return a.x-b.x; }); });
    return porSlot.map(function(lista){ return lista.map(function(it){ return it.str; }).join(' ').trim(); });
  }

  var papel=valoresPorSlot(rPapel, function(s){ return !/^Total$/i.test(s) && !/^geral:?$/i.test(s); });
  var rCodB3=pdfAcharRotulo(itensPagina, /^C[óo]d\.?\s*B3/i);
  var codB3=valoresPorSlot(rCodB3, function(s){ return /^[A-Z0-9]{6,}$/.test(s); });
  var rDtVcto=pdfAcharRotulo(itensPagina, /^Dt\.?\s*vcto/i);
  var dtVcto=valoresPorSlot(rDtVcto, function(s){ return /^\d{2}\/\d{2}\/\d{4}$/.test(s); });
  var rTaxa=pdfAcharRotulo(itensPagina, /^Tx\.?\s*\(aa\)/i);
  var taxa=valoresPorSlot(rTaxa, function(s){ return /%/.test(s) || /^[A-Z]{2,5}$/.test(s); });
  var rVlrResp=pdfAcharRotulo(itensPagina, /^Vlr\.?\s*resg\.?\s*bruto/i);
  var vlrResp=valoresPorSlot(rVlrResp, function(s){ return /^[\d.]+,\d{2}$/.test(s); });
  var rVlrAplic=pdfAcharRotulo(itensPagina, /^Vlr\.?\s*aplicado/i);
  var vlrAplic=valoresPorSlot(rVlrAplic, function(s){ return /^[\d.]+,\d{2}$/.test(s); });

  var ativos=[];
  for(var k=0;k<n;k++){
    var p=(papel[k]||'').trim();
    if(!p && !codB3[k]) continue;
    var sub=(/PRE/.test(p) && !/PREV/.test(p)) ? "Pré-fixado" : /POS|CDI/.test(p) ? "Pós-fixado" : /IPCA|INFLA/.test(p) ? "Inflação" : "";
    var posicao = vlrResp[k] ? pdfParseMoeda(vlrResp[k]) : (vlrAplic[k] ? pdfParseMoeda(vlrAplic[k]) : 0);
    ativos.push({
      nome: (p+' '+(codB3[k]||'')).trim(), categoria:"Renda Fixa", subcategoria:sub, inst:"Sinosserra",
      taxa: taxa[k]||"", vencimento: pdfDataParaISO(dtVcto[k]||""), posicao: posicao,
      rentMes:0, rentAno:0, rent12m:0, rentInicio:0,
    });
  }
  return ativos;
}
function pdfParseSinosserra(paginasDeItens){
  var ativos=[];
  paginasDeItens.forEach(function(itensPagina){ ativos=ativos.concat(pdfParseSinosserraPorItens(itensPagina)); });
  return {ativos:ativos, erro: ativos.length?null:"Não consegui reconhecer nenhum ativo nesse extrato."};
}
/* Junta os itens de texto do pdf.js em linhas visuais (por Y, com tolerancia
   de 2) na ordem de leitura. So insere espaco entre dois itens quando o
   vao real em X e maior que 1 -- o pdf.js quebra uma palavra em varios
   itens por causa de ligadura/kerning (ex: "Pós-" + [glifo ilegivel] +
   "xado"), e juntar tudo com espaco fixo colaria "Pos- xado" em vez de
   "Pós-fixado". */
function pdfAgruparLinhas(textContent){
  var itens=textContent.items.filter(function(it){ return it.str && it.str.trim(); });
  var linhas=[];
  itens.forEach(function(it){
    var y=Math.round(it.transform[5]);
    var linha=null;
    for(var i=0;i<linhas.length;i++){ if(Math.abs(linhas[i].y-y)<=2){ linha=linhas[i]; break; } }
    if(!linha){ linha={y:y,itens:[]}; linhas.push(linha); }
    linha.itens.push({x:it.transform[4], str:it.str, width:it.width||0});
  });
  linhas.sort(function(a,b){ return b.y-a.y; });
  return linhas.map(function(l){
    l.itens.sort(function(a,b){ return a.x-b.x; });
    var partes=[]; var anterior=null;
    l.itens.forEach(function(it){
      if(anterior){
        var gap=it.x-(anterior.x+anterior.width);
        if(gap>1) partes.push(' ');
      }
      partes.push(it.str);
      anterior=it;
    });
    return partes.join('').replace(/\u0000/g,'').replace(/\s+/g,' ').trim();
  }).filter(function(s){return s;});
}
function importarAtivosPdf(input){
  var f=input.files[0]; if(!f) return;
  if(typeof pdfjsLib==="undefined"){ alert("O leitor de PDF ainda não carregou. Recarregue a página (Cmd+Shift+R) e tente de novo."); input.value=""; return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc="vendor/pdfjs-3.11.174.worker.min.js";
  var botao=document.getElementById("btnImportarPdf");

  function falhar(msg){
    alert(msg);
    input.value="";
    if(botao){ botao.disabled=false; botao.textContent=textoOriginal; }
  }
  var fr=new FileReader();
  fr.onload=function(){
    var dados=new Uint8Array(fr.result);
    pdfjsLib.getDocument({data:dados}).promise.then(function(pdf){
      var todasLinhas=[], paginasDeItens=[], i=1;

          else { falhar("Não reconheci o formato desse PDF. Por enquanto importo o Relatório de Performance (BTG/Necton) e o Extrato de cliente (Sinosserra)."); return; }
          if(resultado.erro){ falhar(resultado.erro); return; }
          if(!confirm("Importar "+resultado.ativos.length+" ativo(s) desse PDF?\n\nIsso substitui a lista de ativos que está na tela agora, mas nada é gravado até você clicar em \"Salvar mês e ver relatório\". Confira a categoria, a subcategoria e a taxa de cada um — a separação automática é uma aproximação.")){
            input.value="";
            if(botao){ botao.disabled=false; botao.textContent=textoOriginal; }
            return;
          }
          S.rasc.ind.ativos=resultado.ativos;
          render(true);
          input.value="";
          if(botao){ botao.disabled=false; botao.textContent=textoOriginal; }
          return;
        }
        pdf.getPage(i).then(function(pagina){
          return pagina.getTextContent().then(function(tc){
            todasLinhas=todasLinhas.concat(pdfAgruparLinhas(tc));
            var itens=tc.items.filter(function(it){ return it.str && it.str.trim(); })
              .map(function(it){ return {str:it.str.replace(/\u0000/g,"").trim(), x:it.transform[4], y:it.transform[5]}; })
              .filter(function(it){ return it.str; });
            paginasDeItens.push(itens);
            i++;
            proximaPagina();
          });
        }).catch(function(e){ falhar("Não consegui ler a página "+i+" do PDF.\n\n"+e.message); });
      }
      proximaPagina();
    }).catch(function(e){ falhar("Não consegui abrir esse PDF. Confira se o arquivo não está corrompido.\n\n"+e.message); });
  };
  fr.onerror=function(){ falhar("Não consegui ler o arquivo."); };
  fr.readAsArrayBuffer(f);
}

/* Carta do mês: o editor grava HTML, e esse HTML aparece no relatório de todo
   mundo. Sem esta limpeza, um texto com código escondido (ex.: <img onerror>) rodaria
   na tela de quem abrisse o relatório e poderia roubar a sessão (varredura de
   06/11/2026). Fica só a formatação que o editor produz. */
var CARTA_TAGS={P:1,BR:1,B:1,STRONG:1,I:1,EM:1,U:1,H1:1,H2:1,H3:1,H4:1,UL:1,OL:1,LI:1,DIV:1,SPAN:1,BLOCKQUOTE:1,IMG:1,FONT:1,SUB:1,SUP:1,HR:1};
var CARTA_FORA={SCRIPT:1,STYLE:1,IFRAME:1,OBJECT:1,EMBED:1,SVG:1,MATH:1,LINK:1,META:1,TEMPLATE:1,NOSCRIPT:1,FORM:1,INPUT:1,BUTTON:1,TEXTAREA:1,SELECT:1,VIDEO:1,AUDIO:1,CANVAS:1,FRAME:1,FRAMESET:1,BASE:1};
function limparHtmlCarta(html){
  if(!html) return "";
  var doc;
  try{ doc=new DOMParser().parseFromString('<div id="cartaRaiz">'+html+'</div>',"text/html"); }catch(e){ return esc(html); }
  var raiz=doc.getElementById("cartaRaiz"); if(!raiz) return "";
  (function limpa(no){
    [].slice.call(no.childNodes).forEach(function(f){
      if(f.nodeType===3) return;
      if(f.nodeType!==1){ no.removeChild(f); return; }
      var t=f.tagName.toUpperCase();
      if(CARTA_FORA[t]){ no.removeChild(f); return; }
      if(!CARTA_TAGS[t]){ limpa(f); while(f.firstChild) no.insertBefore(f.firstChild,f); no.removeChild(f); return; }
      [].slice.call(f.attributes).forEach(function(a){
        var n=a.name.toLowerCase(), v=String(a.value||"");
        var ok=(n==="style"&&!/url\s*\(|expression|javascript:|behavior|@import|-moz-binding/i.test(v))||
          (t==="IMG"&&n==="src"&&/^(data:image\/(png|jpe?g|gif|webp);base64,|https:\/\/)/i.test(v.trim()))||
          (t==="IMG"&&(n==="width"||n==="height"||n==="alt"))||
          (t==="FONT"&&(n==="size"||n==="color"||n==="face"))||
          n==="align";
        if(!ok) f.removeAttribute(a.name);
      });
      if(t==="IMG"&&!f.getAttribute("src")){ no.removeChild(f); return; }
      limpa(f);
    });
  })(raiz);
  return raiz.innerHTML;
}

function inserirImagem(inp){
  var f=inp.files[0]; if(!f) return;
  if(f.size>8*1024*1024){ alert("Imagem muito grande. Use um arquivo de até 8 MB."); inp.value=""; return; }
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var max=900, esc2=Math.min(1,max/img.width);
      var cv=document.createElement("canvas");
      cv.width=Math.round(img.width*esc2); cv.height=Math.round(img.height*esc2);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      var dados=cv.toDataURL("image/jpeg",0.82);
      document.getElementById("edCarta").focus();
      document.execCommand("insertImage",false,dados);
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(f);
  inp.value="";
}

function backupAutomatico(){
  if(!EU.admin) return Promise.resolve(null);
  return api("backups?select=quando&order=quando.desc&limit=1").then(function(r){
    var ultimo=(r&&r[0])?new Date(r[0].quando):null;
    var horas=ultimo?(Date.now()-ultimo.getTime())/36e5:999;

      .then(function(){ return limparBackupsAntigos(); });

function limparBackupsAntigos(){
  return api("backups?select=id&order=quando.desc").then(function(r){
    if(!r||r.length<=30) return null;
    var velhos=r.slice(30).map(function(x){return x.id;});

function restaurarBackup(id,rotulo){
  if(!confirm("Restaurar a cópia de "+rotulo+"?\n\nTudo o que foi lançado depois dessa data será substituído. Esta ação não pode ser desfeita.")) return;
  status("wait","Restaurando…");
  api("backups?id=eq."+id+"&select=conteudo").then(function(r){
    if(!r||!r[0]) throw new Error("Cópia não encontrada.");
    var b=r[0].conteudo;
    var fila=[];
    (b.clientes||[]).forEach(function(c){
      fila.push(api("clientes?on_conflict=id",{method:"POST",prefer:"resolution=merge-duplicates,return=minimal",body:{id:c.id,nome:c.nome}}));
    });
    Object.keys(b.dados||{}).forEach(function(k){
      var partes=k.split("|"), cid=partes[0], ano=parseInt(partes[1].slice(0,4),10), mes=parseInt(partes[1].slice(5,7),10);
      var d=b.dados[k];
      fila.push(api("lancamentos?on_conflict=cliente_id,mes,ano",{method:"POST",prefer:"resolution=merge-duplicates,return=minimal",
        body:{cliente_id:cid,mes:mes,ano:ano,contas:d.contas||[],indicadores:d.ind||{}}}));
    });
    Object.keys(b.cartas||{}).forEach(function(k){
      fila.push(api("cartas?on_conflict=mes,ano",{method:"POST",prefer:"resolution=merge-duplicates,return=minimal",
        body:{mes:parseInt(k.slice(5,7),10),ano:parseInt(k.slice(0,4),10),conteudo:b.cartas[k]}}));
    });
    return Promise.all(fila);
  }).then(function(){
    return registrar("restaurou backup","",rotulo);
  }).then(function(){
    return carregar();
  }).then(function(){
    S.cliente=db.clientes.length?db.clientes[0].id:null;
    montarRascunho(); render();
    alert("Cópia restaurada.");
  }).catch(falha);
}

function ptaxAuto(){
  var k=S.cliente+"|"+S.mes+"|"+S.ano;
  if(PTAX_TENTADO[k]) return;
  if(n(S.rasc&&S.rasc.ind&&S.rasc.ind.ptax)>0) return;
  PTAX_TENTADO[k]=1; buscarPtax();
}
function buscarPtax(){
  var msg=document.getElementById("ptaxMsg");
  if(msg){ msg.textContent="Consultando Banco Central..."; msg.style.color="var(--muted)"; }
  function f(d){ return String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+"-"+d.getFullYear(); }
  var ini=new Date(S.ano,S.mes-1,1), fim=new Date(S.ano,S.mes,0);
  var url="https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata/CotacaoDolarPeriodo(dataInicial=@dataInicial,dataFinalCotacao=@dataFinalCotacao)"+
    "?@dataInicial='"+f(ini)+"'&@dataFinalCotacao='"+f(fim)+"'&$format=json&$select=cotacaoVenda,dataHoraCotacao";
  fetch(url).then(function(res){ if(!res.ok) throw new Error("HTTP "+res.status); return res.json(); })
  .then(function(j){
    var arr=(j&&j.value)||[]; if(!arr.length) throw new Error("sem cotacao");
    var ult=arr[arr.length-1], v=Number(ult.cotacaoVenda);
    if(!v) throw new Error("cotacao invalida");
    setInd("ptax",v);
    var el=document.getElementById("inpPtax"); if(el) el.value=v;
    var d=String(ult.dataHoraCotacao||"").slice(0,10).split("-");
    if(msg){ msg.textContent="PTAX venda de "+(d.length===3?d[2]+"/"+d[1]+"/"+d[0]:"fechamento")+"."; msg.style.color="var(--muted)"; }
  })
  .catch(function(){
    if(msg){ msg.textContent="Nao foi possivel consultar. Digite a PTAX manualmente."; msg.style.color="var(--alert)"; }
  });
}

function eixoY(max,H,pt,pb,W,fmt){
  var out="",linhas=5;
  for(var i=0;i<linhas;i++){
    var v=max*i/(linhas-1), y=H-pb-(v/max)*(H-pt-pb);
    out+='<line x1="52" y1="'+y+'" x2="'+(W-8)+'" y2="'+y+'" stroke="#EDF1F5"/>'+
         '<text x="46" y="'+(y+3)+'" text-anchor="end" font-size="8.5" fill="#9AA6B5" font-family="Segoe UI, Arial, sans-serif">'+fmt(v)+'</text>';
  }
  return out;
}
function pizza(items){
  var R=88,cx=100,cy=100,ang=-Math.PI/2,out="";
  var tot=items.reduce(function(a,b){return a+b.valor;},0);
  if(tot<=0) return "";
  if(items.length===1){
    out='<circle cx="100" cy="100" r="88" fill="'+CORES[0]+'"/>';
  }else{
    items.forEach(function(it,i){
      var a2=ang+(it.valor/tot)*Math.PI*2,big=(a2-ang)>Math.PI?1:0;
      var x1=cx+R*Math.cos(ang),y1=cy+R*Math.sin(ang),x2=cx+R*Math.cos(a2),y2=cy+R*Math.sin(a2);
      out+='<path d="M'+cx+' '+cy+' L'+x1+' '+y1+' A'+R+' '+R+' 0 '+big+' 1 '+x2+' '+y2+' Z" fill="'+CORES[i%CORES.length]+'" stroke="#fff" stroke-width="1.5"/>';
      ang=a2;
    });
  }
  return '<svg class="dn" viewBox="0 0 200 200" width="210" height="210">'+out+'</svg>';
}
/* numero bem curto para caber sob a coluna: 57600 -> "58k", 1250000 -> "1,3M" */
function moCurto(v){
  var a=Math.abs(v);
  if(a>=1e6) return (v/1e6).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+"M";
  if(a>=1000) return Math.round(v/1000).toLocaleString("pt-BR")+"k";
  return Math.round(v).toLocaleString("pt-BR");
}
function chartEvolucao(serie,cur){
  if(!serie.length) return "";
  var W=Math.max(420,serie.length*84+70),H=222,pt=30,pb=34;
  var vals=serie.map(function(s){return s.pl;});
  var vmax=Math.max.apply(null,vals), vmin=Math.min.apply(null,vals);

  /* Escala com zoom: barra a partir do zero achata a diferenca entre meses
     quando o patrimonio e alto e a variacao pequena. A base sobe para logo
     abaixo do menor mes, e a linha de base fica escrita no eixo para que
     ninguem leia altura de barra como proporcao do total.                */
  var amplitude=vmax-vmin;
  var base, topo;
  if(serie.length<2 || amplitude<=0 || amplitude < vmax*0.005){
    base=0; topo=vmax*1.12||1;                     /* variacao irrelevante: escala cheia */
  } else {
    var folga=amplitude*0.35;
    base=Math.max(0,vmin-folga);
    topo=vmax+folga*0.7;
  }
  var zoom = base>0;
  var faixa=(topo-base)||1;
  var slot=(W-62)/serie.length, bw=Math.min(62,slot-26);
  var alturaUtil=H-pt-pb;

  var out=eixoY2(base,topo,H,pt,pb,W,function(v){return moC(v,cur);});

  /* com muitos meses o valor cheio encosta no vizinho; a partir de 9 usa forma curta */
  var curto=serie.length>8;
  serie.forEach(function(s,i){
    var rotuloTopo = curto ? moCurto(s.pl) : mo(s.pl,cur);
    var hh=Math.max(2,((s.pl-base)/faixa)*alturaUtil);
    var x=52+i*slot+(slot-bw)/2, y=H-pb-hh;
    out+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+hh+'" fill="#1B3A5F"/>'+
         '<text x="'+(x+bw/2)+'" y="'+(y-7)+'" text-anchor="middle" font-size="9" fill="#3C4C60" font-family="Consolas, Menlo, monospace">'+rotuloTopo+'</text>'+
         '<text x="'+(x+bw/2)+'" y="'+(H-13)+'" text-anchor="middle" font-size="9" fill="#7A8698">'+ref(s.mes,s.ano)+'</text>';
  });

  out+='<line x1="52" y1="'+(H-pb)+'" x2="'+(W-8)+'" y2="'+(H-pb)+'" stroke="#DCE2EA"/>';
  if(zoom){
    /* marca de corte: avisa que o eixo nao comeca em zero */
    out+='<text x="46" y="'+(H-pb+3)+'" text-anchor="end" font-size="8.5" fill="#9AA6B5" font-family="Segoe UI, Arial, sans-serif">'+moC(base,cur)+'</text>'+
         '<line x1="49" y1="'+(H-pb-5)+'" x2="55" y2="'+(H-pb+1)+'" stroke="#C6CED8" stroke-width="1"/>'+
         '<line x1="49" y1="'+(H-pb-1)+'" x2="55" y2="'+(H-pb+5)+'" stroke="#C6CED8" stroke-width="1"/>';
  }
  var legenda=zoom?('<p class="foot-note" style="margin:8px 0 0;font-size:9.5px">'+
    'A escala come\u00e7a em '+moC(base,cur)+', n\u00e3o em zero, para que a varia\u00e7\u00e3o entre os meses fique vis\u00edvel.</p>'):'';

  return '<div style="overflow-x:auto"><svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:'+W+'px;display:block;margin:0 auto">'+out+'</svg></div>'+legenda;
}

/* eixo com base e topo livres (a versao antiga sempre partia de zero) */
function eixoY2(base,topo,H,pt,pb,W,fmt){
  var out="",linhas=5,faixa=(topo-base)||1;
  for(var i=1;i<linhas;i++){
    var v=base+faixa*i/(linhas-1), y=H-pb-((v-base)/faixa)*(H-pt-pb);
    out+='<line x1="52" y1="'+y+'" x2="'+(W-8)+'" y2="'+y+'" stroke="#EDF1F5"/>'+
         '<text x="46" y="'+(y+3)+'" text-anchor="end" font-size="8.5" fill="#9AA6B5" font-family="Segoe UI, Arial, sans-serif">'+fmt(v)+'</text>';
  }
  return out;
}

/* tabela de retornos por ano (carteira x CDI) */
function tabelaRetornos(id,cur){
  cur=(cur==="USD")?"USD":"BRL";
  var anos=[];
  Object.keys(db.dados).forEach(function(k){
    if(k.indexOf(id+"|")===0){
      var y=parseInt(k.split("|")[1].slice(0,4),10);
      if(anos.indexOf(y)<0) anos.push(y);
    }
  });
  anos.sort(function(a,b){return a-b;});
  var fc=1,fd=1,linhas=[];
  anos.forEach(function(y){
    var meses=[];
    for(var m=1;m<=12;m++){
      var r=reg(id,m,y);
      var ok=r&&contasDe(r,cur).length;
      meses.push(ok?{p:totais(r,cur).rendPct,c:(cur==="BRL"?n(r.ind&&r.ind.cdi):0)}:null);
    }
    var vivos=meses.filter(function(x){return x;});
    if(!vivos.length) return;
    var noAnoP=comp(vivos.map(function(x){return x.p;}));
    var noAnoC=comp(vivos.map(function(x){return x.c;}));
    fc*=(1+noAnoP/100); fd*=(1+noAnoC/100);
    linhas.push({ano:y,meses:meses,noAnoP:noAnoP,noAnoC:noAnoC,accP:(fc-1)*100,accC:(fd-1)*100});
  });
  return linhas.reverse();
}

           }).join("")+
           (L.noAnoC>0?'<td class="n">'+pct(L.noAnoP/L.noAnoC*100,0)+'</td>':'<td class="n" style="color:#B7C0CB">–</td>')+

/* ============ view: relatório ============ */
function marca(){ return '<div class="pg-mark"><img src="'+LOGO_AZUL+'" alt="'+EMPRESA.nome+'"></div>'; }
var SNUM=0;
/* ===== conferencia de consistencia dos lancamentos =====
   Regras deterministicas: cada achado aponta a conta, o numero encontrado
   e o numero esperado, para dar pra conferir na mao. */
function conferir(id,mes,ano){
  var r=reg(id,mes,ano), out=[];
  if(!r) return out;
  var add=function(nivel,onde,titulo,detalhe){ out.push({nivel:nivel,onde:onde,titulo:titulo,detalhe:detalhe}); };
  var ant=null,pa=anterior(mes,ano),tt=0;
  while(tt<24&&!ant){ var rr=reg(id,pa.mes,pa.ano); if(rr) ant=rr; else pa=anterior(pa.mes,pa.ano); tt++; }

  ["BRL","USD"].forEach(function(cur){
    var contas=contasDe(r,cur); if(!contas.length) return;
    var fm=function(v){ return mo2(v,cur); };
    var antC=ant?contasDe(ant,cur):[];
    var achaAnt=function(nome){
      for(var i=0;i<antC.length;i++){ if((antC[i].nome||"")===(nome||"")) return antC[i]; }
      return null;
    };

    contas.forEach(function(c){
      var nome=(c.nome||"sem nome")+(cur==="USD"?" (offshore)":"");
      var saldo=n(c.saldo), rs=n(c.rendRs), pc=n(c.rendPct), apl=n(c.apl), res=n(c.res);
      var base=saldo-rs-apl+res;

      if(saldo===0&&rs===0&&pc===0&&apl===0&&res===0) return;

      if(res<0||apl<0){
        var qual=(res<0&&apl<0)?"Aplica\u00e7\u00e3o e resgate negativos":(res<0?"Resgate negativo":"Aplica\u00e7\u00e3o negativa");
        var errado=(res<0?Math.abs(res)*2:0)+(apl<0?Math.abs(apl)*2:0);
        add("alta",nome,qual,
          "Aplica\u00e7\u00f5es e resgates s\u00e3o movimentos e devem ser sempre positivos \u2014 o sinal j\u00e1 est\u00e1 na f\u00f3rmula. "+
          "Com o valor negativo, a abertura do m\u00eas sai <i>"+fm(errado)+"</i> menor que a real, "+
          "o que distorce o peso desta conta na rentabilidade da carteira. Troque para positivo e salve.");
      }

      if(base<0){
        add("alta",nome,"Saldo de abertura negativo",
          "Pelo saldo final de "+fm(saldo)+", resultado de "+fm(rs)+", aplica\u00e7\u00f5es de "+fm(apl)+" e resgates de "+fm(res)+
          ", a abertura do m\u00eas daria <i>"+fm(base)+"</i>. Algum dos quatro campos est\u00e1 trocado ou com sinal invertido.");
      }else if(base===0&&saldo>0&&(rs!==0||apl!==0)){
        add("atencao",nome,"Abertura zerada",
          "A conta fecha em "+fm(saldo)+" mas a abertura calculada d\u00e1 zero. Confira se a aplica\u00e7\u00e3o e o resultado est\u00e3o certos.");
      }

      var foraEscala=Math.abs(pc)>50;
      if(foraEscala){
        add("alta",nome,"Rentabilidade fora de escala",
          "Foi informado <i>"+pct(pc)+"</i> no m\u00eas. Se a inten\u00e7\u00e3o era "+pct(pc/100)+", o valor foi digitado cem vezes maior.");
      }

      if(base>0&&rs!==0&&pc!==0&&!foraEscala){
        var impl=(rs/base)*100, dif=Math.abs(impl-pc);
        var tol=Math.max(0.20,Math.abs(pc)*0.25);
        if(dif>tol){
          add(dif>Math.max(1,Math.abs(pc))?"alta":"atencao",nome,"Resultado e percentual n\u00e3o batem",
            "O resultado de "+fm(rs)+" sobre uma abertura de "+fm(base)+" equivale a <i>"+pct(impl)+"</i>, mas foi informado <i>"+pct(pc)+"</i>. "+
            "Os dois campos s\u00e3o independentes de prop\u00f3sito, ent\u00e3o alguma diferen\u00e7a \u00e9 normal \u2014 essa est\u00e1 grande.");
        }
      }
      if(saldo>0&&pc!==0&&rs===0)
        add("atencao",nome,"Falta o resultado em "+(cur==="USD"?"d\u00f3lar":"reais"),
          "A rentabilidade de "+pct(pc)+" foi informada, mas o campo de resultado est\u00e1 zerado. Ele alimenta o resultado da carteira.");
      if(saldo>0&&rs!==0&&pc===0)
        add("atencao",nome,"Falta a rentabilidade em %",
          "O resultado de "+fm(rs)+" foi informado, mas o percentual est\u00e1 zerado. Ele alimenta a rentabilidade da carteira, que \u00e9 m\u00e9dia ponderada.");
      if(saldo>0&&rs===0&&pc===0&&apl===0)
        add("atencao",nome,"M\u00eas sem resultado",
          "A conta tem "+fm(saldo)+" em saldo e nenhum resultado informado. Se ficou parada mesmo, ignore.");

      var a=achaAnt(c.nome);
      if(a){
        var fech=n(a.saldo), delta=base-fech, lim=Math.max(1,Math.abs(fech)*0.005);
        if(Math.abs(delta)>lim){
          /* a abertura NAO e digitada: e derivada. Mostrar a conta evita o
             assessor procurar um campo de abertura que nao existe.        */
          var conta="Saldo final "+fm(saldo)+" \u2212 resultado "+fm(rs)+
                    " \u2212 aplica\u00e7\u00f5es "+fm(apl)+" + resgates "+fm(res)+" = "+fm(base);
          var causa = delta<0
            ? "A abertura ficou <b>abaixo</b> do fechamento anterior. As causas usuais, nesta ordem: "+
              "<b>resgate de "+fm(-delta)+" que n\u00e3o foi lan\u00e7ado</b>; resultado em reais "+fm(-delta)+
              " maior que o real; ou aplica\u00e7\u00e3o lan\u00e7ada a mais."
            : "A abertura ficou <b>acima</b> do fechamento anterior. As causas usuais, nesta ordem: "+
              "<b>aporte de "+fm(delta)+" que n\u00e3o foi lan\u00e7ado</b>; resultado em reais "+fm(delta)+
              " menor que o real; ou resgate lan\u00e7ado a mais.";
          add(Math.abs(delta)>Math.abs(fech)*0.05?"alta":"atencao",nome,"N\u00e3o fecha com o m\u00eas anterior",
            "O m\u00eas anterior fechou em "+fm(fech)+" e a abertura deste m\u00eas d\u00e1 "+fm(base)+
            ", diferen\u00e7a de <i>"+fm(delta)+"</i>.<br><br>"+
            "<b>Voc\u00ea n\u00e3o digita a abertura</b> \u2014 ela \u00e9 calculada para reconstruir o saldo do dia 1\u00ba: "+
            "<i>"+conta+"</i>.<br><br>"+causa);
        }
      }else if(ant&&antC.length&&saldo>0&&apl===0){
        add("atencao",nome,"Conta nova sem aplica\u00e7\u00e3o",
          "N\u00e3o existia no m\u00eas anterior e entrou com "+fm(saldo)+" sem aplica\u00e7\u00e3o lan\u00e7ada. O saldo inteiro vira abertura e derruba a rentabilidade ponderada.");
      }

      var hist=[],hp=anterior(mes,ano),h=0;
      while(h<12){
        var hr=reg(id,hp.mes,hp.ano);
        if(hr){ var hc=contasDe(hr,cur).filter(function(x){return (x.nome||"")===(c.nome||"");})[0];
                if(hc&&n(hc.rendPct)) hist.push(n(hc.rendPct)); }
        hp=anterior(hp.mes,hp.ano); h++;
      }
      if(hist.length>=4&&pc!==0){
        var m=hist.reduce(function(x,y){return x+y;},0)/hist.length;
        var dv=Math.sqrt(hist.reduce(function(x,y){return x+(y-m)*(y-m);},0)/hist.length);
        if(dv>0&&Math.abs(pc-m)>4*dv)
          add("atencao",nome,"Fora do padr\u00e3o da conta",
            "Os "+hist.length+" meses anteriores giraram em torno de "+pct(m)+". Este m\u00eas veio <i>"+pct(pc)+"</i>. Pode estar certo, mas vale conferir.");
      }
    });

    antC.forEach(function(a){
      var achou=contas.filter(function(x){return (x.nome||"")===(a.nome||"");})[0];
      if(!achou&&n(a.saldo)>0)
        add("atencao",(a.nome||"sem nome")+(cur==="USD"?" (offshore)":""),"Conta sumiu",
          "Existia no m\u00eas anterior com "+mo2(n(a.saldo),cur)+" e n\u00e3o aparece neste m\u00eas. Se foi encerrada, lance o resgate para o hist\u00f3rico fechar.");
    });

    var t=totais(r,cur);
    var somaBase=0; contas.forEach(function(c){ var b=n(c.saldo)-n(c.rendRs)-n(c.apl)+n(c.res); somaBase+=(b>0?b:n(c.saldo)); });
    if(somaBase>0&&t.rendRs!==0&&t.rendPct!==0){
      var implT=(t.rendRs/somaBase)*100, difT=Math.abs(implT-t.rendPct);
      if(difT>Math.max(0.25,Math.abs(t.rendPct)*0.25))
        add("alta",(cur==="USD"?"Carteira offshore":"Carteira onshore"),"Carteira: percentual e resultado divergem",
          "A soma dos resultados d\u00e1 <i>"+pct(implT)+"</i> sobre a abertura total, mas a m\u00e9dia ponderada dos percentuais informados d\u00e1 <i>"+pct(t.rendPct)+"</i>.");
    }
  });

  if(!n(r.ind&&r.ind.cdi))
    add("info","Indicadores","CDI do m\u00eas em branco",
      "Sem o CDI o relat\u00f3rio n\u00e3o consegue mostrar o comparativo nem o \u201c% do CDI\u201d.");
  if(contasDe(r,"USD").length&&!n(r.ind&&r.ind.ptax))
    add("info","Indicadores","PTAX em branco",
      "H\u00e1 conta offshore neste m\u00eas e a PTAX de fechamento n\u00e3o foi informada.");

  var ordem={alta:0,atencao:1,info:2};
  out.sort(function(a,b){ return ordem[a.nivel]-ordem[b.nivel]; });
  return out;
}
function mesesDoCliente(id){

    if(k.indexOf(id+"|")!==0) return;
    var mm=(k.split("|")[1]||"").split("-");
    if(mm.length!==2) return;
    out.push({ano:parseInt(mm[0],10),mes:parseInt(mm[1],10)});
  });
  out.sort(function(a,b){ return (b.ano-a.ano)||(b.mes-a.mes); });
  return out;
}
function painelConferencia(id){
  var meses=mesesDoCliente(id), grupos=[], alta=0, aten=0, limpos=0;

    if(!f.length){ limpos++; return; }
    alta+=f.filter(function(x){return x.nivel==="alta";}).length;
    aten+=f.filter(function(x){return x.nivel==="atencao";}).length;
    grupos.push({mes:p.mes,ano:p.ano,f:f});
  });
  var tag="";

  if(aten) tag+='<span class="chk-tag at">'+aten+' a conferir</span>';

    corpo='<div class="chk-vazio">Este cliente ainda n\u00e3o tem nenhum m\u00eas lan\u00e7ado.</div>';
  }else if(!grupos.length){

  }else{
    corpo=grupos.map(function(g){
      var a=g.f.filter(function(x){return x.nivel==="alta";}).length;
      var t=g.f.filter(function(x){return x.nivel==="atencao";}).length;
      var resumo=[]; if(a) resumo.push(a+(a===1?" cr\u00edtico":" cr\u00edticos")); if(t) resumo.push(t+" a conferir");
      return '<div class="chk-mes"><b>'+MESES_C[g.mes-1]+"/"+String(g.ano).slice(2)+'</b><span>'+resumo.join(" \u00b7 ")+'</span></div>'+

          return '<div class="chk-item"><div class="chk-bar '+x.nivel+'"></div><div class="chk-txt">'+

        }).join("");
    }).join("");
    if(limpos) corpo+='<div class="chk-rodape">Outros '+limpos+(limpos===1?" m\u00eas passou":" meses passaram")+' sem apontamento.</div>';
  }
  return '<div class="chk no-print"><div class="chk-top"><h3>Confer\u00eancia dos lan\u00e7amentos</h3>'+tag+
    '<button class="btn" onclick="S._chk=false;render()">Fechar</button></div>'+corpo+
    '<div class="chk-rodape">Verificados '+meses.length+(meses.length===1?" m\u00eas":" meses")+' do hist\u00f3rico deste cliente, do mais recente ao mais antigo.</div></div>';
}

  return '<div class="panel"><table class="rt bm"><thead><tr><th>Indicador</th>'+

}
function nx(){ SNUM++; return String(SNUM).padStart(2,"0"); }
var SUM=[], PGN=0;
function sumAdd(num,titulo){ SUM.push({num:num||"",titulo:titulo,pg:PGN}); }
function shead(num,titulo,cap){

  return '<div class="shead"><span class="n">'+num+'</span><h2>'+titulo+'</h2>'+(cap?'<span class="cap">'+cap+'</span>':'')+'</div>';

/* Agrupa candidatos de página consecutivos que cabem juntos numa folha, pra
   não gastar página impressa inteira com uma seção pequena (pizza sozinha,
   tabela de poucas linhas). Cada candidato marcado "capa" ou "solo" — ou
   sem estimativa de altura — sempre fica sozinho na própria página, exatamente
   como já era antes desta otimização; nunca reordena o conteúdo, só decide
   se o próximo candidato cabe atrás do que já está na página aberta.
   mapaIdx[i] devolve, pro candidato de índice i, o índice da página física
   final em que ele caiu — usado pra corrigir os números de página do
   Sumário, que foram gravados como índice de candidato, não de página. */
function empacotarPaginas(candidatos,orcamento){
  var paginas=[], mapaIdx=[], grupoHtml="", grupoAltura=0, grupoAberto=false;
  function fecha(){
    if(grupoAberto) paginas.push({html:grupoHtml});
    grupoHtml=""; grupoAltura=0; grupoAberto=false;
  }
  candidatos.forEach(function(cnd,ci){
    if(cnd.capa){
      fecha();
      paginas.push({html:cnd.html,capa:true});
      mapaIdx[ci]=paginas.length-1;
      return;
    }
    if(cnd.solo||cnd.altura==null){
      fecha();
      paginas.push({html:cnd.html});
      mapaIdx[ci]=paginas.length-1;
      return;
    }
    if(grupoAberto && grupoAltura+cnd.altura<=orcamento){
      grupoHtml+=cnd.html; grupoAltura+=cnd.altura;
    } else {
      fecha();
      grupoHtml=cnd.html; grupoAltura=cnd.altura; grupoAberto=true;
    }
    mapaIdx[ci]=paginas.length;
  });
  fecha();
  return {paginas:paginas, mapaIdx:mapaIdx};
}

  var consol=listaConsolidado(r.ind);

       '<div class="dn-leg">'+estr.map(function(x,i){return '<span><i style="background:'+CORES[i%CORES.length]+'"></i>'+esc(x.nome)+' '+pct(x.pc,1)+'</span>';}).join("")+'</div>'+
       '<table class="rt" style="margin-top:8px;text-align:left"><thead><tr><th>Estratégia</th><th class="n">% da carteira</th><th class="n">Valor estimado</th></tr></thead><tbody>'+
       estr.map(function(x){return '<tr><td>'+esc(x.nome)+'</td><td class="n">'+pct(x.pc,1)+'</td><td class="n">'+brl(t.pl*x.pc/100)+'</td></tr>';}).join("")+

  };

  if(secOn(r.ind,"retornos")){

  if(secOn(r.ind,"contas")){

     contasBRL.map(function(x){

    var tabelaAtivos=function(lista,comRF,subtotalCompleto){

        '<td colspan="4"></td></tr>')+
        '</tbody></table>';
    };
    /* Dentro de cada categoria, quanto está em cada subcategoria (a mesma
       leitura de listaEstrat, só que restrita aos ativos daquele grupo em
       vez da carteira inteira) — só aparece quando algum ativo do grupo tem
       subcategoria marcada. */
    var subEstratDoGrupo=function(lista){
      var porSub={}, totalGrupo=0;
      lista.forEach(function(x){
        var v=n(x.posicao); totalGrupo+=v;
        var s=x.subcategoria; if(!s) return;
        porSub[s]=(porSub[s]||0)+v;
      });
      if(totalGrupo<=0) return [];
      return SUBCATEGORIAS_ATIVO.map(function(s){
        var v=porSub[s]||0;
        return {nome:s,valor:v,pc:v?(v/totalGrupo*100):0};
      }).filter(function(x){ return x.pc>0; });
    };
    var totalGeral=ativosRel.reduce(function(a,x){return a+n(x.posicao);},0);
    /* Quantas linhas cabem numa folha sem estourar a altura física — calibrado
       com Playwright contra nomes reais de ativos (que quebram linha em
       colunas estreitas) e sempre pelo orçamento mais apertado dos dois
       formatos de impressão (paisagem tem menos altura que retrato), pra a
       mesma lista de páginas valer pros dois sem recalcular nada na hora de
       imprimir. Ver PADRAO_LINHAS_ATIVOS logo acima da função viewRelatorio. */
    var maxLinhas=function(comRF,primeiraPagina){
      var p=PADRAO_LINHAS_ATIVOS;
      var overhead=primeiraPagina?p.overheadComTitulo:p.overheadSemTitulo;
      var disponivel=p.alturaPagina-overhead-p.subtotal;
      var porLinha=comRF?p.linhaComTaxa:p.linhaSemTaxa;
      return Math.max(3,Math.floor(disponivel/porLinha));
    };
    var chunk=function(lista,tam){

    /* Cada categoria vira uma ou mais páginas: com 5 categorias possíveis
       agora (a partir do COE) e clientes com dezenas de ativos numa mesma
       categoria, uma tabela só não cabe numa folha. A seção continua com um
       único número — só a primeira página leva o título; as demais só
       repetem o rótulo da categoria (com "continuação" quando for o mesmo
       grupo) como continuação da mesma lista. */
    var gruposComDados=CATEGORIAS_ATIVO.map(function(cat){
      return {cat:cat,lista:ativosRel.filter(function(x){ return (x.categoria||CATEGORIAS_ATIVO[0])===cat; })};
    }).filter(function(g){ return g.lista.length; });
    var primeiraPaginaGeral=true;
    gruposComDados.forEach(function(g,gi){
      var comRF=CATEGORIAS_COM_PRAZO.indexOf(g.cat)!==-1;
      var subtotalCategoria=g.lista.reduce(function(a,x){return a+n(x.posicao);},0);
      /* O orçamento de linhas por página só é menor na página que leva o
         cabeçalho da seção (shead) — isso acontece só uma vez em todo o
         relatório (a folha em que "primeiraPaginaGeral" ainda é true), nunca
         de novo dentro da mesma categoria. Por isso o corte em pedaços
         acontece linha a linha, e não de uma vez com um tamanho fixo — senão
         toda a primeira categoria herdava o orçamento apertado da 1ª folha. */
      var restante=g.lista.slice();
      var pedacos=[];
      while(restante.length){ pedacos.push(restante.splice(0,maxLinhas(comRF,primeiraPaginaGeral && pedacos.length===0))); }
      var ehUltimaCategoria=gi===gruposComDados.length-1;
      pedacos.forEach(function(pedaco,ci){
        var ehUltimoPedaco=ci===pedacos.length-1;
        var titulo=ci===0?g.cat:g.cat+" (continuação)";
        var corpo='<div class="panel"><h3 class="venc-tit">'+esc(titulo)+'</h3>'+

        if(ehUltimoPedaco){
          var subEstr=subEstratDoGrupo(g.lista);
          if(subEstr.length){
            corpo+='<h3 class="venc-tit" style="margin-top:20px;opacity:.7">Estratégia dentro de '+esc(g.cat)+'</h3>'+
              '<div class="dn-leg" style="justify-content:flex-start;margin:4px 0 2px">'+
              subEstr.map(function(x,i){return '<span><i style="background:'+CORES[i%CORES.length]+'"></i>'+esc(x.nome)+' '+pct(x.pc,1)+'</span>';}).join("")+
              '</div>';
          }
          if(ehUltimaCategoria){
            corpo+='<p class="foot-note" style="margin-top:16px"><b>Total geral: '+brl(totalGeral)+'.</b> '+
              'Taxa e vencimento se aplicam apenas a ativos de renda fixa e COE. Rentabilidades informadas pela instituição '+
              'custodiante, líquidas de taxas quando aplicável, brutas de imposto de renda.</p>';
          }
        }
        corpo+='</div>';
        /* Estratégia-dentro-da-categoria e o rodapé de "Total geral" só entram
           no último pedaço de cada categoria — a altura estimada leva uma
           folga extra nesse caso pra cobrir esse conteúdo a mais. */
        var alturaChunk=alturaAtivosChunk(comRF,pedaco.length,primeiraPaginaGeral)+(ehUltimoPedaco?110:0);
        if(primeiraPaginaGeral){ pag(shead(nx(),"Lista de ativos","posição em "+dataBase(S.mes,S.ano))+corpo,{altura:alturaChunk}); primeiraPaginaGeral=false; }
        else pag(corpo,{altura:alturaChunk});
      });
    });
  }

     '<div class="panel tint">'+

  /* --- vencimentos (página própria quando houver) --- */
  var venc=listaVenc(r.ind);

    var sep=vencDoMes(venc,S.mes,S.ano);
    var tabela=function(lista){
      return '<table class="rt"><thead><tr><th>Ativo</th><th>Instituição</th><th>Taxa</th><th class="n">Vencimento</th><th class="n">Valor aproximado</th></tr></thead><tbody>'+

     '<p>As posições e os saldos aqui apresentados refletem as informações fornecidas pelas instituições custodiantes na data de referência e podem divergir dos extratos oficiais em razão de prazos de atualização, marcação a mercado, provisionamento de proventos e eventos societários. Em caso de divergência, prevalece sempre o extrato da instituição custodiante.</p>'+
     '<p>Rentabilidade passada não representa garantia de rentabilidade futura. Os valores são brutos, salvo indicação em contrário, e não consideram a incidência de tributos, taxas de saída, come-cotas ou custos de transação que podem reduzir o resultado efetivo do investidor.</p>'+
     '<p>Investimentos envolvem riscos, inclusive de perda do capital investido. Produtos de renda fixa emitidos por instituições financeiras contam com a cobertura do Fundo Garantidor de Créditos nos limites e condições previstos em seu regulamento; demais ativos não contam com garantia do FGC nem do administrador. Leia atentamente os documentos de cada produto antes de investir.</p>'+

  /* --- empacota candidatos em páginas físicas ---

     lista de páginas de verdade, cada uma podendo levar mais de um
     candidato quando a soma cabe no orçamento. Os índices em SUM (usados
     pelo Sumário) apontavam pro candidato — remapeia pra página final. */
  var empacotado=empacotarPaginas(PGS,PADRAO_LINHAS_ATIVOS.alturaPagina);
  PGS=empacotado.paginas;
  SUM.forEach(function(e){ e.pg=empacotado.mapaIdx[e.pg]; });

  /* --- sumário: inserido como página 2, empurrando o resto ---
     as entradas ja tem o indice da pagina em que foram criadas;
     como o sumario entra no indice 1, tudo dali pra frente anda um. */
  if(SUM.length){
    var linhas=SUM.map(function(e){
      return '<div class="sum-row"><span class="n">'+esc(e.num)+'</span>'+
        '<span class="t">'+esc(e.titulo)+'</span><span class="dots"></span>'+

    PGS.splice(1,0,{html:'<div class="dash"><i>\u2014</i><h2>Sum\u00e1rio</h2></div>'+
      '<div class="sum">'+linhas+'</div>',capa:false});
  }

  /* --- montagem com numeração real --- */
  var total=PGS.length;
  PGS.forEach(function(P,i){
    if(P.capa){ h+='<div class="pg cover">'+P.html+'</div>'; }
    else { h+='<div class="pg">'+marca()+P.html+'<div class="pg-num">'+(i+1)+' de '+total+'</div></div>'; }
  });

  h+='</div>';
  return h;
}

/* Ferramenta liberada para quem está logado? Quem decide é a matriz de Perfis e
   acessos (Equipe). O banco confere de novo: ferramenta desmarcada não devolve dado. */
function temPerm(chave){ return EU.perm?EU.perm.indexOf(chave)>=0:null; }
function podeFerramenta(id){
  var t=temPerm("ferramenta."+id);
  if(t===null) return (id!=="fluxo"&&id!=="comissoes")||EU.super;
  return t;
}
function irParaApp(id){
  var a=APPS.filter(function(x){return x.id===id;})[0];
  if(!a||!a.ativo) return;
  if(!podeFerramenta(id)){ alert("Seu perfil não tem acesso a "+a.nome+". Fale com o master."); return; }
  if(a.url){
    registrar("abriu sistema",a.nome,"");
    location.href=a.url;
    return;
  }
  S.app=id; S.tab="preencher";
  try{ localStorage.setItem("aw_app",id); }catch(e){}
  render();
}
function irParaHub(){
  S.app=null;
  try{ localStorage.removeItem("aw_app"); }catch(e){}
  render();
}

/* ---------- Agenda do dia (mesma regra da aba Agenda do CRM, só a própria pessoa) ---------- */
function hbIso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function hbSoma(iso,n){ var d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return hbIso(d); }
function hbDiaSemana(iso){ var g=new Date(iso+"T12:00:00").getDay(); return g===0?7:g; }
function hbCai(t,dia){
  if(!t.data||dia<t.data) return false;
  if(t.repeticao==="dia_util") return hbDiaSemana(dia)<=5;
  if(t.repeticao==="semana") return (t.dias_semana||[]).indexOf(hbDiaSemana(dia))!==-1;
  if(t.repeticao==="mes"){
    var alvo=Number(t.data.slice(8,10)), d=new Date(dia+"T12:00:00");
    var ult=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
    return Number(dia.slice(8,10))===Math.min(alvo,ult);
  }
  return dia===t.data;
}
var HB_REGUA={Private:[["relacionamento",8,"Relacionamento"],["performance",3,"Acompanhamento"],["revisao",1,"Revisão de carteira"]],
  Exclusive:[["relacionamento",4,"Relacionamento"],["performance",1,"Acompanhamento"],["revisao",1,"Revisão de carteira"]]};
/* Itens de um dia para a própria pessoa: tarefas, próximo contato, vencimento e régua
   (mesma regra da aba Agenda do CRM). "atrasadas" só faz sentido olhando de hoje. */
function hbNomeLead(l){ if(!l) return ""; var n=(l.cliente||"").trim(),c=(l.conta||"").trim(); return !c?n:(!n?c:(n.slice(-c.length)===c?n:n+" · "+c)); }
function hbAgendaFaixa(tarefas,leads,de,ate,hoje){
  var dias={}, atrasadas=[];
  var porLead={}; leads.forEach(function(l){ porLead[l.id]=l; });
  var poe=function(dia,it){ (dias[dia]=dias[dia]||[]).push(it); };
  tarefas.forEach(function(t){
    var feitas=t.concluidas||[];
    var base={hora:(t.hora||"").slice(0,5),titulo:t.titulo,sub:hbNomeLead(porLead[t.lead_id]),
      cor:t.criado_por&&t.criado_por!==t.dono_id?"#7C5CC4":"#195AB4",tipo:t.criado_por&&t.criado_por!==t.dono_id?"Atribuída":"Tarefa"};
    for(var d=t.data>de?t.data:de; d<=ate; d=hbSoma(d,1)){
      if(hbCai(t,d)) poe(d,Object.assign({feita:feitas.indexOf(d)!==-1},base));
    }
    if(t.data<hoje){
      var dia=null;
      if(t.repeticao==="nao") dia=t.data;
      else if(!hbCai(t,hoje)){ for(var x=hbSoma(hoje,-1);x>=t.data&&x>=hbSoma(hoje,-31);x=hbSoma(x,-1)){ if(hbCai(t,x)){ dia=x; break; } } }
      if(dia&&feitas.indexOf(dia)===-1) atrasadas.push(Object.assign({dia:dia},base));
    }
  });
  leads.forEach(function(l){
    if(l.perdido||((l.funil||"assessor")==="especialista"&&l.ganho)) return;
    var cli=hbNomeLead(l);
    var pus=function(dia,it){ it.sub=cli; if(dia<hoje){ it.dia=dia; atrasadas.push(it); } if(dia>=de&&dia<=ate) poe(dia,it); };
    if(l.proximo_contato) pus(l.proximo_contato,{hora:"",titulo:"Contato agendado",cor:"#2F7A56",tipo:"Próximo contato"});
    (l.alertas||[]).forEach(function(a){ if(a.tipo==="vencimento"&&a.data&&!a.resolvido) pus(a.data,{hora:"",titulo:a.texto?"Vencimento · "+a.texto:"Vencimento",cor:"#B3403A",tipo:"Vencimento"}); });
    var naCarteira=(l.funil||"assessor")!=="especialista"&&!l.perdido&&((l.esteira||"novo")==="base"||l.ganho);
    if(naCarteira) (HB_REGUA[l.segmento]||[]).forEach(function(r){
      var datas=(l.atividades||[]).filter(function(x){ return x.tipo===r[0]&&x.data; }).map(function(x){ return x.data; }).sort();
      var base=datas.length?datas[datas.length-1]:(l.criado_em?hbIso(new Date(l.criado_em)):hoje);
      pus(hbSoma(base,Math.round(365/r[1])),{hora:"",titulo:r[2]+" (régua)",cor:"#8A6A18",tipo:"Régua"});
    });
  });
  Object.keys(dias).forEach(function(d){ dias[d].sort(function(a,b){ return (a.hora||"99").localeCompare(b.hora||"99"); }); });
  atrasadas.sort(function(a,b){ return a.dia.localeCompare(b.dia); });
  return {dias:dias,atrasadas:atrasadas};
}
var HB_MES=null, HB_DIA=null;
function hbAgendaAtual(){
  if(!INICIO.tarefas) return null;
  var hoje=hbIso(new Date());
  if(!HB_MES) HB_MES=hoje.slice(0,8)+"01";
  if(!HB_DIA) HB_DIA=hoje;
  var ini=hbSoma(HB_MES,1-hbDiaSemana(HB_MES));
  var d=new Date(HB_MES+"T12:00:00"), fimMes=hbIso(new Date(d.getFullYear(),d.getMonth()+1,0));
  var fim=hbSoma(fimMes,7-hbDiaSemana(fimMes));
  var de=ini<hoje?ini:hoje, ate=hbSoma(hoje,7)>fim?hbSoma(hoje,7):fim;
  return hbAgendaFaixa(INICIO.tarefas,INICIO.leads,de,ate,hoje);
}
function hbMesTroca(delta){

function carregarInicio(forcar){

  if(!forcar&&INICIO.estado==="pronto"&&Date.now()-INICIO.em<60000) return;
  INICIO.estado="carregando";
  var pAgenda=Promise.all([
    api("tarefas?select=*&dono_id=eq."+EU.id),
    api("leads?select=id,cliente,conta,proximo_contato,alertas,atividades,segmento,funil,esteira,perdido,ganho,criado_em&excluido=eq.false&responsavel_id=eq."+EU.id)
  ]).catch(function(){ return null; });
  var pRv=api("rv_operacoes?select=id&status=eq.aberta").then(function(r){ return (r||[]).length; }).catch(function(){ return null; });
  var pAv=api("rpc/avisos_resumo",{method:"POST",body:{}}).catch(function(){ return null; });
  var pPode=api("rpc/pode_publicar_aviso",{method:"POST",body:{}}).catch(function(){ return false; });
  Promise.all([pAgenda,pRv,pAv,pPode]).then(function(r){
    INICIO.tarefas=r[0]?(r[0][0]||[]):null; INICIO.leads=r[0]?(r[0][1]||[]):[];
    var hoje=hbIso(new Date());
    if(INICIO.tarefas){ var a=hbAgendaFaixa(INICIO.tarefas,INICIO.leads,hoje,hoje,hoje);
      INICIO.agenda={hoje:(a.dias[hoje]||[]).filter(function(i){ return !i.feita; }),atrasadas:a.atrasadas}; }
    else INICIO.agenda=null;
    INICIO.rv=r[1]; INICIO.avisos=r[2]; INICIO.podePublicar=r[3]===true;
    INICIO.estado="pronto"; INICIO.em=Date.now();
    if(!S.app&&SESSAO) render(true);
  });
}

  });
  document.querySelectorAll(".hb-menu .hb-secao").forEach(function(sec){
    var n=sec.nextElementSibling, algum=false;
    while(n&&!n.classList.contains("hb-secao")&&!n.classList.contains("hb-rodape")){ if(n.hasAttribute("data-busca")&&n.style.display!=="none") algum=true; n=n.nextElementSibling; }

  nome=nome?nome.charAt(0).toUpperCase()+nome.slice(1):"";
  var agora=new Date(), hora=agora.getHours();
  var saud=hora<12?"Bom dia":(hora<18?"Boa tarde":"Boa noite");
  var hoje=hbIso(agora);
  var dataLonga=agora.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
  dataLonga=dataLonga.charAt(0).toUpperCase()+dataLonga.slice(1);
  var ag=hbAgendaAtual(), av=INICIO.avisos;
  var naoLidos=av?av.filter(function(a){ return !a.lido_por_mim&&new Date(a.publicar_em).getTime()<=Date.now(); }).length:0;
  var doDiaHoje=ag?(ag.dias[hoje]||[]).filter(function(i){ return !i.feita; }):[];
  var hhmm=String(hora).padStart(2,"0")+":"+String(agora.getMinutes()).padStart(2,"0");
  var proxima=doDiaHoje.filter(function(i){ return i.hora&&i.hora>=hhmm; })[0];
  var chips=[];
  if(INICIO.estado!=="pronto") chips.push('<span class="hb-chip">carregando o seu dia…</span>');
  else {
    if(ag) chips.push('<span class="hb-chip">'+doDiaHoje.length+(doDiaHoje.length===1?" tarefa hoje":" tarefas hoje")+'</span>');
    if(ag&&ag.atrasadas.length) chips.push('<span class="hb-chip ruim">'+ag.atrasadas.length+(ag.atrasadas.length===1?" atrasada":" atrasadas")+'</span>');
    if(proxima) chips.push('<span class="hb-chip">próxima às '+proxima.hora+'</span>');
    if(naoLidos) chips.push('<span class="hb-chip bom">'+naoLidos+(naoLidos===1?" aviso novo":" avisos novos")+'</span>');
    if(ag&&!doDiaHoje.length&&!ag.atrasadas.length&&!naoLidos) chips.push('<span class="hb-chip bom">tudo em dia</span>');
  }

  /* ---- coluna do dia ---- */
  var dia=HB_DIA||hoje, ehHoje=dia===hoje;
  var tituloDia=ehHoje?"Hoje":new Date(dia+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});

/* Pede o link pela função enviar-senha. 404 (função não instalada) ou 401
   (instalada com "Verify JWT" ligado) caem no envio antigo do Supabase. */
function pedirLinkSenha(email){
  return fetch(SB_URL+"/functions/v1/enviar-senha",{
    method:"POST",
    headers:{"apikey":SB_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({email:email})
  }).then(function(res){
    if(res.status===404||res.status===401) return recuperarSenha(email);
    return res.text().then(function(t){
      var j=null; try{ j=t?JSON.parse(t):null; }catch(e){}
      if(res.ok && j && j.ok) return true;
      throw new Error((j&&j.erro)||("Não foi possível enviar o e-mail ("+res.status+")."));
    });
  },function(){
    /* Sem resposta nenhuma (rede ou bloqueio de origem): tenta o caminho antigo. */
    return recuperarSenha(email);
  });
}
function enviarEsqueci(){
  var e=(document.getElementById("esEmail").value||"").trim().toLowerCase();
  EMAIL_ESQUECI=e;

    document.getElementById("view").innerHTML=viewEsqueci("Digite um e-mail válido, como nome@"+EMPRESA.dominio+".");
    var i=document.getElementById("esEmail"); if(i) i.focus();
    return;
  }
  var b=document.getElementById("esBtn"); if(b){ b.disabled=true; b.textContent="Enviando…"; }
  pedirLinkSenha(e)
    .then(function(){ document.getElementById("view").innerHTML=viewEsqueci(null,true); })
    .catch(function(err){ document.getElementById("view").innerHTML=viewEsqueci(String(err.message||err)); });
}

/* ===================== Redefinir senha (link de recuperação) =====================
   O link que o Supabase manda chega com o token no HASH da URL (#access_token=...
   &type=recovery), nunca processado antes -- clicar no link so abria o portal
   normal, sem nenhum jeito de digitar a senha nova. Essa tela fecha esse buraco. */
var TOKEN_RECUPERACAO=null;
/* Desde a 2.85 o e-mail traz ?token_hash=...&type=recovery e o código só é
   gasto no clique em "Salvar nova senha". Antes, o link já consumia o código ao
   abrir: o robô de segurança do e-mail (que abre os links para conferir) gastava
   o código e o clique da pessoa caía em "link já usado". O formato antigo (#access_token)
   continua aceito para e-mails enviados antes da troca do modelo. */
var ERRO_LINK_EMAIL="";
function detectarRecuperacaoNaUrl(){
  var q=new URLSearchParams(location.search);
  if(q.get("token_hash")&&q.get("type")==="recovery") return {token_hash:q.get("token_hash")};
  var hash=location.hash||"";
  if(/error_code=|error=access_denied/.test(hash)){
    ERRO_LINK_EMAIL="O link do e-mail expirou ou já foi usado. Peça um novo em \"Esqueci minha senha\".";
    return null;
  }
  if(!hash || hash.indexOf("type=recovery")===-1) return null;
  var params=new URLSearchParams(hash.replace(/^#/,""));
  var at=params.get("access_token");
  if(!at) return null;
  return {access_token:at, refresh_token:params.get("refresh_token")||""};
}

/* Link novo: o código (token_hash) vira sessão só agora, no clique. Guarda a
   sessão em TOKEN_RECUPERACAO para que uma segunda tentativa (ex.: senha igual
   à antiga) não precise do código de novo, que já foi gasto. */
function sessaoDoLinkDeSenha(){
  if(TOKEN_RECUPERACAO.access_token) return Promise.resolve();
  return fetch(SB_URL+"/auth/v1/verify",{
    method:"POST",
    headers:{"apikey":SB_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({type:"recovery",token_hash:TOKEN_RECUPERACAO.token_hash})
  }).then(function(res){
    return res.text().then(function(t){
      var j=null; try{ j=t?JSON.parse(t):null; }catch(e){}
      if(!res.ok||!j||!j.access_token)
        throw new Error("Esse link expirou ou já foi usado. Peça um novo em \"Esqueci minha senha\".");
      TOKEN_RECUPERACAO={access_token:j.access_token,refresh_token:j.refresh_token||"",user:j.user};
    });
  });
}
function salvarNovaSenha(){
  if(!TOKEN_RECUPERACAO){ cancelarRedefinicao(); return; }
  var p1=document.getElementById("rsSenha1").value;
  var p2=document.getElementById("rsSenha2").value;
  if(!p1||!p2){ document.getElementById("view").innerHTML=viewRedefinirSenha("Preencha os dois campos de senha."); return; }
  if(p1.length<8){ document.getElementById("view").innerHTML=viewRedefinirSenha("A senha precisa ter pelo menos 8 caracteres."); return; }
  if(p1!==p2){ document.getElementById("view").innerHTML=viewRedefinirSenha("As senhas digitadas são diferentes."); return; }
  var b=document.getElementById("rsBtn"); if(b){ b.disabled=true; b.textContent="Salvando…"; }
  sessaoDoLinkDeSenha().then(function(){ return fetch(SB_URL+"/auth/v1/user",{
    method:"PUT",
    headers:{"apikey":SB_KEY,"Authorization":"Bearer "+TOKEN_RECUPERACAO.access_token,"Content-Type":"application/json"},
    body:JSON.stringify({password:p1})
  }); }).then(function(res){
    return res.json().then(function(j){
      if(!res.ok){
        var m=(j&&(j.msg||j.error_description||j.message))||"Não foi possível trocar a senha.";
        if((j&&j.error_code==="same_password")||/different from the old/i.test(m))
          m="Essa já é a sua senha atual. Escolha uma senha diferente, ou volte para o login e entre com ela.";
        else if(/expired|invalid/i.test(m)) m="Esse link expirou ou já foi usado. Peça um novo em \"Esqueci minha senha\".";
        throw new Error(m);
      }
      return j;
    });
  }).then(function(){
    var tk=TOKEN_RECUPERACAO;
    TOKEN_RECUPERACAO=null;
    SESSAO=null;
    guardarSessao(tk);
    novaSessaoPendente();
    return segundaEtapa();
  }).catch(function(err){
    document.getElementById("view").innerHTML=viewRedefinirSenha(String(err.message||err));
  });
}
function prosseguirLogin(){
  return carregar().then(function(){
    if(db.clientes.length) S.cliente=db.clientes[0].id;
    S.app=null; S.tab="preencher"; montarRascunho(); render();
    registrar("entrou","","");
    backupAutomatico();
  });
}
/* Segunda etapa (06/11/2026). Depois da senha: se o banco já tem o seguranca.sql,
   manda o código por e-mail (função codigo-acesso) e só libera depois que o banco
   confere o código (verificar_codigo). Sem o seguranca.sql instalado, entra como
   antes: o banco ainda não exige nada. */
function segundaEtapa(){
  CODIGO_ESTADO="enviando"; mostrarCodigo(null);
  return api("rpc/estado_acesso",{method:"POST",body:{}}).then(function(st){
    if(st&&st.liberado){ marcarLiberado(); return prosseguirLogin(); }
    return enviarCodigo();
  },function(err){
    if(/PGRST202|estado_acesso|could not find the function/i.test(String(err&&err.message))){
      marcarLiberado(); return prosseguirLogin();
    }
    if(!SESSAO){ render(); return; }
    CODIGO_ESTADO=""; mostrarCodigo("Não foi possível falar com o servidor. Tente de novo em instantes.","erro");
  });
}
function enviarCodigo(){
  CODIGO_ESTADO="enviando"; mostrarCodigo(null);
  var tk=SESSAO&&SESSAO.access_token;
  if(!tk){ render(); return Promise.resolve(); }
  return fetch(SB_URL+"/functions/v1/codigo-acesso",{method:"POST",
    headers:{"apikey":SB_KEY,"Authorization":"Bearer "+tk,"Content-Type":"application/json"},body:"{}"})
  .then(function(res){
    return res.text().then(function(t){
      var j=null; try{ j=t?JSON.parse(t):null; }catch(e){}
      if(!res.ok){
        var m=(j&&j.erro)||"";
        if(res.status===404) m="A função codigo-acesso ainda não foi instalada no Supabase. Avise um master.";
        else if(res.status===401) m=m||"Sua sessão expirou. Volte e entre de novo.";
        throw new Error(m||("Não foi possível mandar o código (erro "+res.status+")."));
      }
      CODIGO_EMAIL=(j&&j.email)||CODIGO_EMAIL;
      CODIGO_ESTADO="enviado"; mostrarCodigo(null);
    });
  }).catch(function(e){
    CODIGO_ESTADO="erro"; mostrarCodigo(String(e.message||e),"erro");
  });
}
function reenviarCodigo(){ enviarCodigo(); }
function codigoDigitado(el){
  var v=el.value.replace(/\D/g,"").slice(0,6);
  if(el.value!==v) el.value=v;
  if(v.length===6&&!codigoDigitado.indo){ codigoDigitado.indo=true; setTimeout(function(){ codigoDigitado.indo=false; confirmarCodigoEmail(); },120); }
}
function confirmarCodigoEmail(){
  var el=document.getElementById("cdCodigo"); if(!el) return;
  var c=(el.value||"").replace(/\D/g,"");
  if(c.length!==6){ mostrarCodigo("Digite os 6 números que chegaram no e-mail.","erro"); return; }
  var b=document.getElementById("cdBtn"); if(b){ if(b.disabled) return; b.disabled=true; b.textContent="Conferindo…"; }
  api("rpc/verificar_codigo",{method:"POST",body:{p_codigo:c}}).then(function(r){
    if(r&&r.ok){ marcarLiberado(); CODIGO_EMAIL=""; CODIGO_ESTADO=""; return prosseguirLogin(); }
    mostrarCodigo((r&&r.msg)||"Código não confere.","erro");
  }).catch(function(e){
    if(!SESSAO){ render(); return; }
    mostrarCodigo(String(e.message||e),"erro");
  });
}
function cancelarCodigo(){
  var tk=SESSAO&&SESSAO.access_token;
  limparSessao(); CODIGO_EMAIL=""; CODIGO_ESTADO="";
  if(tk) fetch(SB_URL+"/auth/v1/logout",{method:"POST",headers:{"apikey":SB_KEY,"Authorization":"Bearer "+tk}}).catch(function(){});
  MODO_LOGIN="entrar";
  render();
}
/* Virada do dia: o acesso de ontem acabou. */
function encerrarPorVirada(){
  var tk=SESSAO&&SESSAO.access_token;
  limparSessao();
  if(tk) fetch(SB_URL+"/auth/v1/logout",{method:"POST",headers:{"apikey":SB_KEY,"Authorization":"Bearer "+tk}}).catch(function(){});
  db={clientes:[],dados:{},cartas:{}}; S.cliente=null; S.rasc=null; S.app=null;
  MODO_LOGIN="entrar";
  render();
  document.getElementById("view").innerHTML=viewLogin("Por segurança, o acesso ao Hub vale até a meia-noite. Entre de novo com e-mail, senha e o código do e-mail.",true);
}
setInterval(function(){ if(SESSAO&&SESSAO.dia&&SESSAO.dia!==hojeBR()) encerrarPorVirada(); },60000);
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="visible"&&SESSAO&&SESSAO.dia&&SESSAO.dia!==hojeBR()) encerrarPorVirada();
});
function fazerLogin(){
  var e=document.getElementById("lgEmail").value.trim();
  var p=document.getElementById("lgSenha").value;
  if(!e||!p){ document.getElementById("view").innerHTML=viewLogin("Preencha e-mail e senha."); return; }
  var b=document.getElementById("lgBtn"); b.disabled=true; b.textContent="Entrando…";
  entrar(e,p).then(function(){
    return segundaEtapa();
  }).catch(function(err){
    document.getElementById("view").innerHTML=viewLogin(err.message);
  });
}
function render(manterScroll){
  var scrollAntes=manterScroll?window.scrollY:0;
  hbAplicarAparencia();
  var logado=sessaoLiberada();
  if(!logado&&codigoPendente()){ mostrarCodigo(null); return; }
  if(!logado&&SESSAO&&SESSAO.access_token){ limparSessao(); }
  document.querySelector(".rail").style.display=logado?"":"none";
  document.querySelector(".topbar").style.display=logado?"":"none";
  if(!logado){
    document.querySelector(".main").style.margin="0";
    document.querySelector(".main").style.padding="0";
    document.getElementById("view").innerHTML=viewLogin(null);
    setTimeout(function(){
      var i=document.getElementById(EMAIL_INICIAL?"lgSenha":"lgEmail"); if(i) i.focus();
    },30);
    return;
  }
  if(!S.app){
    document.querySelector(".rail").style.display="none";
    document.querySelector(".topbar").style.display="none";
    document.querySelector(".main").style.margin="0";
    document.querySelector(".main").style.padding="0";
    document.getElementById("view").innerHTML=viewHub();
    return;
  }
  document.querySelector(".main").style.margin="";
  document.querySelector(".main").style.padding="";
  var rb=document.getElementById("railBrand");
  if(rb&&!rb.querySelector("img")) rb.insertAdjacentHTML("afterbegin",'<img src="'+LOGO_BRANCO+'" alt="'+EMPRESA.nome+'">');
  renderRail();
  var ru=document.getElementById("railUser"); if(ru) ru.textContent=SESSAO.email||"";
  /* Preencher grava lançamento (lanc_inserir/alterar exigem eh_admin() no
     banco desde a migração de permissões) — só admin pode chegar lá.
     Some da barra de abas para quem não é admin, e qualquer S.tab
     herdado de uma sessão antiga (ou do padrão inicial) cai pro
     Relatório em vez de mostrar uma aba que a política vai recusar. */
  document.getElementById("tabP").style.display=EU.admin?"":"none";
  if(S.tab==="preencher"&&!EU.admin) S.tab="relatorio";
  document.getElementById("tabP").className=S.tab==="preencher"?"on":"";
  document.getElementById("tabC").className=S.tab==="carta"?"on":"";
  document.getElementById("tabR").className=S.tab==="relatorio"?"on":"";
  document.getElementById("tabH").className=S.tab==="historico"?"on":"";
  document.getElementById("btnPdfR").style.display=S.tab==="relatorio"?"":"none";
  document.getElementById("btnPdfP").style.display=S.tab==="relatorio"?"":"none";
  document.getElementById("btnChk").style.display=S.tab==="relatorio"?"":"none";
  var ma=document.getElementById("miniAcesso");
  if(ma) ma.textContent="Os dados ficam no servidor. "+(EU.admin?"Como administrador, voc\u00ea enxerga os clientes de todos os assessores.":"Cada assessor enxerga apenas os pr\u00f3prios clientes.");
  document.getElementById("view").innerHTML=
    S.tab==="preencher"?viewPreencher():
    (S.tab==="carta"?viewCarta():
    (S.tab==="historico"?viewHistorico():viewRelatorio()));
  if(manterScroll) window.scrollTo(0,scrollAntes); else window.scrollTo(0,0);
}

TOKEN_RECUPERACAO=detectarRecuperacaoNaUrl();
(function(){
  var q=new URLSearchParams(location.search);
  var e=(q.get("primeiro")||"").trim().toLowerCase();
  if(!e) return;
  q.delete("primeiro");
  var resto=q.toString();
  history.replaceState(null,"",location.pathname+(resto?"?"+resto:"")+location.hash);
  if(e.indexOf("@")>0&&!(SESSAO&&SESSAO.access_token)){ EMAIL_INICIAL=e; MODO_LOGIN="novo"; }
})();
if(TOKEN_RECUPERACAO){
  /* Tira o token da barra de endereço assim que lido -- ele não precisa
     continuar visível ali, e sobreviveria a um F5 sem motivo. */
  history.replaceState(null,"",location.pathname);
  document.getElementById("view").innerHTML=viewRedefinirSenha(null);
  document.querySelector(".rail").style.display="none";
  document.querySelector(".topbar").style.display="none";
  document.querySelector(".main").style.margin="0";
  document.querySelector(".main").style.padding="0";
  setTimeout(function(){ var i=document.getElementById("rsSenha1"); if(i) i.focus(); },30);
}else if(ERRO_LINK_EMAIL&&!(SESSAO&&SESSAO.access_token)){
  history.replaceState(null,"",location.pathname+location.search);
  render();
  document.getElementById("view").innerHTML=viewLogin(ERRO_LINK_EMAIL);
}else if(SESSAO&&SESSAO.access_token&&!sessaoLiberada()){
  /* Senha digitada hoje, código ainda não: volta para a tela do código.
     Login de ontem: acabou, entra de novo. */
  if(ERRO_LINK_EMAIL) history.replaceState(null,"",location.pathname+location.search);
  if(codigoPendente()) segundaEtapa(); else encerrarPorVirada();
}else if(SESSAO&&SESSAO.access_token){
  if(ERRO_LINK_EMAIL) history.replaceState(null,"",location.pathname+location.search);
  /* Confere no banco se esta sessão confirmou o código hoje. Quem entrou antes de a
     verificação ser ligada (ou teve a liberação apagada) vai para a tela do código. */
  api("rpc/estado_acesso",{method:"POST",body:{}}).then(function(st){
    if(st&&st.exige&&!st.liberado&&SESSAO){ SESSAO.dia=null; SESSAO.login_dia=hojeBR(); persistirSessao(); segundaEtapa(); }
  }).catch(function(){});
  carregar().then(function(){
    if(db.clientes.length) S.cliente=db.clientes[0].id;
    montarRascunho(); render();
    backupAutomatico();
  });
}else{
  render();
}
</script>
