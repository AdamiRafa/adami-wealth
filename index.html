/* ---------- Agenda do dia (mesma regra da aba Agenda do CRM, só a própria pessoa) ---------- */
function hbIso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function hbSoma(iso,n){ var d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return hbIso(d); }
function hbDiaSemana(iso){ var g=new Date(iso+"T12:00:00").getDay(); return g===0?7:g; }
function hbCai(t,dia){
  if(!t.data||dia<t.data) return false;
  if(t.repeticao==="dia_util") return hbDiaSemana(dia)<=5;
  if(t.repeticao==="semana") return (t.dias_semana||[]).indexOf(hbDiaSemana(dia))!==-1;
  if(t.repeticao==="mes"){
    var alvo=Number(t.data.slice(8,10)), d=new Date(dia+"T12:00:00");
    var ult=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
    return Number(dia.slice(8,10))===Math.min(alvo,ult);
  }
  return dia===t.data;
}
var HB_REGUA={Private:[["relacionamento",8,"Relacionamento"],["performance",3,"Acompanhamento"],["revisao",1,"Revisão de carteira"]],
  Exclusive:[["relacionamento",4,"Relacionamento"],["performance",1,"Acompanhamento"],["revisao",1,"Revisão de carteira"]]};
/* Itens de um dia para a própria pessoa: tarefas, próximo contato, vencimento e régua
   (mesma regra da aba Agenda do CRM). "atrasadas" só faz sentido olhando de hoje. */
function hbNomeLead(l){ if(!l) return ""; var n=(l.cliente||"").trim(),c=(l.conta||"").trim(); return !c?n:(!n?c:(n.slice(-c.length)===c?n:n+" · "+c)); }
function hbAgendaFaixa(tarefas,leads,de,ate,hoje){
  var dias={}, atrasadas=[];
  var porLead={}; leads.forEach(function(l){ porLead[l.id]=l; });
  var poe=function(dia,it){ (dias[dia]=dias[dia]||[]).push(it); };
  tarefas.forEach(function(t){
    var feitas=t.concluidas||[];
    var base={hora:(t.hora||"").slice(0,5),titulo:t.titulo,sub:hbNomeLead(porLead[t.lead_id]),
      cor:t.criado_por&&t.criado_por!==t.dono_id?"#7C5CC4":"#195AB4",tipo:t.criado_por&&t.criado_por!==t.dono_id?"Atribuída":"Tarefa"};
    for(var d=t.data>de?t.data:de; d<=ate; d=hbSoma(d,1)){
      if(hbCai(t,d)) poe(d,Object.assign({feita:feitas.indexOf(d)!==-1},base));
    }
    if(t.data<hoje){
      var dia=null;
      if(t.repeticao==="nao") dia=t.data;
      else if(!hbCai(t,hoje)){ for(var x=hbSoma(hoje,-1);x>=t.data&&x>=hbSoma(hoje,-31);x=hbSoma(x,-1)){ if(hbCai(t,x)){ dia=x; break; } } }
      if(dia&&feitas.indexOf(dia)===-1) atrasadas.push(Object.assign({dia:dia},base));
    }
  });
  leads.forEach(function(l){
    if(l.perdido||((l.funil||"assessor")==="especialista"&&l.ganho)) return;
    var cli=hbNomeLead(l);
    var pus=function(dia,it){ it.sub=cli; if(dia<hoje){ it.dia=dia; atrasadas.push(it); } if(dia>=de&&dia<=ate) poe(dia,it); };
    if(l.proximo_contato) pus(l.proximo_contato,{hora:"",titulo:"Contato agendado",cor:"#2F7A56",tipo:"Próximo contato"});
    (l.alertas||[]).forEach(function(a){ if(a.tipo==="vencimento"&&a.data&&!a.resolvido) pus(a.data,{hora:"",titulo:a.texto?"Vencimento · "+a.texto:"Vencimento",cor:"#B3403A",tipo:"Vencimento"}); });
    var naCarteira=(l.funil||"assessor")!=="especialista"&&!l.perdido&&((l.esteira||"novo")==="base"||l.ganho);
    if(naCarteira) (HB_REGUA[l.segmento]||[]).forEach(function(r){
      var datas=(l.atividades||[]).filter(function(x){ return x.tipo===r[0]&&x.data; }).map(function(x){ return x.data; }).sort();
      var base=datas.length?datas[datas.length-1]:(l.criado_em?hbIso(new Date(l.criado_em)):hoje);
      pus(hbSoma(base,Math.round(365/r[1])),{hora:"",titulo:r[2]+" (régua)",cor:"#8A6A18",tipo:"Régua"});
    });
  });
  Object.keys(dias).forEach(function(d){ dias[d].sort(function(a,b){ return (a.hora||"99").localeCompare(b.hora||"99"); }); });
  atrasadas.sort(function(a,b){ return a.dia.localeCompare(b.dia); });
  return {dias:dias,atrasadas:atrasadas};
}

    return '<button type="button" role="tab" aria-selected="'+(aba===x[0])+'" class="'+(aba===x[0]?"on":"")+'" onclick="INICIO.abaAviso=\''+x[0]+'\';INICIO.avisosTodos=false;render(true)">'+x[1]+(x[2]?'<i>'+x[2]+'</i>':'')+'</button>';
  }).join("")+'</div>';
  var lista=av.filter(function(a){
    if(aba==="naolidos") return !a.lido_por_mim&&!ehAgendado(a);

    if(aba==="agendados") return ehAgendado(a);
    return true;
  });
  if(!lista.length) return h+'<p class="hb-vazio">'+({naolidos:"Nada para ler. Tudo em dia.",fixados:"Nenhum aviso fixado.",agendados:"Nenhum aviso agendado."}[aba]||"Nenhum aviso.")+'</p>';
  var mostrar=INICIO.avisosTodos?lista:lista.slice(0,5);
  mostrar.forEach(function(a){
    var agendado=new Date(a.publicar_em).getTime()>agora;
    var pct=a.total?Math.round(a.lidos/a.total*100):0;
    var selo=agendado?'<span class="hb-delta">agendado</span>':(a.lido_por_mim?'':'<span class="hb-delta bom">novo</span>');
    h+='<div class="hb-aviso"><div class="hb-aviso-cab"><b>'+esc(a.titulo)+'</b>'+(a.fixado?'<span class="hb-delta">fixado</span>':'')+selo+'</div>'+
      (a.texto?'<p>'+esc(a.texto)+'</p>':'')+
      '<div class="hb-aviso-pe">'+
        (agendado?'<span>sai em '+new Date(a.publicar_em).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})+'</span>'
          :'<span class="hb-barra"><span style="width:'+pct+'%"></span></span><span>'+a.lidos+' de '+a.total+' leram</span>')+
        (a.autor?'<span>· '+esc(a.autor)+'</span>':'')+
        (!agendado&&!a.lido_por_mim?'<button type="button" class="hb-link" onclick="hbMarcarLido(\''+a.id+'\')">Marcar como lido</button>':'')+
        (INICIO.podePublicar&&!agendado?'<button type="button" class="hb-link" onclick="hbLeitores(\''+a.id+'\')">'+(INICIO.abertoLeitores===a.id?"Esconder quem leu":"Quem leu")+'</button>':'')+
        (INICIO.podePublicar?'<button type="button" class="hb-link" onclick="hbFixarAviso(\''+a.id+'\','+(!a.fixado)+')">'+(a.fixado?"Desafixar":"Fixar no topo")+'</button>':'')+
        (INICIO.podePublicar?'<button type="button" class="hb-link perigo" onclick="hbApagarAviso(\''+a.id+'\')">Excluir</button>':'')+
      '</div>'+(INICIO.abertoLeitores===a.id?hbLeitoresHtml(a.id):'')+'</div>';
  });
  if(lista.length>5) h+='<button type="button" class="hb-link" style="margin-top:10px" onclick="INICIO.avisosTodos=!INICIO.avisosTodos;render(true)">'+(INICIO.avisosTodos?"Mostrar menos":"Ver todos os "+lista.length)+'</button>';
  return h;
}
function hbLeitores(id){

  INICIO.abertoLeitores=id; INICIO.leitores[id]=null; render(true);

    .then(function(r){ INICIO.leitores[id]=r||[]; render(true); })
    .catch(function(e){ INICIO.leitores[id]={erro:String(e.message||e)}; render(true); });
}
function hbLeitoresHtml(id){

function hbFixarAviso(id,fixar){
  api("avisos?id=eq."+id,{method:"PATCH",body:{fixado:!!fixar}})
    .then(function(){ registrar(fixar?"fixou aviso":"desafixou aviso",id,""); carregarInicio(true); })

function hbPublicarAviso(){
  var t=(document.getElementById("avTitulo").value||"").trim();
  var x=(document.getElementById("avTexto").value||"").trim();
  var q=document.getElementById("avQuando").value;
  var f=document.getElementById("avFixo").checked;
  if(!t){ INICIO.erroAviso="Escreva o título."; render(true); return; }
  var b=document.getElementById("avBtn"); if(b){ b.disabled=true; b.textContent="Publicando…"; }
  var corpo={titulo:t,texto:x,fixado:f,criado_por:EU.id};
  if(q) corpo.publicar_em=new Date(q).toISOString();
  api("avisos",{method:"POST",body:corpo,prefer:"return=representation"}).then(function(){
    INICIO.formAviso=false; INICIO.erroAviso=""; registrar("publicou aviso",t,"");
    carregarInicio(true);
  }).catch(function(e){ INICIO.erroAviso="Não foi possível publicar: "+e.message; render(true); });

function hbMarcarLido(id){
  api("avisos_leitura",{method:"POST",body:{aviso_id:id,user_id:EU.id},prefer:"return=representation"})

function hbApagarAviso(id){
  if(!confirm("Excluir este aviso para todo mundo?")) return;
  api("avisos?id=eq."+id,{method:"DELETE"}).then(function(){ carregarInicio(true); })
    .catch(function(e){ alert("Não foi possível excluir: "+e.message); });

/* ---------- Números da carteira com tendência (2.96) ---------- */
function hbMoeda(v){
  var a=Math.abs(v||0), s=v<0?"-":"";
  if(a>=1e9) return s+"R$ "+(a/1e9).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})+" bi";
  if(a>=1e6) return s+"R$ "+(a/1e6).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+" mi";
  if(a>=1e3) return s+"R$ "+Math.round(a/1e3).toLocaleString("pt-BR")+" mil";
  return s+"R$ "+Math.round(a).toLocaleString("pt-BR");
}
function hbTend(atual,antes,texto){
  if(antes===null||antes===undefined) return '<span class="hb-num-tend">'+texto+'</span>';
  var dif=atual-antes, cls=dif>0.5?"sobe":(dif<-0.5?"desce":""), seta=dif>0.5?"&#9650;":(dif<-0.5?"&#9660;":"&#9679;");
  return '<span class="hb-num-tend '+cls+'"><i>'+seta+'</i>'+texto+'</span>';
}

function viewHub(){
  carregarInicio(false);
  var nome=String(EU.nome||((SESSAO&&SESSAO.email)||"").split("@")[0].split(/[._-]/)[0]).trim().split(/\s+/)[0];
  nome=nome?nome.charAt(0).toUpperCase()+nome.slice(1):"";
  var agora=new Date(), hora=agora.getHours();
  var saud=hora<12?"Bom dia":(hora<18?"Boa tarde":"Boa noite");
  var hoje=hbIso(agora);
  var dataLonga=agora.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
  dataLonga=dataLonga.charAt(0).toUpperCase()+dataLonga.slice(1);
  var ag=hbAgendaAtual(), av=INICIO.avisos;
  var naoLidos=av?av.filter(function(a){ return !a.lido_por_mim&&new Date(a.publicar_em).getTime()<=Date.now(); }).length:0;
  var doDiaHoje=ag?(ag.dias[hoje]||[]).filter(function(i){ return !i.feita; }):[];
  var hhmm=String(hora).padStart(2,"0")+":"+String(agora.getMinutes()).padStart(2,"0");
  var proxima=doDiaHoje.filter(function(i){ return i.hora&&i.hora>=hhmm; })[0];
  var chips=[];
  if(INICIO.estado!=="pronto") chips.push('<span class="hb-chip">carregando o seu dia…</span>');
  else {
    if(ag) chips.push('<span class="hb-chip">'+doDiaHoje.length+(doDiaHoje.length===1?" tarefa hoje":" tarefas hoje")+'</span>');
    if(ag&&ag.atrasadas.length) chips.push('<span class="hb-chip ruim">'+ag.atrasadas.length+(ag.atrasadas.length===1?" atrasada":" atrasadas")+'</span>');
    if(proxima) chips.push('<span class="hb-chip">próxima às '+proxima.hora+'</span>');
    if(naoLidos) chips.push('<span class="hb-chip bom">'+naoLidos+(naoLidos===1?" aviso novo":" avisos novos")+'</span>');
    if(ag&&!doDiaHoje.length&&!ag.atrasadas.length&&!naoLidos) chips.push('<span class="hb-chip bom">tudo em dia</span>');
  }

  /* ---- coluna do dia ---- */
  var dia=HB_DIA||hoje, ehHoje=dia===hoje;
  var tituloDia=ehHoje?"Hoje":new Date(dia+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
  tituloDia=tituloDia.charAt(0).toUpperCase()+tituloDia.slice(1);
  var corpoDia;
  if(!ag) corpoDia='<p class="hb-vazio">'+(INICIO.estado==="pronto"?"A agenda aparece aqui quando o CRM estiver ligado à sua conta.":"Carregando…")+'</p>';
  else {
    var itensDia=ag.dias[dia]||[];
    var atr=ehHoje?ag.atrasadas:[];
    corpoDia=(atr.length||itensDia.length)
      ? '<ul class="hb-lista">'+atr.slice(0,5).map(function(i){ return hbLinhaItem(i,true); }).join("")+itensDia.map(function(i){ return hbLinhaItem(i,false); }).join("")+'</ul>'+
        (atr.length>5?'<p class="hb-vazio" style="margin-top:8px">e mais '+(atr.length-5)+' atrasada(s) na Agenda</p>':'')
      : '<p class="hb-vazio">'+(ehHoje?"Nada marcado para hoje.":"Nada marcado neste dia.")+'</p>';
  }
  var proximos='';
  if(ag&&ehHoje){
    var lin=[];
    for(var k=1;k<=6;k++){ var dk=hbSoma(hoje,k), its=(ag.dias[dk]||[]).filter(function(i){ return !i.feita; });
      if(its.length) lin.push('<button type="button" class="hb-prox" onclick="hbEscolherDia(\''+dk+'\')"><span>'+
        (k===1?"Amanhã":new Date(dk+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"2-digit"}))+
        '</span><b>'+its.length+(its.length===1?" item":" itens")+'</b><em>'+esc(its[0].titulo)+'</em></button>'); }
    proximos='<div class="hb-prox-lista"><h3>Próximos dias</h3>'+(lin.length?lin.join(""):'<p class="hb-vazio">Nada marcado na próxima semana.</p>')+'</div>';
  }

  /* ---- calendário ---- */
  var cal='';
  if(HB_MES||(HB_MES=hoje.slice(0,8)+"01")){
    var ini=hbSoma(HB_MES,1-hbDiaSemana(HB_MES)), mes=HB_MES.slice(0,7);
    var nomeMes=new Date(HB_MES+"T12:00:00").toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
    var celulas='';
    for(var c=0;c<42;c++){
      var dc=hbSoma(ini,c); if(c===35&&dc.slice(0,7)!==mes) break;
      var n=ag?(ag.dias[dc]||[]).filter(function(i){ return !i.feita; }).length:0;
      celulas+='<button type="button" class="hb-cal-dia'+(dc.slice(0,7)!==mes?" fora":"")+(dc===hoje?" hoje":"")+(dc===dia?" on":"")+'" onclick="hbEscolherDia(\''+dc+'\')" aria-label="'+dc.slice(8,10)+'/'+dc.slice(5,7)+(n?": "+n+" itens":"")+'">'+
        Number(dc.slice(8,10))+(n?'<i>'+(n>3?'<span></span><span></span><span></span>':new Array(n+1).join('<span></span>'))+'</i>':'')+'</button>';
    }
    cal='<section class="hb-cartao hb-vidro"><div class="hb-cal-cab">'+
      '<button type="button" class="hb-redondo" onclick="hbMesTroca(-1)" aria-label="Mês anterior">'+HB_IC.recolher+'</button>'+
      '<h2>'+nomeMes.charAt(0).toUpperCase()+nomeMes.slice(1)+'</h2>'+
      '<button type="button" class="hb-redondo" onclick="hbMesTroca(1)" aria-label="Próximo mês">'+HB_IC.abrir+'</button></div>'+
      '<div class="hb-cal">'+["S","T","Q","Q","S","S","D"].map(function(x){ return '<span class="hb-cal-sem">'+x+'</span>'; }).join("")+celulas+'</div>'+
      (dia!==hoje||HB_MES.slice(0,7)!==hoje.slice(0,7)?'<button type="button" class="hb-link" style="margin-top:10px" onclick="HB_DIA=null;HB_MES=null;render(true)">Voltar para hoje</button>':'')+
      '</section>';
  }

  return '<div class="hb"><div class="hb-luz" aria-hidden="true"></div><div class="hb-casca">'+hbMenu()+
    '<main class="hb-main">'+
      '<section class="hb-ola hb-vidro"><div><h1>'+saud+(nome?", "+esc(nome):"")+'</h1>'+
        '<p>'+dataLonga+'</p><div class="hb-chips">'+chips.join("")+'</div></div>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
          '<button type="button" class="hb-pil escura" onclick="irParaAgenda()">'+HB_IC.agenda+'Abrir a Agenda</button>'+
        '</div></section>'+
      hbAvisoAparelhoHtml()+hbChecklistHtml(naoLidos)+
      hbNumerosHtml()+
      '<div class="hb-dois">'+
        '<section class="hb-dia hb-cartao hb-vidro"><div class="hb-cartao-cab"><h2>'+esc(tituloDia)+'<small>da sua Agenda no CRM</small></h2>'+
          '<button type="button" class="hb-link" onclick="irParaAgenda()">Ver tudo</button></div>'+corpoDia+proximos+'</section>'+
        '<aside class="hb-lado">'+cal+
          '<section class="hb-cartao hb-vidro" id="hbAvisos"><div class="hb-cartao-cab"><h2>Avisos da casa</h2>'+
            (INICIO.podePublicar&&!INICIO.formAviso?'<button type="button" class="hb-pil escura" style="height:34px;padding:0 12px;font-size:12.5px" onclick="INICIO.formAviso=true;render(true)">'+HB_IC.mais+'Novo aviso</button>':'')+
          '</div>'+hbAvisosHtml()+'</section>'+
        '</aside></div>'+
      '<div class="hb-pe">Acesso restrito aos colaboradores. Todas as ações ficam registradas. &nbsp;·&nbsp; '+VERSAO+' &nbsp;·&nbsp; &copy; '+new Date().getFullYear()+' '+esc(EMPRESA.nome)+'</div>'+
    '</main></div></div>';
}

function verFotoProblema(i){
  var p=PROB.linhas[i]; if(!p||!p.print_caminho) return;
  var janela=window.open("","_blank");
  var assinar=function(tentou){
    return fetch(SB_URL+"/storage/v1/object/sign/problemas/"+p.print_caminho.split("/").map(encodeURIComponent).join("/"),{method:"POST",
      headers:{"apikey":SB_KEY,"Authorization":"Bearer "+((SESSAO&&SESSAO.access_token)||SB_KEY),"Content-Type":"application/json"},body:JSON.stringify({expiresIn:600})})
    .then(function(res){
      if(res.status===401&&!tentou) return renovar().then(function(){ return assinar(true); });
      if(!res.ok) return res.text().then(function(t){ throw new Error(t||("HTTP "+res.status)); });
      return res.json();
    });
  };
  assinar(false).then(function(r){
    var u=r&&(r.signedURL||r.signedUrl); if(!u) throw new Error("sem link");
    var url=SB_URL+"/storage/v1"+(u.charAt(0)==="/"?u:"/"+u);
    if(janela) janela.location.href=url; else location.href=url;
  }).catch(function(e){ if(janela) janela.close(); alert("Não foi possível abrir a foto: "+(e.message||e)); });
}
function resolverProblema(i,resolvido){
  var p=PROB.linhas[i]; if(!p) return;
  api("rpc/problema_resolver",{method:"POST",body:{p_id:p.id,p_resolvido:!!resolvido}}).then(carregarProblemas)
    .catch(function(e){ alert(String(e.message||e)); });
}

   (instalada com "Verify JWT" ligado) caem no envio antigo do Supabase. */
function pedirLinkSenha(email){
  return fetch(SB_URL+"/functions/v1/enviar-senha",{
    method:"POST",
    headers:{"apikey":SB_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({email:email})
  }).then(function(res){
    if(res.status===404||res.status===401) return recuperarSenha(email);
    return res.text().then(function(t){
      var j=null; try{ j=t?JSON.parse(t):null; }catch(e){}
      if(res.ok && j && j.ok) return true;
      throw new Error((j&&j.erro)||("Não foi possível enviar o e-mail ("+res.status+")."));
    });
  },function(){
    /* Sem resposta nenhuma (rede ou bloqueio de origem): tenta o caminho antigo. */
    return recuperarSenha(email);
  });
}

/* ===================== Redefinir senha (link de recuperação) =====================
   O link que o Supabase manda chega com o token no HASH da URL (#access_token=...
   &type=recovery), nunca processado antes -- clicar no link so abria o portal
   normal, sem nenhum jeito de digitar a senha nova. Essa tela fecha esse buraco. */
var TOKEN_RECUPERACAO=null;
/* Desde a 2.85 o e-mail traz ?token_hash=...&type=recovery e o código só é
   gasto no clique em "Salvar nova senha". Antes, o link já consumia o código ao
   abrir: o robô de segurança do e-mail (que abre os links para conferir) gastava
   o código e o clique da pessoa caía em "link já usado". O formato antigo (#access_token)
   continua aceito para e-mails enviados antes da troca do modelo. */
var ERRO_LINK_EMAIL="";
function detectarRecuperacaoNaUrl(){
  var q=new URLSearchParams(location.search);
  if(q.get("token_hash")&&q.get("type")==="recovery") return {token_hash:q.get("token_hash")};
  var hash=location.hash||"";
  if(/error_code=|error=access_denied/.test(hash)){
    ERRO_LINK_EMAIL="O link do e-mail expirou ou já foi usado. Peça um novo em \"Esqueci minha senha\".";
    return null;
  }
  if(!hash || hash.indexOf("type=recovery")===-1) return null;
  var params=new URLSearchParams(hash.replace(/^#/,""));
  var at=params.get("access_token");
  if(!at) return null;
  return {access_token:at, refresh_token:params.get("refresh_token")||""};
}

function cancelarRedefinicao(){

/* Link novo: o código (token_hash) vira sessão só agora, no clique. Guarda a
   sessão em TOKEN_RECUPERACAO para que uma segunda tentativa (ex.: senha igual
   à antiga) não precise do código de novo, que já foi gasto. */
function sessaoDoLinkDeSenha(){
  if(TOKEN_RECUPERACAO.access_token) return Promise.resolve();
  return fetch(SB_URL+"/auth/v1/verify",{
    method:"POST",
    headers:{"apikey":SB_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({type:"recovery",token_hash:TOKEN_RECUPERACAO.token_hash})
  }).then(function(res){
    return res.text().then(function(t){
      var j=null; try{ j=t?JSON.parse(t):null; }catch(e){}
      if(!res.ok||!j||!j.access_token)
        throw new Error("Esse link expirou ou já foi usado. Peça um novo em \"Esqueci minha senha\".");
      TOKEN_RECUPERACAO={access_token:j.access_token,refresh_token:j.refresh_token||"",user:j.user};
    });
  });
}
function salvarNovaSenha(){
  if(!TOKEN_RECUPERACAO){ cancelarRedefinicao(); return; }
  var p1=document.getElementById("rsSenha1").value;
  var p2=document.getElementById("rsSenha2").value;
  if(!p1||!p2){ document.getElementById("view").innerHTML=viewRedefinirSenha("Preencha os dois campos de senha."); return; }
  if(p1.length<8){ document.getElementById("view").innerHTML=viewRedefinirSenha("A senha precisa ter pelo menos 8 caracteres."); return; }
  if(p1!==p2){ document.getElementById("view").innerHTML=viewRedefinirSenha("As senhas digitadas são diferentes."); return; }
  var b=document.getElementById("rsBtn"); if(b){ b.disabled=true; b.textContent="Salvando…"; }
  sessaoDoLinkDeSenha().then(function(){ return fetch(SB_URL+"/auth/v1/user",{
    method:"PUT",
    headers:{"apikey":SB_KEY,"Authorization":"Bearer "+TOKEN_RECUPERACAO.access_token,"Content-Type":"application/json"},
    body:JSON.stringify({password:p1})
  }); }).then(function(res){
    return res.json().then(function(j){
      if(!res.ok){
        var m=(j&&(j.msg||j.error_description||j.message))||"Não foi possível trocar a senha.";
        if((j&&j.error_code==="same_password")||/different from the old/i.test(m))
          m="Essa já é a sua senha atual. Escolha uma senha diferente, ou volte para o login e entre com ela.";
        else if(/expired|invalid/i.test(m)) m="Esse link expirou ou já foi usado. Peça um novo em \"Esqueci minha senha\".";
        throw new Error(m);
      }
      return j;
    });
  }).then(function(){
    var tk=TOKEN_RECUPERACAO;
    TOKEN_RECUPERACAO=null;
    SESSAO=null;
    guardarSessao(tk);
    novaSessaoPendente();
    return segundaEtapa();
  }).catch(function(err){
    document.getElementById("view").innerHTML=viewRedefinirSenha(String(err.message||err));
  });
}

/* Links diretos (3.10):
   #relatorio=CONTA&nome=NOME  (botão "Relatório do mês" da ficha do CRM): abre Carteiras
     no relatório do cliente, no último mês lançado. Acha pela conta do BTG; sem conta,
     pelo nome. Só aparecem os clientes que a pessoa enxerga (o banco filtra).
   #carteira=ID (busca do Hub): o mesmo, pelo id do cliente nas Carteiras. */
window.addEventListener("hashchange",function(){ if(sessaoLiberada()&&db.clientes.length) abrirLinkDireto(); });
function abrirLinkDireto(){
  var h=location.hash||"";
  var mr=/^#relatorio=([^&]*)(?:&nome=([^&]*))?(?:&lead=(.*))?$/.exec(h), mc=/^#carteira=([0-9a-f-]{36})$/i.exec(h);
  if(h==="#carteiras"){ history.replaceState(null,"",location.pathname+location.search); irParaApp("carteiras"); return; }
  if(!mr&&!mc) return;
  history.replaceState(null,"",location.pathname+location.search);
  var dec=function(x){ try{ return decodeURIComponent(x||""); }catch(e){ return x||""; } };
  var soNum=function(x){ return String(x||"").replace(/\D/g,"").replace(/^0+/,""); };
  var alvo=null;
  if(mc) alvo=db.clientes.filter(function(c){ return c.id===mc[1]; })[0];
  else {
    var conta=soNum(dec(mr[1])), nome=hbSemAcento(dec(mr[2])).trim(), leadId=dec(mr[3]);
    if(leadId) alvo=db.clientes.filter(function(c){ return c.lead_id===leadId; })[0];
    if(!alvo&&conta) alvo=db.clientes.filter(function(c){ return (c.contas_btg||[]).some(function(k){ return soNum(k)===conta; }); })[0];
    if(!alvo&&nome) alvo=db.clientes.filter(function(c){ return hbSemAcento(c.nome).trim()===nome; })[0];
  }
  if(!alvo){
    alert("Este cliente ainda não tem carteira lançada no Hub (ou não está na sua lista de Carteiras).");
    return;
  }
  /* Último mês com lançamento deste cliente. */
  var ult=Object.keys(db.dados).filter(function(k){ return k.indexOf(alvo.id+"|")===0; }).sort().pop();
  if(ult){ var am=ult.split("|")[1].split("-"); S.ano=+am[0]; S.mes=+am[1]; }
  S.cliente=alvo.id;
  irParaApp("carteiras");
  S.tab="relatorio"; montarRascunho(); render();
}
/* Segunda etapa (06/11/2026). Depois da senha: se o banco já tem o seguranca.sql,
   manda o código por e-mail (função codigo-acesso) e só libera depois que o banco
   confere o código (verificar_codigo). Sem o seguranca.sql instalado, entra como
   antes: o banco ainda não exige nada. */
function segundaEtapa(){
  CODIGO_ESTADO="enviando"; mostrarCodigo(null);
  return api("rpc/estado_acesso",{method:"POST",body:{}}).then(function(st){
    if(st&&st.liberado){ marcarLiberado(); return prosseguirLogin(); }
    return entrarPeloAparelho().then(function(ok){
      if(ok){ marcarLiberado(); return prosseguirLogin(); }
      return enviarCodigo();
    });
  },function(err){
    if(/PGRST202|estado_acesso|could not find the function/i.test(String(err&&err.message))){
      marcarLiberado(); return prosseguirLogin();
    }
    if(!SESSAO){ render(); return; }
    CODIGO_ESTADO=""; mostrarCodigo("Não foi possível falar com o servidor. Tente de novo em instantes.","erro");
  });
}
/* ---------- Aparelho lembrado (3.10) ----------
   Quem tem o app autenticador pode marcar "Lembrar este computador por 7 dias".
   O banco devolve um token aleatório; aqui fica o token, lá só o hash. A senha
   continua sendo pedida todo dia: o token só dispensa o código. "Sair de todos os
   aparelhos" e desligar o app apagam os tokens no banco. */
var LEMBRAR_APARELHO=false, AVISO_APARELHO="";
function aparelhoLocal(){ try{ return JSON.parse(localStorage.getItem("aw_aparelho")||"null"); }catch(e){ return null; } }
function esquecerAparelhoLocal(){ try{ localStorage.removeItem("aw_aparelho"); }catch(e){} }
function entrarPeloAparelho(){
  var a=aparelhoLocal();
  if(!a||!a.token||!SESSAO||a.uid!==SESSAO.id) return Promise.resolve(false);
  if(a.expira_em&&new Date(a.expira_em)<new Date()){ esquecerAparelhoLocal(); return Promise.resolve(false); }
  return api("rpc/aparelho_entrar",{method:"POST",body:{p_token:a.token}}).then(function(r){
    if(r&&r.ok) return true;
    esquecerAparelhoLocal(); return false;
  }).catch(function(){ return false; });
}
function lembrarAparelho(){
  if(!LEMBRAR_APARELHO) return Promise.resolve();
  LEMBRAR_APARELHO=false;
  return api("rpc/aparelho_lembrar",{method:"POST",body:{}}).then(function(r){
    if(r&&r.ok&&r.token){
      try{ localStorage.setItem("aw_aparelho",JSON.stringify({uid:SESSAO&&SESSAO.id,id:r.id,token:r.token,expira_em:r.expira_em})); }catch(e){}
      AVISO_APARELHO="";
    }else AVISO_APARELHO=(r&&r.msg)||"Não foi possível lembrar este aparelho.";
  }).catch(function(){ AVISO_APARELHO="Não foi possível lembrar este aparelho agora."; });
}
function enviarCodigo(){
  CODIGO_ESTADO="enviando"; mostrarCodigo(null);
  var tk=SESSAO&&SESSAO.access_token;
  if(!tk){ render(); return Promise.resolve(); }
  return fetch(SB_URL+"/functions/v1/codigo-acesso",{method:"POST",
    headers:{"apikey":SB_KEY,"Authorization":"Bearer "+tk,"Content-Type":"application/json"},body:"{}"})
  .then(function(res){
    return res.text().then(function(t){
      var j=null; try{ j=t?JSON.parse(t):null; }catch(e){}
      if(!res.ok){
        var m=(j&&j.erro)||"";
        if(res.status===404) m="A função codigo-acesso ainda não foi instalada no Supabase. Avise um master.";
        else if(res.status===401) m=m||"Sua sessão expirou. Volte e entre de novo.";
        throw new Error(m||("Não foi possível mandar o código (erro "+res.status+")."));
      }
      CODIGO_EMAIL=(j&&j.email)||CODIGO_EMAIL;
      CODIGO_ESTADO="enviado"; mostrarCodigo(null);
    });
  }).catch(function(e){
    CODIGO_ESTADO="erro"; mostrarCodigo(String(e.message||e),"erro");
  });
}

}else if(SESSAO&&SESSAO.access_token){
  if(ERRO_LINK_EMAIL) history.replaceState(null,"",location.pathname+location.search);
  /* Confere no banco se esta sessão confirmou o código hoje. Quem entrou antes de a
     verificação ser ligada (ou teve a liberação apagada) vai para a tela do código. */
  api("rpc/estado_acesso",{method:"POST",body:{}}).then(function(st){
    if(st&&st.exige&&!st.liberado&&SESSAO){ SESSAO.dia=null; SESSAO.login_dia=hojeBR(); persistirSessao(); segundaEtapa(); }
  }).catch(function(){});
  carregar().then(function(){
    if(db.clientes.length) S.cliente=db.clientes[0].id;
    montarRascunho(); render();
    backupAutomatico();
    abrirLinkDireto();
  });
}else{
  render();
}
</script>
